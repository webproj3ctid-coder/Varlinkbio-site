/* =========================================================
   QR GENERATOR
   ========================================================= */
async function generateQRCustom(canvasEl, text, opts={}){
  try{
    if(typeof QRCode === "undefined"){
      throw new Error("QRCode library not loaded");
    }
    const color = opts.color || "#0a0a0a";
    const bg = opts.bg || "#ffffff";
    const size = opts.size || 440;
    const logo = opts.logo || null;
    
    await QRCode.toCanvas(canvasEl, text, {
      width: size,
      margin: 2,
      color: { dark: color, light: bg },
      errorCorrectionLevel: logo ? "H" : "M"
    });
    
    if(!logo) return true;
    
    await new Promise((resolve)=>{
      const ctx = canvasEl.getContext("2d");
      const img = new Image();
      img.crossOrigin = "anonymous";
      const timeout = setTimeout(resolve, 3000);
      
      img.onload = ()=>{
        clearTimeout(timeout);
        try{
          const logoSize = size * 0.22;
          const x = (size - logoSize) / 2;
          const y = (size - logoSize) / 2;
          const padding = 8;
          
          ctx.fillStyle = bg;
          ctx.beginPath();
          const rx = x - padding, ry = y - padding;
          const rw = logoSize + padding*2, rh = logoSize + padding*2;
          const radius = 10;
          ctx.moveTo(rx + radius, ry);
          ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, radius);
          ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, radius);
          ctx.arcTo(rx, ry + rh, rx, ry, radius);
          ctx.arcTo(rx, ry, rx + rw, ry, radius);
          ctx.closePath();
          ctx.fill();
          
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          ctx.stroke();
          
          ctx.drawImage(img, x, y, logoSize, logoSize);
        }catch(e){ console.warn("Logo draw:", e); }
        resolve();
      };
      img.onerror = ()=>{ clearTimeout(timeout); resolve(); };
      img.src = logo;
    });
    
    return true;
  }catch(e){
    console.error("generateQRCustom:", e);
    throw e;
  }
}

/* =========================================================
   vCARD
   ========================================================= */
function buildVCard(bio){
  const name = bio.name || "User";
  const url = `${PUBLIC_BASE_URL}/#/u/${bio.slug || bio.id}`;
  const bioText = bio.bio || "";
  const waLink = (bio.links || []).find(l => /wa\.me|whatsapp/i.test(l.url||""));
  const igLink = (bio.links || []).find(l => /instagram\.com/i.test(l.url||""));
  const mailLink = (bio.links || []).find(l => /^mailto:|@.*\./i.test(l.url||""));
  
  const waNumber = waLink ? (waLink.url.match(/(\d{8,15})/)||[])[1] : "";
  const igUser = igLink ? (igLink.url.match(/instagram\.com\/([^\/\?]+)/)||[])[1] : "";
  const email = mailLink ? mailLink.url.replace(/^mailto:/,"") : "";
  
  let v = "BEGIN:VCARD\nVERSION:3.0\n";
  v += `FN:${name}\n`;
  v += `N:${name};;;;\n`;
  if(bioText) v += `NOTE:${bioText}\n`;
  if(email) v += `EMAIL:${email}\n`;
  if(waNumber) v += `TEL;TYPE=CELL:+${waNumber}\n`;
  v += `URL:${url}\n`;
  if(igUser) v += `X-SOCIALPROFILE;type=instagram:https://instagram.com/${igUser}\n`;
  v += `END:VCARD`;
  return v;
}
function downloadVCard(bio){
  try{
    const v = buildVCard(bio);
    const blob = new Blob([v], { type:"text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(bio.name||"kontak").replace(/\s+/g,"_")}.vcf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    Sound.success();
    toast("Kontak didownload! 📇","success");
  }catch(e){ console.warn("downloadVCard:", e); }
}

const Auth = {
  current:null,_initialized:false,

    return new Promise(resolve=>{

          try{
            if(user) await this._setCurrentFromUser(user);
            else this.current = null;
          }catch(e){ console.warn("onAuthStateChanged:", e); }
          this._initialized = true;
          resolve(this.current);
        });
      }catch(e){ console.error("Auth.init:", e); resolve(null); }
    });
  },
  
  async _setCurrentFromUser(user){
    if(!user) return null;
    let name = user.displayName || (user.email||"").split("@")[0];
    let tutorialShown = false;
    let kredit = 0;
    let ownedFeatures = [];
    let styleUI = "brutalism";
    let warnaUI = "neo-cream";
    let boughtThemes = [];
    let boughtStyles = [];
    let iklanToday = 0;
    let iklanLastDate = "";
    let varsmileEnabled = true;
    
    try{
      const doc = await FB.db.collection("users").doc(user.uid).get();

      const isGoogleProvider = (user.providerData||[]).some(p => p.providerId === "google.com");
      const effectiveVerified = user.emailVerified || isGoogleProvider;
      await FB.db.collection("users").doc(user.uid).set({
        emailVerified: effectiveVerified,
        isGoogleUser: isGoogleProvider
      }, { merge:true });
      this.current = {
        uid: user.uid, email: user.email, name,
        photo: user.photoURL || "",
        emailVerified: effectiveVerified,
        isGoogle: isGoogleProvider,
        tutorialShown
      };
      STATE.kredit = kredit;
      STATE.ownedFeatures = ownedFeatures;
      STATE.styleUI = styleUI;
      STATE.warnaUI = warnaUI;
      STATE.boughtThemes = boughtThemes;
      STATE.boughtStyles = boughtStyles;
      STATE.iklanToday = iklanToday;
      STATE.iklanLastDate = iklanLastDate;
      STATE.varsmileEnabled = varsmileEnabled;
    }catch(e){
      console.warn("_setCurrentFromUser:", e);
      const isGoogleProvider = (user.providerData||[]).some(p => p.providerId === "google.com");
      this.current = {
        uid: user.uid, email: user.email, name,
        photo: user.photoURL || "",
        emailVerified: user.emailVerified || isGoogleProvider,
        isGoogle: isGoogleProvider,
        tutorialShown
      };
    }
    return this.current;
  },
  
  async register(email, password, name){
    const cred = await FB.auth.createUserWithEmailAndPassword(email, password);
    try{ await cred.user.updateProfile({ displayName: name }); }catch(e){}
    await FB.db.collection("users").doc(cred.user.uid).set({
      name, email,
      createdAt: Date.now(),
      plan: "free",
      emailVerified: false,
      tutorialShown: false,
      kredit: 0,
      ownedFeatures: [],
      styleUI: "brutalism",
      warnaUI: "neo-cream",
      boughtThemes: [],
      boughtStyles: [],
      varsmileEnabled: true
    },{ merge:true });
    try{ await cred.user.sendEmailVerification(); }catch(e){}
    return cred.user;
  },
  
  async login(email, password){
    return (await FB.auth.signInWithEmailAndPassword(email, password)).user;
  },
  
  async loginGoogle(){
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    if(isInAppBrowser()){
      const err = new Error("in-app-browser");
      err.code = "app/in-app-browser";
      throw err;
    }
    try{
      const cred = await FB.auth.signInWithPopup(provider);
      await this._ensureUserDoc(cred.user);
      await this._setCurrentFromUser(cred.user);
      return cred.user;
    }catch(err){
      console.warn("[LoginGoogle] Popup gagal:", err.code);
      const fallback = [
        "auth/popup-blocked","auth/popup-closed-by-user",
        "auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment",
        "auth/web-storage-unsupported","auth/operation-not-allowed"
      ];
      if(fallback.includes(err.code)){
        try{ sessionStorage.setItem("varlinkbio_redirect_from", location.hash || "#/dashboard"); }catch(e){}
        await FB.auth.signInWithRedirect(provider);
        return null;
      }
      throw err;
    }
  },
  
  async _ensureUserDoc(user){
    if(!user) return;
    try{
      const doc = await FB.db.collection("users").doc(user.uid).get();
      if(!doc.exists){
        await FB.db.collection("users").doc(user.uid).set({
          name: user.displayName || (user.email||"").split("@")[0],
          email: user.email || "",
          createdAt: Date.now(),
          plan: "free",
          emailVerified: user.emailVerified || false,
          tutorialShown: false,
          kredit: 0,
          ownedFeatures: [],
          styleUI: "brutalism",
          warnaUI: "neo-cream",
          varsmileEnabled: true
        });
      }
    }catch(e){ console.warn("ensureUserDoc:", e); }
  },
  
  async handleRedirectResult(){
    try{
      const result = await FB.auth.getRedirectResult();
      if(result && result.user){
        await this._ensureUserDoc(result.user);
        await this._setCurrentFromUser(result.user);
        return result.user;
      }
    }catch(err){
      console.warn("getRedirectResult:", err);
      return { __error: err };
    }
    return null;
  },
  
  async logout(){
    try{ await FB.auth.signOut(); }catch(e){}
    this.current = null;
  },
  
  async updateName(newName){
    const user = FB.auth.currentUser;
    if(!user) throw new Error("Not logged in");
    await user.updateProfile({ displayName: newName });
    await FB.db.collection("users").doc(user.uid).set({ name: newName }, { merge:true });
    if(this.current) this.current.name = newName;
    return true;
  },
  
  async updatePassword(oldPass, newPass){
    const user = FB.auth.currentUser;
    if(!user) throw new Error("Not logged in");
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldPass);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(newPass);
    return true;
  },
  
  async markTutorialDone(){
    if(!this.current) return;
    try{
      await FB.db.collection("users").doc(this.current.uid).update({
        tutorialShown: true,
        tutorialCompletedAt: Date.now(),
        tutorialVersion: TUTORIAL_VERSION
      });

  },

        tutorialShown: false,
        tutorialCompletedAt: null
      });

  async toggleVarsmile(enabled){

        varsmileEnabled: enabled
      });
      STATE.varsmileEnabled = enabled;
    }catch(e){ console.warn("toggleVarsmile:", e); }

  errMsg(code){
    const map = {
      "auth/email-already-in-use":"Email sudah terdaftar",
      "auth/invalid-email":"Format email tidak valid",
      "auth/weak-password":"Password terlalu lemah (min 6 karakter)",
      "auth/user-not-found":"Email tidak terdaftar",

    return map[code] || ("Error: " + (code||"tidak diketahui"));
  }

const Kredit = {
  async add(amount, reason="manual"){
    if(!Auth.current) return false;
    try{
      const newKredit = (STATE.kredit || 0) + amount;
      await FB.db.collection("users").doc(Auth.current.uid).update({ kredit: newKredit });

        .collection("kreditLog").add({
          amount, reason, ts: Date.now(),

        }).catch(()=>{});
      STATE.kredit = newKredit;
      return true;
    }catch(e){ console.warn("Kredit.add:", e); return false; }
  },
  
  async spend(amount, featureId){
    if(!Auth.current) return false;
    if((STATE.kredit || 0) < amount){
      toast("Kredit gak cukup! Top up atau nonton iklan dulu.","error");
      return false;
    }
    try{
      const newKredit = STATE.kredit - amount;
      const newOwned = [...(STATE.ownedFeatures || []), featureId];
      await FB.db.collection("users").doc(Auth.current.uid).update({
        kredit: newKredit,
        ownedFeatures: newOwned
      });
      await FB.db.collection("users").doc(Auth.current.uid)
        .collection("kreditLog").add({
          amount: -amount, reason: "buy:" + featureId,
          ts: Date.now(), type: "out"
        }).catch(()=>{});
      STATE.kredit = newKredit;
      STATE.ownedFeatures = newOwned;
      return true;
    }catch(e){ console.warn("Kredit.spend:", e); return false; }
  },
  
  has(featureId){
    if(isDev(Auth.current?.email)) return true;
    if(STATE.plan?.features?.[featureId]) return true;
    if((STATE.ownedFeatures||[]).includes(featureId)) return true;
    return false;
  }
};

const Iklan = {
  today(){ return new Date().toISOString().slice(0,10); },
  
  canWatch(){
    const today = this.today();
    if(STATE.iklanLastDate !== today){
      STATE.iklanToday = 0;
      STATE.iklanLastDate = today;
    }
    return (STATE.iklanToday || 0) < IKLAN_MAX_PER_DAY;
  },
  
  remaining(){
    const today = this.today();
    if(STATE.iklanLastDate !== today) return IKLAN_MAX_PER_DAY;
    return Math.max(0, IKLAN_MAX_PER_DAY - (STATE.iklanToday || 0));
  },
  
  async complete(){
    if(!Auth.current) return false;
    try{
      const today = this.today();
      let newCount = (STATE.iklanToday || 0) + 1;
      if(STATE.iklanLastDate !== today) newCount = 1;
      
      const newKredit = (STATE.kredit || 0) + IKLAN_REWARD;
      
      await FB.db.collection("users").doc(Auth.current.uid).update({
        kredit: newKredit,
        iklanToday: newCount,
        iklanLastDate: today
      });
      
      STATE.kredit = newKredit;
      STATE.iklanToday = newCount;
      STATE.iklanLastDate = today;
      return true;
    }catch(e){ console.warn("Iklan.complete:", e); return false; }
  }
};

/* =========================================================
   ROUTER v26
   ========================================================= */
const PROTECTED = ["/dashboard","/editor","/manage","/stats","/dev","/settings","/help","/explore","/store","/fitur-saya","/topup"];
const Router = {
  routes:{},
  on(p,h){ this.routes[p] = h; },
  navigate(p){
    if(location.hash.slice(1) === p) this.resolve();
    else location.hash = p;
  },
  resolve(){
    try{
      document.body.classList.remove("public-mode");
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      document.body.style.height = '';
      
      const fullSearch = location.search.slice(1);
      if(fullSearch){
        const p = new URLSearchParams(fullSearch);
        const oobCode = p.get("oobCode");
        const mode = p.get("mode");
        if(oobCode && (mode === "verifyEmail" || mode === "resetPassword" || mode === "recoverEmail")){
          const targetHash = `#/verify?${fullSearch}`;
          if(location.hash !== targetHash){
            location.replace(location.pathname + targetHash);
            return;
          }
        }
      }
      
      if(IS_BIO_DOMAIN){
        const raw = location.hash.slice(1) || "/";
        const path = raw.split("?")[0];
        if(!path.startsWith("/u/")){
          location.replace(`${APP_BASE_URL}/#/`);
          return;
        }
      }
      
      const raw = location.hash.slice(1) || "/";
      const path = raw.split("?")[0];
      const query = raw.split("?")[1] || "";
      
      if(path.startsWith("/u/")){
        const handler = this.routes["/u/:id"]||(()=>{});
        handler(path.slice(3));
        setTimeout(()=>hideLoading(), 100);
        return;
      }
      
      if(Auth.current && (path === "/login" || path === "/register")){
        return this.navigate("/dashboard");
      }
      
      if(PROTECTED.includes(path) && !Auth.current){
        const self = this;
        setTimeout(()=>{
          try{
            if(Auth.current) self.resolve();
            else self.navigate("/login");
          }catch(e){ console.warn("Router timeout:", e); }
        }, 200);
        return;
      }
      
      if(PROTECTED.includes(path) && Auth.current && !isDev(Auth.current.email)){
        const user = FB.auth.currentUser;
        const isGoogle = (user?.providerData||[]).some(p => p.providerId === "google.com");
        const allowedUnverified = ["/help", "/verify", "/settings"];
        if(user && !user.emailVerified && !isGoogle && !allowedUnverified.includes(path)){
          return this.navigate("/verify");
        }
      }
      
      const handler = this.routes[path] || this.routes["/404"] || (()=>{});
      handler(query);
      
      setTimeout(()=>{ try{ hideLoading(); }catch(e){} }, 100);
    }catch(e){
      console.error("Router.resolve:", e);
      try{ hideLoading(); }catch(err){}
    }
  },
  start(){
    window.addEventListener("hashchange", ()=>{ try{ this.resolve(); }catch(e){ console.error(e); } });
    this.resolve();
  }
};

/* =========================================================
   LINK TYPES
   ========================================================= */
const LinkTypes = {
  detect(url){
    if(!url) return "classic";
    const u = url.toLowerCase();
    if(u.includes("youtube.com") || u.includes("youtu.be")) return "youtube";
    if(u.includes("spotify.com")) return "spotify";
    if(u.includes("tiktok.com")) return "tiktok";
    if(u.includes("vimeo.com")) return "vimeo";
    if(u.includes("instagram.com")) return "instagram";
    if(u.includes("twitter.com") || u.includes("x.com")) return "twitter";
    if(u.includes("wa.me") || u.includes("whatsapp.com")) return "whatsapp";
    if(u.includes("threads.net")) return "threads";
    if(u.includes("telegram") || u.includes("t.me")) return "telegram";
    if(u.includes("facebook.com") || u.includes("fb.com")) return "facebook";
    if(u.includes("github.com")) return "github";
    if(u.includes("linkedin.com")) return "linkedin";
    return "classic";
  },
  embed(url){
    if(!url) return null;
    const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if(yt) return `https://www.youtube.com/embed/${yt[1]}`;
    const sp = url.match(/spotify\.com\/(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
    if(sp) return `https://open.spotify.com/embed/${sp[1]}/${sp[2]}`;
    const vm = url.match(/vimeo\.com\/(\d+)/);
    if(vm) return `https://player.vimeo.com/video/${vm[1]}`;
    const tt = url.match(/tiktok\.com\/.*\/video\/(\d+)/);
    if(tt) return `https://www.tiktok.com/embed/v2/${tt[1]}`;
    return null;
  },
  icon(url){
    const t = this.detect(url);
    return {
      youtube:"youtube", spotify:"music", tiktok:"video", vimeo:"video",
      instagram:"instagram", twitter:"twitter", whatsapp:"whatsapp",
      threads:"twitter", telegram:"mail", facebook:"user", github:"link",
      linkedin:"user", classic:"link"
    }[t] || "link";
  }
};

/* =========================================================
   EXTRACT LINK INFO (auto-import)
   ========================================================= */
function extractLinkInfo(url){
  try{
    url = String(url || "").trim();
    if(!url) return null;
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    
    const u = url.toLowerCase();
    let label = "Link";
    let icon = "link";
    
    if(u.includes("instagram.com")){
      label = "Instagram"; icon = "instagram";
      const m = url.match(/instagram\.com\/([^\/\?]+)/);
      if(m) label = "@" + m[1];
    } else if(u.includes("tiktok.com")){
      label = "TikTok"; icon = "tiktok";
      const m = url.match(/tiktok\.com\/@([^\/\?]+)/);
      if(m) label = "@" + m[1];
    } else if(u.includes("youtube.com") || u.includes("youtu.be")){
      label = "YouTube"; icon = "youtube";
      const m = url.match(/@([^\/\?]+)/);
      if(m) label = "@" + m[1];
    } else if(u.includes("twitter.com") || u.includes("x.com")){
      label = "Twitter / X"; icon = "twitter";
      const m = url.match(/(?:twitter|x)\.com\/([^\/\?]+)/);
      if(m) label = "@" + m[1];
    } else if(u.includes("wa.me") || u.includes("whatsapp.com")){
      label = "WhatsApp"; icon = "whatsapp";
    } else if(u.includes("spotify.com")){
      label = "Spotify"; icon = "music";
    } else if(u.includes("threads.net")){
      label = "Threads"; icon = "twitter";
      const m = url.match(/threads\.net\/@([^\/\?]+)/);
      if(m) label = "@" + m[1];
    } else if(u.includes("t.me") || u.includes("telegram")){
      label = "Telegram"; icon = "mail";
      const m = url.match(/(?:t\.me|telegram\.me)\/([^\/\?]+)/);
      if(m) label = "@" + m[1];
    } else if(u.includes("github.com")){
      label = "GitHub"; icon = "link";
      const m = url.match(/github\.com\/([^\/\?]+)/);
      if(m) label = "@" + m[1];
    } else if(u.includes("linkedin.com")){
      label = "LinkedIn"; icon = "user";
    } else if(u.includes("facebook.com") || u.includes("fb.com")){
      label = "Facebook"; icon = "user";
    }
    
    return { url, label, icon, type: LinkTypes.detect(url) };
  }catch(e){
    return null;
  }
}

    ]
  },
  
  init(){
    if(!Auth.current){ this.hide(); return; }
    if(!STATE.varsmileEnabled){ this.hide(); return; }
    
    if(this._el) return; // udah ada
    
    try{
      // Buat elemen Varsmile
      this._el = document.createElement("div");
      this._el.className = "varsmile-wrap";
      this._el.id = "varsmile-char";
      this._el.innerHTML = VARSMILE_SVG;
      this._el.style.pointerEvents = "auto";
      this._el.style.cursor = "pointer";
      document.body.appendChild(this._el);
      
      // Buat aspal
      this._roadEl = document.createElement("div");
      this._roadEl.className = "varsmile-road";
      this._roadEl.id = "varsmile-road";
      document.body.appendChild(this._roadEl);
      
      // Bind interaksi
      this._bindInteraction();
      
      // Start loop
      this._active = true;
      this.startLoop();
      
      console.log("✅ Varsmile 8-bit aktif");
    }catch(e){ console.warn("Varsmile.init:", e); }
  },
  
  hide(){
    this._active = false;
    if(this._timer){ clearTimeout(this._timer); this._timer = null; }
    if(this._tipTimer){ clearInterval(this._tipTimer); this._tipTimer = null; }
    if(this._el){ this._el.remove(); this._el = null; }
    if(this._bubbleEl){ this._bubbleEl.remove(); this._bubbleEl = null; }
    if(this._roadEl){ this._roadEl.remove(); this._roadEl = null; }
    this._mode = "hidden";
  },
  
  _bindInteraction(){
    if(!this._el) return;
    
    // Klik → ngomong random
    this._el.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(this._mode === "running" || this._mode === "tired") return;
      const tip = this.TIPS_RANDOM[Math.floor(Math.random()*this.TIPS_RANDOM.length)];
      this.showBubble(tip, 3000);
      Sound.bip();
    });
    
    // Double-click → minimize
    this._el.addEventListener("dblclick", (e)=>{
      e.stopPropagation();
      if(this._el.classList.contains("minimized")){
        this._el.classList.remove("minimized");
        this.showBubble("Aku balik! 👋", 2500);
      } else {
        this._el.classList.add("minimized");
        if(this._bubbleEl){ this._bubbleEl.remove(); this._bubbleEl = null; }
        toast("Varsmile diminimize","info");
      }
    });
  },
  
  showBubble(text, duration=3000){
    if(!this._el) return;
    if(this._bubbleEl){ this._bubbleEl.remove(); this._bubbleEl = null; }
    
    try{
      const rect = this._el.getBoundingClientRect();
      const bubble = document.createElement("div");
      bubble.className = "varsmile-bubble";
      bubble.textContent = text;
      
      // Posisi: atas Varsmile atau bawah (kalau Varsmile di atas layar)
      const isTop = rect.top < 100;
      if(isTop){
        bubble.classList.add("bubble-top");
        bubble.style.top = (rect.bottom + 14) + "px";
      } else {
        bubble.style.top = (rect.top - 60) + "px";
      }
      bubble.style.left = Math.max(10, rect.left + rect.width/2) + "px";
      bubble.style.transform = "translateX(-50%)";
      
      document.body.appendChild(bubble);
      this._bubbleEl = bubble;
      
      // Auto-dismiss
      setTimeout(()=>{
        if(this._bubbleEl === bubble){
          bubble.classList.add("dismissing");
          setTimeout(()=>{
            bubble.remove();
            if(this._bubbleEl === bubble) this._bubbleEl = null;
          }, 300);
        }
      }, duration);
      
      // Klik bubble → dismiss
      bubble.addEventListener("click", ()=>{
        bubble.classList.add("dismissing");
        setTimeout(()=>{
          bubble.remove();
          if(this._bubbleEl === bubble) this._bubbleEl = null;
        }, 300);
      });
    }catch(e){ console.warn("showBubble:", e); }
  },
  
  _setMode(mode){
    if(!this._el) return;
    this._mode = mode;
    this._el.className = "varsmile-wrap";
    if(mode === "peek") this._el.classList.add("peek-mode","idle");
    else if(mode === "running") this._el.classList.add("run-mode","walking");
    else if(mode === "tired") this._el.classList.add("stand-mode","tired");
    else if(mode === "talking") this._el.classList.add("stand-mode","talking");
    else if(mode === "waiting") this._el.classList.add("login-mode","idle");
    else if(mode === "runAway") this._el.classList.add("run-away");
  },
  
  /* ==========================================================
     MODE: LOGIN WAITING (diam di bawah form)
     ========================================================== */
  startLoginMode(){
    if(!this._el || !this._active) return;
    this._setMode("waiting");
    
    // Ngasih tips login tiap 8 detik
    if(this._tipTimer) clearInterval(this._tipTimer);
    this._tipTimer = setInterval(()=>{
      if(this._mode !== "waiting") return;
      const tip = this.TIPS_LOGIN[Math.floor(Math.random()*this.TIPS_LOGIN.length)];
      this.showBubble(tip, 4000);
      Sound.vPeek();
    }, 8000);
  },
  
  /* ==========================================================
     MODE: RUN AWAY 3D (login sukses → ke dashboard)
     ========================================================== */
  async runAway3D(){
    if(!this._el) return;
    if(this._tipTimer){ clearInterval(this._tipTimer); this._tipTimer = null; }
    
    this._setMode("runAway");
    this.showBubble("AYOOO MARI KITA MENUJU RUMAH! 🏠", 2500);
    Sound.vRun();
    
    // Efek dust
    for(let i=0;i<5;i++){
      setTimeout(()=>this._spawnDust(), i*400);
    }
    
    // Flash putih di akhir
    setTimeout(()=>this._flashScreen(), 2300);
    
    // Selesai
    await sleep(2600);
  },
  
  _spawnDust(){
    if(!this._el) return;
    try{
      const rect = this._el.getBoundingClientRect();
      const dust = document.createElement("div");
      dust.className = "varsmile-dust";
      dust.style.left = (rect.left + rect.width/2) + "px";
      dust.style.top = (rect.bottom - 6) + "px";
      document.body.appendChild(dust);
      setTimeout(()=>dust.remove(), 800);
    }catch(e){}
  },
  
  _flashScreen(){
    try{
      const flash = document.createElement("div");
      flash.className = "varsmile-flash";
      document.body.appendChild(flash);
      setTimeout(()=>flash.classList.add("active"), 10);
      setTimeout(()=>{
        flash.classList.remove("active");
        setTimeout(()=>flash.remove(), 300);
      }, 250);
    }catch(e){}
  },
  
  /* ==========================================================
     MODE: NORMAL LOOP (di dashboard & halaman lain)
     ========================================================== */
  startLoop(){
    if(!this._el || !this._active) return;
    this._cycle();
  },
  
  async _cycle(){
    if(!this._active) return;
    
    // Cek current page untuk tips kontekstual
    const hashPath = (location.hash.slice(1) || "/").split("?")[0];
    
    // STEP 1 — NGINTIP (3 detik)
    this._setMode("peek");
    this.showBubble("Shuusss diemmm 🤫", 2500);
    Sound.vPeek();
    await sleep(3000);
    if(!this._active) return;
    
    // STEP 2 — LARI KANAN→KIRI (aspal aktif)
    if(this._roadEl) this._roadEl.classList.add("active");
    this._setMode("running");
    this._el.classList.add("facing-left");
    this._el.style.top = "8px";
    this._el.style.left = "calc(100% - 80px)";
    this._el.style.bottom = "auto";
    this._el.style.transform = "translateX(0)";
    Sound.vRun();
    
    // Animasi lari pakai transition
    await sleep(50);
    this._el.style.transition = "left 3s linear";
    this._el.style.left = "20px";
    await sleep(3000);
    if(!this._active) return;
    
    // STEP 3 — CAPEK (1.5 detik)
    this._el.style.transition = "left .3s ease";
    this._setMode("tired");
    this._el.classList.add("facing-left");
    Sound.vTired();
    await sleep(1500);
    if(!this._active) return;
    
    // STEP 4 — NGISI TIPS (5 detik)
    this._setMode("talking");
    this._el.classList.remove("facing-left");
    
    // Pilih tips: kontekstual atau random
    let tips = this.TIPS_RANDOM;
    if(this.TIPS_CONTEXT[hashPath]){
      tips = [...this.TIPS_CONTEXT[hashPath], ...this.TIPS_RANDOM];
    }
    const tip = tips[Math.floor(Math.random()*tips.length)];
    this.showBubble(tip, 4500);
    Sound.bip();
    await sleep(5000);
    if(!this._active) return;
    
    // STEP 5 — LARI BALIK KIRI→KANAN (3 detik)
    this._setMode("running");
    this._el.classList.remove("facing-left");
    this._el.style.transition = "left 3s linear";
    this._el.style.left = "calc(100% - 80px)";
    Sound.vRun();
    await sleep(3000);
    if(!this._active) return;
    
    // Aspal off
    if(this._roadEl) this._roadEl.classList.remove("active");
    
    // STEP 6 — NGINTIP LAGI (3 detik)
    this._setMode("peek");
    this.showBubble("Shuusss diemmm 🤫", 2000);
    Sound.vPeek();
    await sleep(3000);
    if(!this._active) return;
    
    // Reset posisi & loop lagi
    this._el.style.transition = "";
    await sleep(500);
    this._cycle();
  }
};

/* =========================================================
   MAINTENANCE MODE
   ========================================================= */
async function checkMaintenance(){
  try{
    const doc = await FB.db.collection("settings").doc("app").get();
    if(!doc.exists) return false;
    const data = doc.data();
    const m = data.maintenance || {};
    
    if(!m.active) return false;
    
    // Auto-unlock kalau timer udah lewat
    if(m.until && m.until > 0 && Date.now() >= m.until){
      try{
        await FB.db.collection("settings").doc("app").update({
          "maintenance.active": false,
          "maintenance.autoUnlockedAt": Date.now()
        });
      }catch(e){}
      return false;
    }
    
    // Dev bypass
    if(Auth.current && isDev(Auth.current.email)){
      console.log("🔧 Maintenance active — DEV bypass");
      return false;
    }
    
    return m;
  }catch(e){
    console.warn("checkMaintenance:", e);
    return false;
  }
}

function renderMaintenancePage(m){
  const until = m.until || 0;
  const reason = m.reason || "Sedang ada perbaikan sistem";
  const startedAt = m.startedAt || Date.now();
  
  document.body.innerHTML = `
    <div class="maint-page">
      <div class="maint-card">
        <div class="maint-icon">🔧</div>
        
        <h1 class="maint-title">Web Sedang Diperbaiki</h1>
        <p class="maint-desc">
          Varlinkbio sedang <b>dalam proses maintenance</b>.
          Mohon sabar ya, kita balik lagi! 🚀
        </p>
        
        <div class="maint-info">
          ${until > 0 ? `
            <div class="maint-countdown-wrap">
              <div class="maint-countdown-label">⏱️ Selesai Dalam</div>
              <div class="maint-countdown" id="maint-countdown">--:--</div>
            </div>
          ` : `
            <div class="maint-manual-note">
              ⏳ Durasi: <b>BELUM DITENTUKAN</b><br>
              <span style="font-size:11px;font-weight:600;color:var(--ink-soft)">
                Admin akan segera membuka kembali
              </span>
            </div>
          `}
          
          <div class="maint-info-row">
            <div class="lbl">📋 Alasan</div>
            <div class="val">${esc(reason)}</div>
          </div>
          
          <div class="maint-info-row">
            <div class="lbl">🕐 Mulai</div>
            <div class="val">${new Date(startedAt).toLocaleString("id-ID")}</div>
          </div>
        </div>
        
        <div class="maint-status">
          <span class="dot">🔄</span> Auto-cek tiap 5 detik
        </div>
        
        <button class="maint-retry-btn" id="maint-retry">🚀 Coba Lagi Sekarang</button>
        
        <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;margin-top:20px">
          Powered by Varlinkbio · by Varoo
        </div>
      </div>
    </div>`;
  
  // Countdown
  if(until > 0){
    const updateCountdown = ()=>{
      const el = document.getElementById("maint-countdown");
      if(!el) return;
      const diff = Math.max(0, until - Date.now());
      const totalSec = Math.floor(diff / 1000);
      const h = Math.floor(totalSec / 3600);
      const m2 = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      
      if(h > 0){
        el.textContent = `${h}:${String(m2).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      } else {
        el.textContent = `${String(m2).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      }
      
      if(diff <= 0){
        el.textContent = "00:00";
        el.style.color = "#22c55e";
        setTimeout(()=>location.reload(), 1000);
      }
    };
    updateCountdown();
    setInterval(updateCountdown, 1000);
  }
  
  // Auto-check tiap 5 detik
  const checkAndReload = async ()=>{
    try{
      const doc = await FB.db.collection("settings").doc("app").get();
      const data = doc.exists ? doc.data() : {};
      const m2 = data.maintenance || {};
      
      const isUnlocked = !m2.active || (m2.until && m2.until > 0 && Date.now() >= m2.until);
      
      if(isUnlocked){
        const status = document.querySelector(".maint-status");
        if(status) status.innerHTML = "✅ <b>Web udah aktif! Reloading...</b>";
        Sound.success();
        setTimeout(()=>location.reload(), 800);
      }
    }catch(e){ console.warn("checkAndReload:", e); }
  };
  
  checkAndReload();
  setInterval(checkAndReload, 5000);
  
  const retryBtn = document.getElementById("maint-retry");
  if(retryBtn) retryBtn.addEventListener("click", async ()=>{
    retryBtn.textContent = "🔄 Checking...";
    retryBtn.disabled = true;
    await checkAndReload();
    setTimeout(()=>{
      retryBtn.textContent = "🚀 Coba Lagi Sekarang";
      retryBtn.disabled = false;
    }, 1500);
  });
}

function bindTopbar(){
  try{
    const backBtn = $("#btn-back-dashboard");
    if(backBtn) backBtn.addEventListener("click", ()=>{
      if(location.hash.includes("/editor") && STATE.draft && STATE.draft.name){
        const saved = STATE.draft.id && STATE.draft.updatedAt;
        if(!saved){
          if(!confirm("Keluar dari editor?\n\nPerubahan belum disimpan.")) return;
        }
      }
      Router.navigate("/dashboard");
    });
    
    const open = $("#btn-drawer-open");
    const drawer = $("#lt-drawer");
    if(open && drawer) open.addEventListener("click", ()=>drawer.classList.add("open"));
    const close = $("#btn-drawer-close");
    if(close && drawer) close.addEventListener("click", ()=>drawer.classList.remove("open"));
    if(drawer) drawer.addEventListener("click", e=>{ if(e.target === drawer) drawer.classList.remove("open"); });
    
    $$("[data-nav]").forEach(el=>{
      el.addEventListener("click", ()=>{
        if(drawer) drawer.classList.remove("open");
        Router.navigate(el.dataset.nav);
      });
    });
    
    const homeBtn = $("#drawer-back-home");
    if(homeBtn) homeBtn.addEventListener("click", ()=>{ if(drawer) drawer.classList.remove("open"); Router.navigate("/"); });
    const upgradeBtn = $("#drawer-upgrade");
    if(upgradeBtn) upgradeBtn.addEventListener("click", ()=>{ if(drawer) drawer.classList.remove("open"); showUpgradeModal(); });
    const planBtn = $("#btn-plan-top");
    if(planBtn) planBtn.addEventListener("click", ()=>showUpgradeModal());
    const devBtn = $("#btn-dev-top");
    if(devBtn) devBtn.addEventListener("click", ()=>Router.navigate("/dev"));
    const kreditBtn = $("#btn-kredit-top");
    if(kreditBtn) kreditBtn.addEventListener("click", ()=>Router.navigate("/store"));
    const soundBtn = $("#sound-toggle-btn");
    if(soundBtn){
      soundBtn.addEventListener("click", ()=>{
        const enabled = Sound.toggle();
        soundBtn.textContent = enabled ? '🔊' : '🔇';
        toast(enabled ? "Sound ON 🔊" : "Sound OFF 🔇", "info");
      });
    }
  }catch(e){ console.warn("bindTopbar:", e); }
}

const PageVerify = {
  async render(){
    if(!Auth.current) return Router.navigate("/login");
    const user = FB.auth.currentUser;
    const email = Auth.current?.email || "";
    const isGoogle = (user?.providerData||[]).some(p => p.providerId === "google.com");
    
    const rawQuery = (location.hash.split("?")[1] || "");
    const params = new URLSearchParams(rawQuery);
    const oobCode = params.get("oobCode");
    const mode = params.get("mode");
    
    if(oobCode && (mode === "verifyEmail" || mode === "recoverEmail")){
      showLoading("Memverifikasi email...");
      try{
        await FB.auth.applyActionCode(oobCode);
        if(FB.auth.currentUser){
          await FB.auth.currentUser.reload();
          await FB.auth.currentUser.getIdToken(true);
        }
        await Auth.init();
        await loadUserPlan();
        hideLoading();
        toast("🎉 Email berhasil diverifikasi!","success");
        location.replace(location.pathname + "#/dashboard");
        return;
      }catch(e){
        hideLoading();
        const map = {
          "auth/invalid-action-code":"Link verifikasi tidak valid atau sudah dipakai",
          "auth/expired-action-code":"Link verifikasi sudah kadaluarsa"
        };
        const msg = map[e.code] || e.message || "Gagal verifikasi";
        $("#app").innerHTML = `
          <div class="auth-page">
            <div class="auth-card">
              <div class="auth-icon" style="background:var(--red);color:#fff">${ico('x')}</div>

              <button class="btn btn-primary btn-block" id="vf-retry">${ico('back')} Ke Halaman Verifikasi</button>
            </div>
          </div>`;
        const r = $("#vf-retry");
        if(r) r.addEventListener("click", ()=>{ location.replace(location.pathname + "#/verify"); });

    if(isGoogle) return Router.navigate("/dashboard");
    if(user?.emailVerified) return Router.navigate("/dashboard");
    
    $("#app").innerHTML = `
      <div class="auth-page">
        <div class="auth-card">
          <div class="auth-icon">${ico('mail')}</div>

        </div>
      </div>`;
    
    const showMsg = (msg, type="error") => {
      const bg = type === "success" ? "var(--green)" : "var(--red)";
      const s = $("#err-slot");
      if(s) s.innerHTML = `<div class="err-box" style="background:${bg}">${esc(msg)}</div>`;
    };
    
    const vc = $("#v-check");
    if(vc) vc.addEventListener("click", async ()=>{
      showLoading("Cek status...");
      try{
        await user.reload();

          await FB.auth.currentUser.getIdToken(true);
          await Auth.init();
          hideLoading();
          toast("Email terverifikasi! 🎉","success");
          Router.navigate("/dashboard");

    const vd = $("#v-back-dash"); if(vd) vd.addEventListener("click", ()=>Router.navigate("/dashboard"));

      toast("Logout","info");
      Router.navigate("/");

const Checklist = {
  ITEMS: [
    { key:"createBio", label:"Bikin bio pertama", hint:"Dashboard → Bikin Bio", icon:"✨" },
    { key:"fillProfile", label:"Isi nama & foto profil", hint:"Editor → Foto Profil", icon:"👤" },

    { key:"pickTheme", label:"Pilih tema favorit", hint:"Editor → Tema", icon:"🎨" },
    { key:"saveBio", label:"Simpan & share", hint:"Editor → Simpan", icon:"💾" }
  ],
  _data:null,_loaded:false,_loading:false,
  
  async load(){
    if(this._loading) return;
    this._loading = true;
    this._data = {};
    this._loaded = false;
    if(!Auth.current || !Auth.current.uid){ this._loading = false; return; }
    try{
      const doc = await FB.db.collection("users").doc(Auth.current.uid).get();
      const d = doc.exists ? doc.data() : {};
      this._data = d.checklistProgress || {};
    }catch(e){ this._data = {}; }
    try{
      const list = await Store.list();
      const bioCount = list.length;
      const linkCount = list.reduce((s,b)=>s + ((b.links||[]).filter(l=>l.active!==false).length), 0);
      if(bioCount > 0) this._data.createBio = true;
      if(list.some(b => b.name && b.profile)) this._data.fillProfile = true;
      if(linkCount >= 3) this._data.add3Links = true;
      if(list.some(b => b.theme && b.theme !== "neo-cream")) this._data.pickTheme = true;
      if(list.some(b => b.id && b.updatedAt)) this._data.saveBio = true;
      try{
        await FB.db.collection("users").doc(Auth.current.uid).set({
          checklistProgress: this._data
        }, { merge:true });
      }catch(e){}
      this._loaded = true;
    }catch(e){ this._loaded = true; }
    this._loading = false;
  },
  
  count(){ if(!this._data) return 0; return this.ITEMS.filter(it => this._data[it.key]).length; },
  
  render(){
    try{
      if(!this._data) return "";
      const done = this.count();
      const total = this.ITEMS.length;
      const pct = Math.round((done/total)*100);
      if(done === total) return "";
      return `
        <div class="onb-checklist" id="dash-checklist">
          <div class="onb-checklist-head">
            <b>🎯 Selesaikan Setup</b>
            <div class="onb-checklist-progress">${done}/${total}</div>
          </div>
          <div class="onb-checklist-bar"><div class="onb-checklist-bar-fill" style="width:${pct}%"></div></div>
          <ul class="onb-checklist-list">
            ${this.ITEMS.map(it=>`
              <li class="onb-check-item ${this._data[it.key]?'done':''}">
                <span class="onb-check-box">${ico('check')}</span>
                <span class="onb-check-text">${it.label}</span>
                <span class="onb-check-hint">${it.hint}</span>
              </li>`).join("")}
          </ul>
        </div>`;
    }catch(e){ return ""; }
  }
};

/* =========================================================
   QR MODAL v26 (canvas fix + auto ensure library)
   ========================================================= */
async function showQRModal(bio, url){
  try{
    // Ensure library
    await ensureQRCodeLibrary();
    
    const canCustom = canDo("qrCustom");
    const colors = [
      { name:"Hitam", hex:"#0a0a0a" },
      { name:"Biru", hex:"#2563eb" },
      { name:"Merah", hex:"#ff2a2a" },
      { name:"Hijau", hex:"#22c55e" },
      { name:"Pink", hex:"#ff69b4" },
      { name:"Ungu", hex:"#a78bfa" },
      { name:"Oranye", hex:"#ff8c00" }
    ];
    const useLogo = bio.profile && canCustom;
    
    const m = openModal(`
      <button class="close-x" onclick="this.closest('.modal-back').remove()">×</button>
      <h3>${ico('qr')} QR Code</h3>
      <p style="font-size:13px;margin-bottom:10px;font-weight:600">Scan untuk buka bio kamu</p>
      <div style="text-align:center">
        <div class="qr-box" style="padding:16px;background:#fff;text-align:center">
          <canvas id="qr-canvas" style="width:220px;height:220px;display:block;margin:0 auto;background:#fff"></canvas>
        </div>
        <div class="qr-url">${esc(url)}</div>
      </div>
      ${canCustom ? `
        <div style="margin-top:14px">
          <label style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);display:block;margin-bottom:8px">🎨 Warna QR</label>
          <div class="qr-custom-grid">
            ${colors.map((c,i)=>`
              <div class="qr-color-opt ${i===0?'active':''}" data-color="${c.hex}" style="background:${c.hex}"></div>
            `).join("")}
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;font-weight:700;cursor:pointer">
            <input type="checkbox" id="qr-use-logo" ${useLogo?"checked":""} style="width:auto;padding:0"/>
            Tambahkan logo di tengah QR
          </label>
        </div>
      ` : `
        <div style="margin-top:14px;background:var(--cream);border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;text-align:center">
          🔒 <b>QR Custom</b> cuma untuk Ultimate atau beli di Fitur Store.
          <button class="btn btn-sm btn-yellow" id="qr-upgrade" style="margin-top:8px">Buka Store →</button>
        </div>
      `}
      <button class="btn btn-primary btn-block" id="qr-dl" style="margin-top:14px">${ico('save')} Download PNG</button>
    `);
    
    if(!m) return;
    
    const qrState = { color: "#0a0a0a", useLogo: !!useLogo };
    const canvasEl = $("#qr-canvas", m);
    
    async function refreshQR(){
      try{
        if(!canvasEl) return;
        if(typeof QRCode === "undefined"){
          const ctx = canvasEl.getContext("2d");
          canvasEl.width = 220; canvasEl.height = 220;
          ctx.fillStyle = "#ff2a2a"; ctx.fillRect(0, 0, 220, 220);
          ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif";
          ctx.textAlign = "center"; ctx.fillText("QR Error", 110, 110);
          return;
        }
        await generateQRCustom(canvasEl, url, {
          color: qrState.color,
          bg: "#ffffff",
          size: 440,
          logo: qrState.useLogo && bio.profile ? bio.profile : null
        });
      }catch(e){ console.warn("refreshQR:", e); }
    }
    
    await refreshQR();
    Sound.tada();
    
    if(canCustom){
      m.querySelectorAll(".qr-color-opt").forEach(el=>{
        el.addEventListener("click", async ()=>{
          m.querySelectorAll(".qr-color-opt").forEach(x=>x.classList.remove("active"));
          el.classList.add("active");
          qrState.color = el.dataset.color;
          await refreshQR();
        });
      });
      const lc = $("#qr-use-logo", m);
      if(lc) lc.addEventListener("change", async e=>{
        qrState.useLogo = e.target.checked;
        await refreshQR();
      });
    } else {
      const ub = $("#qr-upgrade", m);
      if(ub) ub.addEventListener("click", ()=>{ m.remove(); Router.navigate("/store"); });
    }
    
    const dl = $("#qr-dl", m);
    if(dl) dl.addEventListener("click", ()=>{
      try{
        if(!canvasEl){ toast("QR belum ready","error"); return; }
        canvasEl.toBlob((blob)=>{
          if(!blob){ toast("Gagal convert QR","error"); return; }
          const u = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.download = `varlinkbio-qr-${bio.slug||bio.id}.png`;
          a.href = u;
          a.click();
          setTimeout(()=>URL.revokeObjectURL(u), 1000);
          toast("QR didownload!","success");
        }, "image/png");
      }catch(e){ toast("Gagal download: "+e.message,"error"); }
    });
  }catch(e){ console.warn("showQRModal:", e); }
}

/* =========================================================
   PAGE: IKLAN
   ========================================================= */
const PageIklan = {
  _timer:null,
  _countdown:0,
  
  open(){
    if(!Auth.current){ toast("Login dulu","error"); return; }
    if(!Iklan.canWatch()){
      toast(`Max ${IKLAN_MAX_PER_DAY} iklan/hari. Coba besok!`,"error");
      return;
    }
    
    this._countdown = 30;
    const m = openModal(`
      <button class="close-x" id="ik-close">×</button>
      <div class="iklan-modal">
        <div class="ik-icon">📺</div>
        <h3>Nonton Iklan</h3>
        <p>Nonton 30 detik, dapat <b>+${IKLAN_REWARD} kredit</b></p>
        <div class="iklan-countdown" id="ik-count">30</div>
        <div class="iklan-progress"><div class="iklan-progress-fill" id="ik-bar"></div></div>
        <div style="font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:14px">
          📌 Iklan simulasi (placeholder). Integrasi real nanti.
        </div>
        <div style="background:var(--cream);border:2px dashed var(--ink);border-radius:10px;padding:14px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:10px">
          [ Placeholder Iklan ]<br>
          <small style="font-size:11px">Nanti diganti dengan iklan real</small>
        </div>
        <button class="btn btn-primary btn-block" id="ik-claim" disabled>Menunggu...</button>
      </div>
    `);
    
    if(!m) return;
    
    const closeBtn = $("#ik-close",m);
    const claimBtn = $("#ik-claim",m);
    const countEl = $("#ik-count",m);
    const barEl = $("#ik-bar",m);
    
    if(closeBtn) closeBtn.addEventListener("click", ()=>{ this._stop(); m.remove(); });
    
    this._timer = setInterval(()=>{
      this._countdown--;
      if(countEl) countEl.textContent = this._countdown;
      if(barEl) barEl.style.width = ((30 - this._countdown) / 30 * 100) + "%";
      
      if(this._countdown <= 0){
        this._stop();
        if(claimBtn){
          claimBtn.disabled = false;
          claimBtn.textContent = `✅ Klaim +${IKLAN_REWARD} Kredit`;
          claimBtn.classList.remove("btn-primary");
          claimBtn.classList.add("btn-green");
        }
      }
    }, 1000);
    
    if(claimBtn) claimBtn.addEventListener("click", async ()=>{
      if(this._countdown > 0) return;
      showLoading("Memproses...");
      const ok = await Iklan.complete();
      hideLoading();
      if(ok){
        Sound.tada();
        toast(`✅ +${IKLAN_REWARD} kredit!`,"success");
        m.remove();
        this._stop();
        const kb = $("#btn-kredit-top");
        if(kb) kb.innerHTML = `${ico('coins','ic-sm')} ${STATE.kredit || 0}`;
        if(location.hash.includes("/store")) Router.resolve();
      } else {
        toast("Gagal klaim","error");
      }
    });
  },
  
  _stop(){
    if(this._timer){ clearInterval(this._timer); this._timer = null; }
  }
};
</script>

  async load(){
    try{

      const list = await Store.list();
      if(!list.length){
        wrap.innerHTML = `<div class="empty-state"><div class="ei">${ico('folder')}</div><p>Belum ada.</p></div>`;

      }

        return `
        <div class="recent-item">

              <b>${esc(b.name||"Tanpa nama")}</b>
              <span>#${esc(b.slug||b.id)} · ${b.stats?.views||0} views${b.lock?" · 🔒":""}</span>
            </div>
          </div>
          <div class="ri-actions">
            <button class="icon-btn" onclick="PageManage.clone('${b.id}')" title="Clone">${ico('copy')}</button>
            <button class="icon-btn" onclick="PageManage.export('${b.id}')" title="Export">${ico('download')}</button>
            <button class="icon-btn" onclick='copyLink(${bioJson})' title="Copy link">${ico('link')}</button>
            <button class="icon-btn" onclick="PageDashboard.qr('${b.id}')" title="QR">${ico('qr')}</button>
            <button class="icon-btn" onclick="window.open('${PUBLIC_BASE_URL}/#/u/${b.slug||b.id}','_blank')" title="Buka">${ico('eye')}</button>
            <button class="icon-btn" onclick="PageManage.edit('${b.id}')" title="Edit">${ico('edit')}</button>
            <button class="icon-btn danger" onclick="PageManage.remove('${b.id}')" title="Hapus">${ico('trash')}</button>
          </div>
        </div>`;
      }).join("");
    }catch(e){ console.warn("Manage.load:", e); }
  },
  
  async edit(id){
    STATE.currentEdit = id;
    STATE.draft = await Store.get(id);
    if(!STATE.draft){ toast("Tidak ditemukan","error"); return; }
    Router.navigate("/editor");
  },
  
  async remove(id){
    if(!confirm("Hapus link-in-bio ini?")) return;
    showLoading("Menghapus...");
    try{
      await Store.remove(id);
      hideLoading();
      toast("Terhapus","success");
      this.load();
    }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
  },
  
  async clone(id){
    if(!confirm("Clone bio ini?")) return;
    showLoading("Cloning...");
    try{
      const cloned = await Store.clone(id);
      hideLoading();
      toast("✅ Bio berhasil di-clone!","success");
      Sound.tada();
      this.load();
    }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
  },
  
  async export(id){
    try{
      const json = await Store.exportJSON(id);
      const bio = await Store.get(id);
      const blob = new Blob([json], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `varlinkbio-${bio.slug || bio.id}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("✅ Bio di-export!","success");
      Sound.success();
    }catch(e){ toast("Gagal export: "+e.message,"error"); }
  },
  
  openImport(){
    const m = openModal(`
      <button class="close-x" onclick="this.closest('.modal-back').remove()">×</button>
      <h3>${ico('upload')} Import Bio</h3>
      <p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:12px">
        Paste JSON dari file export atau dari bio lain.
      </p>
      <textarea class="import-textarea" id="import-json" placeholder='{"name":"Bio","links":[...]}'></textarea>
      <button class="btn btn-primary btn-block" id="import-submit">${ico('upload')} Import Sekarang</button>
    `);
    if(!m) return;
    const btn = $("#import-submit",m);
    if(btn) btn.addEventListener("click", async ()=>{
      const txt = $("#import-json",m)?.value.trim();
      if(!txt){ toast("Paste JSON dulu","error"); return; }
      showLoading("Importing...");
      try{
        const saved = await Store.importJSON(txt);
        hideLoading();
        toast("✅ Bio berhasil di-import!","success");
        Sound.tada();
        m.remove();
        this.load();
      }catch(e){
        hideLoading();
        toast("Gagal import: "+e.message,"error");
      }
    });
  }
};

/* =========================================================
   PAGE: STATS
   ========================================================= */
const PageStats = {
  async render(){
    if(!Auth.current) return Router.navigate("/login");
    if(!STATE.plan) await loadUserPlan();
    if(STATE.varsmileEnabled) setTimeout(()=>{ Varsmile.hide(); Varsmile.init(); }, 300);
    
    if(!canDo("analytics")){
      $("#app").innerHTML = `
        ${renderTopbar()}
        <div class="container" style="padding-top:40px;padding-bottom:60px">
          <div class="empty-state">
            <div class="ei">${ico('lock')}</div>
            <p style="font-size:15px;margin-bottom:8px">Analytics belum unlock</p>
            <p style="font-size:12.5px;font-weight:600;margin-bottom:20px">Upgrade plan atau beli di Fitur Store (50 kredit)</p>
            <button class="btn btn-primary" id="btn-up">${ico('gift')} Buka Store</button>
          </div>
        </div>`;
      bindTopbar();
      const b = $("#btn-up");
      if(b) b.addEventListener("click", ()=>Router.navigate("/store"));
      return;
    }
    
    const list = await Store.list();
    const totalViews = list.reduce((s,b)=>s+(b.stats?.views||0),0);
    const totalClicks = list.reduce((s,b)=>{
      const c = b.stats?.clicks||{};
      return s+Object.values(c).reduce((x,y)=>x+y,0);
    },0);
    
    const dailyAgg = {};
    const today = new Date();
    for(let i=6; i>=0; i--){
      const d = new Date(today); d.setDate(d.getDate()-i);
      const key = d.toISOString().slice(0,10);
      dailyAgg[key] = { views:0, clicks:0, label:d.toLocaleDateString("id-ID",{weekday:"short"}) };
    }
    list.forEach(b=>{
      const daily = b.stats?.daily || {};
      Object.keys(daily).forEach(k=>{
        if(dailyAgg[k]){
          dailyAgg[k].views += (daily[k].views||0);
          dailyAgg[k].clicks += (daily[k].clicks||0);
        }
      });
    });
    
    const maxViews = Math.max(...Object.values(dailyAgg).map(d=>d.views), 1);
    const chartBars = Object.keys(dailyAgg).map(k=>{
      const d = dailyAgg[k];
      const pct = Math.round((d.views/maxViews)*100);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:flex-end;">
        <div class="chart-bar" style="height:${Math.max(pct,4)}%;width:100%;">
          ${d.views>0?`<div class="chart-bar-val">${d.views}</div>`:''}
        </div>
        <div class="chart-bar-label">${d.label.slice(0,3)}</div>
      </div>`;
    }).join("");
    
    let topLinksHTML = "";
    if(canDo("topLinks")){
      const allLinks = [];
      list.forEach(b=>{
        const clicks = b.stats?.clicks || {};
        (b.links||[]).forEach((l,i)=>{
          if(clicks[i]) allLinks.push({ label:l.label||"Link", url:l.url, count:clicks[i], bioName:b.name });
        });
      });
      allLinks.sort((a,b)=>b.count - a.count);
      const top5 = allLinks.slice(0,5);
      if(top5.length){
        topLinksHTML = `
          <div class="chart-wrap">
            <h4>🔥 Top 5 Link</h4>
            ${top5.map((l,i)=>`
              <div class="link-stat">
                <div class="ls-l">
                  <div style="font-weight:900;font-size:16px">#${i+1}</div>
                  <div class="ls-info"><b>${esc(l.label)}</b><span>${esc(l.bioName||"")}</span></div>
                </div>
                <div class="ls-count">${l.count}</div>
              </div>`).join("")}
          </div>`;
      }
    }
    
    $("#app").innerHTML = `
      ${renderTopbar()}
      <div class="container" style="padding-top:20px;padding-bottom:60px">
        <div class="section-title">Statistik</div>
        <div class="stats-grid">
          <div class="stat-card"><div class="sv">${list.length}</div><div class="sl">Total Bio</div></div>
          <div class="stat-card"><div class="sv">${totalViews}</div><div class="sl">Views</div></div>
          <div class="stat-card"><div class="sv">${totalClicks}</div><div class="sl">Klik</div></div>
          <div class="stat-card"><div class="sv">${totalViews?((totalClicks/totalViews)*100).toFixed(1):0}%</div><div class="sl">CTR</div></div>
        </div>
        ${canDo("analyticsChart")?`
          <div class="chart-wrap"><h4>📊 Views 7 Hari</h4><div class="chart-bars">${chartBars}</div></div>
        `:`<div class="chart-wrap" style="text-align:center"><h4>📊 Chart</h4><p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:8px 0">🔒 Beli di Fitur Store</p><button class="btn btn-sm btn-yellow" onclick="Router.navigate('/store')">Buka Store →</button></div>`}
        ${topLinksHTML}
        <div class="section-title" style="margin-top:20px">Detail Per Bio</div>
        <div id="stats-list"></div>
      </div>`;
    bindTopbar();
    const wrap = $("#stats-list");
    if(!wrap) return;
    if(!list.length){
      wrap.innerHTML = `<div class="empty-state"><p>Belum ada data.</p></div>`;
      return;
    }
    wrap.innerHTML = list.map(b=>{
      const clicks = b.stats?.clicks || {};
      const totalClick = Object.values(clicks).reduce((a,c)=>a+c,0);
      const links = (b.links||[]).map((l,i)=>`
        <div class="link-stat">
          <div class="ls-l">${ico(LinkTypes.icon(l.url))}<div class="ls-info"><b>${esc(l.label||"Link")}</b><span>${esc(l.url)}</span></div></div>
          <div class="ls-count">${clicks[i]||0}</div>
        </div>`).join("");
      return `<div class="card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">
          <div><b style="font-size:14px;text-transform:uppercase">${esc(b.name||"Tanpa nama")}</b>
          <div style="font-size:11.5px;margin-top:2px;font-weight:600">#${esc(b.slug||b.id)} · ${b.stats?.views||0} views · ${totalClick} klik</div></div>
        </div>
        ${links||`<p style="font-size:12.5px;font-weight:600">Belum ada link.</p>`}
      </div>`;
    }).join("");
  }
};

  async openScanQR(){
    try{
      if(typeof Html5Qrcode === "undefined"){
        toast("Library Scan QR belum ke-load","error");
        return;
      }
      
      const m = openModal(`
        <button class="close-x" onclick="this.closest('.modal-back').remove()">×</button>
        <div class="scan-qr-modal">
          <h3>${ico('scan')} Scan QR</h3>
          <p class="scan-hint">Arahkan kamera ke QR code<br>(WA, IG, atau URL)</p>
          <div class="scan-preview" id="scan-preview"></div>
          <div id="scan-result-slot"></div>
          <button class="btn btn-block" id="scan-cancel">${ico('x')} Batal</button>
        </div>
      `);
      if(!m) return;
      
      const scanner = new Html5Qrcode("scan-preview");
      let resultHandled = false;
      
      const onScanSuccess = (decodedText) => {
        if(resultHandled) return;
        resultHandled = true;
        
        const slot = $("#scan-result-slot", m);
        if(slot) slot.innerHTML = `<div class="scan-result">✅ QR: <b>${esc(decodedText)}</b></div>`;
        
        Sound.tada();
        
        // Auto-add sebagai link
        const info = extractLinkInfo(decodedText);
        setTimeout(()=>{
          try{ scanner.stop(); }catch(e){}
          m.remove();
          
          if(info){
            STATE.draft.links.push({
              label: info.label,
              url: info.url,
              type: info.type,
              color: "", thumb: "", active: true,
              featPosX:50, featPosY:50, featZoom:1, featPadding:10, featRatio:"16:9"
            });
            toast(`✅ Link "${info.label}" ditambahkan dari QR!`,"success");
            PageEditor.renderLinks();
            PageEditor.updatePreview();
          } else {
            toast("QR gak dikenali sebagai link","info");
          }
        }, 800);
      };
      
      const onScanError = () => {}; // silent
      
      try{
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess,
          onScanError
        );
      }catch(e){
        console.warn("Scanner start:", e);
        toast("Gagal akses kamera. Cek izin ya.","error");
        m.remove();
        return;
      }
      
      const cancelBtn = $("#scan-cancel", m);
      if(cancelBtn) cancelBtn.addEventListener("click", async ()=>{
        try{ await scanner.stop(); }catch(e){}
        m.remove();
      });
      
    }catch(e){
      console.warn("openScanQR:", e);
      toast("Gagal buka scanner","error");
    }
  },

  renderLinks(){

      return;
    }
    
    wrap.innerHTML = links.map((l,i)=>{
      const autoColor = NEO_COLORS[i % NEO_COLORS.length];
      const curColor = l.color || NEO_HEX[autoColor];
      const isOff = l.active === false;

            ${canFeatured?`<button class="thumb-btn" data-thumb="${i}">${ico('image')} ${l.thumb?'Ganti':'Upload'}</button>`:''}
          </div>
          ${canToggle?`<div class="toggle-switch ${!isOff?'on':''}" data-toggle="${i}"></div>`:''}
          <input type="color" class="link-color-pick" data-color="${i}" value="${curColor}"/>
          <button class="del" data-del="${i}">${ico('x')}</button>

        ${canFeatured && l.thumb ? `
          <div class="feat-edit-panel" style="background:var(--cream);border:2.5px solid var(--ink);border-radius:10px;padding:12px;margin-left:20px">
            <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px">

            <div class="feat-preview-wrap">

                <img class="feat-preview-img" id="feat-img-${i}" src="${esc(l.thumb)}" alt=""
                  style="--feat-ratio-edit:${l.featRatio==='1:1'?'1/1':(l.featRatio==='4:3'?'4/3':(l.featRatio==='auto'?'auto':'16/9'))};
                  --feat-pos-x-edit:${l.featPosX||50}%;
                  --feat-pos-y-edit:${l.featPosY||50}%;
                  --feat-zoom-edit:${l.featZoom||1}"/>
                <div class="feat-preview-label" style="color:${contrastText(curColor)}">${esc(l.label||"Link")}</div>
              </div>
              <div class="feat-preview-hint">💡 Drag gambar untuk atur posisi</div>
            </div>
            
            <div class="feat-slider-row">
              <label>Padding</label>
              <input type="range" min="0" max="30" value="${l.featPadding||10}" data-feat-slider="padding" data-i="${i}"/>
              <span class="feat-slider-val">${l.featPadding||10}px</span>
            </div>
            
            <div class="feat-slider-row">
              <label>Zoom</label>
              <input type="range" min="50" max="200" value="${Math.round((l.featZoom||1)*100)}" data-feat-slider="zoom" data-i="${i}"/>
              <span class="feat-slider-val">${Math.round((l.featZoom||1)*100)}%</span>
            </div>
            
            <div class="field" style="margin-bottom:8px">
              <label style="font-size:11px">Rasio Gambar</label>
              <div class="feat-ratio-grid">
                ${["16:9","1:1","4:3","auto"].map(r=>`
                  <div class="feat-ratio-btn ${(l.featRatio||"16:9")===r?"active":""}" data-feat-ratio="${r}" data-i="${i}">${r.toUpperCase()}</div>

              <button class="btn btn-yellow" data-feat-center="${i}">🎯 Auto Center</button>
              <button class="btn" data-feat-reset="${i}">↺ Reset</button>
            </div>
          </div>
        `:''}
      </div>`;
    }).join("");
    
    // Bind text

      inp.addEventListener("input", e=>{

        const f = e.target.dataset.field;

      });

        if(box) box.style.setProperty("--feat-bg-edit", e.target.value);
        this.updatePreview();
      });
    });
    
    wrap.querySelectorAll("[data-thumb]").forEach(b=>{

            this.renderLinks(); this.updatePreview();
          }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
        };
        inp.click();
      });

    // Featured sliders
    wrap.querySelectorAll("[data-feat-slider]").forEach(slider=>{
      const i = +slider.dataset.i;
      const type = slider.dataset.featSlider;
      slider.addEventListener("input", e=>{
        const val = +e.target.value;
        const link = STATE.draft.links[i];
        const box = document.getElementById("feat-box-"+i);
        const img = document.getElementById("feat-img-"+i);
        const valEl = slider.nextElementSibling;
        
        if(type === "padding"){
          link.featPadding = val;
          if(box) box.style.setProperty("--feat-pad-edit", val+"px");
          if(valEl) valEl.textContent = val+"px";
        } else if(type === "zoom"){
          link.featZoom = val / 100;
          if(img){
            img.style.setProperty("--feat-zoom-edit", val/100);
            img.style.transform = `scale(${val/100})`;
          }
          if(valEl) valEl.textContent = val+"%";
        }
        AutoSave.tick();
        this.updatePreview();
      });
    });
    
    wrap.querySelectorAll("[data-feat-ratio]").forEach(btn=>{
      btn.addEventListener("click", ()=>{

        STATE.draft.links[i].featRatio = btn.dataset.featRatio;
        this.renderLinks(); this.updatePreview();
      });
    });
    
    wrap.querySelectorAll("[data-feat-center]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = +btn.dataset.featCenter;
        const link = STATE.draft.links[i];
        link.featPosX = 50; link.featPosY = 50; link.featZoom = 1;
        toast("Gambar di-center ✓","success");
        this.renderLinks(); this.updatePreview();
      });
    });
    
    wrap.querySelectorAll("[data-feat-reset]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = +btn.dataset.featReset;
        const link = STATE.draft.links[i];
        link.featPosX = 50; link.featPosY = 50; link.featZoom = 1;
        link.featPadding = 10; link.featRatio = "16:9";
        toast("Reset ✓","info");
        this.renderLinks(); this.updatePreview();
      });
    });
    
    // Drag gambar featured
    wrap.querySelectorAll(".feat-preview-img").forEach(img=>{
      const i = +img.id.replace("feat-img-","");
      let isDragging = false, startX = 0, startY = 0, startPosX = 50, startPosY = 50;
      
      const onStart = (e)=>{
        isDragging = true;
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX; startY = touch.clientY;
        startPosX = STATE.draft.links[i].featPosX || 50;
        startPosY = STATE.draft.links[i].featPosY || 50;
        img.style.cursor = "grabbing";
      };
      const onMove = (e)=>{
        if(!isDragging) return;
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const rect = img.getBoundingClientRect();
        const dxP = (dx / rect.width) * 100;
        const dyP = (dy / rect.height) * 100;
        let newX = Math.max(0, Math.min(100, startPosX - dxP));
        let newY = Math.max(0, Math.min(100, startPosY - dyP));
        STATE.draft.links[i].featPosX = newX;
        STATE.draft.links[i].featPosY = newY;
        img.style.objectPosition = newX + "% " + newY + "%";
        img.style.transformOrigin = newX + "% " + newY + "%";
        img.style.setProperty("--feat-pos-x-edit", newX + "%");
        img.style.setProperty("--feat-pos-y-edit", newY + "%");
      };
      const onEnd = ()=>{
        if(!isDragging) return;
        isDragging = false;
        img.style.cursor = "grab";
        AutoSave.tick();
        this.updatePreview();
      };
      img.addEventListener("mousedown", onStart);
      img.addEventListener("touchstart", onStart, { passive:false });
      document.addEventListener("mousemove", onMove);
      document.addEventListener("touchmove", onMove, { passive:false });
      document.addEventListener("mouseup", onEnd);
      document.addEventListener("touchend", onEnd);
    });
  },
  
  renderThemeGrid(){
    const cur = STATE.draft.theme;
    const grid = $("#theme-grid"); if(!grid) return;
    grid.innerHTML = WARNA_LIST.map(t=>{
      const allowed = themeAllowed(t.id);
      return `<div class="theme-item ${cur===t.id?"active":""} ${allowed?"":"locked"}" data-t="${t.id}" style="background:${t.color}">
        <div class="chk">${ico('check')}</div>
        <div class="label">${t.name}</div>
      </div>`;
    }).join("");
    $$("#theme-grid .theme-item").forEach(el=>{
      el.addEventListener("click", ()=>{
        const tid = el.dataset.t;
        if(!themeAllowed(tid)){ toast("Tema belum unlock. Beli di Store!","error"); Router.navigate("/store"); return; }
        STATE.draft.theme = tid;
        $$("#theme-grid .theme-item").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        this.updatePreview();
      });
    });
  },
  
  updatePreview(){
    const frame = $("#prev-frame"); if(!frame) return;
    try{
      frame.srcdoc = PagePublic.buildHTML(STATE.draft, { preview:true });
    }catch(e){ console.warn("updatePreview:", e); }
  },
  
  async save(){
    if(!STATE.draft.name?.trim()){ toast("Nama tidak boleh kosong","error"); return; }
    const plan = STATE.plan;
    if(!isUnlimited(plan.features.maxLinks) && STATE.draft.links.length > plan.features.maxLinks){
      toast(`Max ${plan.features.maxLinks} tombol!`,"error");
      showUpgradeModal(); return;
    }
    showLoading("Menyimpan...");
    try{
      const saved = await Store.save({...STATE.draft});
      STATE.draft = saved; STATE.currentEdit = saved.id;
      AutoSave.reset();
      hideLoading();
      toast("Tersimpan!","success");
      this.render();
      setTimeout(()=>showShareModal(saved), 300);
    }catch(e){
      console.error(e);
      hideLoading();
      toast("Gagal: "+e.message,"error");
    }
  }
};

/* =========================================================
   HELPER — CONTRAST TEXT (buat Featured Link color)
   ========================================================= */
function contrastText(hex){
  try{
    if(!hex) return "#0a0a0a";
    let c = String(hex).trim();
    if(!c.startsWith("#")) c = "#" + c;
    if(c.length === 4) c = "#" + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
    if(c.length !== 7) return "#0a0a0a";
    const r = parseInt(c.slice(1,3),16);
    const g = parseInt(c.slice(3,5),16);
    const b = parseInt(c.slice(5,7),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? "#0a0a0a" : "#ffffff";
  }catch(e){ return "#0a0a0a"; }
}

  async start(){

    try{

      this._overlay.className = "tut-overlay";
      this._overlay.id = "tut-overlay";
      document.body.appendChild(this._overlay);
      
      // Render step 0

      setTimeout(()=>this._overlay.classList.add("active"), 20);

        if(e.key === "Escape"){ this.skip(); }
        if(e.key === "ArrowRight"){ this.next(); }
        if(e.key === "ArrowLeft"){ this.prev(); }
      });
      
      Sound.ding();
    }catch(e){ console.warn("Tutorial.start:", e); }
  },
  
  render(){
    if(!this._overlay) return;
    const s = this._steps[this._step];
    if(!s) return;
    
    const total = this._steps.length;
    const cur = this._step + 1;
    const pct = Math.round((cur/total)*100);
    
    this._overlay.innerHTML = `
      <div class="tut-dialog">
        <div class="tut-steps-bar">
          ${this._steps.map((_,i)=>`
            <div class="tut-step-dot ${i < this._step ? 'done' : (i === this._step ? 'active' : '')}"></div>
          `).join("")}
        </div>
        
        <div class="tut-header">
          <span class="tut-counter">${cur} / ${total}</span>
          <span class="tut-time">~${Math.ceil((total - this._step) * 0.5)} detik lagi</span>
          <button class="tut-close" id="tut-close">${ico('x')}</button>
        </div>
        
        <div class="tut-body">
          <div class="tut-icon ${s.color}">${s.icon}</div>
          <div class="tut-subtitle">${esc(s.subtitle)}</div>
          <div class="tut-title">${esc(s.title)}</div>
          <div class="tut-desc">${s.desc}</div>
          
          <div class="tut-info-box">
            ${s.info.map(i=>`
              <div class="tut-info-item">
                <span class="bullet">${i.bullet}</span>
                <span class="txt">${i.txt}</span>
              </div>
            `).join("")}
          </div>
          
          ${this._step === total - 1 ? `
            <div class="tut-highlight">
              🎉 <b>Selamat!</b> Kamu udah selesai tutorial. Yuk langsung bikin bio pertamamu!
            </div>
          ` : `
            <div class="tut-highlight">
              💡 <b>Tips:</b> Tutorial ini bisa diulang kapan saja di <b>Settings → Tutorial Onboarding</b>.
            </div>
          `}
        </div>
        
        <div class="tut-footer">
          ${this._step > 0 ? `<button class="btn tut-btn-secondary" id="tut-prev">← Kembali</button>` : `<button class="btn tut-btn-secondary" id="tut-skip">Lewati</button>`}
          <button class="btn btn-primary tut-btn" id="tut-next">
            ${this._step === total - 1 ? '🚀 Mulai Sekarang' : 'Lanjut →'}
          </button>
        </div>
      </div>
    `;
    
    // Bind tombol
    const nc = $("#tut-close", this._overlay);
    if(nc) nc.addEventListener("click", ()=>this.skip());
    const nk = $("#tut-skip", this._overlay);
    if(nk) nk.addEventListener("click", ()=>this.skip());
    const np = $("#tut-prev", this._overlay);
    if(np) np.addEventListener("click", ()=>this.prev());
    const nn = $("#tut-next", this._overlay);
    if(nn) nn.addEventListener("click", ()=>this.next());
    
    // Apply highlight
    this.applyHighlight(s.highlight);
    
    // Confetti di step terakhir
    if(this._step === total - 1) this.confetti();
  },
  
  applyHighlight(elementId){
    // Bersihin highlight lama
    if(this._highlightEl){
      try{ this._highlightEl.classList.remove("tut-highlight-target"); }catch(e){}
      this._highlightEl = null;
    }
    if(this._autoScrollTimer){ clearInterval(this._autoScrollTimer); this._autoScrollTimer = null; }
    
    if(!elementId) return;
    
    try{
      const el = document.getElementById(elementId);
      if(!el) return;
      
      this._highlightEl = el;
      el.classList.add("tut-highlight-target");
      
      // Auto scroll ke elemen
      setTimeout(()=>{
        try{
          el.scrollIntoView({ behavior:"smooth", block:"center" });
        }catch(e){}
      }, 300);
      
      // Pulse animation
      let pulseCount = 0;
      this._autoScrollTimer = setInterval(()=>{
        pulseCount++;
        if(pulseCount >= 6){
          clearInterval(this._autoScrollTimer);
          this._autoScrollTimer = null;
        }
      }, 500);
    }catch(e){ console.warn("applyHighlight:", e); }
  },
  
  next(){
    if(this._step < this._steps.length - 1){
      this._step++;
      Sound.click();
      this.render();
    } else {
      this.finish();
    }
  },
  
  prev(){
    if(this._step > 0){
      this._step--;
      Sound.click();
      this.render();
    }
  },
  
  skip(){
    if(!confirm("Yakin mau skip tutorial?")) return;
    this.finish(true);
  },
  
  async finish(skipped=false){
    try{
      // Cleanup
      if(this._highlightEl){
        try{ this._highlightEl.classList.remove("tut-highlight-target"); }catch(e){}
        this._highlightEl = null;
      }
      if(this._autoScrollTimer){ clearInterval(this._autoScrollTimer); this._autoScrollTimer = null; }
      if(this._keyHandler) document.removeEventListener("keydown", this._keyHandler);
      
      // Close overlay
      if(this._overlay){
        this._overlay.classList.remove("active");
        setTimeout(()=>{
          try{ this._overlay.remove(); }catch(e){}
          this._overlay = null;
        }, 400);
      }
      
      // Mark as done
      try{ await Auth.markTutorialDone(); }catch(e){}
      
      if(!skipped){
        Sound.tada();
        toast("🎉 Tutorial selesai! Selamat berkarya!","success");
      } else {
        toast("Tutorial di-skip","info");
      }
    }catch(e){ console.warn("Tutorial.finish:", e); }
  },
  
  confetti(){
    try{
      if(!this._overlay) return;
      const colors = ["#ffd700","#ff2a2a","#22c55e","#2563eb","#ff69b4","#a78bfa","#ff8c00"];
      const container = document.createElement("div");
      container.className = "tut-confetti";
      for(let i=0;i<60;i++){
        const piece = document.createElement("div");
        piece.className = "tut-confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        piece.style.animationDuration = (2.5 + Math.random()*1.5) + "s";
        piece.style.transform = `rotate(${Math.random()*360}deg)`;
        container.appendChild(piece);
      }
      this._overlay.appendChild(container);
      setTimeout(()=>container.remove(), 4000);
    }catch(e){}
  }
};
