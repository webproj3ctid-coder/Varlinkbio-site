  renderLinks:function(){
    var wrap = $("#links-list"); if(!wrap) return;
    var links = STATE.draft.links || [];
    var canFeatured = canDo("featuredLink");
    var canToggle = canDo("toggleLink");
    var NEO_COLORS = ["red","yellow","green","blue","pink","purple","white"];
    var NEO_HEX = { red:"#ff2a2a", yellow:"#ffd700", green:"#22c55e", blue:"#2563eb", pink:"#ff69b4", purple:"#a78bfa", white:"#ffffff" };

    if(!links.length){
      wrap.innerHTML = '<div style="font-size:12.5px;text-align:center;padding:6px;font-weight:600">Belum ada link.</div>';
      return;
    }

    var html = "";
    links.forEach(function(l, i){
      var autoColor = NEO_COLORS[i % NEO_COLORS.length];
      var curColor = l.color || NEO_HEX[autoColor];
      var isOff = l.active === false;
      html += '<div style="display:flex;flex-direction:column;gap:8px;width:100%">';
      html += '<div class="link-row ' + (isOff ? "off" : "") + '" draggable="true" data-i="' + i + '">';
      html += '<span class="drag">' + ico("grip") + '</span>';
      html += '<div class="link-thumb">' + (l.thumb ? '<img src="' + esc(l.thumb) + '">' : ico(LinkTypes.icon(l.url))) + '</div>';
      html += '<div class="link-fields">';
      html += '<input type="text" placeholder="Label" value="' + esc(l.label) + '" data-field="label" data-i="' + i + '"/>';
      html += '<input type="text" placeholder="https://..." value="' + esc(l.url) + '" data-field="url" data-i="' + i + '"/>';
      if(canFeatured) html += '<button class="thumb-btn" data-thumb="' + i + '">' + ico("image") + ' ' + (l.thumb ? "Ganti" : "Upload") + '</button>';
      html += '</div>';
      if(canToggle) html += '<div class="toggle-switch ' + (!isOff ? "on" : "") + '" data-toggle="' + i + '"></div>';
      html += '<input type="color" class="link-color-pick" data-color="' + i + '" value="' + curColor + '"/>';
      html += '<button class="del" data-del="' + i + '">' + ico("x") + '</button>';
      html += '</div>';

      if(canFeatured && l.thumb){
        html += '<div class="feat-edit-panel" style="background:var(--cream);border:2.5px solid var(--ink);border-radius:10px;padding:12px;margin-left:20px">';
        html += '<div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px">' + ico("image") + ' Atur Gambar Tombol</div>';
        html += '<div class="feat-preview-wrap"><div class="feat-preview-box" id="feat-box-' + i + '" style="--feat-bg-edit:' + curColor + ';--feat-pad-edit:' + (l.featPadding || 10) + 'px">';
        var ratio = l.featRatio === "1:1" ? "1/1" : (l.featRatio === "4:3" ? "4/3" : (l.featRatio === "auto" ? "auto" : "16/9"));
        html += '<img class="feat-preview-img" id="feat-img-' + i + '" src="' + esc(l.thumb) + '" alt="" style="--feat-ratio-edit:' + ratio + ';--feat-pos-x-edit:' + (l.featPosX || 50) + '%;--feat-pos-y-edit:' + (l.featPosY || 50) + '%;--feat-zoom-edit:' + (l.featZoom || 1) + '"/>';
        html += '<div class="feat-preview-label" style="color:' + contrastText(curColor) + '">' + esc(l.label || "Link") + '</div>';
        html += '</div><div class="feat-preview-hint">💡 Drag gambar untuk atur posisi</div></div>';
        html += '<div class="feat-slider-row"><label>Padding</label><input type="range" min="0" max="30" value="' + (l.featPadding || 10) + '" data-feat-slider="padding" data-i="' + i + '"/><span class="feat-slider-val">' + (l.featPadding || 10) + 'px</span></div>';
        html += '<div class="feat-slider-row"><label>Zoom</label><input type="range" min="50" max="200" value="' + Math.round((l.featZoom || 1) * 100) + '" data-feat-slider="zoom" data-i="' + i + '"/><span class="feat-slider-val">' + Math.round((l.featZoom || 1) * 100) + '%</span></div>';
        html += '<div class="field" style="margin-bottom:8px"><label style="font-size:11px">Rasio Gambar</label><div class="feat-ratio-grid">';
        ["16:9","1:1","4:3","auto"].forEach(function(r){
          html += '<div class="feat-ratio-btn ' + ((l.featRatio || "16:9") === r ? "active" : "") + '" data-feat-ratio="' + r + '" data-i="' + i + '">' + r.toUpperCase() + '</div>';
        });
        html += '</div></div>';
        html += '<div class="feat-actions"><button class="btn btn-yellow" data-feat-center="' + i + '">🎯 Auto Center</button><button class="btn" data-feat-reset="' + i + '">↺ Reset</button></div>';
        html += '</div>';
      }

      html += '</div>';
    });

    wrap.innerHTML = html;

    wrap.querySelectorAll("input[data-field]").forEach(function(inp){
      inp.addEventListener("input", function(e){
        var i = +e.target.dataset.i;
        var f = e.target.dataset.field;
        STATE.draft.links[i][f] = e.target.value;
        if(f === "url") STATE.draft.links[i].type = LinkTypes.detect(e.target.value);
        AutoSave.tick();
        PageEditor.updatePreview();
      });
    });

    wrap.querySelectorAll(".del").forEach(function(b){
      b.addEventListener("click", function(e){ var i = +e.currentTarget.dataset.del; STATE.draft.links.splice(i, 1); PageEditor.renderLinks(); PageEditor.updatePreview(); });
    });

    wrap.querySelectorAll("[data-toggle]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var i = +el.dataset.toggle;
        STATE.draft.links[i].active = !STATE.draft.links[i].active;
        Sound.tick();
        PageEditor.renderLinks();
        PageEditor.updatePreview();
      });
    });

    wrap.querySelectorAll("[data-color]").forEach(function(b){
      b.addEventListener("input", function(e){
        var i = +e.currentTarget.dataset.color;
        STATE.draft.links[i].color = e.target.value;
        var box = document.getElementById("feat-box-" + i);
        if(box) box.style.setProperty("--feat-bg-edit", e.target.value);
        PageEditor.updatePreview();
      });
    });

    wrap.querySelectorAll("[data-thumb]").forEach(function(b){
      b.addEventListener("click", function(e){
        var i = +e.currentTarget.dataset.thumb;
        var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
        inp.onchange = async function(){
          var f = inp.files[0]; if(!f) return;
          showLoading("Upload...");
          try{
            var url = await Store.upload(f, "thumb");
            STATE.draft.links[i].thumb = url;
            hideLoading(); toast("Gambar diupdate", "success");
            PageEditor.renderLinks(); PageEditor.updatePreview();
          }catch(err){ hideLoading(); toast("Gagal: " + err.message, "error"); }
        };
        inp.click();
      });
    });

    wrap.querySelectorAll("[data-feat-slider]").forEach(function(slider){
      var i = +slider.dataset.i;
      var type = slider.dataset.featSlider;
      slider.addEventListener("input", function(e){
        var val = +e.target.value;
        var link = STATE.draft.links[i];
        var box = document.getElementById("feat-box-" + i);
        var img = document.getElementById("feat-img-" + i);
        var valEl = slider.nextElementSibling;
        if(type === "padding"){
          link.featPadding = val;
          if(box) box.style.setProperty("--feat-pad-edit", val + "px");
          if(valEl) valEl.textContent = val + "px";
        } else if(type === "zoom"){
          link.featZoom = val / 100;
          if(img){ img.style.setProperty("--feat-zoom-edit", val/100); img.style.transform = "scale(" + (val/100) + ")"; }
          if(valEl) valEl.textContent = val + "%";
        }
        AutoSave.tick(); PageEditor.updatePreview();
      });
    });

    wrap.querySelectorAll("[data-feat-ratio]").forEach(function(btn){
      btn.addEventListener("click", function(){ var i = +btn.dataset.i; STATE.draft.links[i].featRatio = btn.dataset.featRatio; PageEditor.renderLinks(); PageEditor.updatePreview(); });
    });
    wrap.querySelectorAll("[data-feat-center]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var i = +btn.dataset.featCenter;
        var link = STATE.draft.links[i];
        link.featPosX = 50; link.featPosY = 50; link.featZoom = 1;
        toast("Gambar di-center ✓", "success");
        PageEditor.renderLinks(); PageEditor.updatePreview();
      });
    });
    wrap.querySelectorAll("[data-feat-reset]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var i = +btn.dataset.featReset;
        var link = STATE.draft.links[i];
        link.featPosX = 50; link.featPosY = 50; link.featZoom = 1;
        link.featPadding = 10; link.featRatio = "16:9";
        toast("Reset ✓", "info");
        PageEditor.renderLinks(); PageEditor.updatePreview();
      });
    });

    wrap.querySelectorAll(".feat-preview-img").forEach(function(img){
      var i = +img.id.replace("feat-img-", "");
      var isDragging = false, startX = 0, startY = 0, startPosX = 50, startPosY = 50;
      var onStart = function(e){
        isDragging = true;
        var touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX; startY = touch.clientY;
        startPosX = STATE.draft.links[i].featPosX || 50;
        startPosY = STATE.draft.links[i].featPosY || 50;
        img.style.cursor = "grabbing";
      };
      var onMove = function(e){
        if(!isDragging) return;
        e.preventDefault();
        var touch = e.touches ? e.touches[0] : e;
        var dx = touch.clientX - startX;
        var dy = touch.clientY - startY;
        var rect = img.getBoundingClientRect();
        var dxP = (dx / rect.width) * 100;
        var dyP = (dy / rect.height) * 100;
        var newX = Math.max(0, Math.min(100, startPosX - dxP));
        var newY = Math.max(0, Math.min(100, startPosY - dyP));
        STATE.draft.links[i].featPosX = newX;
        STATE.draft.links[i].featPosY = newY;
        img.style.objectPosition = newX + "% " + newY + "%";
        img.style.transformOrigin = newX + "% " + newY + "%";
        img.style.setProperty("--feat-pos-x-edit", newX + "%");
        img.style.setProperty("--feat-pos-y-edit", newY + "%");
      };
      var onEnd = function(){
        if(!isDragging) return;
        isDragging = false;
        img.style.cursor = "grab";
        AutoSave.tick();
        PageEditor.updatePreview();
      };
      img.addEventListener("mousedown", onStart);
      img.addEventListener("touchstart", onStart, { passive:false });
      document.addEventListener("mousemove", onMove);
      document.addEventListener("touchmove", onMove, { passive:false });
      document.addEventListener("mouseup", onEnd);
      document.addEventListener("touchend", onEnd);
    });
  },

  renderThemeGrid:function(){
    var cur = STATE.draft.theme;
    var grid = $("#theme-grid"); if(!grid) return;
    var html = "";
    WARNA_LIST.forEach(function(t){
      var allowed = themeAllowed(t.id);
      html += '<div class="theme-item ' + (cur === t.id ? "active" : "") + ' ' + (allowed ? "" : "locked") + '" data-t="' + t.id + '" style="background:' + t.color + '"><div class="chk">' + ico("check") + '</div><div class="label">' + t.name + '</div></div>';
    });
    grid.innerHTML = html;
    $$("#theme-grid .theme-item").forEach(function(el){
      el.addEventListener("click", function(){
        var tid = el.dataset.t;
        if(!themeAllowed(tid)){ toast("Tema belum unlock. Beli di Store!", "error"); Router.navigate("/store"); return; }
        STATE.draft.theme = tid;
        $$("#theme-grid .theme-item").forEach(function(x){ x.classList.remove("active"); });
        el.classList.add("active");
        PageEditor.updatePreview();
      });
    });
  },

  updatePreview:function(){
    var frame = $("#prev-frame"); if(!frame) return;
    try{
      if(window.PagePublic) frame.srcdoc = PagePublic.buildHTML(STATE.draft, { preview:true });
    }catch(e){ console.warn("updatePreview:", e); }
  },

  save:async function(){
    if(!STATE.draft.name || !STATE.draft.name.trim()){ toast("Nama tidak boleh kosong", "error"); return; }
    var plan = STATE.plan;
    if(!isUnlimited(plan.features.maxLinks) && STATE.draft.links.length > plan.features.maxLinks){
      toast("Max " + plan.features.maxLinks + " tombol!", "error");
      showUpgradeModal(); return;
    }
    showLoading("Menyimpan...");
    try{
      var saved = await Store.save(Object.assign({}, STATE.draft));
      STATE.draft = saved;
      STATE.currentEdit = saved.id;
      AutoSave.reset();
      hideLoading();
      toast("Tersimpan!", "success");
      PageEditor.render();
      setTimeout(function(){ showShareModal(saved); }, 300);
    }catch(e){ console.error(e); hideLoading(); toast("Gagal: " + e.message, "error"); }
  }
};

function uploadToCloudinary(file, onProgress){
  return new Promise(function(resolve, reject){
    var formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_CONFIG.uploadPreset);
    formData.append("folder", CLOUDINARY_CONFIG.folder);

    var isVideo = file.type.indexOf("video/") === 0;
    var resourceType = isVideo ? "video" : "auto";
    var url = "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CONFIG.cloudName + "/" + resourceType + "/upload";
    var xhr = new XMLHttpRequest();
    xhr.open("POST", url);

    xhr.upload.onprogress = function(e){
      if(e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };

    xhr.onload = function(){
      if(xhr.status === 200){
        try{
          var data = JSON.parse(xhr.responseText);
          resolve({
            url: data.secure_url,
            publicId: data.public_id,
            format: data.format,
            duration: data.duration || 0,
            bytes: data.bytes,
            isVideo: isVideo,
            resourceType: data.resource_type
          });
        }catch(e){ reject(new Error("Response error")); }
      } else {
        var errMsg = "Upload gagal (HTTP " + xhr.status + ")";
        try{
          var errData = JSON.parse(xhr.responseText);
          if(errData.error && errData.error.message) errMsg = errData.error.message;
        }catch(e){}
        reject(new Error(errMsg));
      }
    };
    xhr.onerror = function(){ reject(new Error("Network error")); };
    xhr.send(formData);
  });
}

      var raw = localStorage.getItem("varlinkbio_playlist_pref");
      if(raw){ var p2 = JSON.parse(raw); if(p2 && Array.isArray(p2.queue)) return p2; }
    }catch(e){}
    return { queue:[], mode:"sequential" };
  },

  setPref:async function(pref){
    try{
      localStorage.setItem("varlinkbio_playlist_pref", JSON.stringify(pref));
      STATE.playlistPref = pref;
      if(Auth.current){
        try{ await FB.db.collection("users").doc(Auth.current.uid).update({ playlistPref: pref }); }catch(e){}
      }
    }catch(e){}
  },

  getQueue:function(){ return this.getPref().queue || []; },
  getMode:function(){ return this.getPref().mode || "sequential"; },

  setMode:async function(mode){
    var p = this.getPref(); p.mode = mode; await this.setPref(p);
    this.showModeBadge(mode);
  },

  addToQueue:async function(musicId){
    var p = this.getPref();
    if(!p.queue) p.queue = [];
    if(p.queue.indexOf(musicId) !== -1) return false;
    p.queue.push(musicId);
    await this.setPref(p);
    return true;
  },

  removeFromQueue:async function(musicId){
    var p = this.getPref();
    if(!p.queue) p.queue = [];
    var idx = p.queue.indexOf(musicId);
    if(idx === -1) return false;
    p.queue.splice(idx, 1);
    await this.setPref(p);
    return true;
  },

  isInQueue:function(musicId){ return (this.getPref().queue || []).indexOf(musicId) !== -1; },

  clearQueue:async function(){
    var p = this.getPref(); p.queue = []; await this.setPref(p);
  },

  getNextTrack:async function(currentId){
    var queue = this.getQueue();
    var mode = this.getMode();
    if(!queue.length) return null;

    if(mode === "sequential"){
      if(!currentId) return await MusicLibrary.getById(queue[0]);
      var curIdx = queue.indexOf(currentId);
      if(curIdx === -1) return await MusicLibrary.getById(queue[0]);
      var nextIdx = (curIdx + 1) % queue.length;
      return await MusicLibrary.getById(queue[nextIdx]);
    }

    if(mode === "loop"){
      if(!currentId) return await MusicLibrary.getById(queue[0]);
      var cur = await MusicLibrary.getById(currentId);
      if(cur) return cur;
      return await MusicLibrary.getById(queue[0]);
    }

    if(mode === "shuffle"){
      var list = queue.slice();
      if(currentId) list = list.filter(function(id){ return id !== currentId; });
      if(!list.length) return await MusicLibrary.getById(currentId);
      var pick = list[Math.floor(Math.random() * list.length)];
      return await MusicLibrary.getById(pick);
    }
    return null;
  },

  showModeBadge:function(mode){
    try{
      var existing = document.querySelector(".music-mode-badge");
      if(existing && existing.parentNode) existing.remove();
      var labels = { sequential:"Urut", shuffle:"Acak", loop:"Loop 1 Lagu" };
      var iconName = mode === "shuffle" ? "arrowRight" : (mode === "loop" ? "arrowLeft" : "list");
      var badge = document.createElement("div");
      badge.className = "music-mode-badge";
      badge.innerHTML = ico(iconName) + ' <span>' + (labels[mode] || mode) + '</span>';
      document.body.appendChild(badge);
      setTimeout(function(){
        if(badge && badge.parentNode){
          badge.classList.add("hide");
          setTimeout(function(){ if(badge.parentNode) badge.remove(); }, 400);
        }
      }, 2000);
    }catch(e){}
  }
};

/* ============================================================
   04. MUSIC PLAYER
   ============================================================ */
var MusicPlayer = {
  _audio:null, _current:null, _btn:null, _toast:null, _autoNextHandlerSet:false,

  init:function(){
    if(!this._audio){
      this._audio = new Audio();
      this._audio.loop = false;
      this._audio.volume = 0.5;
    }
    if(this._audio && !this._autoNextHandlerSet){
      var self = this;
      this._audio.addEventListener("ended", async function(){
        try{
          var next = await PlaylistManager.getNextTrack(self._current ? self._current.id : null);
          if(next && next.url){
            self._current = next;
            self._audio.src = next.url;
            self._audio.play().then(function(){
              self._btnPlaying(true);
              self._showToast("▶️ " + (next.title || "Music"));
            }).catch(function(){});
            if(self._btn) self._btn.title = "Music: " + (next.title || "Untitled");
          } else {
            self._btnPlaying(false);
          }
        }catch(e){ console.warn("autoNext:", e); }
      });
      this._autoNextHandlerSet = true;
    }
  },

  getPref:function(){
    try{
      if(Auth.current && STATE.musicPref) return STATE.musicPref;
      var raw = localStorage.getItem("varlinkbio_music_pref");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { enabled:true, musicId:null };
  },

  setPref:async function(pref){
    try{
      localStorage.setItem("varlinkbio_music_pref", JSON.stringify(pref));
      STATE.musicPref = pref;
      if(Auth.current){
        try{ await FB.db.collection("users").doc(Auth.current.uid).update({ musicPref: pref }); }catch(e){}
      }
    }catch(e){}
  },

  resolveMusic:async function(){
    try{
      var hashPath = (location.hash.slice(1) || "/").split("?")[0];

      if(hashPath.indexOf("/u/") === 0){
        if(window._publicBioMusicId){
          var m = await MusicLibrary.getById(window._publicBioMusicId);
          if(m) return m;
        }
      }

      if(Auth.current){
        var pref = this.getPref();
        if(pref.musicId){
          var m2 = await MusicLibrary.getById(pref.musicId);
          if(m2) return m2;
        }
      }

      return await MusicLibrary.getDefault();
    }catch(e){ return null; }
  },

  start:async function(){
    this.init();
    var pref = this.getPref();
    if(pref.enabled === false){ this._renderButtonOnly(); return; }

    var music = await this.resolveMusic();
    if(!music || !music.url) return;

    this._current = music;
    this._audio.src = music.url;
    this._renderButton();

    var self = this;
    var p = this._audio.play();
    if(p && p.catch){
      p.then(function(){ self._btnPlaying(true); }).catch(function(err){
        self._showToast("🔇 Tap tombol musik buat nyalain");
        self._btnPlaying(false);
      });
    }

    var onceHandler = function(){
      if(self._audio && self._audio.paused && self._current){
        self._audio.play().then(function(){ self._btnPlaying(true); }).catch(function(){});
      }
      document.removeEventListener("click", onceHandler);
    };
    document.addEventListener("click", onceHandler, { once:true });
  },

  _renderButtonOnly:function(){
    this._renderButton();
    if(this._btn) this._btn.classList.remove("playing");
  },

  _renderButton:function(){
    if(this._btn) try{ this._btn.remove(); }catch(e){}
    var self = this;
    var btn = document.createElement("div");
    btn.className = "music-float-btn";
    btn.id = "music-float-btn";
    btn.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path class="mus-icon-note" d="M9 18V5l12-2v13"/><circle class="mus-icon-note" cx="6" cy="18" r="3"/><circle class="mus-icon-note" cx="18" cy="16" r="3"/><line class="mus-slash" x1="3" y1="3" x2="21" y2="21" stroke-width="2.5"/></svg>';
    btn.title = "Toggle Music";
    document.body.appendChild(btn);
    this._btn = btn;
    btn.addEventListener("click", function(e){ e.stopPropagation(); self.toggle(); });
  },

  _btnPlaying:function(isPlaying){
    if(!this._btn) return;
    if(isPlaying) this._btn.classList.add("playing");
    else this._btn.classList.remove("playing");
  },

  toggle:async function(){
    var self = this;
    if(!this._current){
      var m = await this.resolveMusic();
      if(m && m.url){
        this._current = m;
        this._audio.src = m.url;
        this._audio.play().then(function(){
          self._btnPlaying(true);
          self._showToast("🎵 " + (m.title || "Music"));
        }).catch(function(e){ self._showToast("❌ " + e.message); });
      } else { self._showToast("❌ Belum ada music"); }
      return;
    }
    if(this._audio.paused){
      this._audio.play().then(function(){
        self._btnPlaying(true);
        self.setPref({ enabled:true, musicId: self._current.id });
        self._showToast("🎵 " + (self._current.title || "Music"));
      }).catch(function(err){ self._showToast("❌ " + err.message); });
    } else {
      this._audio.pause();
      this._btnPlaying(false);
      this.setPref({ enabled:false, musicId: this._current.id });
      this._showToast("🔇 Music dimatiin");
    }
  },

  _showToast:function(text){
    var self = this;
    if(this._toast) try{ this._toast.remove(); }catch(e){}
    var t = document.createElement("div");
    t.className = "music-toast";
    t.textContent = text;
    document.body.appendChild(t);
    this._toast = t;
    setTimeout(function(){
      if(self._toast === t){
        t.classList.add("hide");
        setTimeout(function(){ try{ t.remove(); }catch(e){} if(self._toast === t) self._toast = null; }, 400);
      }
    }, 3000);
  },

  setUserMusic:async function(musicId){
    await this.setPref({ enabled:true, musicId: musicId });
    var m = await MusicLibrary.getById(musicId);
    if(m && m.url){
      this._current = m;
      this._audio.src = m.url;
      var self = this;
      this._audio.play().then(function(){ self._btnPlaying(true); }).catch(function(){});
    }
    toast("✅ Music dipilih!", "success");
  },

  unsetUserMusic:async function(){
    await this.setPref({ enabled:false, musicId:null });
    if(this._audio){ this._audio.pause(); this._audio.currentTime = 0; }
    this._btnPlaying(false);
    toast("🔇 Music dimatiin", "info");
  },

  stop:function(){
    if(this._audio){ this._audio.pause(); this._audio.currentTime = 0; }
    if(this._btn) try{ this._btn.remove(); }catch(e){}
    this._btn = null;
    if(this._toast) try{ this._toast.remove(); }catch(e){}
    this._toast = null;
  }
};

var PageMusic = {

      html += '<div style="margin:14px 0 8px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px">' + ico("list") + ' Semua Music</div>';

      list.forEach(function(m){
        var inPl = queue.indexOf(m.id) !== -1;
        var isSelected = (m.id === selectedId) && enabled;
        html += '<div class="music-picker-item ' + (isSelected ? "selected" : "") + ' ' + (inPl ? "in-playlist" : "") + '" data-music-id="' + m.id + '">';
        html += '<div class="mpi-play" data-action="preview" data-id="' + m.id + '">' + ico("play") + '</div>';
        html += '<div class="mpi-info"><div class="mpi-title">' + esc(m.title || "Untitled") + '</div><div class="mpi-artist">' + esc(m.artist || "Unknown") + (m.isDefault ? " · Default" : "") + '</div></div>';

        html += '</div>';
      });

      wrap.innerHTML = html;

      wrap.querySelectorAll("[data-plmode]").forEach(function(btn){
        btn.addEventListener("click", async function(){
          await PlaylistManager.setMode(btn.dataset.plmode);
          PageMusic.loadList();
        });
      });

      wrap.querySelectorAll("[data-add-pl]").forEach(function(btn){
        btn.addEventListener("click", async function(e){
          e.stopPropagation();
          var id = btn.dataset.addPl;
          if(PlaylistManager.isInQueue(id)){
            await PlaylistManager.removeFromQueue(id);
            toast("Dihapus dari playlist", "info");
          } else {
            await PlaylistManager.addToQueue(id);
            toast("✅ Ditambah ke playlist!", "success");
          }
          PageMusic.loadList();
        });
      });

      wrap.querySelectorAll("[data-pl-remove]").forEach(function(btn){
        btn.addEventListener("click", async function(e){
          e.stopPropagation();
          await PlaylistManager.removeFromQueue(btn.dataset.plRemove);
          toast("Dihapus dari playlist", "info");
          PageMusic.loadList();
        });
      });

      var clearBtn = $("#pl-clear");
      if(clearBtn) clearBtn.addEventListener("click", async function(){
        if(!confirm("Hapus semua lagu dari playlist?")) return;
        await PlaylistManager.clearQueue();
        toast("Playlist dikosongkan", "info");

        await MusicPlayer.unsetUserMusic();
        PageMusic.loadList();
      });

      wrap.querySelectorAll('[data-action="preview"]').forEach(function(el){

          var id = el.dataset.id;
          var music = list.find(function(x){ return x.id === id; });
          if(music) PageMusic.preview(music, el);
        });
      });

      wrap.querySelectorAll(".music-picker-item").forEach(function(item){
        item.addEventListener("dblclick", async function(){
          var id = item.dataset.musicId;
          await MusicPlayer.setUserMusic(id);
          PageMusic.loadList();
        });
      });
    }catch(e){
      console.warn("PageMusic.loadList:", e);
      wrap.innerHTML = '<div class="music-picker-empty">😵 ' + esc(e.message) + '</div>';
    }
  },

  preview:function(music, btnEl){
    if(this._previewAudio){ this._previewAudio.pause(); this._previewAudio = null; }
    if(this._previewId === music.id){
      this._previewId = null;
      if(btnEl) btnEl.innerHTML = ico("play");
      return;
    }
    this._previewId = music.id;
    this._previewAudio = new Audio(music.url);
    this._previewAudio.volume = 0.6;
    this._previewAudio.play().catch(function(){});
    document.querySelectorAll(".mpi-play").forEach(function(el){ el.innerHTML = ico("play"); });
    if(btnEl) btnEl.innerHTML = ico("pause");
    var self = this;
    this._previewAudio.onended = function(){
      if(btnEl) btnEl.innerHTML = ico("play");
      self._previewId = null;
      self._previewAudio = null;
    };
  }
};

    try{

      var until = m.until || 0;
      var reason = m.reason || "Sedang ada perbaikan";
      var now = Date.now();
      var remaining = until > 0 ? Math.max(0, until - now) : 0;
      var remainingMin = Math.floor(remaining / 60000);

      var html = '<div class="dev-manager"><div class="dev-manager-head"><div class="mgr-title">' + ico("settings") + ' Maintenance Mode</div></div>';
      html += '<div class="maint-status-card ' + (active ? "active" : "inactive") + '">';

      if(active && until > 0){
        html += '<div style="background:rgba(255,255,255,.5);border-radius:8px;padding:10px;margin-bottom:10px;text-align:center"><div style="font-size:11px;font-weight:900;text-transform:uppercase">⏱️ Auto Unlock Dalam</div><div style="font-size:22px;font-weight:900;font-family:var(--mono)">~' + remainingMin + ' menit</div></div>';
      }
      if(active && !until){
        html += '<div style="background:rgba(255,255,255,.5);border-radius:8px;padding:10px;margin-bottom:10px;text-align:center;font-size:12px;font-weight:700">🔒 Manual mode</div>';
      }
      html += '</div>';
      html += '<div style="background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:12px">';
      html += '<div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;color:var(--ink-soft)">📋 Alasan:</div>';
      html += '<input type="text" id="maint-reason" value="' + esc(reason) + '" placeholder="Alasan maintenance..." style="width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px"/>';
      html += '<div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;color:var(--ink-soft)">⏱️ Durasi:</div>';
      html += '<div class="maint-duration-grid">';
      [15,30,60,120,360,1440].forEach(function(min){ html += '<div class="maint-duration-btn" data-min="' + min + '">' + (min < 60 ? min + " menit" : (min < 1440 ? (min/60) + " jam" : "1 hari")) + '</div>'; });
      html += '<div class="maint-duration-btn" data-min="0">Manual</div>';
      html += '</div></div>';
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
      if(active) html += '<button class="btn btn-green btn-block" id="maint-off">✅ MATIKAN MAINTENANCE</button>';
      else html += '<button class="btn btn-red btn-block" id="maint-on">🔧 AKTIFKAN MAINTENANCE</button>';
      html += '</div>';
      html += '<div style="background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:12px;margin-top:14px;font-size:11.5px;font-weight:600;line-height:1.6"><b>💡 Info:</b><ul style="margin-left:16px;margin-top:6px"><li>User buka web bakal lihat halaman maintenance</li><li>Auto-refresh tiap 5 detik</li><li>Developer bypass, tetap bisa akses</li><li>Durasi "Manual" = gak auto-unlock</li></ul></div>';
      html += '</div>';
      wrap.innerHTML = html;

      var selectedMin = null;
      wrap.querySelectorAll(".maint-duration-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          wrap.querySelectorAll(".maint-duration-btn").forEach(function(x){ x.classList.remove("active"); });
          btn.classList.add("active");
          selectedMin = parseInt(btn.dataset.min, 10);
        });
      });
      var onBtn = $("#maint-on");
      if(onBtn) onBtn.addEventListener("click", async function(){

        var reasonText = ($("#maint-reason") && $("#maint-reason").value.trim()) || "Sedang ada perbaikan";
        var until2 = selectedMin > 0 ? Date.now() + selectedMin * 60000 : 0;
        if(!confirm("Aktifkan maintenance " + (selectedMin > 0 ? selectedMin + " menit" : "manual") + "?")) return;

      });
    }catch(e){ wrap.innerHTML = '<div class="dev-manager"><div class="mgr-empty">😵 ' + esc(e.message) + '</div></div>'; }

      html += '<label style="display:block;margin-bottom:10px"><input type="file" id="fav-file" accept="image/*" style="display:none"/><div class="btn btn-primary btn-block" style="cursor:pointer">📤 Upload Favicon</div></label>';

        if(f.size > 100*1024){ toast("File max 100KB!", "error"); return; }
        showLoading("Upload...");
        try{
          var dataUrl = await new Promise(function(res, rej){
            var r = new FileReader();
            r.onload = function(){ res(r.result); };
            r.onerror = function(){ rej(new Error("Gagal baca file")); };
            r.readAsDataURL(f);
          });
          await Store.saveSettings({ favicon: dataUrl });
          hideLoading(); toast("✅ Favicon diupdate!", "success"); Sound.tada();
          var links = document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']");
          if(!links.length){ var link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); links = [link]; }
          Array.prototype.forEach.call(links, function(l){ l.href = dataUrl; });
          PageDev.renderFavicon();
        }catch(err){ hideLoading(); toast("Gagal: " + err.message, "error"); }
      });
      var clearBtn = $("#fav-clear");
      if(clearBtn) clearBtn.addEventListener("click", async function(){

        catch(e){ toast("Gagal: " + e.message, "error"); }
      });
    }catch(e){ wrap.innerHTML = '<div class="dev-manager"><div class="mgr-empty">😵 ' + esc(e.message) + '</div></div>'; }
  },

/* ============================================================
   07. NOTIFICATION MANAGER
   ============================================================ */
var NotificationManager = {
  _list:[], _unreadCount:0, _dropdownEl:null, _unsubscribe:null, _initialized:false, _outsideHandler:null,

  load:async function(){
    if(!Auth.current) return [];
    try{
      var snap = await FB.db.collection("users").doc(Auth.current.uid).collection("notifications").orderBy("createdAt","desc").limit(30).get();
      var list = [];
      snap.forEach(function(d){ list.push(Object.assign({ id:d.id }, d.data())); });
      this._list = list;
      this._unreadCount = list.filter(function(n){ return !n.read; }).length;
      return list;
    }catch(e){ console.warn("NotificationManager.load:", e); return []; }
  },

  listen:function(){
    if(!Auth.current) return;
    if(this._unsubscribe) try{ this._unsubscribe(); }catch(e){}
    var self = this;
    try{
      this._unsubscribe = FB.db.collection("users").doc(Auth.current.uid).collection("notifications").orderBy("createdAt","desc").limit(30).onSnapshot(function(snap){
        var list = [];
        snap.forEach(function(d){ list.push(Object.assign({ id:d.id }, d.data())); });
        self._list = list;
        var oldCount = self._unreadCount;
        self._unreadCount = list.filter(function(n){ return !n.read; }).length;
        self.updateBell();
        if(self._dropdownEl && document.body.contains(self._dropdownEl)) self.renderDropdownContent();
        if(self._unreadCount > oldCount && oldCount !== 0){ if(window.Sound && Sound.ding) Sound.ding(); }
      }, function(err){ console.warn("notif listener:", err); });
    }catch(e){ console.warn("NotificationManager.listen:", e); }
  },

  updateBell:function(){
    var bell = document.getElementById("btn-bell-top");
    if(!bell) return;
    var count = this._unreadCount;
    if(count > 0){
      bell.classList.add("has-unread");
      var badge = bell.querySelector(".bell-count");
      if(!badge){ badge = document.createElement("span"); badge.className = "bell-count"; bell.appendChild(badge); }
      badge.textContent = count > 99 ? "99+" : count;
    } else {
      bell.classList.remove("has-unread");
      var badge2 = bell.querySelector(".bell-count");
      if(badge2) badge2.remove();
    }
  },

  toggleDropdown:function(){
    if(this._dropdownEl && document.body.contains(this._dropdownEl)){ this.closeDropdown(); return; }
    this.openDropdown();
  },

  openDropdown:function(){
    if(this._dropdownEl) try{ this._dropdownEl.remove(); }catch(e){}
    var el = document.createElement("div");
    el.className = "notif-dropdown";
    el.id = "notif-dropdown";
    document.body.appendChild(el);
    this._dropdownEl = el;
    this.renderDropdownContent();
    var self = this;
    setTimeout(function(){
      self._outsideHandler = function(e){
        if(!el.contains(e.target) && !(e.target.closest && e.target.closest("#btn-bell-top"))) self.closeDropdown();
      };
      document.addEventListener("click", self._outsideHandler);
    }, 100);
  },

  closeDropdown:function(){
    if(this._dropdownEl){
      var el = this._dropdownEl;
      el.classList.add("hide");
      setTimeout(function(){ try{ el.remove(); }catch(e){} }, 200);
      this._dropdownEl = null;
    }
    if(this._outsideHandler){
      document.removeEventListener("click", this._outsideHandler);
      this._outsideHandler = null;
    }
  },

  renderDropdownContent:function(){
    if(!this._dropdownEl) return;
    var list = this._list;
    var unread = this._unreadCount;
    var html = '<div class="nd-head"><div class="nd-title">' + ico("bell") + ' Notifikasi</div>';
    if(unread > 0) html += '<div class="nd-count">' + unread + ' baru</div>';
    html += '<button class="nd-close" id="nd-close-btn">' + ico("x") + '</button></div>';
    html += '<div class="nd-list">';
    if(list.length === 0){
      html += '<div class="notif-empty"><span class="ne-icon">🔕</span><div class="ne-title">Belum ada notifikasi</div><div>Notif dari admin bakal muncul di sini</div></div>';
    } else {
      var self = this;
      list.forEach(function(n){
        var timeAgo = self.timeAgo(n.createdAt);
        html += '<div class="notif-item ' + (n.read ? "" : "unread") + '" data-notif-id="' + n.id + '" data-link="' + esc(n.link || "") + '">';
        html += '<div class="ni-icon">' + (n.from === "admin" ? "📢" : "🔔") + '</div>';
        html += '<div class="ni-info"><div class="ni-title">' + esc(n.title || "Notifikasi") + '</div>';
        if(n.body) html += '<div class="ni-body">' + esc(n.body) + '</div>';
        html += '<div class="ni-time">' + timeAgo + '</div></div></div>';
      });
    }
    html += '</div>';
    if(list.length > 0){
      html += '<div class="nd-foot">';
      if(unread > 0) html += '<button class="btn btn-sm btn-primary" id="nd-mark-all">' + ico("check") + ' Tandai Dibaca</button>';
      html += '<button class="btn btn-sm btn-red" id="nd-clear">' + ico("trash") + ' Hapus Semua</button>';
      html += '</div>';
    }
    this._dropdownEl.innerHTML = html;
    this.bindDropdownEvents();
  },

  bindDropdownEvents:function(){
    if(!this._dropdownEl) return;
    var el = this._dropdownEl;
    var self = this;
    var closeBtn = el.querySelector("#nd-close-btn");
    if(closeBtn) closeBtn.addEventListener("click", function(){ self.closeDropdown(); });
    el.querySelectorAll(".notif-item").forEach(function(item){
      item.addEventListener("click", async function(){
        var id = item.dataset.notifId;
        var link = item.dataset.link;
        await self.markRead(id);
        if(link){
          self.closeDropdown();
          setTimeout(function(){
            if(link.indexOf("#/") === 0) location.hash = link.slice(2);
            else if(link.indexOf("http") === 0) window.open(link, "_blank");
          }, 200);
        }
      });
    });
    var markAllBtn = el.querySelector("#nd-mark-all");
    if(markAllBtn) markAllBtn.addEventListener("click", function(){ self.markAllRead(); });
    var clearBtn = el.querySelector("#nd-clear");
    if(clearBtn) clearBtn.addEventListener("click", async function(){
      if(!confirm("Hapus semua notifikasi?")) return;
      await self.clearAll();
    });
  },

  markRead:async function(id){
    if(!Auth.current) return;
    try{ await FB.db.collection("users").doc(Auth.current.uid).collection("notifications").doc(id).update({ read:true, readAt:Date.now() }); }
    catch(e){ console.warn("markRead:", e); }
  },

  markAllRead:async function(){
    if(!Auth.current) return;
    try{
      var snap = await FB.db.collection("users").doc(Auth.current.uid).collection("notifications").where("read","==",false).get();
      var batch = FB.db.batch();
      snap.forEach(function(d){ batch.update(d.ref, { read:true, readAt:Date.now() }); });
      await batch.commit();
      toast("✅ Semua ditandai dibaca", "success");
    }catch(e){ toast("Gagal: " + e.message, "error"); }
  },

  clearAll:async function(){
    if(!Auth.current) return;
    try{
      var snap = await FB.db.collection("users").doc(Auth.current.uid).collection("notifications").get();
      var batch = FB.db.batch();
      snap.forEach(function(d){ batch.delete(d.ref); });
      await batch.commit();
      toast("Notifikasi dihapus", "info");
    }catch(e){ toast("Gagal: " + e.message, "error"); }
  },

  timeAgo:function(ts){
    if(!ts) return "";
    var diff = Date.now() - ts;
    var sec = Math.floor(diff / 1000);
    if(sec < 60) return "Baru saja";
    var min = Math.floor(sec / 60);
    if(min < 60) return min + " menit lalu";
    var hr = Math.floor(min / 60);
    if(hr < 24) return hr + " jam lalu";
    var day = Math.floor(hr / 24);
    if(day < 7) return day + " hari lalu";
    return new Date(ts).toLocaleDateString("id-ID", { day:"numeric", month:"short" });
  },

  init:async function(){
    if(this._initialized) return;
    if(!Auth.current) return;
    this._initialized = true;
    await this.load();
    this.listen();
  }
};

/* ============================================================
   08. FCM MANAGER
   ============================================================ */
var FCMManager = {
  _token:null, _permissionAsked:false,

  isSupported:function(){
    try{
      return ("serviceWorker" in navigator) && ("Notification" in window) && ("PushManager" in window) &&
        !!(window.firebase && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported());
    }catch(e){ return false; }
  },

  getPermission:function(){
    try{ return Notification.permission; }catch(e){ return "default"; }
  },

  requestPermission:async function(){
    if(!this.isSupported()) return false;
    try{
      var perm = await Notification.requestPermission();
      if(perm === "granted"){ await this.registerToken(); return true; }
      return false;
    }catch(e){ return false; }
  },

  registerToken:async function(){
    if(!Auth.current) return null;
    if(!this.isSupported()) return null;
    try{
      var messaging = FB.messaging || (firebase.messaging && firebase.messaging());
      if(!messaging) return null;
      if("serviceWorker" in navigator){
        try{ await navigator.serviceWorker.register("/firebase-messaging-sw.js"); }catch(e){}
      }
      var token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY });
      if(!token) return null;
      this._token = token;
      STATE.fcmToken = token;
      await FB.db.collection("users").doc(Auth.current.uid).update({ fcmToken: token, notifEnabled: true, notifUpdatedAt: Date.now() });
      messaging.onMessage(function(payload){
        try{
          var title = (payload.notification && payload.notification.title) || (payload.data && payload.data.title) || "Varlinkbio";
          var body = (payload.notification && payload.notification.body) || (payload.data && payload.data.body) || "";
          toast("🔔 " + title + (body ? ": " + body : ""), "info");
          if(Notification.permission === "granted"){ new Notification(title, { body:body, tag:"varlinkbio" }); }
          NotificationManager.load();
        }catch(e){}
      });
      return token;
    }catch(e){ console.warn("registerToken:", e); return null; }
  },

  unregister:async function(){
    try{
      if(!Auth.current) return;
      if(FB.messaging){ try{ await FB.messaging.deleteToken(); }catch(e){} }
      await FB.db.collection("users").doc(Auth.current.uid).update({
        fcmToken: firebase.firestore.FieldValue.delete(), notifEnabled: false, notifUpdatedAt: Date.now()
      });
      this._token = null;
      STATE.fcmToken = null;
      toast("Notifikasi dimatiin", "info");
      return true;
    }catch(e){ return false; }
  },

  showPermissionBanner:async function(){
    if(this._permissionAsked) return;
    if(!this.isSupported()) return;
    if(!Auth.current) return;
    if(document.getElementById("fcm-banner")) return;
    if(this.getPermission() === "granted" || this.getPermission() === "denied") return;
    if(STATE.notifEnabled === false) return;
    try{
      var lastDismiss = localStorage.getItem("varlinkbio_fcm_dismiss");
      if(lastDismiss && Date.now() - parseInt(lastDismiss, 10) < 24 * 60 * 60 * 1000) return;
    }catch(e){}
    this._permissionAsked = true;
    await new Promise(function(r){ setTimeout(r, 3000); });
    var banner = document.createElement("div");
    banner.className = "fcm-banner";
    banner.id = "fcm-banner";
    banner.innerHTML = '<div class="fb-icon">🔔</div><div class="fb-info"><b>Aktifin Notifikasi?</b><span>Dapet update, promo, & notif dari admin langsung di HP kamu</span></div><div class="fb-actions"><button class="btn btn-sm" id="fcm-later" style="background:var(--cream)">Nanti</button><button class="btn btn-sm btn-primary" id="fcm-allow">Aktifin</button></div>';
    document.body.appendChild(banner);
    var self = this;
    var close = function(){
      try{ banner.style.opacity = "0"; banner.style.transform = "translateY(30px)"; setTimeout(function(){ try{ banner.remove(); }catch(e){} }, 300); }catch(e){}
    };
    var allowBtn = banner.querySelector("#fcm-allow");
    if(allowBtn) allowBtn.addEventListener("click", async function(){
      var ok = await self.requestPermission();
      if(ok) toast("✅ Notifikasi aktif!", "success");
      else toast("Notifikasi ditolak", "info");
      close();
    });
    var laterBtn = banner.querySelector("#fcm-later");
    if(laterBtn) laterBtn.addEventListener("click", function(){
      try{ localStorage.setItem("varlinkbio_fcm_dismiss", String(Date.now())); }catch(e){}
      close();
    });
  }
};

/* ============================================================
   09. INJECT BELL INTO TOPBAR

function injectBellIntoTopbar(){

  generate:async function(userInput, style){
    if(!GROQ_CONFIG.apiKey || GROQ_CONFIG.apiKey.trim() === ""){
      return this.fallbackGenerate(userInput, style);
    }
    var kategori = $("#ai-kategori") ? $("#ai-kategori").value : "";
    var sysPrompt = 'Kamu adalah asisten Varlinkbio. Bikin bio in-bio dari deskripsi user.\n\nOUTPUT HARUS JSON valid (tanpa markdown):\n{"bio":"max 60 char dengan emoji","links":[{"label":"WhatsApp Order","url":"https://wa.me/"},{"label":"Instagram","url":"https://instagram.com/"},{"label":"Katalog","url":"#"},{"label":"Testimoni","url":"#"}],"tema":"neo-pink","style":"minimalist","tips":"saran singkat"}\n\nAturan:\n- Bio maksimal 60 karakter, ada 1 emoji di awal\n- Link 3-4 link relevan\n- Tema pilih dari: neo-cream, neo-midnight, neo-dark, neo-blue, neo-rose, neo-pink, neo-green, neo-purple, neo-orange, neo-ocean, neo-coffee, neo-sunset, neo-galaxy, neo-neon, neo-retro, neo-sakura, neo-gold\n- Style pilih dari: brutalism, minimalist, glassmorphism, material, gaming, vintage, cyberpunk, aurora, retro, cosmic, anime\n- Gaya bahasa: ' + style + '\n- Output HANYA JSON, tanpa penjelasan.';
    var userMsg = 'User bilang: "' + userInput + '"' + (kategori ? '\nKategori: ' + kategori : '');

    var response = await fetch(GROQ_CONFIG.endpoint, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization":"Bearer " + GROQ_CONFIG.apiKey },
      body: JSON.stringify({
        model: GROQ_CONFIG.model,
        messages: [
          { role:"system", content: sysPrompt },
          { role:"user", content: userMsg }
        ],
        max_tokens: GROQ_CONFIG.maxTokens,
        temperature: GROQ_CONFIG.temperature,
        response_format: { type:"json_object" }
      })
    });

    if(!response.ok){
      if(response.status === 429){
        console.warn("Groq limit, fallback ke rule-based");
        return this.fallbackGenerate(userInput, style);
      }
      var errText = await response.text();
      throw new Error("Groq error: " + response.status);
    }
    var resData = await response.json();
    var content = resData.choices && resData.choices[0] && resData.choices[0].message && resData.choices[0].message.content;
    if(!content) throw new Error("Response kosong");
    var parsed = JSON.parse(content);

/* ============================================================

var VarsmileAI = {
  _panel:null, _history:[], _typing:false,

  open:function(){

  sendMessage:async function(text){

    if(!chk.ok){
      toast("Limit chat habis! Upgrade plan dulu.", "error");

    var sendBtn = document.getElementById("vai-send");

      var usage = STATE.aiChatUsage || { count:0, lastDate:"" };

  askGroq:async function(userText){

  render:async function(idOrSlug){

        if(doc.exists) bio = Object.assign({ id:doc.id }, doc.data());
      }catch(e){ console.warn("get by id:", e); }
      if(!bio){
        try{
          var q = await FB.db.collection("bios").where("slug","==",idOrSlug).limit(1).get();
          if(!q.empty){ var d = q.docs[0]; bio = Object.assign({ id:d.id }, d.data()); }
        }catch(e){ console.warn("get by slug:", e); }

      if(!bio){
        if(app) app.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 18px;text-align:center;background:#f0ebe0;font-family:Inter,sans-serif;font-weight:700"><div style="font-size:80px;margin-bottom:16px">🔍</div><h1 style="font-size:24px;font-weight:900;text-transform:uppercase;margin-bottom:8px">Bio Tidak Ditemukan</h1><p style="font-size:13.5px;font-weight:600;color:#555;margin-bottom:20px;max-width:320px;line-height:1.6">URL yang kamu buka gak ada atau udah dihapus.</p><a href="' + APP_BASE_URL + '/#/register" style="display:inline-block;padding:12px 20px;background:#0a0a0a;color:#fff;border:2.5px solid #0a0a0a;border-radius:10px;font-weight:900;font-size:13px;text-transform:uppercase;text-decoration:none;box-shadow:3px 3px 0 #ffd700">Bikin Bio Kamu →</a></div>';
        return;
      }

      window._publicBioMusicId = bio.musicId || null;

      try{
        var today = new Date().toISOString().slice(0,10);
        var bioRef = FB.db.collection("bios").doc(bio.id);
        await FB.db.runTransaction(async function(tx){
          var doc2 = await tx.get(bioRef);
          if(!doc2.exists) return;
          var data = doc2.data();
          var stats = data.stats || { views:0, clicks:{}, daily:{} };
          if(!stats.daily) stats.daily = {};
          if(!stats.daily[today]) stats.daily[today] = { views:0, clicks:0 };
          stats.views = (stats.views || 0) + 1;
          stats.daily[today].views = (stats.daily[today].views || 0) + 1;
          var hour = new Date().getHours();
          if(!stats.hourlyHeatmap) stats.hourlyHeatmap = {};
          stats.hourlyHeatmap[hour] = (stats.hourlyHeatmap[hour] || 0) + 1;
          var devType = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "mobile" : (/iPad|Tablet/i.test(navigator.userAgent) ? "tablet" : "desktop");
          if(!stats.devices) stats.devices = {};
          stats.devices[devType] = (stats.devices[devType] || 0) + 1;
          var ref = document.referrer || "direct";
          try{ ref = new URL(document.referrer).hostname || "direct"; }catch(e){}
          if(!stats.referrers) stats.referrers = {};
          stats.referrers[ref] = (stats.referrers[ref] || 0) + 1;
          tx.update(bioRef, { stats: stats });
        });
      }catch(e){ console.warn("view increment:", e); }

      var html = this.buildHTML(bio, { preview:false });
      if(app){
        app.innerHTML = "";
        var iframe = document.createElement("iframe");
        iframe.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:none;background:transparent";
        iframe.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox");
        iframe.srcdoc = html;
        app.appendChild(iframe);
      }
      document.title = (bio.name || "Link in Bio") + " — Varlinkbio";

      setTimeout(function(){
        try{
          var iframe2 = document.querySelector("#app iframe");

          var doc = iframe2.contentDocument || (iframe2.contentWindow && iframe2.contentWindow.document);
          if(!doc) return;
          doc.querySelectorAll(".bio-link[data-idx]").forEach(function(el){
            el.addEventListener("click", async function(){
              var idx = el.getAttribute("data-idx");
              var today = new Date().toISOString().slice(0,10);
              try{
                await FB.db.collection("bios").doc(bio.id).update({
                  ["stats.clicks." + idx]: firebase.firestore.FieldValue.increment(1),
                  ["stats.daily." + today + ".clicks"]: firebase.firestore.FieldValue.increment(1)
                });
              }catch(e){}
            });
          });
        }catch(e){ console.warn("Click bind:", e); }
      }, 600);

      setTimeout(function(){ try{ if(window.MusicPlayer) MusicPlayer.start(); }catch(e){} }, 1000);

      if(bio.lock){
        setTimeout(function(){
          try{
            var iframe3 = document.querySelector("#app iframe");
            if(!iframe3) return;
            var doc3 = iframe3.contentDocument || (iframe3.contentWindow && iframe3.contentWindow.document);
            if(!doc3) return;
            var overlay = doc3.createElement("div");
            overlay.className = "lock-overlay";
            overlay.innerHTML = '<div class="lock-card"><div class="li">🔒</div><h3>Bio Dikunci</h3><p>Masukkan password untuk melihat bio ini.</p><input type="password" id="lock-input" placeholder="Password"/><div class="lock-err" id="lock-err"></div><button id="lock-submit">Buka Bio</button></div>';
            overlay.style.cssText = "position:fixed;inset:0;background:rgba(240,235,224,.96);z-index:9998;display:grid;place-items:center;padding:18px;font-family:Inter,sans-serif";
            doc3.body.appendChild(overlay);
            var submitBtn = overlay.querySelector("#lock-submit");
            var input = overlay.querySelector("#lock-input");
            if(submitBtn) submitBtn.addEventListener("click", function(){
              if(input.value === bio.lock){ overlay.remove(); }
              else { overlay.querySelector("#lock-err").textContent = "Password salah"; }
            });
            if(input) input.addEventListener("keydown", function(e){ if(e.key === "Enter") submitBtn.click(); });
          }catch(e){}
        }, 800);
      }
    }catch(e){
      console.error("PagePublic.render:", e);
      var app2 = $("#app");
      if(app2) app2.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;font-family:Inter,sans-serif"><div style="font-size:80px;margin-bottom:16px">⚠️</div><h1>Terjadi Error</h1><p>' + esc(e.message) + '</p></div>';

  html += '<div class="qr-url" style="margin-top:12px">' + (window.esc ? esc(url) : url) + '</div>';
  html += '</div>';
  html += '<div style="background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:10px;margin:14px 0;font-size:11.5px;font-weight:700;text-align:center">💡 QR pakai layanan online. Klik tombol download untuk save.</div>';
  html += '<a id="qr-dl-link" href="' + apiUrl + '" target="_blank" style="display:flex;width:100%;padding:14px;background:var(--ink);color:#fff;border:2.5px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--yellow);align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:900;font-size:13.5px;text-transform:uppercase;margin-bottom:8px">📥 Download QR (Buka Gambar)</a>';
  html += '<button class="btn btn-primary btn-block" id="qr-copy-link" style="margin-bottom:8px">📋 Copy Link Bio</button>';
  html += '<button class="btn btn-block" id="qr-buka-bio" style="background:var(--cream)">🔗 Buka Bio</button>';
  
  var m = window.openModal(html);
  if(!m) return;
  
  var copyBtn = m.querySelector("#qr-copy-link");
  if(copyBtn) copyBtn.addEventListener("click", function(){
    try{
      navigator.clipboard.writeText(url);
      if(window.toast) toast("Link disalin!", "success");
    }catch(e){
      var ta = document.createElement("textarea");
      ta.value = url; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      if(window.toast) toast("Link disalin!", "success");
    }
  });
  
  var bukaBtn = m.querySelector("#qr-buka-bio");
  if(bukaBtn) bukaBtn.addEventListener("click", function(){ window.open(url, "_blank"); });
  
  if(window.Sound && Sound.tada) Sound.tada();
};
console.log("✅ showQRModal replaced with API online version");

        PageDashboard.render("");
      }
    }
  }catch(e){}
}, 2500);
