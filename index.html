  bindAll(){
    const bs1 = $("#btn-save"); if(bs1) bs1.addEventListener("click", ()=>this.save());
    const bs2 = $("#btn-save2"); if(bs2) bs2.addEventListener("click", ()=>this.save());
    
    const qrBtn = $("#btn-qr");
    if(qrBtn) qrBtn.addEventListener("click", ()=>{
      const d = STATE.draft;
      const url = `${PUBLIC_BASE_URL}/#/u/${d.slug || d.id}`;
      showQRModal(d, url);
    });
    
    const cpBtn = $("#btn-copy-top");
    if(cpBtn) cpBtn.addEventListener("click", ()=>copyLink(STATE.draft));
    
    const vcBtn = $("#btn-vcard-top");
    if(vcBtn) vcBtn.addEventListener("click", ()=>{
      if(!canDo("vcard")){ toast("vCard belum unlock. Beli di Store!","error"); return; }
      downloadVCard(STATE.draft);
    });
    
    const pInput = $("#p-input");
    if(pInput) pInput.addEventListener("change", async e=>{
      const f = e.target.files[0]; if(!f) return;
      showLoading("Upload...");
      try{
        const url = await Store.upload(f, "profile");
        STATE.draft.profile = url;
        const box = $("#pbox");
        if(box) box.innerHTML = `<img src="${esc(url)}"/><div class="overlay">${ico('camera')}</div><input type="file" id="p-input" accept="image/*"/>`;
        this.bindAll();
        hideLoading(); toast("Profil diupdate","success");
        this.updatePreview();
      }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
    });
    
    const fn = $("#f-name"); if(fn) fn.addEventListener("input", e=>{ STATE.draft.name = e.target.value; AutoSave.tick(); this.updatePreview(); });
    const fb = $("#f-bio"); if(fb) fb.addEventListener("input", e=>{ STATE.draft.bio = e.target.value; AutoSave.tick(); this.updatePreview(); });
    const fl = $("#f-lock"); if(fl) fl.addEventListener("input", e=>{ STATE.draft.lock = e.target.value; });
    
    const dirBox = $("#f-allow-dir");
    if(dirBox) dirBox.addEventListener("change", e=>{ STATE.draft.allowDirectory = e.target.checked; });
    
    const btnCheckSlug = $("#btn-check-slug");
    if(btnCheckSlug){
      btnCheckSlug.addEventListener("click", async ()=>{
        const raw = $("#f-slug")?.value;
        const v = validateSlug(raw, STATE.plan);
        const msgEl = $("#slug-msg");
        if(!v.ok){
          if(msgEl) msgEl.innerHTML = `<div style="background:var(--red);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700">❌ ${esc(v.msg)}</div>`;
          return;
        }
        showLoading("Cek...");
        const avail = await checkSlugAvailable(v.slug, STATE.draft.id);
        hideLoading();
        if(!avail){
          if(msgEl) msgEl.innerHTML = `<div style="background:var(--red);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700">❌ Sudah dipakai</div>`;
          return;
        }
        if(msgEl) msgEl.innerHTML = `<div style="background:var(--green);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700">✅ Tersedia!</div>`;
        STATE.draft.slug = v.slug;
        STATE.draft._slugManual = true;
      });
    }
    
    const fSlug = $("#f-slug");
    if(fSlug) fSlug.addEventListener("input", e=>{
      e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, "");
    });
    
    const bnInput = $("#bn-input");
    if(bnInput) bnInput.addEventListener("change", async e=>{
      const f = e.target.files[0]; if(!f) return;
      const isVid = f.type.startsWith("video/");
      showLoading(isVid ? "Upload video..." : "Compress...");
      try{
        const url = await Store.upload(f, "banner");
        STATE.draft.banner = url;
        STATE.draft.bannerType = isVid ? "video" : "image";
        hideLoading(); toast("Banner diupdate","success");
        this.render();
      }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
    });
    
    const bnClear = $("#bn-clear");
    if(bnClear) bnClear.addEventListener("click", ()=>{
      STATE.draft.banner = ""; STATE.draft.bannerType = "image"; this.render();
    });
    
    const addLogo = $("#add-logo");
    if(addLogo) addLogo.addEventListener("click", ()=>{
      STATE.draft.logos.push({ name:"Partner", url:"https://", img:"" });
      this.renderLogos(); this.updatePreview();
    });
    
    const addLink = $("#add-link");
    if(addLink) addLink.addEventListener("click", ()=>this.openLinkTypePicker());
    
    const btnView = $("#btn-view");
    if(btnView) btnView.addEventListener("click", ()=>{
      if(!STATE.draft.id){ toast("Simpan dulu","info"); return; }
      window.open(`${PUBLIC_BASE_URL}/#/u/${STATE.draft.slug||STATE.draft.id}`,"_blank");
    });
    
    const wmBtn = $("#btn-remove-watermark");
    if(wmBtn) wmBtn.addEventListener("click", ()=>Router.navigate("/store"));
    
    bindTopbar();
  },
  
  renderAnimGrid(){
    const el = $("#anim-grid"); if(!el) return;
    const opts = [
      { id:"none", label:"None", icon:"·" },
      { id:"bounce", label:"Bounce", icon:"↑" },
      { id:"shake", label:"Shake", icon:"↔" },
      { id:"glow", label:"Glow", icon:"✦" }
    ];
    el.innerHTML = opts.map(o=>`<div class="opt-item ${STATE.draft.animation===o.id?"active":""}" data-anim="${o.id}"><div class="opt-preview">${o.icon}</div>${o.label}</div>`).join("");
    $$("#anim-grid .opt-item").forEach(x=>{
      x.addEventListener("click", ()=>{
        STATE.draft.animation = x.dataset.anim;
        this.renderAnimGrid(); this.updatePreview();
      });
    });
  },
  
  renderLogos(){
    const wrap = $("#logos-list"); if(!wrap) return;
    const logos = STATE.draft.logos || [];
    if(!logos.length){
      wrap.innerHTML = `<div style="font-size:12px;text-align:center;padding:8px;font-weight:600;color:var(--ink-soft)">Belum ada logo.</div>`;
      return;
    }
    wrap.innerHTML = logos.map((lg,i)=>`
      <div class="logo-item">
        <div class="lg-thumb">${lg.img?`<img src="${esc(lg.img)}">`:`<span>${ico('image')}</span>`}</div>
        <div class="lg-fields">
          <input type="text" placeholder="Nama" value="${esc(lg.name)}" data-lgname="${i}"/>
          <input type="text" placeholder="https://..." value="${esc(lg.url)}" data-lgurl="${i}"/>
        </div>
        <button class="lg-up" data-lgup="${i}">${ico('camera')}</button>
        <button class="lg-del" data-lgdel="${i}">${ico('x')}</button>
      </div>`).join("");
    wrap.querySelectorAll("[data-lgname]").forEach(inp=>{
      inp.addEventListener("input", e=>{ STATE.draft.logos[+e.target.dataset.lgname].name = e.target.value; this.updatePreview(); });
    });
    wrap.querySelectorAll("[data-lgurl]").forEach(inp=>{
      inp.addEventListener("input", e=>{ STATE.draft.logos[+e.target.dataset.lgurl].url = e.target.value; this.updatePreview(); });
    });
    wrap.querySelectorAll("[data-lgdel]").forEach(b=>{
      b.addEventListener("click", e=>{ STATE.draft.logos.splice(+e.currentTarget.dataset.lgdel,1); this.renderLogos(); this.updatePreview(); });
    });
    wrap.querySelectorAll("[data-lgup]").forEach(b=>{
      b.addEventListener("click", e=>{
        const i = +e.currentTarget.dataset.lgup;
        const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
        inp.onchange = async ()=>{
          const f = inp.files[0]; if(!f) return;
          showLoading("Upload logo...");
          try{
            const url = await Store.upload(f, "logo");
            STATE.draft.logos[i].img = url;
            hideLoading(); toast("Logo diupdate","success");
            this.renderLogos(); this.updatePreview();
          }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
        };
        inp.click();
      });
    });
  },
  
  openLinkTypePicker(){
    const canFeatured = canDo("featuredLink");
    const canEmbed = canDo("embed");
    const m = openModal(`
      <button class="close-x" onclick="this.closest('.modal-back').remove()">×</button>
      <h3>Pilih Jenis Link</h3>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
        ${[
          {t:"classic",icon:"link",name:"Classic",desc:"Link biasa",allowed:true},
          {t:"featured",icon:"image",name:"Featured",desc:canFeatured?"Gambar + tombol":"Beli di Store",allowed:canFeatured},
          {t:"youtube",icon:"youtube",name:"YouTube",desc:canEmbed?"Embed":"Beli di Store",allowed:canEmbed},
          {t:"spotify",icon:"music",name:"Spotify",desc:canEmbed?"Embed":"Beli di Store",allowed:canEmbed},
          {t:"vimeo",icon:"video",name:"Vimeo",desc:canEmbed?"Embed":"Beli di Store",allowed:canEmbed},
          {t:"tiktok",icon:"tiktok",name:"TikTok",desc:canEmbed?"Embed":"Beli di Store",allowed:canEmbed}
        ].map(x=>`
          <div class="link-type" data-t="${x.t}" style="background:var(--cream);border:2.5px solid var(--ink);border-radius:10px;padding:12px;text-align:center;cursor:pointer;box-shadow:2px 2px 0 var(--ink);${x.allowed?'':'opacity:.5'}">
            <div style="width:32px;height:32px;background:var(--ink);color:var(--yellow);border-radius:6px;display:grid;place-items:center;margin:0 auto 6px">${ico(x.icon)}</div>
            <b style="font-size:12px;display:block;text-transform:uppercase">${x.name}</b>
            <small style="font-size:10.5px">${x.desc}</small>
          </div>`).join("")}
      </div>`);
    if(!m) return;
    m.querySelectorAll(".link-type").forEach(el=>{
      el.addEventListener("click", ()=>{
        const t = el.dataset.t;
        if(t === "featured" && !canFeatured){ toast("Beli Featured Link di Store!","error"); m.remove(); Router.navigate("/store"); return; }
        if(["youtube","spotify","vimeo","tiktok"].includes(t) && !canEmbed){ toast("Beli Embed di Store!","error"); m.remove(); Router.navigate("/store"); return; }
        STATE.draft.links.push({
          label:"Link Baru", url:"https://", type:t, color:"", thumb:"", active:true,
          featPosX:50, featPosY:50, featZoom:1, featPadding:10, featRatio:"16:9"
        });
        this.renderLinks(); this.updatePreview();
        m.remove();
      });
    });
  },
  
  renderLinks(){
    const wrap = $("#links-list"); if(!wrap) return;
    const links = STATE.draft.links || [];
    const canFeatured = canDo("featuredLink");
    const canToggle = canDo("toggleLink");
    const NEO_COLORS = ["red","yellow","green","blue","pink","purple","white"];
    const NEO_HEX = { red:"#ff2a2a", yellow:"#ffd700", green:"#22c55e", blue:"#2563eb", pink:"#ff69b4", purple:"#a78bfa", white:"#ffffff" };
    
    if(!links.length){
      wrap.innerHTML = `<div style="font-size:12.5px;text-align:center;padding:6px;font-weight:600">Belum ada link.</div>`;
      return;
    }
    
    wrap.innerHTML = links.map((l,i)=>{
      const autoColor = NEO_COLORS[i % NEO_COLORS.length];
      const curColor = l.color || NEO_HEX[autoColor];
      const isOff = l.active === false;
      return `
      <div style="display:flex;flex-direction:column;gap:8px;width:100%">
        <div class="link-row ${isOff?'off':''}" draggable="true" data-i="${i}">
          <span class="drag">${ico('grip')}</span>
          <div class="link-thumb">${l.thumb?`<img src="${esc(l.thumb)}">`:ico(LinkTypes.icon(l.url))}</div>
          <div class="link-fields">
            <input type="text" placeholder="Label" value="${esc(l.label)}" data-field="label" data-i="${i}"/>
            <input type="text" placeholder="https://..." value="${esc(l.url)}" data-field="url" data-i="${i}"/>
            ${canFeatured?`<button class="thumb-btn" data-thumb="${i}">${ico('image')} ${l.thumb?'Ganti':'Upload'} Gambar</button>`:''}
          </div>
          ${canToggle?`<div class="toggle-switch ${!isOff?'on':''}" data-toggle="${i}"></div>`:''}
          <input type="color" class="link-color-pick" data-color="${i}" value="${curColor}"/>
          <button class="del" data-del="${i}">${ico('x')}</button>
        </div>
        ${canFeatured && l.thumb ? `
          <div class="feat-edit-panel" style="background:var(--cream);border:2.5px solid var(--ink);border-radius:10px;padding:12px;margin-left:20px">
            <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px">
              ${ico('image')} Atur Gambar Tombol
            </div>
            <div class="feat-preview-wrap">
              <div class="feat-preview-box" id="feat-box-${i}" style="--feat-bg-edit:${curColor};--feat-pad-edit:${l.featPadding||10}px">
                <img class="feat-preview-img" id="feat-img-${i}" src="${esc(l.thumb)}" alt=""
                  style="--feat-ratio-edit:${l.featRatio==='1:1'?'1/1':(l.featRatio==='4:3'?'4/3':(l.featRatio==='auto'?'auto':'16/9'))};
                  --feat-pos-x-edit:${l.featPosX||50}%;
                  --feat-pos-y-edit:${l.featPosY||50}%;
                  --feat-zoom-edit:${l.featZoom||1}"/>
                <div class="feat-preview-label" style="color:${contrastText(curColor)}">${esc(l.label||"Link")}</div>
              </div>
              <div class="feat-preview-hint">💡 Drag gambar untuk atur posisi</div>
            </div>
            
            <div class="feat-slider-row">
              <label>Padding</label>
              <input type="range" min="0" max="30" value="${l.featPadding||10}" data-feat-slider="padding" data-i="${i}"/>
              <span class="feat-slider-val">${l.featPadding||10}px</span>
            </div>
            
            <div class="feat-slider-row">
              <label>Zoom</label>
              <input type="range" min="50" max="200" value="${Math.round((l.featZoom||1)*100)}" data-feat-slider="zoom" data-i="${i}"/>
              <span class="feat-slider-val">${Math.round((l.featZoom||1)*100)}%</span>
            </div>
            
            <div class="field" style="margin-bottom:8px">
              <label style="font-size:11px">Rasio Gambar</label>
              <div class="feat-ratio-grid">
                ${["16:9","1:1","4:3","auto"].map(r=>`
                  <div class="feat-ratio-btn ${(l.featRatio||"16:9")===r?"active":""}" data-feat-ratio="${r}" data-i="${i}">${r.toUpperCase()}</div>
                `).join("")}
              </div>
            </div>
            
            <div class="feat-actions">
              <button class="btn btn-yellow" data-feat-center="${i}">🎯 Auto Center</button>
              <button class="btn" data-feat-reset="${i}">↺ Reset</button>
            </div>
          </div>
        `:''}
      </div>`;
    }).join("");
    
    // Bind text inputs
    wrap.querySelectorAll("input[data-field]").forEach(inp=>{
      inp.addEventListener("input", e=>{
        const i = +e.target.dataset.i;
        const f = e.target.dataset.field;
        STATE.draft.links[i][f] = e.target.value;
        if(f === "url") STATE.draft.links[i].type = LinkTypes.detect(e.target.value);
        AutoSave.tick();
        this.updatePreview();
      });
    });
    
    // Del
    wrap.querySelectorAll(".del").forEach(b=>{
      b.addEventListener("click", e=>{
        const i = +e.currentTarget.dataset.del;
        STATE.draft.links.splice(i,1);
        this.renderLinks(); this.updatePreview();
      });
    });
    
    // Toggle
    wrap.querySelectorAll("[data-toggle]").forEach(el=>{
      el.addEventListener("click", e=>{
        e.stopPropagation();
        const i = +el.dataset.toggle;
        STATE.draft.links[i].active = !STATE.draft.links[i].active;
        Sound.tick();
        this.renderLinks(); this.updatePreview();
      });
    });
    
    // Color
    wrap.querySelectorAll("[data-color]").forEach(b=>{
      b.addEventListener("input", e=>{
        const i = +e.currentTarget.dataset.color;
        STATE.draft.links[i].color = e.target.value;
        const box = document.getElementById("feat-box-"+i);
        if(box) box.style.setProperty("--feat-bg-edit", e.target.value);
        this.updatePreview();
      });
    });
    
    // Upload thumb
    wrap.querySelectorAll("[data-thumb]").forEach(b=>{
      b.addEventListener("click", e=>{
        const i = +e.currentTarget.dataset.thumb;
        const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
        inp.onchange = async ()=>{
          const f = inp.files[0]; if(!f) return;
          showLoading("Upload...");
          try{
            const url = await Store.upload(f, "thumb");
            STATE.draft.links[i].thumb = url;
            hideLoading(); toast("Gambar diupdate","success");
            this.renderLinks(); this.updatePreview();
          }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
        };
        inp.click();
      });
    });
    
    // Featured sliders
    wrap.querySelectorAll("[data-feat-slider]").forEach(slider=>{
      const i = +slider.dataset.i;
      const type = slider.dataset.featSlider;
      slider.addEventListener("input", e=>{
        const val = +e.target.value;
        const link = STATE.draft.links[i];
        const box = document.getElementById("feat-box-"+i);
        const img = document.getElementById("feat-img-"+i);
        const valEl = slider.nextElementSibling;
        
        if(type === "padding"){
          link.featPadding = val;
          if(box) box.style.setProperty("--feat-pad-edit", val+"px");
          if(valEl) valEl.textContent = val+"px";
        } else if(type === "zoom"){
          link.featZoom = val / 100;
          if(img){
            img.style.setProperty("--feat-zoom-edit", val/100);
            img.style.transform = `scale(${val/100})`;
          }
          if(valEl) valEl.textContent = val+"%";
        }
        AutoSave.tick();
        this.updatePreview();
      });
    });
    
    // Rasio
    wrap.querySelectorAll("[data-feat-ratio]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = +btn.dataset.i;
        STATE.draft.links[i].featRatio = btn.dataset.featRatio;
        this.renderLinks(); this.updatePreview();
      });
    });
    
    // Auto Center
    wrap.querySelectorAll("[data-feat-center]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = +btn.dataset.featCenter;
        const link = STATE.draft.links[i];
        link.featPosX = 50; link.featPosY = 50; link.featZoom = 1;
        toast("Gambar di-center ✓","success");
        this.renderLinks(); this.updatePreview();
      });
    });
    
    // Reset
    wrap.querySelectorAll("[data-feat-reset]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = +btn.dataset.featReset;
        const link = STATE.draft.links[i];
        link.featPosX = 50; link.featPosY = 50; link.featZoom = 1;
        link.featPadding = 10; link.featRatio = "16:9";
        toast("Reset ✓","info");
        this.renderLinks(); this.updatePreview();
      });
    });
    
    // Drag gambar
    wrap.querySelectorAll(".feat-preview-img").forEach(img=>{
      const i = +img.id.replace("feat-img-","");
      let isDragging = false, startX = 0, startY = 0, startPosX = 50, startPosY = 50;
      
      const onStart = (e)=>{
        isDragging = true;
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX; startY = touch.clientY;
        startPosX = STATE.draft.links[i].featPosX || 50;
        startPosY = STATE.draft.links[i].featPosY || 50;
        img.style.cursor = "grabbing";
      };
      const onMove = (e)=>{
        if(!isDragging) return;
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const rect = img.getBoundingClientRect();
        const dxP = (dx / rect.width) * 100;
        const dyP = (dy / rect.height) * 100;
        let newX = Math.max(0, Math.min(100, startPosX - dxP));
        let newY = Math.max(0, Math.min(100, startPosY - dyP));
        STATE.draft.links[i].featPosX = newX;
        STATE.draft.links[i].featPosY = newY;
        img.style.objectPosition = newX + "% " + newY + "%";
        img.style.transformOrigin = newX + "% " + newY + "%";
        img.style.setProperty("--feat-pos-x-edit", newX + "%");
        img.style.setProperty("--feat-pos-y-edit", newY + "%");
      };
      const onEnd = ()=>{
        if(!isDragging) return;
        isDragging = false;
        img.style.cursor = "grab";
        AutoSave.tick();
        this.updatePreview();
      };
      img.addEventListener("mousedown", onStart);
      img.addEventListener("touchstart", onStart, { passive:false });
      document.addEventListener("mousemove", onMove);
      document.addEventListener("touchmove", onMove, { passive:false });
      document.addEventListener("mouseup", onEnd);
      document.addEventListener("touchend", onEnd);
    });
  },
  
  renderThemeGrid(){
    const cur = STATE.draft.theme;
    const grid = $("#theme-grid"); if(!grid) return;
    grid.innerHTML = WARNA_LIST.map(t=>{
      const allowed = themeAllowed(t.id);
      return `<div class="theme-item ${cur===t.id?"active":""} ${allowed?"":"locked"}" data-t="${t.id}" style="background:${t.color}">
        <div class="chk">${ico('check')}</div>
        <div class="label">${t.name}</div>
      </div>`;
    }).join("");
    $$("#theme-grid .theme-item").forEach(el=>{
      el.addEventListener("click", ()=>{
        const tid = el.dataset.t;
        if(!themeAllowed(tid)){ toast("Tema belum unlock. Beli di Store!","error"); Router.navigate("/store"); return; }
        STATE.draft.theme = tid;
        $$("#theme-grid .theme-item").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        this.updatePreview();
      });
    });
  },
  
  updatePreview(){
    const frame = $("#prev-frame"); if(!frame) return;
    try{
      frame.srcdoc = PagePublic.buildHTML(STATE.draft, { preview:true });
    }catch(e){ console.warn("updatePreview:", e); }
  },
  
  async save(){
    if(!STATE.draft.name?.trim()){ toast("Nama tidak boleh kosong","error"); return; }
    const plan = STATE.plan;
    if(!isUnlimited(plan.features.maxLinks) && STATE.draft.links.length > plan.features.maxLinks){
      toast(`Max ${plan.features.maxLinks} tombol!`,"error");
      showUpgradeModal(); return;
    }
    showLoading("Menyimpan...");
    try{
      const saved = await Store.save({...STATE.draft});
      STATE.draft = saved; STATE.currentEdit = saved.id;
      AutoSave.reset();
      hideLoading();
      toast("Tersimpan!","success");
      this.render();
      setTimeout(()=>showShareModal(saved), 300);
    }catch(e){
      console.error(e);
      hideLoading();
      toast("Gagal: "+e.message,"error");
    }
  }
};

      </div>
    `);
    
    if(!m) return;
    
    const closeBtn = $("#ik-close",m);
    const claimBtn = $("#ik-claim",m);
    const countEl = $("#ik-count",m);
    const barEl = $("#ik-bar",m);
    
    if(closeBtn) closeBtn.addEventListener("click", ()=>{ this._stop(); m.remove(); });
    
    this._timer = setInterval(()=>{
      this._countdown--;
      if(countEl) countEl.textContent = this._countdown;
      if(barEl) barEl.style.width = ((30 - this._countdown) / 30 * 100) + "%";
      
      if(this._countdown <= 0){
        this._stop();
        if(claimBtn){
          claimBtn.disabled = false;
          claimBtn.textContent = `✅ Klaim +${IKLAN_REWARD} Kredit`;
          claimBtn.classList.remove("btn-primary");
          claimBtn.classList.add("btn-green");
        }
      }
    }, 1000);
    
    if(claimBtn) claimBtn.addEventListener("click", async ()=>{
      if(this._countdown > 0) return;
      showLoading("Memproses...");
      const ok = await Iklan.complete();
      hideLoading();
      if(ok){
        Sound.tada();
        toast(`✅ +${IKLAN_REWARD} kredit!`,"success");
        m.remove();
        this._stop();
        // Update UI
        const kb = $("#btn-kredit-top");
        if(kb) kb.innerHTML = `${ico('coins','ic-sm')} ${STATE.kredit || 0}`;
        if(location.hash.includes("/store")) Router.resolve();
      } else {
        toast("Gagal klaim","error");
      }
    });
  },
  
  _stop(){
    if(this._timer){ clearInterval(this._timer); this._timer = null; }
  }
};

        $$(".explore-filter").forEach(x=>x.classList.remove("active"));
        f.classList.add("active");
        this.state.filter = f.dataset.filter;
        await this.loadGrid();
      });
    });
    
    const searchEl = $("#explore-search");
    let searchTO;
    if(searchEl) searchEl.addEventListener("input", e=>{
      clearTimeout(searchTO);
      searchTO = setTimeout(async ()=>{
        this.state.search = e.target.value.trim();
        await this.loadGrid();
      }, 300);
    });
    
    await this.loadGrid();
  },
  
  async loadGrid(){
    const wrap = $("#explore-grid"); if(!wrap) return;
    wrap.innerHTML = `<div class="explore-empty">⏳ Memuat...</div>`;
    try{
      const list = await Store.listDirectory(this.state.filter, this.state.search);
      if(!list.length){
        wrap.innerHTML = `<div class="explore-empty">Belum ada bio di Explore.</div>`;
        return;
      }
      wrap.innerHTML = list.map(b=>{
        const planBadge = b.ownerPlan === "ultimate" ? "ULTIMATE"
          : b.ownerPlan === "pro" ? "PRO"
          : b.ownerPlan === "starter" ? "STARTER" : "";
        return `
        <div class="explore-card" data-slug="${esc(b.slug||b.id)}">
          ${b.banner?`<img class="ec-banner" src="${esc(b.banner)}" alt=""/>`:`<div class="ec-banner"></div>`}
          ${planBadge?`<div class="ec-badge-plan ${b.ownerPlan}">${planBadge}</div>`:''}
          <div class="ec-body">
            <div class="ec-avatar">${b.profile?`<img src="${esc(b.profile)}"/>`:esc((b.name||"?")[0].toUpperCase())}</div>
            <div class="ec-name">${esc(b.name||"Tanpa Nama")}</div>
            ${b.bio?`<div class="ec-bio">${esc(b.bio)}</div>`:''}
            <div class="ec-stats">
              <span class="ec-stat">${ico('eye','ic-sm')} ${b.stats?.views||0}</span>
              <span class="ec-stat">${ico('link','ic-sm')} ${(b.links||[]).filter(l=>l.active!==false).length}</span>
            </div>
          </div>
        </div>`;
      }).join("");
      wrap.querySelectorAll(".explore-card").forEach(el=>{
        el.addEventListener("click", ()=>{
          window.open(`${PUBLIC_BASE_URL}/#/u/${el.dataset.slug}`, "_blank");
        });
      });
    }catch(e){
      console.error("Explore error:", e);
      wrap.innerHTML = `<div class="explore-empty">😵 Gagal memuat.</div>`;
    }
  }
};

const Tutorial = {
  _stepIndex:0,
  _active:false,
  _overlay:null,
  _confetti:null,
  
  start(){
    if(this._active){ console.log("Tutorial already active"); return; }
    if(!Auth.current){ console.log("No user"); return; }
    
    this._active = true;
    this._stepIndex = 0;
    document.body.classList.add("tour-active");
    
    try{
      this._overlay = document.createElement("div");
      this._overlay.className = "tut-overlay";
      this._overlay.innerHTML = `
        <div class="tut-dialog" id="tut-dialog">
          <div class="tut-steps-bar" id="tut-steps-bar"></div>
          <div class="tut-header">
            <span class="tut-counter" id="tut-counter">Step 1/10</span>
            <span class="tut-time" id="tut-time">${ico('clock')} 30 detik</span>
            <button class="tut-close" id="tut-close-btn">${ico('x')}</button>
          </div>
          <div class="tut-body">
            <div class="tut-icon" id="tut-icon">🚀</div>
            <div class="tut-subtitle" id="tut-subtitle">Subtitle</div>
            <div class="tut-title" id="tut-title">Title</div>
            <div class="tut-desc" id="tut-desc">Desc</div>
            <div class="tut-info-box" id="tut-info-box"></div>
            <div class="tut-highlight" id="tut-highlight"></div>
          </div>
          <div class="tut-footer">
            <button class="btn tut-btn-secondary" id="tut-back-btn" style="display:none">${ico('arrowLeft')} Sebelumnya</button>
            <button class="btn tut-btn-secondary" id="tut-skip-btn">Lewati</button>
            <button class="btn btn-primary tut-btn" id="tut-next-btn">Lanjut ${ico('arrowRight')}</button>
          </div>
        </div>
      `;
      document.body.appendChild(this._overlay);
    }catch(e){
      console.error("Tutorial overlay error:", e);
      this._active = false;
      document.body.classList.remove("tour-active");
      return;
    }
    
    const closeBtn = document.getElementById("tut-close-btn");
    const skipBtn = document.getElementById("tut-skip-btn");
    const backBtn = document.getElementById("tut-back-btn");
    const nextBtn = document.getElementById("tut-next-btn");
    
    if(closeBtn) closeBtn.addEventListener("click", ()=>this.finish());
    if(skipBtn) skipBtn.addEventListener("click", ()=>{
      if(confirm("Lewati tutorial?\n\nBisa buka lagi di Settings → Ulangi Tutorial.")){
        this.finish();
      }
    });
    if(backBtn) backBtn.addEventListener("click", ()=>this.prev());
    if(nextBtn) nextBtn.addEventListener("click", ()=>this.next());
    
    setTimeout(()=>{
      try{
        if(this._overlay) this._overlay.classList.add("active");
        this.render();
      }catch(e){ console.error("Tutorial show:", e); }
    }, 300);
  },
  
  render(){
    const step = TUTORIAL_STEPS[this._stepIndex];
    if(!step) return this.finish();
    
    try{
      const bar = document.getElementById("tut-steps-bar");
      if(bar){
        bar.innerHTML = TUTORIAL_STEPS.map((_,i)=>{
          let cls = "tut-step-dot";
          if(i < this._stepIndex) cls += " done";
          else if(i === this._stepIndex) cls += " active";
          return `<div class="${cls}"></div>`;
        }).join("");
      }
      
      const counter = document.getElementById("tut-counter");
      if(counter) counter.textContent = `Step ${this._stepIndex + 1}/${TUTORIAL_STEPS.length}`;
      
      const timeEl = document.getElementById("tut-time");
      if(timeEl) timeEl.innerHTML = `${ico('clock')} ${step.time}`;
      
      const iconEl = document.getElementById("tut-icon");
      if(iconEl){
        iconEl.textContent = step.icon;
        iconEl.className = "tut-icon " + (step.iconColor || "");
      }
      
      const sub = document.getElementById("tut-subtitle");
      if(sub) sub.textContent = step.subtitle || "";
      
      const title = document.getElementById("tut-title");
      if(title) title.textContent = step.title;
      
      const desc = document.getElementById("tut-desc");
      if(desc) desc.innerHTML = step.desc;
      
      const infoBox = document.getElementById("tut-info-box");
      if(infoBox){
        if(step.info && step.info.length){
          infoBox.innerHTML = step.info.map(item => `
            <div class="tut-info-item">
              <span class="bullet">${ico('check','ic-sm')}</span>
              <span class="txt"><b>${item.b}:</b> ${item.t}</span>
            </div>
          `).join("");
          infoBox.style.display = "flex";
        } else {
          infoBox.style.display = "none";
        }
      }
      
      const highlight = document.getElementById("tut-highlight");
      if(highlight){
        if(step.highlight){
          highlight.innerHTML = step.highlight;
          highlight.style.display = "block";
        } else {
          highlight.style.display = "none";
        }
      }
      
      const backBtn = document.getElementById("tut-back-btn");
      const nextBtn = document.getElementById("tut-next-btn");
      const skipBtn = document.getElementById("tut-skip-btn");
      
      if(backBtn) backBtn.style.display = this._stepIndex === 0 ? "none" : "inline-flex";
      
      if(nextBtn){
        if(this._stepIndex === TUTORIAL_STEPS.length - 1){
          nextBtn.innerHTML = "Mulai Ngoding ${ico('sparkle')}";
        } else {
          nextBtn.innerHTML = `Lanjut ${ico('arrowRight')}`;
        }
      }
      
      if(skipBtn) skipBtn.style.display = this._stepIndex === TUTORIAL_STEPS.length - 1 ? "none" : "inline-flex";
      
      try{ if(this._stepIndex > 0) Sound.ding(); }catch(e){}
      
      if(step.celebration){
        this.showConfetti();
        try{ Sound.tada(); }catch(e){}
      }
    }catch(e){ console.error("Tutorial render:", e); }
  },
  
  showConfetti(){
    try{
      if(this._confetti) return;
      this._confetti = document.createElement("div");
      this._confetti.className = "tut-confetti";
      const colors = ["#ff2a2a","#ffd700","#22c55e","#2563eb","#ff69b4","#a78bfa"];
      let html = "";
      for(let i=0; i<50; i++){
        const color = colors[i % colors.length];
        const left = Math.random() * 100;
        const delay = Math.random() * 2;
        const dur = 2.5 + Math.random() * 1.5;
        const rot = Math.random() * 360;
        const br = Math.random() > 0.5 ? "50%" : "2px";
        html += `<div class="tut-confetti-piece" style="left:${left}%;background:${color};animation-duration:${dur}s;animation-delay:${delay}s;transform:rotate(${rot}deg);border-radius:${br}"></div>`;
      }
      this._confetti.innerHTML = html;
      document.body.appendChild(this._confetti);
      setTimeout(()=>{
        if(this._confetti){ this._confetti.remove(); this._confetti = null; }
      }, 6000);
    }catch(e){}
  },
  
  next(){
    this._stepIndex++;
    if(this._stepIndex >= TUTORIAL_STEPS.length) this.finish();
    else { this.render(); try{ const d = document.getElementById("tut-dialog"); if(d) d.scrollTop = 0; }catch(e){} }
  },
  prev(){
    if(this._stepIndex > 0){
      this._stepIndex--;
      this.render();
      try{ const d = document.getElementById("tut-dialog"); if(d) d.scrollTop = 0; }catch(e){}
    }
  },
  skip(){ this.finish(); },
  
  async finish(){
    try{
      if(this._overlay){
        this._overlay.classList.remove("active");
        setTimeout(()=>{
          if(this._overlay){ this._overlay.remove(); this._overlay = null; }
        }, 400);
      }
      if(this._confetti){ this._confetti.remove(); this._confetti = null; }
      document.body.classList.remove("tour-active");
      this._active = false;
      try{ await Auth.markTutorialDone(); }catch(e){}
      setTimeout(()=>{ toast("Tutorial selesai! 🎉 Selamat berkarya!","success"); }, 300);
    }catch(e){ console.error("Tutorial.finish:", e); }
  }
};

const PageDev = {
  state:{ users:[], bios:[], partners:[], updates:[], filter:"all", search:"", tab:"users", settings:{} },
  
  async render(){
    if(!Auth.current) return Router.navigate("/login");
    if(!isDev(Auth.current.email)){ toast("Akses ditolak","error"); return Router.navigate("/dashboard"); }
    
    $("#app").innerHTML = `

        <div class="dev-header">
          <button class="back-btn" id="dev-back-btn">${ico('back')} Back</button>

          <div class="dev-tab" data-tab="bios">📁 Bios</div>

    $$(".dev-tab").forEach(t=>{
      t.addEventListener("click", ()=>{
        $$(".dev-tab").forEach(x=>x.classList.remove("active"));
        t.classList.add("active");
        this.state.tab = t.dataset.tab;
        this.renderTab();
      });
    });
    
    await this.loadData();
  },
  
  async loadData(){
    try{
      const usersSnap = await FB.db.collection("users").get();
      const biosSnap = await FB.db.collection("bios").get();
      const users = []; usersSnap.forEach(d=>users.push({uid:d.id, ...d.data()}));
      const bios = []; biosSnap.forEach(d=>bios.push({id:d.id, ...d.data()}));
      users.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      bios.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      this.state.users = users;
      this.state.bios = bios;
      try{ this.state.partners = await Store.listPartners(); }catch(e){ this.state.partners = []; }
      try{ this.state.updates = await Store.listUpdates(); }catch(e){ this.state.updates = []; }
      try{ this.state.settings = await Store.getSettings(); }catch(e){ this.state.settings = {}; }
      this.renderStats();
      this.renderTab();
    }catch(e){
      console.error(e);
      const dc = $("#dev-content");
      if(dc) dc.innerHTML = `<div class="empty-state"><p>Gagal load: ${esc(e.message)}</p></div>`;
    }
  },
  
  renderStats(){
    const stats = $("#dev-stats"); if(!stats) return;
    const users = this.state.users.filter(u => !isDev(u.email));
    const countBy = (p)=>users.filter(u => (u.plan||"free") === p).length;
    stats.innerHTML = `
      <div class="dev-stat"><div class="sv">${users.length}</div><div class="sl">Total User</div></div>
      <div class="dev-stat dev-free"><div class="sv">${countBy("free")}</div><div class="sl">Free</div></div>
      <div class="dev-stat dev-starter"><div class="sv">${countBy("starter")}</div><div class="sl">Starter</div></div>
      <div class="dev-stat dev-pro"><div class="sv">${countBy("pro")}</div><div class="sl">Pro</div></div>
      <div class="dev-stat dev-ultimate"><div class="sv">${countBy("ultimate")}</div><div class="sl">Ultimate</div></div>
      <div class="dev-stat"><div class="sv">${this.state.bios.length}</div><div class="sl">Total Bio</div></div>`;
  },
  
  renderTab(){
    const tab = this.state.tab;

      for(const b of biosToDelete){

    }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }

const PagePublic = {
  buildHTML(d, opts={}){
    try{
      const preview = !!(opts && opts.preview);
      const NEO_COLORS = ["red","yellow","green","blue","pink","purple","white"];
      const NEO_HEX = { red:"#ff2a2a", yellow:"#ffd700", green:"#22c55e", blue:"#2563eb", pink:"#ff69b4", purple:"#a78bfa", white:"#ffffff" };
      
      const activeLinks = (d.links||[]).filter(l => l.active !== false);
      
      const links = activeLinks.map((l, idx)=>{
        const embed = LinkTypes.embed(l.url);
        const type = LinkTypes.detect(l.url);
        const autoColor = NEO_COLORS[idx % NEO_COLORS.length];
        const bg = l.color || NEO_HEX[autoColor];
        const fg = contrastText(bg);
        
        if(l.thumb){
          const featPad = l.featPadding !== undefined ? l.featPadding : 10;
          const featRatio = l.featRatio || "16:9";
          const featPosX = l.featPosX !== undefined ? l.featPosX : 50;
          const featPosY = l.featPosY !== undefined ? l.featPosY : 50;
          const featZoom = l.featZoom !== undefined ? l.featZoom : 1;

      document.body.style.height = '100vh';
      document.body.style.height = '100dvh';
      
      $("#app").innerHTML = `<iframe id="bio-full" style="position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;border:0;background:#f0ebe0;z-index:50;display:block" title="Link-in-Bio"></iframe>`;
      const frame = document.getElementById("bio-full");
      if(frame) frame.srcdoc = this.buildHTML(data, { preview:false });
    }catch(e){ console.error("PagePublic.render:", e); }
  }
};

/* =========================================================
   BOOT v25
   ========================================================= */
(async function boot(){
  try{
    // Show loading
    const ov = document.getElementById("loading-overlay");
    if(ov) ov.classList.remove("hidden");
    
    Sound.init();
    bindGlobalSound();
    await applyAppFavicon();
    
    // Apply user's style UI (dari state kosong dulu, default brutalism)
    applyStyleUI("brutalism");
    
    // Firebase Action URL
    const fullSearch = location.search.slice(1) || "";
    const fullParams = new URLSearchParams(fullSearch);
    if(fullParams.get("oobCode")){
      location.replace(location.pathname + `#/verify?${fullSearch}`);
      return;
    }
    
    // Handle redirect
    try{
      const redirectUser = await Auth.handleRedirectResult();
      if(redirectUser && redirectUser.__error){
        console.warn("Redirect error:", redirectUser.__error.code);
      }
    }catch(e){ console.warn("boot redirect:", e); }
    
    // Init auth
    await Auth.init();
    
    // Tunggu sync
    if(!Auth.current){
      await new Promise(resolve => {
        let done = false;
        const finish = ()=>{ if(!done){ done = true; resolve(); } };
        try{
          const unsub = FB.auth.onAuthStateChanged(async user => {
            if(user) await Auth._setCurrentFromUser(user);
            unsub();
            finish();
          });
          setTimeout(finish, 3000);
        }catch(e){ finish(); }
      });
    }
    
    // Apply user's style & warna
    if(Auth.current){
      applyStyleUI(STATE.styleUI || "brutalism");
    }
    
    // Redirect logic
    const hashPath = (location.hash.slice(1) || "/").split("?")[0];
    const isAuthPage = hashPath === "/login" || hashPath === "/register";
    
    if(IS_BIO_DOMAIN && !hashPath.startsWith("/u/")){
      location.replace(`${APP_BASE_URL}/#/`);
      return;
    }
    
    if(Auth.current){
      // Load plan
      try{ await loadUserPlan(); }catch(e){}
      
      if(isAuthPage || hashPath === "/"){
        Router.navigate("/dashboard");
        return;
      }
    } else {
      if(!location.hash) location.hash = "#/";
    }
    
    Router.start();
    
    // AUTO-START TUTORIAL
    if(Auth.current && Auth.current.tutorialShown !== true){
      setTimeout(()=>{
        try{
          const hashNow = (location.hash.slice(1) || "/").split("?")[0];
          if(hashNow === "/dashboard"){
            Tutorial.start();
          } else {
            const checkInterval = setInterval(()=>{
              try{
                const h = (location.hash.slice(1) || "/").split("?")[0];
                if(h === "/dashboard" && !Tutorial._active && Auth.current && Auth.current.tutorialShown !== true){
                  Tutorial.start();
                  clearInterval(checkInterval);
                } else if(Auth.current && Auth.current.tutorialShown === true){
                  clearInterval(checkInterval);
                }
              }catch(e){ clearInterval(checkInterval); }
            }, 500);
            setTimeout(()=>clearInterval(checkInterval), 5*60*1000);
          }
        }catch(e){ console.warn("Tutorial auto-start:", e); }
      }, 1500);
    }
  }catch(e){
    console.error("BOOT ERROR:", e);
    hideLoading();
    try{
      const errBox = document.getElementById("global-error");
      if(errBox){
        errBox.textContent = "BOOT ERROR: " + e.message;
        errBox.classList.add("show");
      }
    }catch(err){}
  }
})();
</script>
