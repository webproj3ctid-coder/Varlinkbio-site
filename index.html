.music-picker-item .mpi-info{flex:1;min-width:0}
.music-picker-item .mpi-title{font-size:13.5px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-picker-item .mpi-artist{font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-top:2px}
.music-picker-item .mpi-add{
  padding:6px 10px;
  border:2.5px solid var(--ink);
  border-radius:8px;
  background:var(--green);
  color:#fff;
  font-weight:900;
  font-size:11px;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}
.music-picker-item .mpi-add svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3}
.music-picker-item.in-playlist .mpi-add{background:var(--ink);color:var(--yellow)}

.music-picker-empty{
  text-align:center;
  padding:40px 20px;
  background:var(--white);
  border:2.5px dashed var(--ink);
  border-radius:14px;
  color:var(--ink-soft);
  font-weight:600;
}

/* Playlist panel */
.playlist-panel{background:linear-gradient(135deg,#e0f2fe,#bae6fd);border:2.5px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink)}
.playlist-panel .plp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.playlist-panel .plp-title{font-size:14px;font-weight:900;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.playlist-panel .plp-count{background:var(--ink);color:var(--yellow);font-family:var(--mono);font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px}
.playlist-mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.playlist-mode-btn{padding:10px 6px;border:2.5px solid var(--ink);border-radius:10px;background:var(--white);font-weight:900;font-size:11px;text-transform:uppercase;cursor:pointer;box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.playlist-mode-btn.active{background:var(--ink);color:var(--yellow)}
.playlist-mode-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5}
.playlist-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--white);border:2px solid var(--ink);border-radius:10px;margin-bottom:6px;font-size:12.5px;font-weight:700}
.playlist-item .pli-num{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font-weight:900;font-size:11px;flex-shrink:0}
.playlist-item .pli-info{flex:1;min-width:0}
.playlist-item .pli-title{font-weight:900;text-transform:uppercase;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playlist-item .pli-artist{font-size:10.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playlist-item .pli-remove{width:26px;height:26px;border-radius:7px;background:var(--red);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:2px 2px 0 var(--ink);flex-shrink:0}
.playlist-item .pli-remove svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3}
.playlist-empty{text-align:center;padding:16px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--cream);border:2px dashed var(--ink-soft);border-radius:10px}

/* Music library (dev) */
.music-lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:0 18px 60px;max-width:1200px;margin:0 auto}
.music-card{background:var(--white);border:2.5px solid var(--ink);border-radius:14px;padding:14px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:10px;position:relative}
.music-card.is-default{background:linear-gradient(135deg,var(--yellow),#ffed4e)}
.music-card .mc-head{display:flex;align-items:center;gap:10px}
.music-card .mc-icon{width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.music-card .mc-info{flex:1;min-width:0}
.music-card .mc-title{font-size:13.5px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-card .mc-artist{font-size:11px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.music-card .mc-badge{position:absolute;top:-10px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);letter-spacing:.5px;transform:rotate(8deg)}
.music-card .mc-audio{width:100%;height:36px;border:2px solid var(--ink);border-radius:8px;background:var(--cream)}
.music-card .mc-actions{display:flex;gap:6px;flex-wrap:wrap}
.music-card .mc-actions .btn{flex:1;padding:8px 10px;font-size:11px;min-width:0}

.music-upload-zone{background:var(--cream);border:2.5px dashed var(--ink);border-radius:14px;padding:24px;text-align:center;cursor:pointer;margin:0 18px 16px;max-width:800px}
.music-upload-zone:hover{background:var(--yellow);border-style:solid;transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.music-upload-zone .muz-icon{font-size:42px;margin-bottom:8px}
.music-upload-zone p{font-size:13px;font-weight:900;text-transform:uppercase;margin-bottom:4px}
.music-upload-zone small{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.music-upload-zone input[type=file]{display:none}

.music-progress{background:var(--white);border:2.5px solid var(--ink);border-radius:10px;padding:14px;margin:0 18px 14px;box-shadow:3px 3px 0 var(--ink);max-width:800px}
.music-progress .mp-label{font-size:11.5px;font-weight:900;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.music-progress .mp-bar{height:12px;background:var(--cream);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.music-progress .mp-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),#4ade80);width:0%;transition:width .3s ease}

/* Editor music box */
.editor-music-box{background:linear-gradient(135deg,#e0f2fe,#bae6fd);border:2.5px solid var(--ink);border-radius:12px;padding:14px;margin-top:10px}
.editor-music-box .emb-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:10px}
.editor-music-box .emb-current{background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;margin-bottom:10px}
.editor-music-box .emb-current .embi-icon{font-size:22px}
.editor-music-box .emb-current .embi-info{flex:1;min-width:0}
.editor-music-box .emb-current .embi-info b{display:block;font-size:13px;font-weight:900;text-transform:uppercase}
.editor-music-box .emb-current .embi-info span{font-size:11px;color:var(--ink-soft)}
.editor-music-box .emb-actions{display:flex;gap:6px;flex-wrap:wrap}
.editor-music-box .emb-actions .btn{flex:1;padding:8px 12px;font-size:11.5px;min-width:0}

/* ============================================================
   60. COMPONENT — TUTORIAL
   ============================================================ */
.tut-overlay{position:fixed;inset:0;z-index:99000;background:rgba(10,10,10,.78);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .35s ease}
.tut-overlay.active{opacity:1;pointer-events:auto}
.tut-dialog{position:relative;background:var(--white);border:3px solid var(--ink);border-radius:18px;box-shadow:10px 10px 0 var(--yellow);max-width:440px;width:100%;max-height:92vh;overflow-y:auto;transform:translateY(30px) scale(.95);opacity:0;transition:all .45s cubic-bezier(.34,1.56,.64,1)}
.tut-overlay.active .tut-dialog{transform:translateY(0) scale(1);opacity:1}
.tut-steps-bar{display:flex;gap:3px;padding:14px 16px 0}
.tut-step-dot{flex:1;height:5px;background:var(--cream-2);border-radius:3px;transition:background .3s}
.tut-step-dot.done{background:var(--green)}
.tut-step-dot.active{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:tutPulse 1.5s ease-in-out infinite}
@keyframes tutPulse{0%,100%{opacity:1}50%{opacity:.6}}
.tut-header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tut-counter{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--yellow);font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.tut-time{display:inline-flex;align-items:center;gap:4px;background:var(--cream);color:var(--ink-soft);font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.tut-close{width:32px;height:32px;border-radius:50%;background:var(--white);color:var(--ink);border:2.5px solid var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:2px 2px 0 var(--ink);flex-shrink:0;padding:0}
.tut-close:hover{transform:translate(-1px,-1px);background:var(--red);color:#fff}
.tut-body{padding:20px;display:flex;flex-direction:column}
.tut-icon{width:72px;height:72px;background:var(--yellow);border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;box-shadow:5px 5px 0 var(--red);font-size:34px;transform:rotate(-4deg);animation:tutIconFloat 2.5s ease-in-out infinite}
.tut-icon.blue{background:var(--blue)}
.tut-icon.green{background:var(--green)}
.tut-icon.purple{background:var(--purple)}
.tut-icon.orange{background:var(--orange)}
.tut-icon.pink{background:var(--pink)}
@keyframes tutIconFloat{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-6px)}}
.tut-title{font-size:20px;font-weight:900;text-transform:uppercase;margin-bottom:10px;line-height:1.15;text-align:center}
.tut-subtitle{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);text-align:center;margin-bottom:14px}
.tut-desc{font-size:13.5px;font-weight:600;color:var(--ink-soft);line-height:1.65;margin-bottom:16px}
.tut-desc b{color:var(--ink);font-weight:900}
.tut-info-box{background:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.tut-info-item{display:flex;align-items:flex-start;gap:10px;font-size:12px;font-weight:700;color:var(--ink);line-height:1.45}
.tut-info-item .bullet{width:20px;height:20px;border-radius:6px;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:900;margin-top:1px}
.tut-info-item .txt{flex:1}
.tut-highlight{background:linear-gradient(135deg,var(--yellow),var(--orange));border:2.5px solid var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;font-weight:700;line-height:1.55;box-shadow:3px 3px 0 var(--ink)}
.tut-footer{padding:14px 20px 20px;border-top:2px solid var(--cream-2);display:flex;gap:8px;align-items:center;background:var(--white);position:sticky;bottom:0}
.tut-footer .tut-btn{flex:1;padding:12px 16px;font-size:13px}
.tut-footer .tut-btn-secondary{background:var(--cream);flex:0 0 auto;padding:12px 14px;font-size:12px}
.tut-confetti{position:fixed;inset:0;z-index:99004;pointer-events:none;overflow:hidden}
.tut-confetti-piece{position:absolute;top:-20px;width:10px;height:14px;animation:tutFall 3s linear infinite}
@keyframes tutFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.3}}
.tut-highlight-target{position:relative;z-index:99001;box-shadow:0 0 0 4px var(--yellow),0 0 0 8px var(--ink),0 0 30px rgba(255,215,0,.6)!important;border-radius:12px;animation:tutTargetPulse 1.5s ease-in-out infinite}
@keyframes tutTargetPulse{0%,100%{box-shadow:0 0 0 4px var(--yellow),0 0 0 8px var(--ink),0 0 30px rgba(255,215,0,.6)}50%{box-shadow:0 0 0 6px var(--yellow),0 0 0 12px var(--ink),0 0 40px rgba(255,215,0,.8)}}

/* ============================================================
   61. COMPONENT — PUBLIC BIO VIEWER
   ============================================================ */
.bio-wrap{min-height:100vh;width:100%;position:relative;overflow-x:hidden;color:var(--ink);padding:34px 18px 60px;display:flex;flex-direction:column;align-items:center;font-weight:700;z-index:2}
.bio-inner{width:100%;max-width:420px;position:relative;z-index:2}
.bio-deco{position:fixed;pointer-events:none;z-index:1}
.bio-deco.d1{width:60px;height:60px;top:8%;left:6%;background:var(--red);border:3px solid var(--ink);transform:rotate(-12deg);box-shadow:5px 5px 0 var(--ink);animation:deco1 6s ease-in-out infinite}
.bio-deco.d2{width:38px;height:38px;top:16%;right:8%;background:var(--blue);border:3px solid var(--ink);border-radius:50%;transform:rotate(20deg);box-shadow:4px 4px 0 var(--ink);animation:deco2 7s ease-in-out infinite}
.bio-deco.d3{width:44px;height:44px;bottom:20%;right:6%;background:var(--yellow);border:3px solid var(--ink);transform:rotate(15deg);box-shadow:4px 4px 0 var(--ink);animation:deco3 8s ease-in-out infinite}
@keyframes deco1{0%,100%{transform:rotate(-12deg) translate(0,0)}50%{transform:rotate(-12deg) translate(6px,-8px)}}
@keyframes deco2{0%,100%{transform:rotate(20deg) translate(0,0)}50%{transform:rotate(20deg) translate(-6px,8px)}}
@keyframes deco3{0%,100%{transform:rotate(15deg) translate(0,0)}50%{transform:rotate(15deg) translate(4px,-6px)}}
.bio-banner{width:100%;max-width:100%;margin:0 auto 16px;height:110px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:var(--white);position:relative}
.bio-banner img,.bio-banner video{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:480px){.bio-banner{height:95px;margin-bottom:14px}}
.bio-avatar{width:110px;height:110px;border-radius:50%;border:4px solid var(--ink);overflow:hidden;background:var(--white);margin:0 auto;box-shadow:6px 6px 0 var(--ink)}
.bio-avatar img{width:100%;height:100%;object-fit:cover}
.bio-header{display:flex;flex-direction:column;align-items:center;margin-bottom:14px;position:relative}
.bio-title-top{display:inline-block;padding:5px 14px;background:var(--white);color:var(--ink);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;border:3px solid var(--ink);transform:rotate(-4deg);margin-top:12px;box-shadow:3px 3px 0 var(--ink);z-index:3}
.bio-name{display:inline-block;padding:7px 18px;background:var(--yellow);color:var(--ink);font-size:21px;font-weight:900;text-transform:uppercase;border:3px solid var(--ink);transform:rotate(2deg);margin-top:-4px;box-shadow:5px 5px 0 var(--ink);text-align:center;max-width:100%;word-break:break-word;z-index:2}
.bio-bio{display:inline-block;padding:6px 14px;background:var(--red);color:var(--white);font-size:12px;font-weight:800;text-transform:uppercase;border:3px solid var(--ink);transform:rotate(-2deg);margin-top:-2px;box-shadow:4px 4px 0 var(--ink);text-align:center;max-width:100%;word-break:break-word;z-index:1}
.bio-plan-badge{display:inline-block;padding:3px 12px;background:var(--ink);color:var(--yellow);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;border:2px solid var(--yellow);border-radius:999px;margin-top:10px;box-shadow:2px 2px 0 var(--ink)}
.bio-plan-badge.starter{background:var(--green);color:#fff;border-color:var(--ink)}
.bio-plan-badge.pro{background:var(--blue);color:#fff;border-color:var(--ink)}
.bio-plan-badge.ultimate{background:var(--ink);color:var(--yellow);border-color:var(--yellow)}
.bio-logos{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;margin-top:4px}
.bio-logo-item{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--white);overflow:hidden;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.bio-logo-item img{width:100%;height:100%;object-fit:contain;padding:4px}
.bio-links{display:flex;flex-direction:column;gap:14px}
.bio-link{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 18px;border:3px solid var(--ink);border-radius:12px;font-weight:900;font-size:14.5px;text-transform:uppercase;letter-spacing:.5px;position:relative;box-shadow:6px 6px 0 var(--ink);cursor:pointer;min-height:56px;background:var(--white);color:var(--ink);animation:linkFadeIn .4s ease both}
@keyframes linkFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bio-link:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.bio-link:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.bio-link .licon{width:22px;height:22px;display:grid;place-items:center;flex-shrink:0}
.bio-link .licon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bio-link .ltext{flex:1;text-align:center}
.bio-embed{border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:var(--white)}
.bio-embed iframe{width:100%;display:block;border:none;aspect-ratio:16/9}
.bio-footer{margin-top:28px;font-size:11px;color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:1px;background:var(--white);border:2px solid var(--ink);padding:6px 12px;border-radius:20px;box-shadow:2px 2px 0 var(--ink);display:inline-block}
.bio-footer a{color:var(--ink);font-weight:900;text-decoration:underline}
.bio-cta-float{position:fixed;bottom:16px;right:16px;z-index:9990;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--yellow);font-weight:900;font-size:11px;text-transform:uppercase;text-decoration:none;padding:8px 14px;border-radius:999px;border:2.5px solid var(--yellow);box-shadow:3px 3px 0 var(--yellow);animation:ctaBounce 2.5s ease-in-out infinite}
@keyframes ctaBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.bio-link.bio-featured{display:flex;flex-direction:column;align-items:stretch;padding:0;overflow:hidden;gap:0;background:var(--feat-bg,var(--white));color:var(--feat-fg,var(--ink));min-height:0;position:relative;border:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink)}
.bio-link.bio-featured:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.bio-link.bio-featured .feat-img-wrap{padding:var(--feat-padding,10px);display:flex;justify-content:center;align-items:center;width:100%;background:var(--feat-bg,var(--white))}
.bio-link.bio-featured .feat-img{width:80%;height:auto;aspect-ratio:var(--feat-ratio,16/9);object-fit:cover;object-position:var(--feat-pos-x,50%) var(--feat-pos-y,50%);transform:scale(var(--feat-zoom,1));transform-origin:var(--feat-pos-x,50%) var(--feat-pos-y,50%);border:2.5px solid var(--ink);border-radius:8px;display:block;background:var(--white)}
.bio-link.bio-featured .feat-body{padding:10px 14px 12px;text-align:center;background:var(--feat-bg,var(--white));color:var(--feat-fg,var(--ink))}
.bio-link.bio-featured .feat-body b{font-size:14.5px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}

/* Lock overlay */
.lock-overlay{position:fixed;inset:0;background:rgba(240,235,224,.96);z-index:9998;display:grid;place-items:center;padding:18px}
.lock-card{background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:28px;max-width:340px;width:100%;text-align:center;box-shadow:8px 8px 0 var(--red)}
.lock-card .li{width:56px;height:56px;background:var(--ink);color:var(--yellow);border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:26px}
.lock-card h3{margin-bottom:6px;font-size:16px;text-transform:uppercase;font-weight:900}
.lock-card p{font-size:13px;margin-bottom:16px;font-weight:600;color:var(--ink-soft)}
.lock-card input{width:100%;padding:12px;border-radius:10px;border:2.5px solid var(--ink);background:var(--white);color:var(--ink);font-size:14px;outline:none;text-align:center;font-weight:700;font-family:inherit}
.lock-card button{width:100%;padding:12px;border-radius:10px;border:2.5px solid var(--ink);background:var(--ink);color:var(--white);font-weight:900;cursor:pointer;margin-top:10px;font-size:13.5px;text-transform:uppercase;box-shadow:3px 3px 0 var(--red);font-family:inherit}
.lock-card .lock-err{color:var(--red);font-size:12px;font-weight:700;margin-top:8px;min-height:16px}

/* ============================================================
   62. COMPONENT — NOTIFICATION CENTER
   ============================================================ */
.lt-badge.bell{background:var(--white);position:relative;padding:6px 10px;font-size:14px}
.lt-badge.bell.has-unread{background:var(--red);color:#fff;animation:bellPulse 2s ease-in-out infinite}
@keyframes bellPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.lt-badge.bell .bell-icon{display:block;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

window.addEventListener("error", function(e){
  if(!e.message) return;
  if(e.message.indexOf("ResizeObserver") !== -1) return;
  if(e.message.indexOf("passive") !== -1) return;
  console.error("🔴 JS Error:", e.message, "@ line", e.lineno);
  try{
    var errBox = document.getElementById("global-error");
    if(errBox){
      errBox.textContent = "ERROR: " + e.message + " (line " + e.lineno + ")";
      errBox.classList.add("show");
      setTimeout(function(){ errBox.classList.remove("show"); }, 10000);
    }
  }catch(err){}
}, true);

window.addEventListener("unhandledrejection", function(e){
  var r = e.reason;
  if(!r) return;
  var msg = r.message || String(r);
  if(msg.indexOf("permission-denied") !== -1) return;
  if(msg.indexOf("ResizeObserver") !== -1) return;
  console.error("🔴 Promise Error:", msg);
  try{
    var errBox = document.getElementById("global-error");
    if(errBox){
      errBox.textContent = "PROMISE: " + msg;
      errBox.classList.add("show");
      setTimeout(function(){ errBox.classList.remove("show"); }, 10000);

});

function emojiToSvg(text, opts){
  opts = opts || {};
  if(!text) return text;
  var sizeClass = opts.size === "sm" ? "svg-sm" : (opts.size === "lg" ? "svg-lg" : "");
  var colorClass = opts.color ? ("svg-" + opts.color) : "";
  return String(text).replace(/([\u{1F300}-\u{1F9FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{2600}-\u{27BF}]|[\u{1F900}-\u{1F9FF}]|[\u{2190}-\u{21FF}]|[\u{2B00}-\u{2BFF}]|[\uFE0F]|[\u2700-\u27BF])/gu, function(match){
    if(match === "\uFE0F") return "";
    var svgData = EMOJI_SVG[match];
    if(!svgData) return match;
    var classes = ["svg-emoji"];
    if(sizeClass) classes.push(sizeClass);
    if(colorClass) classes.push(colorClass);
    return '<span class="' + classes.join(" ") + '"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + svgData + '</svg></span>';
  });
}

function formatBytes(bytes){
  if(!bytes) return "—";
  var kb = bytes / 1024;
  if(kb < 1024) return kb.toFixed(0) + " KB";
  return (kb / 1024).toFixed(1) + " MB";
}
function contrastText(hex){
  try{
    if(!hex) return "#0a0a0a";
    var c = String(hex).trim();
    if(c.indexOf("linear-gradient") === 0){
      var matches = c.match(/#[0-9a-f]{6}/gi) || [];
      if(matches.length){
        var avg = matches.reduce(function(s, h){ return s + parseInt(h.slice(1,3),16); }, 0) / matches.length;
        return avg > 128 ? "#0a0a0a" : "#ffffff";
      }
      return "#ffffff";
    }
    if(c.charAt(0) !== "#") c = "#" + c;
    if(c.length === 4) c = "#" + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
    if(c.length !== 7) return "#0a0a0a";
    var r = parseInt(c.slice(1,3),16);
    var g = parseInt(c.slice(3,5),16);
    var b = parseInt(c.slice(5,7),16);
    var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? "#0a0a0a" : "#ffffff";
  }catch(e){ return "#0a0a0a"; }
}

function toast(msg, type){
  type = type || "info";
  try{
    var el = document.createElement("div");
    el.className = "toast " + type;
    el.textContent = msg;
    var cont = $("#toast-container");
    if(cont) cont.appendChild(el);
    if(type === "success") Sound.success();
    else if(type === "error") Sound.error();
    setTimeout(function(){
      try{
        el.style.opacity = "0";
        el.style.transform = "translateY(-8px)";
        setTimeout(function(){ el.remove(); }, 220);
      }catch(e){}
    }, 2800);
  }catch(e){ console.warn("toast:", e); }
}

  }catch(e){}

function hideLoading(){

}
function openModal(html){
  try{
    var b = document.createElement("div");
    b.className = "modal-back";
    b.innerHTML = '<div class="modal">' + html + '</div>';
    b.addEventListener("click", function(e){ if(e.target === b) b.remove(); });
    document.body.appendChild(b);
    return b;
  }catch(e){ console.error("openModal:", e); return null; }
}

/* ============================================================

   ============================================================ */
function generateSlug(text){
  return String(text || "").toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}
function validateSlug(slug, plan){
  slug = String(slug || "").toLowerCase().trim()
    .replace(/[^a-z0-9-]/g, "")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
  var minLen = (plan && plan.features && plan.features.slugMinLength) || 4;
  if(!slug) return { ok:false, msg:"URL gak boleh kosong" };
  if(slug.length < minLen) return { ok:false, msg:"Minimal " + minLen + " karakter" };
  if(slug.length > 30) return { ok:false, msg:"Maksimal 30 karakter" };
  if(/^\d+$/.test(slug)) return { ok:false, msg:"Gak boleh angka semua" };
  if(RESERVED_SLUGS.indexOf(slug) !== -1) return { ok:false, msg:'URL "' + slug + '" tidak bisa dipakai' };
  return { ok:true, slug: slug };
}
async function checkSlugAvailable(slug, currentBioId){
  try{
    var q = await FB.db.collection("bios").where("slug","==",slug).get();
    var taken = false;
    q.forEach(function(d){ if(d.id !== currentBioId) taken = true; });
    return !taken;
  }catch(e){ return false; }
}
async function getUniqueSlug(baseSlug, currentBioId){
  var slug = baseSlug || ("user-" + Math.random().toString(36).slice(2,7));
  var unique = false, counter = 1, finalSlug = slug;
  while(!unique){
    try{
      var q = await FB.db.collection("bios").where("slug","==",finalSlug).get();
      var taken = false;
      q.forEach(function(doc){ if(doc.id !== currentBioId) taken = true; });
      if(!taken) unique = true;
      else { counter++; finalSlug = slug + "-" + counter; }
      if(counter > 20){ finalSlug = slug + "-" + Date.now().toString(36); break; }
    }catch(e){ unique = true; }
  }
  return finalSlug;
}

/* ============================================================
   13. IMAGE COMPRESS
   ============================================================ */
function compressImage(file, maxSize, quality){
  maxSize = maxSize || 900;
  quality = quality || 0.72;
  return new Promise(function(resolve, reject){
    if(!file.type.startsWith("image/")){ reject(new Error("Hanya file gambar")); return; }
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      try{
        URL.revokeObjectURL(url);
        var width = img.width, height = img.height;
        if(width > maxSize || height > maxSize){
          var ratio = Math.min(maxSize/width, maxSize/height);
          width = Math.round(width*ratio);
          height = Math.round(height*ratio);
        }
        var canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(function(blob){
          if(!blob){ reject(new Error("Compress gagal")); return; }
          var compressed = new File([blob], file.name.replace(/\.[^.]+$/,".jpg"), { type:"image/jpeg" });
          resolve(compressed);
        }, "image/jpeg", quality);
      }catch(e){ reject(e); }
    };
    img.onerror = function(){ reject(new Error("Gagal baca gambar")); };
    img.src = url;
  });
}

  try{
    if(typeof QRCode === "undefined") throw new Error("QRCode library not loaded");
    var color = opts.color || "#0a0a0a";
    var bg = opts.bg || "#ffffff";
    var size = opts.size || 440;
    var logo = opts.logo || null;
    await QRCode.toCanvas(canvasEl, text, {
      width: size, margin: 2,
      color: { dark: color, light: bg },
      errorCorrectionLevel: logo ? "H" : "M"
    });
    if(!logo) return true;
    await new Promise(function(resolve){
      var ctx = canvasEl.getContext("2d");
      var img = new Image();
      img.crossOrigin = "anonymous";
      var timeout = setTimeout(resolve, 3000);
      img.onload = function(){
        clearTimeout(timeout);
        try{
          var logoSize = size * 0.22;
          var x = (size - logoSize) / 2;
          var y = (size - logoSize) / 2;
          var padding = 8;
          ctx.fillStyle = bg;
          ctx.beginPath();
          var rx = x - padding, ry = y - padding;
          var rw = logoSize + padding*2, rh = logoSize + padding*2;
          var radius = 10;
          ctx.moveTo(rx + radius, ry);
          ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, radius);
          ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, radius);
          ctx.arcTo(rx, ry + rh, rx, ry, radius);
          ctx.arcTo(rx, ry, rx + rw, ry, radius);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.drawImage(img, x, y, logoSize, logoSize);
        }catch(e){ console.warn("Logo draw:", e); }
        resolve();
      };
      img.onerror = function(){ clearTimeout(timeout); resolve(); };
      img.src = logo;
    });
    return true;
  }catch(e){ console.error("generateQRCustom:", e); throw e; }
}

async function ensureQRCodeLibrary(){
  if(typeof QRCode !== "undefined") return true;
  var cdns = [
    "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js",
    "https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"
  ];
  for(var i = 0; i < cdns.length; i++){
    try{
      await new Promise(function(resolve, reject){
        var s = document.createElement("script");
        s.src = cdns[i];
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      if(typeof QRCode !== "undefined") return true;
    }catch(e){}
  }
  return false;
}

   ============================================================ */
function buildVCard(bio){
  var name = bio.name || "User";
  var url = PUBLIC_BASE_URL + "/#/u/" + (bio.slug || bio.id);
  var bioText = bio.bio || "";
  var waLink = (bio.links || []).find(function(l){ return /wa\.me|whatsapp/i.test(l.url||""); });
  var igLink = (bio.links || []).find(function(l){ return /instagram\.com/i.test(l.url||""); });
  var mailLink = (bio.links || []).find(function(l){ return /^mailto:|@.*\./i.test(l.url||""); });
  var waNumber = waLink ? (waLink.url.match(/(\d{8,15})/)||[])[1] : "";
  var igUser = igLink ? (igLink.url.match(/instagram\.com\/([^\/\?]+)/)||[])[1] : "";
  var email = mailLink ? mailLink.url.replace(/^mailto:/,"") : "";
  var v = "BEGIN:VCARD\nVERSION:3.0\n";
  v += "FN:" + name + "\n";
  v += "N:" + name + ";;;;\n";
  if(bioText) v += "NOTE:" + bioText + "\n";
  if(email) v += "EMAIL:" + email + "\n";
  if(waNumber) v += "TEL;TYPE=CELL:+" + waNumber + "\n";
  v += "URL:" + url + "\n";
  if(igUser) v += "X-SOCIALPROFILE;type=instagram:https://instagram.com/" + igUser + "\n";
  v += "END:VCARD";
  return v;
}
function downloadVCard(bio){
  try{
    var v = buildVCard(bio);
    var blob = new Blob([v], { type:"text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = (bio.name || "kontak").replace(/\s+/g,"_") + ".vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    Sound.success();
    toast("Kontak didownload! 📇","success");
  }catch(e){ console.warn("downloadVCard:", e); }
}

var PROTECTED = ["/dashboard","/editor","/manage","/stats","/dev","/settings","/help","/explore","/store","/fitur-saya","/topup","/music","/notifikasi"];

var Router = {
  routes:{},
  _resolving:false,
  on:function(p, h){ this.routes[p] = h; },
  navigate:function(p){
    if(location.hash.slice(1) === p) this.resolve();
    else location.hash = p;
  },
  resolve:function(){
    if(this._resolving) return;
    this._resolving = true;
    var self = this;
    setTimeout(function(){ self._resolving = false; }, 50);

    try{
      document.body.classList.remove("public-mode");
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
      document.body.style.height = "";

      var fullSearch = location.search.slice(1);
      if(fullSearch){
        var p = new URLSearchParams(fullSearch);
        var oobCode = p.get("oobCode");
        var mode = p.get("mode");
        if(oobCode && (mode === "verifyEmail" || mode === "resetPassword" || mode === "recoverEmail")){
          var targetHash = "#/verify?" + fullSearch;
          if(location.hash !== targetHash){
            location.replace(location.pathname + targetHash);
            return;
          }
        }
      }

      if(IS_BIO_DOMAIN){
        var raw0 = location.hash.slice(1) || "/";
        var path0 = raw0.split("?")[0];
        if(path0.indexOf("/u/") !== 0){
          location.replace(APP_BASE_URL + "/#/");
          return;
        }
      }

      var raw = location.hash.slice(1) || "/";
      var path = raw.split("?")[0];
      var query = raw.split("?")[1] || "";

      if(path.indexOf("/u/") === 0){
        var handler = this.routes["/u/:id"] || function(){};
        handler(path.slice(3));
        setTimeout(function(){ hideLoading(); }, 100);
        return;
      }

      if(Auth.current && (path === "/login" || path === "/register")){
        return this.navigate("/dashboard");
      }

      if(PROTECTED.indexOf(path) !== -1 && !Auth.current){
        setTimeout(function(){
          try{
            if(Auth.current) self.resolve();
            else self.navigate("/login");
          }catch(e){}
        }, 200);
        return;
      }

      if(PROTECTED.indexOf(path) !== -1 && Auth.current && !isDev(Auth.current.email)){
        var user = FB.auth.currentUser;
        var isGoogle = (user && user.providerData || []).some(function(p){ return p.providerId === "google.com"; });
        var allowedUnverified = ["/help","/verify","/settings"];
        if(user && !user.emailVerified && !isGoogle && allowedUnverified.indexOf(path) === -1){
          return this.navigate("/verify");
        }
      }

      var finalHandler = this.routes[path] || this.routes["/404"] || function(){};
      finalHandler(query);

      setTimeout(function(){ try{ hideLoading(); }catch(e){} }, 100);
    }catch(e){
      console.error("Router.resolve:", e);
      try{ hideLoading(); }catch(err){}
    }
  },
  start:function(){
    var self = this;
    window.addEventListener("hashchange", function(){ try{ self.resolve(); }catch(e){ console.error(e); } });
    this.resolve();
  }
};

var LinkTypes = {
  detect:function(url){
    if(!url) return "classic";
    var u = url.toLowerCase();
    if(u.indexOf("youtube.com") !== -1 || u.indexOf("youtu.be") !== -1) return "youtube";
    if(u.indexOf("spotify.com") !== -1) return "spotify";
    if(u.indexOf("tiktok.com") !== -1) return "tiktok";
    if(u.indexOf("vimeo.com") !== -1) return "vimeo";
    if(u.indexOf("instagram.com") !== -1) return "instagram";
    if(u.indexOf("twitter.com") !== -1 || u.indexOf("x.com") !== -1) return "twitter";
    if(u.indexOf("wa.me") !== -1 || u.indexOf("whatsapp.com") !== -1) return "whatsapp";
    if(u.indexOf("threads.net") !== -1) return "threads";
    if(u.indexOf("telegram") !== -1 || u.indexOf("t.me") !== -1) return "telegram";
    if(u.indexOf("facebook.com") !== -1 || u.indexOf("fb.com") !== -1) return "facebook";
    if(u.indexOf("github.com") !== -1) return "github";
    if(u.indexOf("linkedin.com") !== -1) return "linkedin";
    return "classic";
  },
  embed:function(url){
    if(!url) return null;
    var yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if(yt) return "https://www.youtube.com/embed/" + yt[1];
    var sp = url.match(/spotify\.com\/(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
    if(sp) return "https://open.spotify.com/embed/" + sp[1] + "/" + sp[2];
    var vm = url.match(/vimeo\.com\/(\d+)/);
    if(vm) return "https://player.vimeo.com/video/" + vm[1];
    var tt = url.match(/tiktok\.com\/.*\/video\/(\d+)/);
    if(tt) return "https://www.tiktok.com/embed/v2/" + tt[1];
    return null;
  },
  icon:function(url){
    var t = this.detect(url);
    return {
      youtube:"youtube", spotify:"music", tiktok:"video", vimeo:"video",
      instagram:"instagram", twitter:"twitter", whatsapp:"whatsapp",
      threads:"twitter", telegram:"mail", facebook:"user", github:"link",
      linkedin:"user", classic:"link"
    }[t] || "link";
  }
};

/* ============================================================
   27. EXTRACT LINK INFO
   ============================================================ */
function extractLinkInfo(url){
  try{
    url = String(url || "").trim();
    if(!url) return null;
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    var u = url.toLowerCase();
    var label = "Link";
    if(u.indexOf("instagram.com") !== -1){
      label = "Instagram";
      var m1 = url.match(/instagram\.com\/([^\/\?]+)/);
      if(m1) label = "@" + m1[1];
    } else if(u.indexOf("tiktok.com") !== -1){
      label = "TikTok";
      var m2 = url.match(/tiktok\.com\/@([^\/\?]+)/);
      if(m2) label = "@" + m2[1];
    } else if(u.indexOf("youtube.com") !== -1 || u.indexOf("youtu.be") !== -1){
      label = "YouTube";
      var m3 = url.match(/@([^\/\?]+)/);
      if(m3) label = "@" + m3[1];
    } else if(u.indexOf("twitter.com") !== -1 || u.indexOf("x.com") !== -1){
      label = "Twitter / X";
      var m4 = url.match(/(?:twitter|x)\.com\/([^\/\?]+)/);
      if(m4) label = "@" + m4[1];
    } else if(u.indexOf("wa.me") !== -1 || u.indexOf("whatsapp.com") !== -1){
      label = "WhatsApp";
    } else if(u.indexOf("spotify.com") !== -1){
      label = "Spotify";
    } else if(u.indexOf("threads.net") !== -1){
      label = "Threads";
      var m5 = url.match(/threads\.net\/@([^\/\?]+)/);
      if(m5) label = "@" + m5[1];
    } else if(u.indexOf("t.me") !== -1 || u.indexOf("telegram") !== -1){
      label = "Telegram";
      var m6 = url.match(/(?:t\.me|telegram\.me)\/([^\/\?]+)/);
      if(m6) label = "@" + m6[1];
    } else if(u.indexOf("github.com") !== -1){
      label = "GitHub";
      var m7 = url.match(/github\.com\/([^\/\?]+)/);
      if(m7) label = "@" + m7[1];
    } else if(u.indexOf("linkedin.com") !== -1){
      label = "LinkedIn";
    } else if(u.indexOf("facebook.com") !== -1 || u.indexOf("fb.com") !== -1){
      label = "Facebook";
    }
    return { url:url, label:label, type:LinkTypes.detect(url) };
  }catch(e){ return null; }
}

  _bindInteraction:function(){
    var self = this;
    if(!this._el) return;

    this._el.addEventListener("mousedown", function(e){
      self._clickTimer = setTimeout(function(){
        self._clickTimer = null;
        self._openChat();
        if(navigator.vibrate) navigator.vibrate(20);
      }, self.CONFIG.LONG_PRESS_MS);
    });

    this._el.addEventListener("mouseup", function(e){
      if(self._clickTimer){
        clearTimeout(self._clickTimer);
        self._clickTimer = null;
        if(self._mode === "walking-out" || self._mode === "hide") return;
        var tip = self.TIPS_RANDOM[Math.floor(Math.random() * self.TIPS_RANDOM.length)];
        self.showBubble(tip, 3000);
        if(window.Sound && Sound.bip) Sound.bip();
      }
    });

    this._el.addEventListener("mouseleave", function(){
      if(self._clickTimer){ clearTimeout(self._clickTimer); self._clickTimer = null; }
    });

    this._el.addEventListener("touchstart", function(e){
      self._clickTimer = setTimeout(function(){
        self._clickTimer = null;
        self._openChat();
        if(navigator.vibrate) navigator.vibrate(20);
      }, self.CONFIG.LONG_PRESS_MS);
    }, { passive: true });

    this._el.addEventListener("touchend", function(e){
      if(self._clickTimer){
        clearTimeout(self._clickTimer);
        self._clickTimer = null;
        if(self._mode === "walking-out" || self._mode === "hide") return;
        var tip = self.TIPS_RANDOM[Math.floor(Math.random() * self.TIPS_RANDOM.length)];
        self.showBubble(tip, 3000);
        if(window.Sound && Sound.bip) Sound.bip();
      }
    });
  },

  _openChat:function(){
    if(window.VarsmileAI){
      try{ VarsmileAI.open(); }catch(e){ console.warn("VarsmileAI.open:", e); }
    } else {
      toast("Varsmile AI belum siap", "info");
    }
  },

  showBubble:function(text, duration){
    duration = duration || 3000;
    if(!this._el) return;
    if(this._bubbleTimer){ clearTimeout(this._bubbleTimer); this._bubbleTimer = null; }
    if(this._bubbleEl){ try{ this._bubbleEl.remove(); }catch(e){} this._bubbleEl = null; }

    try{
      var rect = this._el.getBoundingClientRect();
      var bubble = document.createElement("div");
      bubble.className = "varsmile-bubble";
      bubble.textContent = text;
      bubble.style.bottom = (window.innerHeight - rect.top + 14) + "px";
      bubble.style.right = "16px";
      document.body.appendChild(bubble);
      this._bubbleEl = bubble;

      var self = this;
      this._bubbleTimer = setTimeout(function(){
        if(self._bubbleEl === bubble){
          bubble.classList.add("dismissing");
          setTimeout(function(){
            try{ bubble.remove(); }catch(e){}
            if(self._bubbleEl === bubble) self._bubbleEl = null;
          }, 300);
        }
      }, duration);

      bubble.addEventListener("click", function(){
        if(self._bubbleTimer){ clearTimeout(self._bubbleTimer); self._bubbleTimer = null; }
        bubble.classList.add("dismissing");
        setTimeout(function(){
          try{ bubble.remove(); }catch(e){}
          if(self._bubbleEl === bubble) self._bubbleEl = null;
        }, 300);
      });
    }catch(e){}
  },

  _setMode:function(mode){
    if(!this._el) return;
    this._mode = mode;
    var cls = "facing-right";
    if(mode === "idle") cls = "idle-pos idle facing-right";
    else if(mode === "walking-out") cls = "idle-pos walking facing-left";
    else if(mode === "walking-in") cls = "idle-pos walking facing-right";
    else if(mode === "hide") cls = "hide-bottom facing-right";
    else if(mode === "peek") cls = "peek-bottom facing-right";
    else if(mode === "talk") cls = "idle-pos talking facing-right";
    this._el.className = cls;
  },

  startLoop:function(){
    if(!this._el) return;
    this._active = true;
    this._idleCycle();
  },

  _idleCycle:function(){
    var self = this;
    if(!this._active) return;
    this._setMode("idle");
    setTimeout(function(){
      if(!self._active) return;
      self._step1_walkOut();
    }, this.CONFIG.CYCLE_INTERVAL);
  },

  _step1_walkOut:function(){
    var self = this;
    if(!this._active) return;
    this._setMode("walking-out");
    if(window.Sound && Sound.tick) Sound.tick();
    setTimeout(function(){
      if(!self._active) return;
      self._step2_hide();
    }, this.CONFIG.WALK_OUT_DURATION);
  },

  _step2_hide:function(){
    var self = this;
    if(!this._active) return;
    this._setMode("hide");
    setTimeout(function(){
      if(!self._active) return;
      self._step3_peek();
    }, this.CONFIG.HIDE_DURATION);
  },

  _step3_peek:function(){
    var self = this;
    if(!this._active || !this._el) return;
    this._el.classList.remove("walking-out");
    this._el.classList.remove("walking-in");
    this._el.style.right = "16px";
    this._setMode("peek");
    setTimeout(function(){
      if(!self._active) return;
      self._step4_comeUp();
    }, this.CONFIG.PEEK_DURATION);
  },

  _step4_comeUp:function(){
    var self = this;
    if(!this._active) return;
    this._setMode("talk");
    var tip = this.TIPS_RANDOM[Math.floor(Math.random() * this.TIPS_RANDOM.length)];
    this.showBubble(tip, this.CONFIG.TIP_SHOW_DURATION);
    if(window.Sound && Sound.bip) Sound.bip();
    setTimeout(function(){
      if(!self._active) return;
      self._step5_backToIdle();
    }, this.CONFIG.TIP_SHOW_DURATION);
  },

  _step5_backToIdle:function(){
    if(!this._active) return;
    this._setMode("idle");
    this._idleCycle();
  },

  startLoginMode:function(){
    var self = this;
    if(!this._el){
      try{
        var oldEl = document.getElementById("varsmile-char");
        if(oldEl) oldEl.remove();
        this._el = document.createElement("div");
        this._el.id = "varsmile-char";
        this._el.className = "peek-bottom idle facing-right";
        this._el.innerHTML = this.SVG;
        this._el.style.pointerEvents = "auto";
        this._el.style.cursor = "pointer";
        document.body.appendChild(this._el);
        this._bindInteraction();
      }catch(e){ return; }
    }
    this._setMode("peek");
    if(this._tipTimer) clearInterval(this._tipTimer);
    this._tipTimer = setInterval(function(){
      if(self._mode !== "peek") return;
      var tip = self.TIPS_LOGIN[Math.floor(Math.random() * self.TIPS_LOGIN.length)];
      self.showBubble(tip, 4000);
    }, this.CONFIG.LOGIN_TIP_INTERVAL);
  },

  runAway3D:function(){
    var self = this;
    if(!this._el) return Promise.resolve();
    if(this._tipTimer){ clearInterval(this._tipTimer); this._tipTimer = null; }
    this.showBubble("AYOOO MARI KITA MENUJU RUMAH! 🏠", 2500);
    if(window.Sound && Sound.success) Sound.success();
    setTimeout(function(){
      if(self._el){
        self._el.style.transition = "transform 1.5s ease, opacity 1.5s ease";
        self._el.style.transform = "scale(0.1) translateY(-100px)";
        self._el.style.opacity = "0";
      }
    }, 500);
    return new Promise(function(resolve){ setTimeout(resolve, 2600); });
  },

  hide:function(){
    this._active = false;
    if(this._tipTimer){ clearInterval(this._tipTimer); this._tipTimer = null; }
    if(this._bubbleTimer){ clearTimeout(this._bubbleTimer); this._bubbleTimer = null; }
    if(this._el){ try{ this._el.remove(); }catch(e){} this._el = null; }
    if(this._bubbleEl){ try{ this._bubbleEl.remove(); }catch(e){} this._bubbleEl = null; }
    this._mode = "hidden";
  }
};

/* ============================================================
   03. MAINTENANCE PAGE
   ============================================================ */
function renderMaintenancePage(m){
  var until = m.until || 0;
  var reason = m.reason || "Sedang ada perbaikan sistem";
  var startedAt = m.startedAt || Date.now();

  document.body.innerHTML =
    '<div class="maint-page">' +
      '<div class="maint-card">' +
        '<div class="maint-icon">🔧</div>' +
        '<h1 class="maint-title">Web Sedang Diperbaiki</h1>' +
        '<p class="maint-desc">Varlinkbio sedang <b>dalam proses maintenance</b>. Mohon sabar ya, kita balik lagi! 🚀</p>' +
        '<div class="maint-info">' +
          (until > 0 ?
            '<div class="maint-countdown-wrap">' +
              '<div class="maint-countdown-label">⏱️ Selesai Dalam</div>' +
              '<div class="maint-countdown" id="maint-countdown">--:--</div>' +
            '</div>'
          :
            '<div class="maint-manual-note">⏳ Durasi: <b>BELUM DITENTUKAN</b></div>'
          ) +
          '<div class="maint-info-row"><div class="lbl">📋 Alasan</div><div class="val">' + esc(reason) + '</div></div>' +
          '<div class="maint-info-row"><div class="lbl">🕐 Mulai</div><div class="val">' + new Date(startedAt).toLocaleString("id-ID") + '</div></div>' +
        '</div>' +
        '<div class="maint-status"><span>🔄</span> Auto-cek tiap 5 detik</div>' +
        '<button class="maint-retry-btn" id="maint-retry">🚀 Coba Lagi Sekarang</button>' +
        '<div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;margin-top:20px">Powered by Varlinkbio · by Varoo</div>' +
      '</div>' +
    '</div>';

  if(until > 0){
    var updateCountdown = function(){
      var el = document.getElementById("maint-countdown");
      if(!el) return;
      var diff = Math.max(0, until - Date.now());
      var totalSec = Math.floor(diff / 1000);
      var h = Math.floor(totalSec / 3600);
      var m2 = Math.floor((totalSec % 3600) / 60);
      var s = totalSec % 60;
      if(h > 0) el.textContent = h + ":" + String(m2).padStart(2,"0") + ":" + String(s).padStart(2,"0");
      else el.textContent = String(m2).padStart(2,"0") + ":" + String(s).padStart(2,"0");
      if(diff <= 0){ el.textContent = "00:00"; el.style.color = "#22c55e"; setTimeout(function(){ location.reload(); }, 1000); }
    };
    updateCountdown();
    setInterval(updateCountdown, 1000);
  }

  var checkAndReload = async function(){
    try{
      var doc = await FB.db.collection("settings").doc("app").get();
      var data = doc.exists ? doc.data() : {};
      var m2 = data.maintenance || {};
      var isUnlocked = !m2.active || (m2.until && m2.until > 0 && Date.now() >= m2.until);
      if(isUnlocked){
        var status = document.querySelector(".maint-status");
        if(status) status.innerHTML = "✅ <b>Web udah aktif! Reloading...</b>";
        Sound.success();
        setTimeout(function(){ location.reload(); }, 800);
      }
    }catch(e){ console.warn("checkAndReload:", e); }
  };
  checkAndReload();
  setInterval(checkAndReload, 5000);

  var retryBtn = document.getElementById("maint-retry");
  if(retryBtn) retryBtn.addEventListener("click", async function(){
    retryBtn.textContent = "🔄 Checking...";
    retryBtn.disabled = true;
    await checkAndReload();
    setTimeout(function(){ retryBtn.textContent = "🚀 Coba Lagi Sekarang"; retryBtn.disabled = false; }, 1500);
  });
}

var Checklist = {
  ITEMS:[
    { key:"createBio", label:"Bikin bio pertama", hint:"Dashboard → Bikin Bio", icon:"✨" },
    { key:"fillProfile", label:"Isi nama & foto profil", hint:"Editor → Foto Profil", icon:"👤" },
    { key:"add3Links", label:"Tambah minimal 3 link", hint:"Editor → Tombol Link", icon:"🔗" },
    { key:"pickTheme", label:"Pilih tema favorit", hint:"Editor → Tema", icon:"🎨" },
    { key:"saveBio", label:"Simpan & share", hint:"Editor → Simpan", icon:"💾" }
  ],
  _data:null, _loaded:false, _loading:false,

  load:async function(){
    if(this._loading) return;
    this._loading = true;
    this._data = {};
    this._loaded = false;
    if(!Auth.current || !Auth.current.uid){ this._loading = false; return; }
    try{
      var doc = await FB.db.collection("users").doc(Auth.current.uid).get();
      var d = doc.exists ? doc.data() : {};
      this._data = d.checklistProgress || {};
    }catch(e){ this._data = {}; }
    try{
      var list = await Store.list();
      var bioCount = list.length;
      var linkCount = list.reduce(function(s, b){ return s + ((b.links||[]).filter(function(l){ return l.active !== false; }).length); }, 0);
      if(bioCount > 0) this._data.createBio = true;
      if(list.some(function(b){ return b.name && b.profile; })) this._data.fillProfile = true;
      if(linkCount >= 3) this._data.add3Links = true;
      if(list.some(function(b){ return b.theme && b.theme !== "neo-cream"; })) this._data.pickTheme = true;
      if(list.some(function(b){ return b.id && b.updatedAt; })) this._data.saveBio = true;
      try{ await FB.db.collection("users").doc(Auth.current.uid).set({ checklistProgress: this._data }, { merge:true }); }catch(e){}
      this._loaded = true;
    }catch(e){ this._loaded = true; }
    this._loading = false;
  },

  count:function(){
    if(!this._data) return 0;
    var self = this;
    return this.ITEMS.filter(function(it){ return self._data[it.key]; }).length;
  },

  render:function(){
    try{
      if(!this._data) return "";
      var done = this.count();
      var total = this.ITEMS.length;
      var pct = Math.round((done/total)*100);
      if(done === total) return "";
      var html = '<div class="onb-checklist" id="dash-checklist">';
      html += '<div class="onb-checklist-head"><b>' + ico("sparkle") + ' Selesaikan Setup</b><div class="onb-checklist-progress">' + done + '/' + total + '</div></div>';
      html += '<div class="onb-checklist-bar"><div class="onb-checklist-bar-fill" style="width:' + pct + '%"></div></div>';
      html += '<ul class="onb-checklist-list">';
      var self = this;
      this.ITEMS.forEach(function(it){
        html += '<li class="onb-check-item ' + (self._data[it.key] ? "done" : "") + '"><span class="onb-check-box">' + ico("check") + '</span><span class="onb-check-text">' + it.label + '</span><span class="onb-check-hint">' + it.hint + '</span></li>';
      });
      html += '</ul></div>';
      return html;
    }catch(e){ return ""; }
  }
};

  loadMiniChart:async function(){
    try{
      var slot = $("#mini-chart-slot");
      if(!slot) return;
      var list = await Store.list();
      var dailyAgg = {};
      var today = new Date();
      for(var i = 6; i >= 0; i--){
        var d = new Date(today); d.setDate(d.getDate() - i);
        var key = d.toISOString().slice(0,10);
        dailyAgg[key] = { views:0, label: d.toLocaleDateString("id-ID", { weekday:"short" }) };
      }
      list.forEach(function(b){
        var daily = (b.stats && b.stats.daily) || {};
        Object.keys(daily).forEach(function(k){ if(dailyAgg[k]) dailyAgg[k].views += (daily[k].views||0); });
      });
      var vals = Object.keys(dailyAgg).map(function(k){ return dailyAgg[k].views; });
      var max = Math.max.apply(null, vals.concat([1]));
      var keys = Object.keys(dailyAgg);
      var todayKey = new Date().toISOString().slice(0,10);
      var total = vals.reduce(function(s, v){ return s + v; }, 0);
      var html = '<div class="mini-chart-card"><h4>📊 Views 7 Hari (' + total + ')</h4>';
      html += '<div class="mini-chart-bars">';
      keys.forEach(function(k){
        var d = dailyAgg[k];
        var pct = Math.max(4, Math.round((d.views/max)*100));
        var isToday = k === todayKey;
        html += '<div class="mini-chart-bar ' + (isToday ? "today" : "") + '" style="height:' + pct + '%" title="' + d.views + ' views"></div>';
      });
      html += '</div><div class="mini-chart-labels">';
      keys.forEach(function(k){ html += '<span>' + dailyAgg[k].label.slice(0,3) + '</span>'; });
      html += '</div></div>';
      slot.innerHTML = html;
    }catch(e){ console.warn("loadMiniChart:", e); }
  },

/* ============================================================
   14. QR MODAL
   ============================================================ */
async function showQRModal(bio, url){
  try{
    await ensureQRCodeLibrary();
    var canCustom = canDo("qrCustom");
    var colors = [
      { name:"Hitam", hex:"#0a0a0a" },
      { name:"Biru", hex:"#2563eb" },
      { name:"Merah", hex:"#ff2a2a" },
      { name:"Hijau", hex:"#22c55e" },
      { name:"Pink", hex:"#ff69b4" },
      { name:"Ungu", hex:"#a78bfa" },
      { name:"Oranye", hex:"#ff8c00" }
    ];
    var useLogo = bio.profile && canCustom;

    var html = '<button class="close-x" onclick="this.closest(\'.modal-back\').remove()">×</button>';
    html += '<h3>' + ico("qr") + ' QR Code</h3>';
    html += '<p style="font-size:13px;margin-bottom:10px;font-weight:600">Scan untuk buka bio kamu</p>';
    html += '<div style="text-align:center"><div class="qr-box" style="padding:16px;background:#fff;text-align:center"><canvas id="qr-canvas" style="width:220px;height:220px;display:block;margin:0 auto;background:#fff"></canvas></div><div class="qr-url">' + esc(url) + '</div></div>';
    if(canCustom){
      html += '<div style="margin-top:14px">';
      html += '<label style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);display:block;margin-bottom:8px">🎨 Warna QR</label>';
      html += '<div class="qr-custom-grid">';
      colors.forEach(function(c, i){
        html += '<div class="qr-color-opt ' + (i === 0 ? "active" : "") + '" data-color="' + c.hex + '" style="background:' + c.hex + '"></div>';
      });
      html += '</div>';
      html += '<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;font-weight:700;cursor:pointer"><input type="checkbox" id="qr-use-logo" ' + (useLogo ? "checked" : "") + ' style="width:auto;padding:0"/> Tambahkan logo di tengah QR</label>';
      html += '</div>';
    } else {
      html += '<div style="margin-top:14px;background:var(--cream);border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;text-align:center">🔒 <b>QR Custom</b> cuma untuk Ultimate atau beli di Fitur Store.<button class="btn btn-sm btn-yellow" id="qr-upgrade" style="margin-top:8px">Buka Store →</button></div>';
    }
    html += '<button class="btn btn-primary btn-block" id="qr-dl" style="margin-top:14px">' + ico("save") + ' Download PNG</button>';

    var m = openModal(html);
    if(!m) return;

    var qrState = { color:"#0a0a0a", useLogo: !!useLogo };
    var canvasEl = $("#qr-canvas", m);

    var refreshQR = async function(){
      try{
        if(!canvasEl) return;
        if(typeof QRCode === "undefined"){
          var ctx = canvasEl.getContext("2d");
          canvasEl.width = 220; canvasEl.height = 220;
          ctx.fillStyle = "#ff2a2a"; ctx.fillRect(0, 0, 220, 220);
          ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif";
          ctx.textAlign = "center"; ctx.fillText("QR Error", 110, 110);
          return;
        }
        await generateQRCustom(canvasEl, url, {
          color: qrState.color, bg:"#ffffff", size:440,
          logo: qrState.useLogo && bio.profile ? bio.profile : null
        });
      }catch(e){ console.warn("refreshQR:", e); }
    };

    await refreshQR();
    Sound.tada();

    if(canCustom){
      m.querySelectorAll(".qr-color-opt").forEach(function(el){
        el.addEventListener("click", async function(){
          m.querySelectorAll(".qr-color-opt").forEach(function(x){ x.classList.remove("active"); });
          el.classList.add("active");
          qrState.color = el.dataset.color;
          await refreshQR();
        });
      });
      var lc = $("#qr-use-logo", m);
      if(lc) lc.addEventListener("change", async function(e){ qrState.useLogo = e.target.checked; await refreshQR(); });
    } else {
      var ub = $("#qr-upgrade", m);
      if(ub) ub.addEventListener("click", function(){ m.remove(); Router.navigate("/store"); });
    }

    var dl = $("#qr-dl", m);
    if(dl) dl.addEventListener("click", function(){
      try{
        if(!canvasEl){ toast("QR belum ready", "error"); return; }
        canvasEl.toBlob(function(blob){
          if(!blob){ toast("Gagal convert QR", "error"); return; }
          var u = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.download = "varlinkbio-qr-" + (bio.slug || bio.id) + ".png";
          a.href = u;
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
          toast("QR didownload!", "success");
        }, "image/png");
      }catch(e){ toast("Gagal download: " + e.message, "error"); }
    });
  }catch(e){ console.warn("showQRModal:", e); }
}

/* ============================================================

var PageIklan = {
  _timer:null, _countdown:0, _claiming:false,
  open:function(){
    if(!Auth.current){ toast("Login dulu", "error"); return; }
    if(!Iklan.canWatch()){ toast("Max " + IKLAN_MAX_PER_DAY + " iklan/hari. Coba besok!", "error"); return; }
    this._countdown = 30;
    this._claiming = false;
    var m = openModal(
      '<button class="close-x" id="ik-close">×</button>' +
      '<div class="iklan-modal">' +
        '<div class="ik-icon">📺</div>' +
        '<h3>Nonton Iklan</h3>' +
        '<p>Nonton 30 detik, dapat <b>+' + IKLAN_REWARD + ' kredit</b></p>' +
        '<div class="iklan-countdown" id="ik-count">30</div>' +
        '<div class="iklan-progress"><div class="iklan-progress-fill" id="ik-bar"></div></div>' +
        '<div style="font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:14px">📌 Iklan simulasi (placeholder). Integrasi real nanti.</div>' +
        '<div style="background:var(--cream);border:2px dashed var(--ink);border-radius:10px;padding:14px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:10px">[ Placeholder Iklan ]<br><small style="font-size:11px">Nanti diganti dengan iklan real</small></div>' +
        '<button class="btn btn-primary btn-block" id="ik-claim" disabled>Menunggu...</button>' +
      '</div>'
    );
    if(!m) return;
    var closeBtn = $("#ik-close", m);
    var claimBtn = $("#ik-claim", m);
    var countEl = $("#ik-count", m);
    var barEl = $("#ik-bar", m);

    if(closeBtn) closeBtn.addEventListener("click", function(){ PageIklan._stop(); m.remove(); });

    this._timer = setInterval(function(){
      PageIklan._countdown--;
      if(countEl) countEl.textContent = PageIklan._countdown;
      if(barEl) barEl.style.width = ((30 - PageIklan._countdown) / 30 * 100) + "%";
      if(PageIklan._countdown <= 0){
        PageIklan._stop();
        if(claimBtn){
          claimBtn.disabled = false;
          claimBtn.textContent = "✅ Klaim +" + IKLAN_REWARD + " Kredit";
          claimBtn.classList.remove("btn-primary");
          claimBtn.classList.add("btn-green");
        }
      }
    }, 1000);

    if(claimBtn) claimBtn.addEventListener("click", async function(){
      if(PageIklan._countdown > 0) return;
      if(PageIklan._claiming) return;
      PageIklan._claiming = true;
      claimBtn.disabled = true;
      showLoading("Memproses...");
      var ok = await Iklan.complete();
      hideLoading();
      if(ok){
        Sound.tada();
        toast("✅ +" + IKLAN_REWARD + " kredit!", "success");
        m.remove();
        PageIklan._stop();
        var kb = $("#btn-kredit-top");
        if(kb) kb.innerHTML = ico("coins","ic-sm") + " " + (STATE.kredit || 0);
        if(location.hash.indexOf("/store") !== -1) Router.resolve();
      } else {
        toast("Gagal klaim", "error");
        PageIklan._claiming = false;
      }
    });
  },
  _stop:function(){ if(this._timer){ clearInterval(this._timer); this._timer = null; } }
};

          dailyAgg[k].clicks += (daily[k].clicks || 0);

    var maxViews = Math.max.apply(null, Object.keys(dailyAgg).map(function(k){ return dailyAgg[k].views; }).concat([1]));

  loadAnalyticsPro:function(list){
    try{
      var slot = $("#analytics-pro-slot");
      if(!slot) return;

      /* Heatmap per jam (24 jam) */
      var hourly = new Array(24).fill(0);
      var deviceMobile = 0, deviceDesktop = 0, deviceTablet = 0;
      var referrers = {};
      var realtimeCount = 0;
      var now = Date.now();

      list.forEach(function(b){
        var heat = (b.stats && b.stats.hourlyHeatmap) || {};
        Object.keys(heat).forEach(function(h){
          var idx = parseInt(h, 10);
          if(idx >= 0 && idx < 24) hourly[idx] += heat[h];
        });
        var dev = (b.stats && b.stats.devices) || {};
        deviceMobile += dev.mobile || 0;
        deviceDesktop += dev.desktop || 0;
        deviceTablet += dev.tablet || 0;
        var refs = (b.stats && b.stats.referrers) || {};
        Object.keys(refs).forEach(function(r){
          referrers[r] = (referrers[r] || 0) + refs[r];
        });
        var rt = (b.stats && b.stats.realtime) || {};
        Object.keys(rt).forEach(function(k){
          if(now - rt[k] < 5 * 60 * 1000) realtimeCount++;
        });
      });

      var maxHourly = Math.max.apply(null, hourly.concat([1]));
      var heatHTML = "";
      for(var i = 0; i < 24; i++){
        var lvl = hourly[i] === 0 ? 0 : Math.min(4, Math.ceil((hourly[i]/maxHourly) * 4));
        heatHTML += '<div class="heatmap-cell' + (lvl ? ' lvl-' + lvl : '') + '" title="' + i + ':00 — ' + hourly[i] + ' views"></div>';
      }

      var totalDev = deviceMobile + deviceDesktop + deviceTablet;
      var devMobilePct = totalDev ? Math.round((deviceMobile/totalDev)*100) : 0;
      var devDesktopPct = totalDev ? Math.round((deviceDesktop/totalDev)*100) : 0;
      var devTabletPct = totalDev ? Math.round((deviceTablet/totalDev)*100) : 0;

      var refArr = Object.keys(referrers).map(function(r){ return { name:r, count: referrers[r] }; });
      refArr.sort(function(a,b){ return b.count - a.count; });
      var refHTML = "";
      if(refArr.length){
        refArr.slice(0, 5).forEach(function(r){
          refHTML += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1.5px solid var(--cream-2);font-size:12px;font-weight:700"><span>' + esc(r.name) + '</span><span style="font-family:var(--mono);font-weight:900">' + r.count + '</span></div>';
        });
      } else {
        refHTML = '<div style="font-size:12px;font-weight:600;color:var(--ink-soft);text-align:center;padding:10px">Belum ada data</div>';
      }

      var html = '<div class="section-title" style="margin-top:20px">📊 Analytics Pro</div>';
      html += '<div class="analytics-pro-grid">';
      html += '<div class="analytics-card"><h4>' + ico("fire","ic-sm") + ' REALTIME (5 menit)</h4><div class="big-val" style="color:var(--green)">' + realtimeCount + '</div><div class="sub-val">Orang aktif sekarang</div></div>';
      html += '<div class="analytics-card"><h4>' + ico("clock","ic-sm") + ' JAM TERAKTIF</h4><div class="big-val">' + (hourly.indexOf(Math.max.apply(null, hourly))) + ':00</div><div class="sub-val">Jam paling ramai</div></div>';
      html += '<div class="analytics-card"><h4>' + ico("tv","ic-sm") + ' DEVICE</h4><div class="device-bars" style="margin-top:6px">';
      html += '<div class="device-bar-row"><span class="db-label">Mobile</span><div class="db-bar"><div class="db-fill" style="width:' + devMobilePct + '%;background:var(--green)"></div></div><span class="db-pct">' + devMobilePct + '%</span></div>';
      html += '<div class="device-bar-row"><span class="db-label">Desktop</span><div class="db-bar"><div class="db-fill" style="width:' + devDesktopPct + '%;background:var(--blue)"></div></div><span class="db-pct">' + devDesktopPct + '%</span></div>';
      html += '<div class="device-bar-row"><span class="db-label">Tablet</span><div class="db-bar"><div class="db-fill" style="width:' + devTabletPct + '%;background:var(--purple)"></div></div><span class="db-pct">' + devTabletPct + '%</span></div>';
      html += '</div></div>';
      html += '</div>';
      html += '<div class="analytics-card" style="margin-bottom:18px"><h4>' + ico("clock","ic-sm") + ' HEATMAP PER JAM (24 jam)</h4><div class="heatmap-grid">' + heatHTML + '</div>';
      html += '<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:6px"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>';
      html += '<div class="analytics-card" style="margin-bottom:18px"><h4>' + ico("compass","ic-sm") + ' TOP REFERRER</h4>' + refHTML + '</div>';
      html += '<div class="analytics-export-row">';
      html += '<button class="btn btn-primary" id="an-export-csv">' + ico("download") + ' Export CSV</button>';
      html += '<button class="btn btn-yellow" id="an-export-json">' + ico("download") + ' Export JSON</button>';
      html += '<button class="btn" id="an-refresh" style="background:var(--cream)">' + ico("compass") + ' Refresh</button>';
      html += '</div>';

      slot.innerHTML = html;

      var csvBtn = $("#an-export-csv");
      if(csvBtn) csvBtn.addEventListener("click", function(){ PageStats.exportCSV(list); });
      var jsonBtn = $("#an-export-json");
      if(jsonBtn) jsonBtn.addEventListener("click", function(){ PageStats.exportJSON(list); });
      var refBtn = $("#an-refresh");
      if(refBtn) refBtn.addEventListener("click", function(){ PageStats.render(); });
    }catch(e){ console.warn("loadAnalyticsPro:", e); }
  },

  exportCSV:function(list){
    try{
      var rows = [["Bio","Slug","Views","Total Clicks","Link","Link URL","Link Clicks"]];
      list.forEach(function(b){
        var clicks = (b.stats && b.stats.clicks) || {};
        var totalClick = Object.keys(clicks).reduce(function(a, k){ return a + clicks[k]; }, 0);
        if((b.links || []).length){
          b.links.forEach(function(l, i){
            rows.push([
              b.name || "",
              b.slug || b.id || "",
              (b.stats && b.stats.views) || 0,
              totalClick,
              l.label || "",
              l.url || "",
              clicks[i] || 0
            ]);
          });
        } else {
          rows.push([b.name || "", b.slug || b.id || "", (b.stats && b.stats.views) || 0, 0, "", "", 0]);
        }
      });
      var csv = rows.map(function(r){
        return r.map(function(c){
          var s = String(c).replace(/"/g, '""');
          return '"' + s + '"';
        }).join(",");
      }).join("\n");
      var blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "varlinkbio-analytics-" + Date.now() + ".csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("✅ CSV di-export!", "success");
      Sound.tada();
    }catch(e){ toast("Gagal export: " + e.message, "error"); }
  },

  exportJSON:function(list){
    try{
      var data = list.map(function(b){
        return {
          name: b.name,
          slug: b.slug,
          views: (b.stats && b.stats.views) || 0,
          clicks: (b.stats && b.stats.clicks) || {},
          daily: (b.stats && b.stats.daily) || {}
        };
      });
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "varlinkbio-analytics-" + Date.now() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("✅ JSON di-export!", "success");
      Sound.tada();
    }catch(e){ toast("Gagal export: " + e.message, "error"); }
  },

  loadTopLinksStats:function(list){
    try{
      var slot = $("#top-links-slot-stats");
      if(!slot) return;
      var allLinks = [];
      list.forEach(function(b){
        var clicks = (b.stats && b.stats.clicks) || {};
        (b.links || []).forEach(function(l, i){
          if(clicks[i]) allLinks.push({ label: l.label || "Link", url: l.url, count: clicks[i], bioName: b.name });
        });
      });
      allLinks.sort(function(a,b){ return b.count - a.count; });
      var top5 = allLinks.slice(0, 5);
      if(!top5.length){ slot.innerHTML = ""; return; }
      var html = '<div class="chart-wrap"><h4>🔥 Top 5 Link</h4>';
      top5.forEach(function(l, i){
        html += '<div class="link-stat"><div class="ls-l"><div style="font-weight:900;font-size:16px">#' + (i+1) + '</div><div class="ls-info"><b>' + esc(l.label) + '</b><span>' + esc(l.bioName || "") + '</span></div></div><div class="ls-count">' + l.count + '</div></div>';
      });
      html += '</div>';
      slot.innerHTML = html;
    }catch(e){ console.warn("loadTopLinksStats:", e); }
  }
};

  updateEditorMusic:async function(){

      wrap.innerHTML = '<div class="emb-current"><div class="embi-icon">🔇</div><div class="embi-info"><b>Belum ada music</b><span>Tap "Pilih Lagu" buat mulai</span></div></div>';

      }

      if(!m){
        wrap.innerHTML = '<div class="emb-current"><div class="embi-icon">⚠️</div><div class="embi-info"><b>Music gak ditemukan</b><span>Mungkin udah dihapus admin</span></div></div>';

      wrap.innerHTML = '<div class="emb-current"><div class="embi-icon">🔇</div><div class="embi-info"><b>Error</b><span>Gagal load music</span></div></div>';
    }
  },

  openMusicPickerModal:async function(){
    if(!window.MusicLibrary){ toast("Music library belum ke-load", "error"); return; }
    var list = await window.MusicLibrary.list();
    if(!list.length){ toast("Belum ada music. Tunggu admin upload ya!", "info"); return; }

    var currentId = STATE.draft ? STATE.draft.musicId : null;
    var html = '<button class="close-x" onclick="this.closest(\'.modal-back\').remove()">×</button>';
    html += '<h3>🎵 Pilih Music Bio</h3>';
    html += '<p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:12px">Pilih lagu buat bio ini:</p>';
    list.forEach(function(m){
      var selected = m.id === currentId;
      html += '<div class="music-picker-item ' + (selected ? "selected" : "") + '" data-modal-music="' + m.id + '" style="margin-bottom:8px">';
      html += '<div class="mpi-play" data-modal-preview="' + m.id + '">' + ico("play") + '</div>';
      html += '<div class="mpi-info"><div class="mpi-title">' + esc(m.title || "Untitled") + '</div><div class="mpi-artist">' + esc(m.artist || "Unknown") + '</div></div>';
      html += '<button class="mpi-select">' + (selected ? "✓" : "Pilih") + '</button>';
      html += '</div>';
    });

    var modal = openModal(html);
    if(!modal) return;

    var previewAudio = null;
    modal.querySelectorAll("[data-modal-preview]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.dataset.modalPreview;
        var music = list.find(function(x){ return x.id === id; });
        if(!music) return;
        if(previewAudio){ previewAudio.pause(); previewAudio = null; }
        if(el.dataset.playing === "1"){
          el.dataset.playing = "0";
          el.innerHTML = ico("play");
          return;
        }
        previewAudio = new Audio(music.url);
        previewAudio.volume = 0.6;
        previewAudio.play().catch(function(){});
        el.dataset.playing = "1";
        el.innerHTML = ico("pause");
        previewAudio.onended = function(){
          el.dataset.playing = "0";
          el.innerHTML = ico("play");
          previewAudio = null;
        };
      });
    });

    modal.querySelectorAll("[data-modal-music]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.modalMusic;
        if(previewAudio){ previewAudio.pause(); previewAudio = null; }
        if(STATE.draft){ STATE.draft.musicId = id; }
        modal.remove();
        PageEditor.updateEditorMusic();
        toast("✅ Music bio dipilih!", "success");
        Sound.tada();
      });
    });
  },

  openScanQR:async function(){
    try{
      if(typeof Html5Qrcode === "undefined"){ toast("Library Scan QR belum ke-load", "error"); return; }
      var html = '<button class="close-x" onclick="this.closest(\'.modal-back\').remove()">×</button>';
      html += '<div class="scan-qr-modal">';
      html += '<h3>' + ico("scan") + ' Scan QR</h3>';
      html += '<p class="scan-hint">Arahkan kamera ke QR code<br>(WA, IG, atau URL)</p>';
      html += '<div class="scan-preview" id="scan-preview"></div>';
      html += '<div id="scan-result-slot"></div>';
      html += '<button class="btn btn-block" id="scan-cancel">' + ico("x") + ' Batal</button>';
      html += '</div>';
      var m = openModal(html);
      if(!m) return;
      var scanner = new Html5Qrcode("scan-preview");
      var resultHandled = false;
      var onScanSuccess = function(decodedText){
        if(resultHandled) return;
        resultHandled = true;
        var slot = $("#scan-result-slot", m);
        if(slot) slot.innerHTML = '<div class="scan-result">✅ QR: <b>' + esc(decodedText) + '</b></div>';
        Sound.tada();
        var info = extractLinkInfo(decodedText);
        setTimeout(function(){
          try{ scanner.stop(); }catch(e){}
          m.remove();
          if(info){
            STATE.draft.links.push({
              label: info.label, url: info.url, type: info.type,
              color:"", thumb:"", active:true,
              featPosX:50, featPosY:50, featZoom:1, featPadding:10, featRatio:"16:9"
            });
            toast('✅ Link "' + info.label + '" ditambahkan dari QR!', "success");
            PageEditor.renderLinks();
            PageEditor.updatePreview();
          } else { toast("QR gak dikenali sebagai link", "info"); }
        }, 800);
      };
      var onScanError = function(){};
      try{
        await scanner.start({ facingMode: "environment" }, { fps:10, qrbox:{ width:250, height:250 } }, onScanSuccess, onScanError);
      }catch(e){
        console.warn("Scanner start:", e);
        toast("Gagal akses kamera. Cek izin ya.", "error");
        m.remove();
        return;
      }
      var cancelBtn = $("#scan-cancel", m);
      if(cancelBtn) cancelBtn.addEventListener("click", async function(){
        try{ await scanner.stop(); }catch(e){}
        m.remove();
      });

      var observer = new MutationObserver(function(){
        if(!document.body.contains(m)){
          try{ scanner.stop(); }catch(e){}
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList:true });
    }catch(e){ console.warn("openScanQR:", e); toast("Gagal buka scanner", "error"); }
  },
