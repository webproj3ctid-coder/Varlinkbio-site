<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Varlinkbio — Link in Bio Generator</title>
<meta name="theme-color" content="#f0ebe0"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><circle cx='50' cy='50' r='22' fill='%23ffd700' stroke='%23fff' stroke-width='4'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f0ebe0;--cream-2:#e8e2d5;--ink:#0a0a0a;--ink-soft:#2a2a2a;
  --red:#ff2a2a;--yellow:#ffd700;--green:#22c55e;--blue:#2563eb;
  --pink:#ff69b4;--purple:#a78bfa;--white:#fff;--orange:#ff8c00;
  --shadow:5px 5px 0 var(--ink);--shadow-sm:3px 3px 0 var(--ink);
  --border:2.5px solid var(--ink);--radius:10px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{height:100%;font-family:var(--font);color:var(--ink);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{background-color:var(--cream);
  background-image:radial-gradient(circle,#0a0a0a 1.2px,transparent 1.2px),
    radial-gradient(circle,#0a0a0a 1.2px,transparent 1.2px);
  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
  animation:dotsFlow 24s linear infinite;min-height:100vh}
@keyframes dotsFlow{
  from{background-position:0 0,10px 10px}
  to{background-position:400px -400px,410px -390px}
}
#app{min-height:100vh}
body.public-mode{overflow:hidden;height:100vh;height:100dvh}
body.public-mode #app{min-height:0;height:100vh;height:100dvh;overflow:hidden}
.hidden{display:none!important}
a{color:var(--ink);text-decoration:none}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;outline:none;
  transition:transform .1s, box-shadow .1s}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--white);border:var(--border);border-radius:var(--radius);
  padding:12px 14px;outline:none;transition:all .1s;width:100%;font-weight:600}
input:focus,textarea:focus,select:focus{box-shadow:var(--shadow-sm)}
input::placeholder,textarea::placeholder{color:#888;font-weight:500}
textarea{resize:vertical;min-height:80px}

.ic{width:16px;height:16px;display:inline-block;vertical-align:middle;
  stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;
  stroke-linejoin:round;flex-shrink:0}
.ic-sm{width:12px;height:12px}
.ic-lg{width:20px;height:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:var(--radius);font-weight:800;font-size:13.5px;
  white-space:nowrap;background:var(--white);color:var(--ink);
  border:var(--border);box-shadow:var(--shadow-sm);text-transform:uppercase;
  letter-spacing:.3px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--white)}
.btn-yellow{background:var(--yellow)}
.btn-red{background:var(--red);color:var(--white)}
.btn-green{background:var(--green);color:var(--white)}
.btn-blue{background:var(--blue);color:var(--white)}
.btn-pink{background:var(--pink)}
.btn-purple{background:var(--purple)}
.btn-sm{padding:8px 12px;font-size:12px}
.btn-lg{padding:15px 22px;font-size:14px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.card{background:var(--white);border:var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px}

#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;
  flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--white);border:var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:10px 14px;font-weight:700;font-size:13px;
  pointer-events:auto;animation:toastIn .18s ease}
.toast.success{background:var(--green);color:var(--white)}
.toast.error{background:var(--red);color:var(--white)}
.toast.info{background:var(--yellow)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

#loading-overlay{position:fixed;inset:0;background:rgba(240,235,224,.85);z-index:10000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:1px}
.loader{width:40px;height:40px;border:4px solid var(--ink);border-top-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.container{max-width:960px;margin:0 auto;padding:0 18px}

/* ===== TOPBAR (TANPA LOGOUT BUTTON) ===== */
.lt-topbar{position:sticky;top:0;z-index:100;background:var(--white);
  border-bottom:3px solid var(--ink);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.lt-topbar .lt-brand{display:flex;align-items:center;gap:8px;font-weight:900;
  font-size:15px;text-transform:uppercase;letter-spacing:.5px;
  white-space:nowrap;min-width:0;overflow:hidden}
.lt-topbar .lt-brand .lt-logo{width:32px;height:32px;background:var(--ink);
  color:var(--yellow);border-radius:50%;display:grid;place-items:center;
  font-size:15px;font-weight:900;border:2.5px solid var(--ink);
  box-shadow:2px 2px 0 var(--red);flex-shrink:0}
.lt-topbar .lt-actions{display:flex;gap:6px;align-items:center}

.lt-badge{padding:6px 12px;border-radius:999px;font-weight:900;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;border:2.5px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);display:inline-flex;align-items:center;gap:5px;
  cursor:pointer;transition:transform .1s, box-shadow .1s}
.lt-badge:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.lt-badge.dev{background:var(--red);color:#fff}
.lt-badge.pro{background:var(--blue);color:#fff}
.lt-badge.ultimate{background:var(--ink);color:var(--yellow)}
.lt-badge .ic{width:11px;height:11px}

.lt-menu-btn{display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--white);
  border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--red);
  font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  cursor:pointer;transition:transform .1s, box-shadow .1s}
.lt-menu-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--red)}
.lt-menu-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--red)}
.lt-menu-btn .ic{width:16px;height:16px;stroke-width:3}

@media(max-width:640px){
  .lt-menu-btn .label{display:none}
  .lt-menu-btn{padding:8px;width:40px;height:40px;justify-content:center}
  .lt-badge{padding:4px 8px;font-size:10px}
}

/* ===== DRAWER ===== */
.lt-drawer{position:fixed;inset:0;background:rgba(10,10,10,.6);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s}
.lt-drawer.open{opacity:1;pointer-events:auto}
.lt-drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(340px,85vw);
  background:var(--cream);border-left:3px solid var(--ink);
  padding:20px;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.lt-drawer.open .lt-drawer-panel{transform:translateX(0)}
.lt-drawer-panel h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;
  color:var(--ink-soft);margin-bottom:4px;font-weight:800}
.lt-drawer-panel .user-box{background:var(--white);border:var(--border);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:6px}
.lt-drawer-panel .user-box b{display:block;font-size:15px;text-transform:uppercase;
  font-weight:900;letter-spacing:.3px}
.lt-drawer-panel .user-box span{font-size:12px;color:var(--ink-soft);font-weight:600;
  word-break:break-all}
.plan-badge{display:inline-block;padding:3px 10px;font-size:10px;
  font-weight:900;text-transform:uppercase;letter-spacing:1px;border:2px solid var(--ink);
  border-radius:999px;margin-top:6px;background:var(--yellow)}
.plan-badge.pro{background:var(--blue);color:var(--white)}
.plan-badge.ultimate{background:var(--ink);color:var(--yellow)}
.plan-badge.developer{background:var(--red);color:var(--white)}
.lt-drawer-panel .menu-item{background:var(--white);border:var(--border);
  border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;
  gap:10px;font-weight:800;font-size:13.5px;text-transform:uppercase;
  letter-spacing:.3px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.lt-drawer-panel .menu-item:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.lt-drawer-panel .menu-item:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--cream-2)}
::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--cream-2)}

/* ===== LANDING ===== */
.landing{min-height:100vh;display:flex;flex-direction:column;position:relative}
.landing-hero{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:60px 18px 40px;text-align:center;position:relative}
.hero-logo{width:88px;height:88px;border-radius:50%;background:var(--white);
  border:4px solid var(--ink);box-shadow:6px 6px 0 var(--red);
  display:grid;place-items:center;margin-bottom:24px;transform:rotate(-3deg);
  animation:heroFloat 3s ease-in-out infinite}
@keyframes heroFloat{0%,100%{transform:rotate(-3deg) translateY(0)}
  50%{transform:rotate(-3deg) translateY(-8px)}}
.hero-logo .ic{width:44px;height:44px}
.landing h1{font-size:clamp(38px,8vw,68px);font-weight:900;letter-spacing:-1.5px;
  margin-bottom:10px;text-transform:uppercase;line-height:1;
  text-shadow:4px 4px 0 var(--yellow);
  animation:titlePop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes titlePop{from{opacity:0;transform:scale(.8) rotate(-3deg)}
  to{opacity:1;transform:scale(1) rotate(0)}}
.landing p.sub{color:var(--ink);font-size:15px;max-width:460px;margin-bottom:28px;
  font-weight:600;background:var(--white);border:var(--border);padding:10px 16px;
  border-radius:var(--radius);box-shadow:var(--shadow-sm);transform:rotate(-1deg);
  animation:slideUp .7s .1s both}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) rotate(-1deg)}
  to{opacity:1;transform:translateY(0) rotate(-1deg)}}
.cta-row{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;
  animation:slideUp .7s .2s both}
.cta-row .btn{padding:15px;font-size:14px}
.footer-tag{margin-top:28px;color:var(--ink);font-size:12px;font-weight:700;
  background:var(--white);border:var(--border);padding:5px 12px;border-radius:20px}

/* ===== UPDATE ===== */
.update-section{padding:40px 18px 50px;background:var(--white);
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.update-header{text-align:center;margin-bottom:24px}
.update-header h2{font-size:clamp(22px,4.5vw,32px);font-weight:900;
  text-transform:uppercase;letter-spacing:-.3px;display:inline-block;
  background:var(--yellow);border:3px solid var(--ink);padding:6px 18px;
  box-shadow:5px 5px 0 var(--ink);transform:rotate(-1deg)}
.update-header p{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.update-list{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.update-item{background:var(--cream);border:2.5px solid var(--ink);border-radius:12px;
  padding:14px 16px;box-shadow:4px 4px 0 var(--ink);position:relative;
  transition:transform .15s, box-shadow .15s}
.update-item:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.update-item.new::before{content:'NEW';position:absolute;top:-10px;right:-6px;
  background:var(--red);color:#fff;font-size:10px;font-weight:900;
  padding:3px 10px;border:2.5px solid var(--ink);border-radius:999px;
  transform:rotate(8deg);box-shadow:2px 2px 0 var(--ink);
  animation:pulseBadge 1.8s ease-in-out infinite}
@keyframes pulseBadge{0%,100%{transform:rotate(8deg) scale(1)}
  50%{transform:rotate(8deg) scale(1.08)}}
.update-item .u-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;
  flex-wrap:wrap}
.update-item .u-version{background:var(--ink);color:var(--yellow);
  font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:6px;letter-spacing:.5px}
.update-item .u-date{font-size:11.5px;font-weight:700;color:var(--ink-soft);
  font-family:var(--mono)}
.update-item .u-title{font-size:15px;font-weight:900;text-transform:uppercase;
  letter-spacing:.3px;margin-bottom:8px}
.update-item .u-changes{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.update-item .u-changes li{font-size:12.5px;font-weight:600;padding-left:20px;
  position:relative;line-height:1.45;color:var(--ink-soft)}
.update-item .u-changes li::before{content:'▸';position:absolute;left:0;
  font-weight:900;color:var(--ink);font-size:14px}
.update-empty{text-align:center;padding:30px 18px;color:var(--ink-soft);font-weight:600}

/* ===== PARTNER ===== */
.partner-section{padding:40px 18px;background:var(--cream);
  border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
.partner-header{text-align:center;margin-bottom:24px}
.partner-header h2{font-size:clamp(20px,4vw,28px);font-weight:900;
  text-transform:uppercase;letter-spacing:-.3px;display:inline-block;
  background:var(--ink);color:var(--yellow);padding:5px 16px;border-radius:8px}
.partner-header p{margin-top:10px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.partner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;max-width:720px;margin:0 auto}
.partner-card{background:var(--white);border:2.5px solid var(--ink);border-radius:12px;
  padding:14px 10px;text-align:center;box-shadow:3px 3px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-decoration:none;color:var(--ink);transition:transform .15s, box-shadow .15s;
  cursor:pointer;position:relative;overflow:hidden;min-height:120px;justify-content:center}
.partner-card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.partner-card .p-logo{width:44px;height:44px;border-radius:50%;
  border:2.5px solid var(--ink);display:grid;place-items:center;
  overflow:hidden;flex-shrink:0;font-weight:900;font-size:18px;
  color:#fff;background:var(--ink)}
.partner-card .p-logo img{width:100%;height:100%;object-fit:cover}
.partner-card .p-name{font-size:11.5px;font-weight:900;text-transform:uppercase;
  letter-spacing:.3px;line-height:1.2;word-break:break-word}
.partner-card .p-tag{font-size:9.5px;font-weight:700;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.5px;opacity:.75}
.partner-card.collab-cta{background:var(--yellow);border-style:dashed}
.partner-card.collab-cta .p-logo{background:var(--ink);color:var(--yellow);font-size:22px}
.partner-empty{text-align:center;padding:20px;font-weight:600;color:var(--ink-soft)}

/* ===== PRICING ===== */
.pricing-section{padding:40px 18px 60px;background:var(--cream-2);
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.pricing-header{text-align:center;margin-bottom:28px}
.pricing-header h2{font-size:clamp(28px,5vw,40px);font-weight:900;
  text-transform:uppercase;letter-spacing:-.5px;line-height:1.05}
.pricing-header h2 span{background:var(--yellow);border:3px solid var(--ink);
  padding:2px 10px;box-shadow:4px 4px 0 var(--ink);display:inline-block;
  transform:rotate(-1deg);margin-top:6px}
.pricing-header p{margin-top:14px;font-size:14px;font-weight:600}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;max-width:960px;margin:0 auto}
.pricing-card{background:var(--white);border:3px solid var(--ink);border-radius:14px;
  padding:20px;position:relative;box-shadow:6px 6px 0 var(--ink);
  display:flex;flex-direction:column;transition:transform .2s, box-shadow .2s}
.pricing-card:hover{transform:translate(-4px,-4px);box-shadow:10px 10px 0 var(--ink)}
.pricing-card.popular{background:var(--yellow);transform:rotate(-1deg)}
.pricing-card.ultimate-card{background:var(--ink);color:var(--white)}
.pricing-card.ultimate-card .price{color:var(--yellow)}
.pricing-card.ultimate-card .features li::before{color:var(--yellow)}
.pricing-card.ultimate-card .btn{background:var(--yellow);color:var(--ink);
  border-color:var(--white);box-shadow:3px 3px 0 var(--white)}
.pricing-card .pop-badge{position:absolute;top:-14px;right:-8px;background:var(--red);
  color:var(--white);font-size:11px;font-weight:900;padding:4px 10px;
  border:2.5px solid var(--ink);border-radius:999px;text-transform:uppercase;
  letter-spacing:.5px;transform:rotate(8deg);box-shadow:2px 2px 0 var(--ink);
  animation:pulseBadge 1.8s ease-in-out infinite}
.pricing-card .plan-name{font-size:22px;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:4px}
.pricing-card .plan-tagline{font-size:12.5px;font-weight:600;opacity:.75;
  margin-bottom:16px;min-height:32px}
.pricing-card .price{font-size:32px;font-weight:900;line-height:1;letter-spacing:-1px}
.pricing-card .price small{font-size:13px;font-weight:700;opacity:.7;letter-spacing:0}
.pricing-card .features{list-style:none;margin:16px 0 20px;flex:1;padding:0}
.pricing-card .features li{font-size:13px;font-weight:600;padding:5px 0 5px 22px;
  position:relative;line-height:1.4}
.pricing-card .features li::before{content:'✓';position:absolute;left:0;
  font-weight:900;font-size:14px;color:var(--green)}

/* ===== HELP ===== */
.help-page{max-width:720px;margin:0 auto;padding:20px 18px 80px}
.help-hero{text-align:center;padding:24px 0 20px}
.help-hero .hero-icon{width:72px;height:72px;border-radius:50%;
  background:var(--yellow);border:3px solid var(--ink);display:grid;
  place-items:center;margin:0 auto 14px;box-shadow:5px 5px 0 var(--red);
  color:var(--ink);transform:rotate(-3deg);animation:heroFloat 3s ease-in-out infinite}
.help-hero .hero-icon .ic{width:36px;height:36px}
.help-hero h1{font-size:clamp(24px,5vw,32px);font-weight:900;text-transform:uppercase;
  letter-spacing:-.5px;line-height:1.1}
.help-hero p{font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-top:8px;
  max-width:420px;margin-left:auto;margin-right:auto}
.help-search-wrap{max-width:520px;margin:0 auto 20px;position:relative}
.help-search-wrap input{padding-left:44px;font-size:14px;box-shadow:var(--shadow-sm)}
.help-search-wrap .search-icon{position:absolute;left:14px;top:50%;
  transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;
  font-size:14px;font-weight:900}
.help-cats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  margin-bottom:20px;max-width:640px;margin-left:auto;margin-right:auto}
.help-cat{padding:7px 14px;border:2px solid var(--ink);border-radius:999px;
  background:var(--white);font-weight:900;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.5px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);
  transition:transform .1s, box-shadow .1s;display:inline-flex;align-items:center;gap:6px}
.help-cat:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.help-cat.active{background:var(--ink);color:var(--yellow)}
.help-list{display:flex;flex-direction:column;gap:10px}
.help-item{background:var(--white);border:2.5px solid var(--ink);border-radius:12px;
  box-shadow:4px 4px 0 var(--ink);overflow:hidden;transition:box-shadow .15s}
.help-item:hover{box-shadow:5px 5px 0 var(--ink)}
.help-q{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;
  user-select:none;font-weight:800;font-size:14px;line-height:1.4}
.help-q .q-icon{width:26px;height:26px;border-radius:8px;flex-shrink:0;
  background:var(--yellow);border:2px solid var(--ink);display:grid;
  place-items:center;color:var(--ink);font-size:12px;font-weight:900}
.help-q .q-cat{font-size:9.5px;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;background:var(--cream);border:1.5px solid var(--ink);

.logo-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}

.theme-item.locked:hover{transform:none}
.theme-item .label{position:absolute;bottom:0;left:0;right:0;padding:4px;
  background:rgba(10,10,10,.85);font-size:10.5px;font-weight:900;text-align:center;
  color:#fff;text-transform:uppercase;letter-spacing:.3px}
.theme-item .chk{position:absolute;top:5px;right:5px;width:20px;height:20px;
  border-radius:50%;background:var(--yellow);border:2px solid var(--ink);
  display:none;place-items:center;color:var(--ink)}
.theme-item .chk .ic{width:12px;height:12px}
.theme-item.active .chk{display:grid}

.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.opt-item{padding:10px;text-align:center;border:2px solid var(--ink);border-radius:8px;
  background:var(--cream);font-weight:800;font-size:11.5px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.3px;box-shadow:2px 2px 0 var(--ink);
  transition:transform .1s, box-shadow .1s;position:relative}
.opt-item:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.opt-item.active{background:var(--ink);color:var(--yellow)}
.opt-item .opt-preview{width:100%;height:32px;background:var(--white);
  border:1.5px solid var(--ink);border-radius:4px;margin-bottom:6px;
  display:grid;place-items:center;font-size:16px}

.editor-preview{position:sticky;top:70px;align-self:start}
.preview-phone{width:100%;max-width:300px;margin:0 auto;aspect-ratio:9/19;
  border-radius:28px;border:4px solid var(--ink);overflow:hidden;
  background:var(--cream);position:relative;box-shadow:6px 6px 0 var(--ink)}
.preview-phone iframe{width:100%;height:100%;border:none;display:block}
.editor-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}

.qr-box{text-align:center;padding:14px;background:var(--white);border:var(--border);
  border-radius:var(--radius);display:inline-block;margin:10px auto;
  box-shadow:var(--shadow-sm)}
.qr-box canvas{display:block}
.qr-url{font-family:var(--mono);font-size:11.5px;word-break:break-all;
  text-align:center;margin-top:10px;font-weight:600;
  background:var(--cream);padding:8px;border-radius:6px;border:1.5px solid var(--ink)}

.upgrade-box{text-align:center}
.upgrade-box .plan-title{font-size:22px;font-weight:900;text-transform:uppercase;
  margin-bottom:6px}
.upgrade-box .steps{text-align:left;background:var(--cream);border:2px solid var(--ink);
  border-radius:var(--radius);padding:14px;margin-bottom:14px;font-size:13px;
  font-weight:600;line-height:1.6}
.upgrade-box .steps ol{margin-left:18px}
.upgrade-box .steps li{margin-bottom:6px}
.upgrade-box .tako-link{display:inline-flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--white);padding:14px 22px;border-radius:var(--radius);
  font-weight:900;text-transform:uppercase;letter-spacing:.5px;font-size:14px;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--yellow);margin-bottom:12px}
.upgrade-box .tako-link:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--yellow)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;margin-bottom:18px}
.stat-card{background:var(--white);border:var(--border);border-radius:var(--radius);
  padding:14px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card:nth-child(1){background:var(--yellow)}
.stat-card:nth-child(2){background:var(--red);color:var(--white)}
.stat-card:nth-child(3){background:var(--blue);color:var(--white)}
.stat-card:nth-child(4){background:var(--green);color:var(--white)}
.stat-card .sv{font-size:24px;font-weight:900}
.stat-card .sl{font-size:11px;font-weight:800;margin-top:3px;
  text-transform:uppercase;letter-spacing:.5px}
.link-stat{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;background:var(--cream);border:2px solid var(--ink);
  border-radius:var(--radius);margin-bottom:6px;box-shadow:2px 2px 0 var(--ink)}
.link-stat .ls-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.link-stat .ls-info{min-width:0;flex:1}
.link-stat .ls-info b{display:block;font-size:12.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:800}
.link-stat .ls-info span{color:var(--ink-soft);font-size:11px;font-weight:600}
.link-stat .ls-count{font-weight:900;font-size:14px;flex-shrink:0;
  background:var(--ink);color:var(--white);padding:2px 8px;border-radius:6px}

/* ===== DEV PANEL ===== */
.dev-header{background:var(--ink);color:var(--yellow);padding:20px 18px;
  border-bottom:3px solid var(--yellow);position:relative;overflow:hidden}
.dev-header::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border:3px solid var(--yellow);border-radius:50%;opacity:.15;
  animation:pulseRing 4s ease-in-out infinite}
@keyframes pulseRing{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.dev-header h1{font-size:22px;text-transform:uppercase;font-weight:900;
  letter-spacing:1px;display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.dev-header p{font-size:12.5px;color:#fff;font-weight:600;margin-top:4px;opacity:.8;
  position:relative;z-index:1}
.dev-header .back-btn{position:absolute;top:14px;right:14px;z-index:2;
  background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);padding:8px 14px;border-radius:999px;
  font-weight:900;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
  cursor:pointer;transition:transform .1s, box-shadow .1s;
  display:inline-flex;align-items:center;gap:5px}
.dev-header .back-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.dev-header .back-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.dev-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;padding:18px}
.dev-stat{background:var(--white);border:2.5px solid var(--ink);border-radius:var(--radius);
  padding:14px;box-shadow:3px 3px 0 var(--ink);text-align:center;
  transition:transform .15s, box-shadow .15s}
.dev-stat:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.dev-stat .sv{font-size:22px;font-weight:900;color:var(--ink)}
.dev-stat .sl{font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.5px;color:var(--ink-soft);margin-top:3px}
.dev-stat.dev-free{background:var(--cream)}
.dev-stat.dev-pro{background:var(--blue);color:#fff}
.dev-stat.dev-pro .sv,.dev-stat.dev-pro .sl{color:#fff}
.dev-stat.dev-ultimate{background:var(--ink);color:var(--yellow)}
.dev-stat.dev-ultimate .sv,.dev-stat.dev-ultimate .sl{color:var(--yellow)}
.dev-stat.dev-dev{background:var(--red);color:#fff}
.dev-stat.dev-dev .sv,.dev-stat.dev-dev .sl{color:#fff}
.dev-tabs{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
.dev-tab{padding:8px 14px;border:2px solid var(--ink);border-radius:999px;
  background:var(--white);font-weight:900;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.dev-tab.active{background:var(--ink);color:var(--yellow)}
.dev-tab:hover{transform:translate(-1px,-1px)}
.dev-tools{padding:0 18px 14px;display:flex;gap:8px;flex-wrap:wrap}
.dev-tools input{flex:1;min-width:180px;padding:10px 14px;font-size:13px;
  box-shadow:2px 2px 0 var(--ink)}
.dev-tools select{padding:10px;font-size:13px;font-weight:800;
  text-transform:uppercase;box-shadow:2px 2px 0 var(--ink);cursor:pointer;width:auto}
.dev-list{padding:0 18px 60px;display:flex;flex-direction:column;gap:8px}
.dev-item{background:var(--white);border:2.5px solid var(--ink);border-radius:var(--radius);
  padding:12px 14px;box-shadow:3px 3px 0 var(--ink);display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.dev-item .di-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--yellow);border:2px solid var(--ink);display:grid;
  place-items:center;font-weight:900;color:var(--ink);overflow:hidden;font-size:14px}
.dev-item .di-avatar img{width:100%;height:100%;object-fit:cover}
.dev-item .di-info{flex:1;min-width:0}
.dev-item .di-info b{display:block;font-size:13.5px;font-weight:900;
  text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.dev-item .di-info span{font-size:11.5px;color:var(--ink-soft);font-weight:600;
  word-break:break-all}
.dev-item .di-actions{display:flex;gap:5px;flex-wrap:wrap}
.dev-plan-pill{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:.5px;border:2px solid var(--ink);margin-left:6px;
  display:inline-block;vertical-align:middle}
.dev-plan-pill.free{background:var(--cream)}
.dev-plan-pill.pro{background:var(--blue);color:#fff}
.dev-plan-pill.ultimate{background:var(--ink);color:var(--yellow)}
.dev-plan-pill.developer{background:var(--red);color:#fff}

/* DEV MANAGER */
.dev-manager{padding:0 18px 60px}
.dev-manager-head{display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dev-manager-head .mgr-title{font-size:13px;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;background:var(--ink);color:var(--yellow);padding:5px 12px;
  border-radius:6px}
.dev-manager-list{display:flex;flex-direction:column;gap:10px}
.mgr-card{background:var(--white);border:2.5px solid var(--ink);border-radius:var(--radius);
  padding:12px 14px;box-shadow:3px 3px 0 var(--ink)}
.mgr-card .mgr-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.mgr-card .mgr-thumb{width:44px;height:44px;border-radius:8px;flex-shrink:0;
  background:var(--cream);border:2px solid var(--ink);overflow:hidden;
  display:grid;place-items:center;font-weight:900;color:var(--ink);cursor:pointer;
  position:relative}
.mgr-card .mgr-thumb img{width:100%;height:100%;object-fit:cover}
.mgr-card .mgr-fields{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.mgr-card input,.mgr-card textarea{font-size:12.5px;padding:7px 10px;font-weight:600;
  box-shadow:none!important;border:1.5px solid var(--ink)}
.mgr-card textarea{min-height:60px;font-size:12px;font-family:inherit;resize:vertical}
.mgr-card .mgr-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mgr-card .mgr-changes-list{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.mgr-card .mgr-changes-list .change-row{display:flex;gap:6px;align-items:center}
.mgr-card .mgr-changes-list input{flex:1}
.mgr-card .mgr-changes-list .chg-del{width:26px;height:26px;border-radius:6px;
  background:var(--red);color:#fff;border:2px solid var(--ink);display:grid;
  place-items:center;flex-shrink:0;cursor:pointer;box-shadow:1px 1px 0 var(--ink)}
.mgr-empty{text-align:center;padding:30px 18px;color:var(--ink-soft);
  background:var(--white);border:2.5px dashed var(--ink-soft);border-radius:var(--radius);
  font-weight:600}

/* DEV FAVICON PANEL */
.favicon-panel{max-width:640px;margin:0 auto;padding:20px 18px 60px}
.favicon-panel .fp-card{background:var(--white);border:2.5px solid var(--ink);
  border-radius:14px;padding:20px;box-shadow:5px 5px 0 var(--ink);margin-bottom:16px}
.favicon-panel h3{font-size:14px;text-transform:uppercase;font-weight:900;
  letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.favicon-panel p.fp-desc{font-size:12.5px;font-weight:600;color:var(--ink-soft);
  margin-bottom:16px;line-height:1.55}
.favicon-preview-big{display:flex;align-items:center;justify-content:center;
  gap:20px;flex-wrap:wrap;margin-bottom:16px}
.favicon-preview-big .fp-thumb{width:96px;height:96px;border-radius:16px;
  background:var(--cream);border:2.5px solid var(--ink);overflow:hidden;
  display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink);
  cursor:pointer;transition:transform .15s}
.favicon-preview-big .fp-thumb:hover{transform:translate(-2px,-2px)}
.favicon-preview-big .fp-thumb img{width:100%;height:100%;object-fit:cover}
.favicon-preview-big .fp-thumb .ph{font-size:11.5px;font-weight:800;
  color:var(--ink-soft);text-align:center;padding:8px}
.favicon-preview-big .fp-arrow{font-size:22px;font-weight:900;color:var(--ink)}
.favicon-preview-big .fp-tab-mock{width:220px;height:34px;background:var(--white);
  border:2.5px solid var(--ink);border-radius:8px 8px 0 0;display:flex;
  align-items:center;gap:8px;padding:0 12px;box-shadow:3px 3px 0 var(--ink)}
.favicon-preview-big .fp-tab-mock .dot{width:8px;height:8px;border-radius:50%;
  background:var(--red)}
.favicon-preview-big .fp-tab-mock .icon{width:16px;height:16px;border-radius:4px;
  overflow:hidden;flex-shrink:0;background:var(--cream);display:grid;place-items:center}
.favicon-preview-big .fp-tab-mock .icon img{width:100%;height:100%;object-fit:cover}
.favicon-preview-big .fp-tab-mock .title{font-size:11px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.favicon-panel .fp-note{background:var(--yellow);border:2px dashed var(--ink);
  border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;
  margin-top:12px;line-height:1.5}

/* ===== BIO PUBLIK ===== */
.bio-wrap{min-height:100vh;width:100%;position:relative;overflow-x:hidden;
  color:var(--ink);padding:34px 18px 60px;
  display:flex;flex-direction:column;align-items:center;font-weight:700;z-index:2}
.bio-inner{width:100%;max-width:420px;position:relative;z-index:2}
.bio-deco{position:fixed;pointer-events:none;z-index:1}
.bio-deco.d1{width:60px;height:60px;top:8%;left:6%;background:var(--red);
  border:3px solid var(--ink);transform:rotate(-12deg);box-shadow:5px 5px 0 var(--ink);
  animation:deco1 6s ease-in-out infinite}
.bio-deco.d2{width:38px;height:38px;top:16%;right:8%;background:var(--blue);
  border:3px solid var(--ink);border-radius:50%;transform:rotate(20deg);
  box-shadow:4px 4px 0 var(--ink);animation:deco2 7s ease-in-out infinite}
.bio-deco.d3{width:44px;height:44px;bottom:20%;right:6%;background:var(--yellow);
  border:3px solid var(--ink);transform:rotate(15deg);box-shadow:4px 4px 0 var(--ink);
  animation:deco3 8s ease-in-out infinite}
@keyframes deco1{0%,100%{transform:rotate(-12deg) translate(0,0)}
  50%{transform:rotate(-12deg) translate(6px,-8px)}}
@keyframes deco2{0%,100%{transform:rotate(20deg) translate(0,0)}
  50%{transform:rotate(20deg) translate(-6px,8px)}}
@keyframes deco3{0%,100%{transform:rotate(15deg) translate(0,0)}
  50%{transform:rotate(15deg) translate(4px,-6px)}}
.bio-avatar{width:110px;height:110px;border-radius:50%;border:4px solid var(--ink);
  overflow:hidden;background:var(--white);margin:0 auto;
  box-shadow:6px 6px 0 var(--ink);transition:transform .15s, box-shadow .15s}
.bio-avatar img{width:100%;height:100%;object-fit:cover}
.bio-avatar video{width:100%;height:100%;object-fit:cover}
.bio-avatar:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.bio-header{display:flex;flex-direction:column;align-items:center;
  margin-bottom:14px;position:relative}
.bio-title-top{display:inline-block;padding:5px 14px;background:var(--white);
  color:var(--ink);font-size:13px;font-weight:900;text-transform:uppercase;
  letter-spacing:1.5px;border:3px solid var(--ink);transform:rotate(-4deg);
  margin-top:12px;box-shadow:3px 3px 0 var(--ink);z-index:3}
.bio-name{display:inline-block;padding:7px 18px;background:var(--yellow);
  color:var(--ink);font-size:21px;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;border:3px solid var(--ink);transform:rotate(2deg);
  margin-top:-4px;box-shadow:5px 5px 0 var(--ink);text-align:center;max-width:100%;
  word-break:break-word;z-index:2}
.bio-bio{display:inline-block;padding:6px 14px;background:var(--red);color:var(--white);
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  border:3px solid var(--ink);transform:rotate(-2deg);margin-top:-2px;
  box-shadow:4px 4px 0 var(--ink);text-align:center;max-width:100%;
  word-break:break-word;z-index:1}
.bio-plan-badge{display:inline-block;padding:3px 12px;background:var(--ink);
  color:var(--yellow);font-size:10px;font-weight:900;text-transform:uppercase;
  letter-spacing:1.5px;border:2px solid var(--yellow);border-radius:999px;
  margin-top:10px;box-shadow:2px 2px 0 var(--ink)}
.bio-plan-badge.pro{background:var(--blue);color:#fff;border-color:var(--ink)}
.bio-plan-badge.ultimate{background:var(--ink);color:var(--yellow);border-color:var(--yellow)}
.bio-plan-badge.developer{background:var(--red);color:#fff;border-color:var(--ink)}
.bio-logos{display:flex;justify-content:center;align-items:center;gap:10px;
  flex-wrap:wrap;margin-bottom:14px;margin-top:4px}
.bio-logo-item{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);
  background:var(--white);overflow:hidden;display:grid;place-items:center;
  box-shadow:3px 3px 0 var(--ink);transition:transform .15s, box-shadow .15s}
.bio-logo-item img{width:100%;height:100%;object-fit:contain;padding:4px}
.bio-logo-item:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}

/* Banner persegi panjang */
.bio-banner{width:100%;max-width:320px;margin:0 auto 18px;aspect-ratio:16/9;
  border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  box-shadow:6px 6px 0 var(--ink);background:var(--white);position:relative}
.bio-banner img,.bio-banner video{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:480px){.bio-banner{max-width:100%}}

.bio-links{display:flex;flex-direction:column;gap:14px}
.bio-links.layout-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bio-links.layout-grid .bio-link{min-height:80px;padding:12px;font-size:12.5px;
  flex-direction:column;text-align:center;gap:6px}
.bio-links.layout-grid .bio-link .ltext{padding-right:0}
.bio-link{display:flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 18px;border:3px solid var(--ink);border-radius:12px;
  font-weight:900;font-size:14.5px;text-transform:uppercase;letter-spacing:.5px;
  position:relative;transition:transform .12s, box-shadow .12s;
  box-shadow:6px 6px 0 var(--ink);cursor:pointer;min-height:56px;
  background:var(--white);color:var(--ink);animation:linkFadeIn .4s ease both}
@keyframes linkFadeIn{from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}}
.bio-link:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.bio-link:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.bio-link .licon{width:22px;height:22px;display:grid;place-items:center;flex-shrink:0}
.bio-link .ltext{flex:1;text-align:center}
.bio-link.bio-featured{flex-direction:column;align-items:stretch;padding:0;
  overflow:hidden;gap:0;background:var(--white);color:var(--ink);min-height:0}
.bio-link.bio-featured .feat-img{width:100%;height:130px;object-fit:cover;
  border-bottom:3px solid var(--ink);display:block;background:var(--yellow)}
.bio-link.bio-featured .feat-body{padding:12px 14px;text-align:center}
.bio-link.bio-featured .feat-body b{font-size:14.5px;font-weight:900;text-transform:uppercase}
.bio-embed{border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  box-shadow:6px 6px 0 var(--ink);background:var(--white)}
.bio-embed iframe{width:100%;display:block;border:none;aspect-ratio:16/9}
.bio-footer{margin-top:28px;font-size:11px;color:var(--ink);font-weight:800;
  text-transform:uppercase;letter-spacing:1px;background:var(--white);
  border:2px solid var(--ink);padding:6px 12px;border-radius:20px;
  box-shadow:2px 2px 0 var(--ink);display:inline-block}
.bio-footer a{color:var(--ink);font-weight:900;text-decoration:underline}

.bio-wrap.anim-bounce .bio-link:hover{animation:linkBounce .4s ease}
@keyframes linkBounce{0%,100%{transform:translate(-2px,-2px)}
  50%{transform:translate(-2px,-8px)}}
.bio-wrap.anim-shake .bio-link:active{animation:linkShake .3s ease}
@keyframes linkShake{0%,100%{transform:translate(4px,4px)}
  25%{transform:translate(0px,4px)}75%{transform:translate(8px,4px)}}
.bio-wrap.anim-glow .bio-link:hover{box-shadow:8px 8px 0 var(--ink),0 0 24px var(--yellow)}

.theme-neo-cream{background-color:#f0ebe0;
  background-image:radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px),
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px);
  background-size:20px 20px,20px 20px;background-position:0 0,10px 10px;

function generateSlug(text){
  return String(text || "").toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g, "").replace(/\s+/g, "-")
    .replace(/-+/g, "-").replace(/^-|-$/g, "");
}
async function getUniqueSlug(baseSlug, currentBioId=null){
  let slug = baseSlug || `user-${Math.random().toString(36).slice(2,7)}`;
  let isUnique = false, counter = 1, finalSlug = slug;
  while(!isUnique){
    const q = await FB.db.collection("bios").where("slug","==",finalSlug).get();
    let isTaken = false;
    q.forEach(doc => { if(doc.id !== currentBioId) isTaken = true; });
    if(!isTaken) isUnique = true;
    else { counter++; finalSlug = `${slug}-${counter}`; }
  }
  return finalSlug;
}

/* IMAGE COMPRESS */
function compressImage(file, maxSize=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith("image/")){ reject(new Error("Hanya file gambar")); return; }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if(width > maxSize || height > maxSize){
        const ratio = Math.min(maxSize/width, maxSize/height);
        width = Math.round(width*ratio); height = Math.round(height*ratio);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob=>{
        if(!blob){ reject(new Error("Compress gagal")); return; }
        const compressed = new File([blob], file.name.replace(/\.[^.]+$/,".jpg"), { type:"image/jpeg" });
        resolve(compressed);
      }, "image/jpeg", quality);
    };
    img.onerror = ()=>reject(new Error("Gagal baca gambar"));
    img.src = url;
  });
}

async function generateQR(text, canvasEl){
  try{
    await QRCode.toCanvas(canvasEl, text, { width:220, margin:1,
      color:{ dark:"#0a0a0a", light:"#ffffff" }});
    return true;
  }catch(e){ console.error(e); return false; }
}
function contrastText(hex){
  if(!hex) return "#0a0a0a";
  const h=hex.replace("#","");
  if(h.length!==6) return "#0a0a0a";
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.6?"#0a0a0a":"#ffffff";
}

}

const Auth = {
  current: null,
  async init(){
    return new Promise(resolve=>{
      FB.auth.onAuthStateChanged(async user=>{
        if(user){
          let name = user.displayName || (user.email||"").split("@")[0];
          try{
            const doc = await FB.db.collection("users").doc(user.uid).get();
            if(doc.exists && doc.data().name) name = doc.data().name;
            await FB.db.collection("users").doc(user.uid).set({
              emailVerified: user.emailVerified
            }, { merge:true });
          }catch(e){}
          this.current = {
            uid:user.uid, email:user.email, name,
            photo:user.photoURL||"",
            emailVerified: user.emailVerified
          };
        } else { this.current = null; }
        resolve(this.current);
      });
    });
  },
  async register(email,password,name){
    const cred = await FB.auth.createUserWithEmailAndPassword(email,password);
    try{ await cred.user.updateProfile({ displayName:name }); }catch(e){}
    await FB.db.collection("users").doc(cred.user.uid).set({
      name, email, createdAt:Date.now(), plan:"free", emailVerified:false
    },{ merge:true });
    try{ await cred.user.sendEmailVerification(); }catch(e){}
    return cred.user;
  },
  async login(email,password){ return (await FB.auth.signInWithEmailAndPassword(email,password)).user; },
  async loginGoogle(){
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    if(isInAppBrowser()){
      const err = new Error("in-app-browser");
      err.code = "app/in-app-browser";
      throw err;
    }

    const useRedirect = isMobile();

    if(useRedirect){
      await FB.auth.signInWithRedirect(provider);
      return null;
    }

    try{
      const cred = await FB.auth.signInWithPopup(provider);
      await this._ensureUserDoc(cred.user);
      return cred.user;
    }catch(err){
      const fallback = ["auth/popup-blocked","auth/popup-closed-by-user",
        "auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment"];
      if(fallback.includes(err.code)){
        await FB.auth.signInWithRedirect(provider);
        return null;
      }
      throw err;
    }
  },
  async _ensureUserDoc(user){
    if(!user) return;
    try{
      const doc = await FB.db.collection("users").doc(user.uid).get();
      if(!doc.exists){
        await FB.db.collection("users").doc(user.uid).set({
          name: user.displayName || (user.email||"").split("@")[0],
          email: user.email || "", createdAt: Date.now(), plan:"free",
          emailVerified: user.emailVerified || false
        });
      }
    }catch(e){ console.warn("ensureUserDoc:", e); }
  },
  async handleRedirectResult(){
    try{
      const result = await FB.auth.getRedirectResult();
      if(result && result.user){ await this._ensureUserDoc(result.user); return result.user; }
    }catch(err){
      console.warn("getRedirectResult:", err);
      return { __error: err };
    }
    return null;
  },
  async logout(){ await FB.auth.signOut(); this.current = null; },

  /* GANTI NAMA */
  async updateName(newName){
    const user = FB.auth.currentUser;
    if(!user) throw new Error("Not logged in");
    await user.updateProfile({ displayName: newName });
    await FB.db.collection("users").doc(user.uid).set({ name: newName }, { merge:true });
    if(this.current) this.current.name = newName;
    return true;
  },

  /* GANTI PASSWORD */
  async updatePassword(oldPass, newPass){
    const user = FB.auth.currentUser;
    if(!user) throw new Error("Not logged in");
    const credential = firebase.auth.EmailAuthProvider.credential(user.email, oldPass);
    await user.reauthenticateWithCredential(credential);
    await user.updatePassword(newPass);
    return true;
  },

  /* GANTI EMAIL */
  async updateEmail(password, newEmail){
    const user = FB.auth.currentUser;
    if(!user) throw new Error("Not logged in");
    const credential = firebase.auth.EmailAuthProvider.credential(user.email, password);
    await user.reauthenticateWithCredential(credential);
    await user.verifyBeforeUpdateEmail(newEmail);
    await FB.db.collection("users").doc(user.uid).set({ pendingEmail: newEmail }, { merge:true });
    return true;
  },

  errMsg(code){
    const map = {
      "auth/email-already-in-use":"Email sudah terdaftar",
      "auth/invalid-email":"Format email tidak valid",
      "auth/weak-password":"Password terlalu lemah (min 6 karakter)",
      "auth/user-not-found":"Email tidak terdaftar",
      "auth/wrong-password":"Password salah",
      "auth/invalid-credential":"Email atau password salah",
      "auth/invalid-login-credentials":"Email atau password salah",
      "auth/too-many-requests":"Terlalu banyak percobaan. Coba nanti",
      "auth/popup-closed-by-user":"Login dibatalkan",
      "auth/popup-blocked":"Popup diblokir browser",
      "auth/network-request-failed":"Koneksi internet bermasalah",
      "auth/operation-not-allowed":"Provider belum aktif di Firebase",
      "auth/unauthorized-domain":"Domain belum di-whitelist di Firebase",
      "permission-denied":"Akses Firestore ditolak. Cek Firestore Rules."
    };
    return map[code] || ("Error: " + (code||"tidak diketahui"));
  }
};

async function loadUserPlan(){
  if(!Auth.current) { STATE.plan = PLANS.free; return PLANS.free; }
  if(isDev(Auth.current.email)) { STATE.plan = PLANS.developer; STATE.planMeta = null; return PLANS.developer; }
  try{
    const doc = await FB.db.collection("users").doc(Auth.current.uid).get();
    const data = doc.exists ? doc.data() : {};
    let planId = data.plan || "free";
    if(planId !== "free" && data.planExpiry && data.planExpiry < Date.now()) planId = "free";
    STATE.planMeta = data;
    STATE.plan = PLANS[planId] || PLANS.free;
    return STATE.plan;
  }catch(e){ STATE.plan = PLANS.free; return PLANS.free; }
}

    }catch(e){}
    const q = await FB.db.collection("bios").where("slug","==",idOrSlug).limit(1).get();

    if(bio.stats===undefined) bio.stats = { views:0, clicks:{} };

    const {id, ...data} = bio;

    if(sizeKB > 950) throw new Error(`Data terlalu besar (${sizeKB}KB). Kurangi gambar.`);

    if(file.type.startsWith("video/")){
      const sizeKB = Math.round(file.size / 1024);
      if(sizeKB > 500) throw new Error(`Video terlalu besar (${sizeKB}KB). Max 500KB.`);
      return new Promise((res, rej)=>{
        const r = new FileReader();
        r.onload = ()=>res(r.result);
        r.onerror = ()=>rej(new Error("Gagal baca video"));
        r.readAsDataURL(file);
      });
    }
    const compressed = await compressImage(file);
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const dataUrl = reader.result;
        const sizeKB = Math.round((dataUrl.length * 3 / 4) / 1024);
        if(sizeKB > 300) reject(new Error(`Gambar terlalu besar (${sizeKB}KB). Max ~300KB.`));
        else resolve(dataUrl);
      };
      reader.onerror = ()=>reject(new Error("Gagal baca file"));
      reader.readAsDataURL(compressed);

/* =========================================================
   ROUTER
   ========================================================= */
const PROTECTED = ["/dashboard","/editor","/manage","/stats","/dev","/settings","/help"];
const Router = {
  routes:{},
  on(p,h){ this.routes[p]=h; },
  navigate(p){ if(location.hash.slice(1)===p) this.resolve(); else location.hash=p; },
  resolve(){
    document.body.classList.remove("public-mode");
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    document.body.style.height = '';
    const raw = location.hash.slice(1) || "/";
    const path = raw.split("?")[0];
    const query = raw.split("?")[1] || "";
    if(path.startsWith("/u/")) return (this.routes["/u/:id"]||(()=>{}))(path.slice(3));
    if(PROTECTED.includes(path) && !Auth.current) return this.navigate("/login");

    // Cek verifikasi email
    if(PROTECTED.includes(path) && Auth.current && !isDev(Auth.current.email)){
      const user = FB.auth.currentUser;
      const isGoogle = (user?.providerData||[]).some(p => p.providerId === "google.com");
      if(user && !user.emailVerified && !isGoogle && path !== "/help" && path !== "/verify"){
        return this.navigate("/verify");
      }
    }
    (this.routes[path]||this.routes["/404"]||(()=>{}))(query);
  },
  start(){ window.addEventListener("hashchange",()=>this.resolve()); this.resolve(); }
};

/* =========================================================
   LINK TYPES
   ========================================================= */
const LinkTypes = {
  detect(url){
    if(!url) return "classic";
    const u=url.toLowerCase();
    if(u.includes("youtube.com")||u.includes("youtu.be")) return "youtube";
    if(u.includes("spotify.com")) return "spotify";
    if(u.includes("tiktok.com")) return "tiktok";
    if(u.includes("vimeo.com")) return "vimeo";
    if(u.includes("instagram.com")) return "instagram";
    if(u.includes("twitter.com")||u.includes("x.com")) return "twitter";
    if(u.includes("wa.me")||u.includes("whatsapp.com")) return "whatsapp";
    return "classic";
  },
  embed(url){
    if(!url) return null;
    const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if(yt) return `https://www.youtube.com/embed/${yt[1]}`;
    const sp = url.match(/spotify\.com\/(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
    if(sp) return `https://open.spotify.com/embed/${sp[1]}/${sp[2]}`;
    const vm = url.match(/vimeo\.com\/(\d+)/);
    if(vm) return `https://player.vimeo.com/video/${vm[1]}`;
    const tt = url.match(/tiktok\.com\/.*\/video\/(\d+)/);
    if(tt) return `https://www.tiktok.com/embed/v2/${tt[1]}`;
    return null;
  },
  icon(url){
    const t=this.detect(url);
    return {youtube:"youtube",spotify:"music",tiktok:"video",vimeo:"video",
      instagram:"instagram",twitter:"message",whatsapp:"whatsapp",classic:"link"}[t]||"link";
  }
};

function bindTopbar(){
  const open=$("#btn-drawer-open");
  const drawer=$("#lt-drawer");
  if(open && drawer) open.addEventListener("click",()=>drawer.classList.add("open"));
  const close=$("#btn-drawer-close");
  if(close && drawer) close.addEventListener("click",()=>drawer.classList.remove("open"));
  if(drawer) drawer.addEventListener("click",e=>{ if(e.target===drawer) drawer.classList.remove("open"); });
  $$("[data-nav]").forEach(el=>{
    el.addEventListener("click",()=>{ drawer.classList.remove("open"); Router.navigate(el.dataset.nav); });
  });
  const homeBtn=$("#drawer-back-home"); if(homeBtn) homeBtn.addEventListener("click",()=>{ drawer.classList.remove("open"); Router.navigate("/"); });
  const upgradeBtn=$("#drawer-upgrade"); if(upgradeBtn) upgradeBtn.addEventListener("click",()=>{ drawer.classList.remove("open"); showUpgradeModal(); });
  const planBtn=$("#btn-plan-top"); if(planBtn) planBtn.addEventListener("click",()=>showUpgradeModal());
  const devBtn=$("#btn-dev-top"); if(devBtn) devBtn.addEventListener("click",()=>Router.navigate("/dev"));
}

        <div class="recent-item">
          <div class="ri-left">
            ${b.profile?`<img class="ri-avatar" src="${esc(b.profile)}">`:`<div class="ri-avatar">${esc((b.name||"?")[0].toUpperCase())}</div>`}

            <button class="icon-btn danger" onclick="PageDashboard.remove('${b.id}')">${ico('trash')}</button>
          </div>
        </div>`;
      }).join("");
    }catch(e){ console.error(e); wrap.innerHTML=`<div class="empty-state"><p>Gagal memuat.</p></div>`; }
  },
  async edit(id){ STATE.currentEdit=id; STATE.draft=await Store.get(id); if(!STATE.draft){toast("Tidak ditemukan","error");return;} Router.navigate("/editor"); },
  async remove(id){ if(!confirm("Yakin mau hapus?")) return; showLoading("Menghapus..."); await Store.remove(id); hideLoading(); toast("Terhapus","success"); this.loadRecent(); },
  async qr(id){
    const bio = await Store.get(id);
    const identifier = bio?.slug || id;
    const url=`${location.origin}${location.pathname}#/u/${identifier}`;
    const m=openModal(`<button class="close-x" onclick="this.closest('.modal-back').remove()">×</button><h3>${ico('qr')} QR Code</h3><p style="font-size:13px;margin-bottom:10px;font-weight:600">Scan untuk buka</p><div style="text-align:center"><div class="qr-box"><canvas id="qr-canvas"></canvas></div><div class="qr-url">${esc(url)}</div></div><button class="btn btn-primary btn-block" id="qr-dl" style="margin-top:14px">${ico('save')} Download PNG</button>`);
    await generateQR(url, $("#qr-canvas",m));
    $("#qr-dl",m).addEventListener("click",()=>{
      const c=$("#qr-canvas",m);
      const a=document.createElement("a");
      a.download=`varlinkbio-qr-${identifier}.png`;
      a.href=c.toDataURL("image/png");
      a.click();
    });
  }
};

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <div class="section-title" style="margin:0">Semua Bio</div>
          <button class="btn btn-primary btn-sm" id="btn-new">${ico('plus')} Baru</button>
        </div>
        <div id="list" class="recent-list"></div>
      </div>`;
    bindTopbar();
    $("#btn-new").addEventListener("click", async ()=>{
      const count = await Store.count();
      if(!isUnlimited(STATE.plan.features.maxBios) && count >= STATE.plan.features.maxBios){
        toast(`Plan ${STATE.plan.name} max ${STATE.plan.features.maxBios} bio. Upgrade dulu!`,"error");
        showUpgradeModal(); return;
      }
      STATE.currentEdit=null; STATE.draft=PageEditor.newDraft(); Router.navigate("/editor");
    });
    await this.load();
  },
  async load(){
    const wrap=$("#list");
    try{
      const list=await Store.list();
      if(!list.length){
        wrap.innerHTML=`<div class="empty-state"><div class="ei">${ico('folder')}</div><p>Belum ada.</p></div>`;
        return;
      }
      wrap.innerHTML=list.map(b=>{
        const bioJson = JSON.stringify(b).replace(/"/g,'&quot;').replace(/'/g,"&#39;");
        return `
        <div class="recent-item">
          <div class="ri-left">
            ${b.profile?`<img class="ri-avatar" src="${esc(b.profile)}">`:`<div class="ri-avatar">${esc((b.name||"?")[0].toUpperCase())}</div>`}
            <div class="ri-info"><b>${esc(b.name||"Tanpa nama")}</b><span>#${esc(b.slug||b.id)} · ${b.stats?.views||0} views${b.lock?" · 🔒":""}</span></div>
          </div>
          <div class="ri-actions">
            <button class="icon-btn" onclick='copyLink(${bioJson})'>${ico('copy')}</button>
            <button class="icon-btn" onclick="PageDashboard.qr('${b.id}')">${ico('qr')}</button>
            <button class="icon-btn" onclick="window.open('${location.pathname}#/u/${b.slug||b.id}','_blank')">${ico('eye')}</button>
            <button class="icon-btn" onclick="PageManage.edit('${b.id}')">${ico('edit')}</button>
            <button class="icon-btn danger" onclick="PageManage.remove('${b.id}')">${ico('trash')}</button>
          </div>
        </div>`;
      }).join("");
    }catch(e){ console.error(e); wrap.innerHTML=`<div class="empty-state"><p>Gagal memuat.</p></div>`; }
  },
  async edit(id){ STATE.currentEdit=id; STATE.draft=await Store.get(id); if(!STATE.draft){toast("Tidak ditemukan","error");return;} Router.navigate("/editor"); },
  async remove(id){ if(!confirm("Hapus link-in-bio ini?")) return; showLoading("Menghapus..."); await Store.remove(id); hideLoading(); toast("Terhapus","success"); this.load(); }
};

const PageStats = {
  async render(){
    if(!Auth.current) return Router.navigate("/login");
    if(!STATE.plan) await loadUserPlan();

    if(!canDo("analytics")){
      $("#app").innerHTML = `
        ${renderTopbar()}
        <div class="container" style="padding-top:40px;padding-bottom:60px">
          <div class="empty-state">
            <div class="ei">${ico('lock')}</div>
            <p style="font-size:15px;margin-bottom:8px">Analytics cuma untuk plan Pro+</p>
            <p style="font-size:12.5px;font-weight:600;margin-bottom:20px">Upgrade sekarang untuk lihat statistik views & klik</p>
            <button class="btn btn-primary" id="btn-up">${ico('crown')} Upgrade</button>
          </div>
        </div>`;
      bindTopbar();
      $("#btn-up").addEventListener("click",()=>showUpgradeModal());
      return;
    }

    const list=await Store.list();
    const totalViews=list.reduce((s,b)=>s+(b.stats?.views||0),0);
    const totalClicks=list.reduce((s,b)=>{
      const c=b.stats?.clicks||{};
      return s+Object.values(c).reduce((x,y)=>x+y,0);
    },0);

    $("#app").innerHTML = `
      ${renderTopbar()}
      <div class="container" style="padding-top:20px;padding-bottom:60px">
        <div class="stats-grid">
          <div class="stat-card"><div class="sv">${list.length}</div><div class="sl">Total Bio</div></div>
          <div class="stat-card"><div class="sv">${totalViews}</div><div class="sl">Views</div></div>
          <div class="stat-card"><div class="sv">${totalClicks}</div><div class="sl">Klik</div></div>
          <div class="stat-card"><div class="sv">${totalViews?((totalClicks/totalViews)*100).toFixed(1):0}%</div><div class="sl">CTR</div></div>
        </div>
        <div id="stats-list"></div>
      </div>`;
    bindTopbar();

    const wrap=$("#stats-list");
    if(!list.length){ wrap.innerHTML=`<div class="empty-state"><p>Belum ada data.</p></div>`; return; }
    wrap.innerHTML=list.map(b=>{
      const clicks=b.stats?.clicks||{};
      const totalClick=Object.values(clicks).reduce((a,c)=>a+c,0);
      const topLinks=(b.links||[]).map((l,i)=>`
        <div class="link-stat">
          <div class="ls-l">${ico(LinkTypes.icon(l.url))}<div class="ls-info"><b>${esc(l.label||"Link")}</b><span>${esc(l.url)}</span></div></div>
          <div class="ls-count">${clicks[i]||0}</div>
        </div>`).join("");
      return `
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">
            <div><b style="font-size:14px;text-transform:uppercase">${esc(b.name||"Tanpa nama")}</b><div style="font-size:11.5px;margin-top:2px;font-weight:600">#${esc(b.slug||b.id)} · ${b.stats?.views||0} views · ${totalClick} klik</div></div>
            <button class="btn btn-sm" onclick="window.open('${location.pathname}#/u/${b.slug||b.id}','_blank')">${ico('eye')} Lihat</button>
          </div>
          ${topLinks||`<p style="font-size:12.5px;font-weight:600">Belum ada link.</p>`}
        </div>`;
    }).join("");
  }
};

/* =========================================================
   PAGE: SETTINGS ACCOUNT
   ========================================================= */
const PageSettings = {
  async render(){
    if(!Auth.current) return Router.navigate("/login");
    const user = FB.auth.currentUser;
    if(!user) return Router.navigate("/login");

    const u = Auth.current;
    const meta = STATE.planMeta || {};
    const isGoogle = (user.providerData||[]).some(p => p.providerId === "google.com");
    const created = meta.createdAt ? new Date(meta.createdAt).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}) : "—";
    const initial = (u.name||u.email||"?")[0].toUpperCase();

    $("#app").innerHTML = `
      ${renderTopbar()}
      <div class="settings-page">
        <div class="settings-hero">
          <div class="avatar-big">${initial}</div>
          <h1>${esc(u.name||"User")}</h1>
          <p>${esc(u.email||"")}</p>
        </div>

        <div class="settings-section">
          <h3>${ico('user')} Info Akun</h3>
          <div class="info-row"><span class="lbl">Email</span><span class="val">${esc(u.email||"—")}</span></div>
          <div class="info-row"><span class="lbl">Status Email</span><span class="val">
            ${isGoogle ? "🔵 Google Account" : (user.emailVerified ? "✅ Terverifikasi" : "⚠️ Belum")}
          </span></div>
          <div class="info-row"><span class="lbl">Plan</span><span class="val">${STATE.plan?.name || "Free"}</span></div>
          <div class="info-row"><span class="lbl">Login via</span><span class="val">${isGoogle ? "Google" : "Email & Password"}</span></div>
          <div class="info-row"><span class="lbl">Member sejak</span><span class="val">${created}</span></div>
        </div>

        <div class="settings-section">
          <h3>${ico('edit')} Ganti Nama</h3>
          <div id="name-msg"></div>
          <div class="field">
            <label>Nama Baru</label>
            <input type="text" id="set-name" maxlength="40" value="${esc(u.name)}" placeholder="Nama baru..."/>
          </div>
          <button class="btn btn-primary btn-block" id="btn-save-name" style="margin-top:8px">${ico('save')} Simpan Nama</button>
        </div>

        ${!isGoogle ? `
        <div class="settings-section">
          <h3>${ico('lock')} Ganti Password</h3>
          <div id="pass-msg"></div>
          <div class="field"><label>Password Lama</label><input type="password" id="set-oldpass" placeholder="••••••••"/></div>
          <div class="field"><label>Password Baru</label><input type="password" id="set-newpass" placeholder="Min 6 karakter"/></div>
          <div class="field"><label>Konfirmasi Password Baru</label><input type="password" id="set-newpass2" placeholder="Ulangi password baru"/></div>
          <button class="btn btn-primary btn-block" id="btn-save-pass" style="margin-top:8px">${ico('lock')} Ganti Password</button>
          <div class="hint">Setelah ganti, kamu tetap login di device ini.</div>
        </div>

        <div class="settings-section">
          <h3>${ico('mail')} Ganti Email</h3>
          <div id="email-msg"></div>
          <div class="field"><label>Password (verifikasi)</label><input type="password" id="set-emailpass" placeholder="••••••••"/></div>
          <div class="field"><label>Email Baru</label><input type="email" id="set-newemail" placeholder="emailbaru@mail.com"/></div>
          <button class="btn btn-primary btn-block" id="btn-save-email" style="margin-top:8px">${ico('mail')} Ganti Email</button>
          <div class="hint">Kamu akan menerima email verifikasi di <b>email baru</b>. Klik link untuk menyelesaikan.</div>
        </div>
        ` : `
        <div class="settings-section">
          <h3>${ico('lock')} Password</h3>
          <p style="font-size:13px;font-weight:600;color:var(--ink-soft);line-height:1.6">
            Kamu login dengan <b>Google</b>. Untuk ganti password, buka
            <a href="https://myaccount.google.com/security" target="_blank" style="text-decoration:underline;font-weight:900">Akun Google kamu</a>.
          </p>
        </div>
        `}

        <div class="settings-section danger">
          <h3>${ico('logout')} Keluar Akun</h3>
          <p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);line-height:1.5;margin-bottom:12px">
            Kamu akan keluar dari device ini. Login ulang kapan saja pakai email & password atau Google.
          </p>
          <button class="btn btn-red btn-block" id="btn-logout-here">${ico('logout')} Logout dari Device Ini</button>
        </div>
      </div>`;

    bindTopbar();

    /* GANTI NAMA */
    $("#btn-save-name").addEventListener("click", async ()=>{
      const newName = $("#set-name").value.trim();
      if(!newName || newName.length < 2){
        $("#name-msg").innerHTML = `<div class="err-box">Nama minimal 2 karakter</div>`; return;
      }
      if(newName === u.name){
        $("#name-msg").innerHTML = `<div class="err-box">Nama sama dengan yang sekarang</div>`; return;
      }
      showLoading("Menyimpan...");
      try{
        await Auth.updateName(newName);
        await Auth.init();
        hideLoading(); toast("Nama berhasil diubah!","success");
        this.render();
      }catch(e){ hideLoading(); $("#name-msg").innerHTML = `<div class="err-box">Gagal: ${esc(e.message)}</div>`; }
    });

    /* GANTI PASSWORD */
    const btnPass = $("#btn-save-pass");
    if(btnPass) btnPass.addEventListener("click", async ()=>{
      const oldPass = $("#set-oldpass").value, newPass = $("#set-newpass").value, newPass2 = $("#set-newpass2").value;
      if(!oldPass || !newPass || !newPass2){ $("#pass-msg").innerHTML = `<div class="err-box">Isi semua field</div>`; return; }
      if(newPass.length < 6){ $("#pass-msg").innerHTML = `<div class="err-box">Password baru minimal 6 karakter</div>`; return; }
      if(newPass !== newPass2){ $("#pass-msg").innerHTML = `<div class="err-box">Konfirmasi password tidak sama</div>`; return; }
      if(newPass === oldPass){ $("#pass-msg").innerHTML = `<div class="err-box">Password baru sama dengan yang lama</div>`; return; }
      showLoading("Verifikasi & ganti password...");
      try{
        await Auth.updatePassword(oldPass, newPass);
        hideLoading();
        $("#set-oldpass").value = ""; $("#set-newpass").value = ""; $("#set-newpass2").value = "";
        $("#pass-msg").innerHTML = `<div class="ok-box">✅ Password berhasil diubah!</div>`;
        toast("Password diubah","success");
      }catch(e){
        hideLoading();
        let msg = e.message || e.code || "Gagal";
        if(e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Password lama salah";
        else if(e.code === "auth/weak-password") msg = "Password baru terlalu lemah";
        else if(e.code === "auth/requires-recent-login") msg = "Sesi sudah lama. Logout lalu login ulang.";
        $("#pass-msg").innerHTML = `<div class="err-box">${esc(msg)}</div>`;
      }
    });

    /* GANTI EMAIL */
    const btnEmail = $("#btn-save-email");
    if(btnEmail) btnEmail.addEventListener("click", async ()=>{
      const pass = $("#set-emailpass").value, newEmail = $("#set-newemail").value.trim();
      if(!pass || !newEmail){ $("#email-msg").innerHTML = `<div class="err-box">Isi semua field</div>`; return; }
      if(!newEmail.includes("@") || !newEmail.includes(".")){ $("#email-msg").innerHTML = `<div class="err-box">Format email tidak valid</div>`; return; }
      if(newEmail === u.email){ $("#email-msg").innerHTML = `<div class="err-box">Email sama dengan yang sekarang</div>`; return; }
      if(!confirm(`Ganti email ke ${newEmail}?\n\nEmail lama tetap aktif sampai kamu verifikasi email baru.`)) return;
      showLoading("Memproses...");
      try{
        await Auth.updateEmail(pass, newEmail);
        hideLoading();
        $("#set-emailpass").value = ""; $("#set-newemail").value = "";
        $("#email-msg").innerHTML = `<div class="ok-box">✅ Cek email <b>${esc(newEmail)}</b> — klik link verifikasi untuk selesaikan.</div>`;
        toast("Email verifikasi terkirim!","success");
      }catch(e){
        hideLoading();
        let msg = e.message || e.code || "Gagal";
        if(e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Password salah";
        else if(e.code === "auth/email-already-in-use") msg = "Email sudah dipakai akun lain";
        else if(e.code === "auth/invalid-email") msg = "Format email tidak valid";
        else if(e.code === "auth/requires-recent-login") msg = "Sesi sudah lama. Logout lalu login ulang.";
        $("#email-msg").innerHTML = `<div class="err-box">${esc(msg)}</div>`;
      }
    });

    /* LOGOUT */
    $("#btn-logout-here").addEventListener("click", async ()=>{
      if(!confirm("Logout dari device ini?")) return;
      await Auth.logout();
      toast("Logout berhasil","info");
      Router.navigate("/");
    });
  }
};

const PageHelp = {
  state: { cat:"all", search:"" },
  render(){
    if(!Auth.current) return Router.navigate("/login");
    $("#app").innerHTML = `
      ${renderTopbar()}
      <div class="help-page">
        <div class="help-hero">
          <div class="hero-icon">${ico('help')}</div>
          <h1>Bantuan & FAQ</h1>
          <p>Pertanyaan umum seputar Varlinkbio. Gak nemu? Chat admin aja!</p>
        </div>
        <div class="help-search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="help-search" placeholder="Cari bantuan..." autocomplete="off"/>
        </div>
        <div class="help-cats" id="help-cats"></div>
        <div class="help-list" id="help-list"></div>
        <div class="help-cta">
          <h3>Masih bingung?</h3>
          <p>Kalau pertanyaan kamu gak ada di sini, langsung chat admin aja!</p>
          <a href="https://wa.me/${ADMIN_WA}?text=${encodeURIComponent('Halo admin Varlinkbio, saya butuh bantuan.')}"
             target="_blank" class="btn">${ico('whatsapp')} Chat Admin</a>
        </div>
      </div>`;

    bindTopbar();
    $("#help-cats").innerHTML = FAQ_CATS.map(c=>`
      <div class="help-cat ${this.state.cat===c.id?"active":""}" data-cat="${c.id}">
        ${c.icon} ${c.label}
      </div>`).join("");
    $$("#help-cats .help-cat").forEach(el=>{
      el.addEventListener("click",()=>{
        this.state.cat = el.dataset.cat;
        $$("#help-cats .help-cat").forEach(x=>x.classList.toggle("active", x.dataset.cat === this.state.cat));
        this.renderList();
      });
    });
    $("#help-search").addEventListener("input", e=>{
      this.state.search = e.target.value.toLowerCase().trim();
      this.renderList();
    });
    this.renderList();
  },
  renderList(){
    const el = $("#help-list");
    let list = FAQ_DATA;
    if(this.state.cat !== "all") list = list.filter(f => f.cat === this.state.cat);
    if(this.state.search){
      const q = this.state.search;
      list = list.filter(f =>
        f.q.toLowerCase().includes(q) ||
        f.a.toLowerCase().replace(/<[^>]+>/g," ").includes(q)
      );
    }
    if(!list.length){
      el.innerHTML = `<div class="help-empty">🔍 Gak ada hasil untuk "${esc(this.state.search)}". Coba kata kunci lain atau chat admin.</div>`;
      return;
    }
    const catLabel = (cid) => (FAQ_CATS.find(c=>c.id===cid) || {}).label || cid;
    el.innerHTML = list.map((f,i)=>`
      <div class="help-item" data-idx="${i}">
        <div class="help-q">
          <span class="q-icon">?</span>
          <span style="flex:1">${esc(f.q)}</span>
          <span class="q-cat">${esc(catLabel(f.cat))}</span>
          <span class="q-arrow">▼</span>
        </div>
        <div class="help-a">${f.a}</div>
      </div>`).join("");
    $$("#help-list .help-item").forEach(item=>{
      item.querySelector(".help-q").addEventListener("click", ()=>{
        item.classList.toggle("open");
      });
    });
  }
};

        if(["youtube","spotify","vimeo","tiktok"].includes(t) && !canEmbed){ toast("Embed khusus Pro+","error"); showUpgradeModal(); return; }
        STATE.draft.links.push({label:"Link Baru",url:"https://",type:t,color:"",thumb:""});
        this.renderLinks(); this.updatePreview();
        m.remove();
      });

  renderLinks(){
    const wrap=$("#links-list");
    const links=STATE.draft.links || [];
    const canFeatured = canDo("featuredLink");
    const NEO_COLORS = ["red","yellow","green","blue","pink","purple","white"];
    const NEO_HEX = { red:"#ff2a2a", yellow:"#ffd700", green:"#22c55e", blue:"#2563eb", pink:"#ff69b4", purple:"#a78bfa", white:"#ffffff" };
    if(!links.length){ wrap.innerHTML=`<div style="font-size:12.5px;text-align:center;padding:6px;font-weight:600">Belum ada link.</div>`; return; }
    wrap.innerHTML=links.map((l,i)=>{
      const autoColor = NEO_COLORS[i % NEO_COLORS.length];
      const curColor = l.color || NEO_HEX[autoColor];
      return `
      <div class="link-row" draggable="true" data-i="${i}">
        <span class="drag">${ico('grip')}</span>
        <div class="link-thumb">${l.thumb?`<img src="${esc(l.thumb)}">`:ico(LinkTypes.icon(l.url))}</div>
        <div class="link-fields">
          <input type="text" placeholder="Label" value="${esc(l.label)}" data-field="label" data-i="${i}"/>
          <input type="text" placeholder="https://..." value="${esc(l.url)}" data-field="url" data-i="${i}"/>
          ${canFeatured?`<button class="thumb-btn" data-thumb="${i}">${ico('image')} ${l.thumb?'Ganti':'Upload'} Gambar</button>`:''}
        </div>
        <input type="color" class="link-color-pick" data-color="${i}" value="${curColor}"/>
        <button class="del" data-del="${i}">${ico('x')}</button>
      </div>`;
    }).join("");

    wrap.querySelectorAll("input[data-field]").forEach(inp=>{
      inp.addEventListener("input",e=>{
        const i=+e.target.dataset.i, f=e.target.dataset.field;
        STATE.draft.links[i][f]=e.target.value;
        if(f==="url") STATE.draft.links[i].type=LinkTypes.detect(e.target.value);
        this.updatePreview();
      });
    });
    wrap.querySelectorAll(".del").forEach(b=>{
      b.addEventListener("click",e=>{
        const i=+e.currentTarget.dataset.del;
        STATE.draft.links.splice(i,1);
        this.renderLinks(); this.updatePreview();
      });
    });
    wrap.querySelectorAll("[data-thumb]").forEach(b=>{
      b.addEventListener("click",e=>{
        const i=+e.currentTarget.dataset.thumb;
        const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
        inp.onchange=async()=>{
          const f=inp.files[0]; if(!f) return;
          showLoading("Upload gambar...");
          try{
            const url=await Store.upload(f,"thumb");
            STATE.draft.links[i].thumb=url;
            hideLoading(); toast("Gambar diupdate","success");
            this.renderLinks(); this.updatePreview();
          }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
        };
        inp.click();
      });
    });
    wrap.querySelectorAll("[data-color]").forEach(b=>{
      b.addEventListener("input",e=>{
        const i=+e.currentTarget.dataset.color;
        STATE.draft.links[i].color=e.target.value;
        this.updatePreview();
      });
    });

    let dragIdx=null;
    wrap.querySelectorAll(".link-row").forEach(row=>{
      row.addEventListener("dragstart",e=>{ dragIdx=+row.dataset.i; row.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
      row.addEventListener("dragend",()=>{ row.classList.remove("dragging"); wrap.querySelectorAll(".link-row").forEach(r=>r.classList.remove("drag-over")); });
      row.addEventListener("dragover",e=>{ e.preventDefault(); row.classList.add("drag-over"); });
      row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));
      row.addEventListener("drop",e=>{
        e.preventDefault();
        const dropIdx=+row.dataset.i;
        if(dragIdx===null||dragIdx===dropIdx) return;
        const arr=STATE.draft.links;
        const [moved]=arr.splice(dragIdx,1);
        arr.splice(dropIdx,0,moved);
        dragIdx=null;
        this.renderLinks(); this.updatePreview();
      });
    });
  },

  renderThemeGrid(){
    const themes=[
      {id:"neo-cream",label:"Cream",css:"#f0ebe0"},
      {id:"neo-dark",label:"Dark",css:"#0a0a0a"},
      {id:"neo-blue",label:"Blue",css:"#2563eb"},
      {id:"neo-pink",label:"Pink",css:"#ff69b4"},
      {id:"neo-green",label:"Green",css:"#22c55e"},
      {id:"neo-purple",label:"Purple",css:"#a78bfa"}
    ];
    const cur=STATE.draft.theme;
    $("#theme-grid").innerHTML=themes.map(t=>{
      const allowed = themeAllowed(t.id);
      return `
      <div class="theme-item ${cur===t.id?"active":""} ${allowed?"":"locked"}" data-t="${t.id}" style="background:${t.css}">
        <div class="chk">${ico('check')}</div><div class="label">${t.label}</div>
      </div>`;
    }).join("");
    $$("#theme-grid .theme-item").forEach(el=>{
      el.addEventListener("click",()=>{
        const tid = el.dataset.t;
        if(!themeAllowed(tid)){ toast("Tema ini khusus Pro+","error"); showUpgradeModal(); return; }
        STATE.draft.theme=tid;
        $$("#theme-grid .theme-item").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        this.updatePreview();
      });
    });
  },

  updatePreview(){
    const frame=$("#prev-frame"); if(!frame) return;
    frame.srcdoc=PagePublic.buildHTML(STATE.draft,{preview:true});
  },

  async save(){
    if(!STATE.draft.name?.trim()){ toast("Nama tidak boleh kosong","error"); return; }
    const plan = STATE.plan;
    if(!isUnlimited(plan.features.maxLinks) && STATE.draft.links.length > plan.features.maxLinks){
      toast(`Plan ${plan.name} max ${plan.features.maxLinks} tombol. Upgrade!`,"error");
      showUpgradeModal(); return;
    }
    showLoading("Menyimpan...");
    try{
      const saved=await Store.save({...STATE.draft});
      STATE.draft=saved; STATE.currentEdit=saved.id;
      hideLoading();
      toast("Tersimpan!","success");
      this.render();
      setTimeout(()=>showShareModal(saved), 300);
    }catch(e){ console.error(e); hideLoading(); toast("Gagal: "+e.message,"error"); }
  }
};

  async loadData(){
    try{
      const usersSnap = await FB.db.collection("users").get();
      const biosSnap = await FB.db.collection("bios").get();
