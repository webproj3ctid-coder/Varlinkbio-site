              <div class="mgr-card">
                <div class="mgr-row">
                  <div class="mgr-fields">
                    <input type="text" value="${esc(u.version||"")}" data-u-field="version" data-u-id="${u.id}" placeholder="Version (v26.1)"/>
                    <input type="text" value="${esc(u.date||"")}" data-u-field="date" data-u-id="${u.id}" placeholder="Tanggal"/>
                    <input type="text" value="${esc(u.title||"")}" data-u-field="title" data-u-id="${u.id}" placeholder="Judul"/>
                    <textarea data-u-field="changes" data-u-id="${u.id}" placeholder="Changes (1 per baris)">${esc((u.changes||[]).join("\n"))}</textarea>
                  </div>
                </div>
                <div class="mgr-actions">
                  <button class="btn btn-sm btn-green" data-u-save="${u.id}">💾 Simpan</button>
                  <button class="btn btn-sm btn-red" data-u-del="${u.id}">🗑️ Hapus</button>
                </div>
              </div>
            `).join("") : `<div class="mgr-empty">😶 Gak ada update.</div>`}
          </div>
        </div>
      `;
      
      const addBtn = $("#add-update");
      if(addBtn) addBtn.addEventListener("click", async ()=>{
        try{
          await Store.saveUpdate({
            version:"v26.X", date:new Date().toLocaleDateString("id-ID"),
            title:"Update Baru", changes:["Fitur baru"]
          });
          toast("Update ditambah","success");
          this.renderUpdates();
        }catch(e){ toast("Gagal: "+e.message,"error"); }
      });
      
      wrap.querySelectorAll("[data-u-save]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const uid = btn.dataset.uSave;
          const updates = {};
          wrap.querySelectorAll(`[data-u-id="${uid}"]`).forEach(inp=>{
            const field = inp.dataset.uField;
            if(field === "changes"){
              updates[field] = inp.value.split("\n").map(s=>s.trim()).filter(s=>s);
            } else {
              updates[field] = inp.value;
            }
          });
          try{
            await Store.saveUpdate({ id:uid, ...updates });
            toast("Update disimpan","success");
            this.renderUpdates();
          }catch(e){ toast("Gagal: "+e.message,"error"); }
        });
      });
      
      wrap.querySelectorAll("[data-u-del]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          if(!confirm("Hapus update ini?")) return;
          try{
            await Store.removeUpdate(btn.dataset.uDel);
            toast("Update dihapus","success");
            this.renderUpdates();
          }catch(e){ toast("Gagal: "+e.message,"error"); }
        });
      });
      
    }catch(e){
      wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">😵 ${esc(e.message)}</div></div>`;
    }
  },
  
  async renderMaintenance(){
    const wrap = $("#dev-content");
    if(!wrap) return;
    wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">⏳ Memuat status...</div></div>`;
    
    try{
      const doc = await FB.db.collection("settings").doc("app").get();
      const data = doc.exists ? doc.data() : {};
      const m = data.maintenance || {};
      const active = m.active === true;
      const until = m.until || 0;
      const reason = m.reason || "Sedang ada perbaikan";
      
      const now = Date.now();
      const remaining = until > 0 ? Math.max(0, until - now) : 0;
      const remainingMin = Math.floor(remaining / 60000);
      
      wrap.innerHTML = `
        <div class="dev-manager">
          <div class="dev-manager-head">
            <div class="mgr-title">🔧 Maintenance Mode</div>
          </div>
          
          <div class="maint-status-card ${active?'active':'inactive'}">
            <div class="maint-status-head">
              <div class="maint-status-icon ${active?'active':'inactive'}">${active?'🔧':'✅'}</div>
              <div class="maint-status-text">
                <div class="msl">Status</div>
                <div class="msv">${active?'MAINTENANCE ON':'NORMAL'}</div>
              </div>
            </div>
            ${active && until > 0 ? `
              <div style="background:rgba(255,255,255,.5);border-radius:8px;padding:10px;margin-bottom:10px;text-align:center">
                <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px">⏱️ Auto Unlock Dalam</div>
                <div style="font-size:22px;font-weight:900;font-family:var(--mono)">~${remainingMin} menit</div>
                <div style="font-size:10.5px;opacity:.7">Until: ${new Date(until).toLocaleString("id-ID")}</div>
              </div>
            ` : ''}
            ${active && !until ? `
              <div style="background:rgba(255,255,255,.5);border-radius:8px;padding:10px;margin-bottom:10px;text-align:center;font-size:12px;font-weight:700">
                🔒 Manual mode — harus dibuka manual
              </div>
            ` : ''}
          </div>
          
          <div style="background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:12px">
            <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;color:var(--ink-soft)">📋 Alasan:</div>
            <input type="text" id="maint-reason" value="${esc(reason)}" placeholder="Alasan maintenance..." 
              style="width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px"/>
            
            <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;color:var(--ink-soft)">⏱️ Durasi:</div>
            <div class="maint-duration-grid">
              <div class="maint-duration-btn" data-min="15">15 menit</div>
              <div class="maint-duration-btn" data-min="30">30 menit</div>
              <div class="maint-duration-btn" data-min="60">1 jam</div>
              <div class="maint-duration-btn" data-min="120">2 jam</div>
              <div class="maint-duration-btn" data-min="360">6 jam</div>
              <div class="maint-duration-btn" data-min="1440">1 hari</div>
              <div class="maint-duration-btn" data-min="0">Manual</div>
            </div>
          </div>
          
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${active
              ? `<button class="btn btn-green btn-block" id="maint-off">✅ MATIKAN MAINTENANCE</button>`
              : `<button class="btn btn-red btn-block" id="maint-on">🔧 AKTIFKAN MAINTENANCE</button>`
            }
          </div>
          
          <div style="background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:12px;margin-top:14px;font-size:11.5px;font-weight:600;line-height:1.6">
            <b>💡 Info:</b>
            <ul style="margin-left:16px;margin-top:6px">
              <li>User yang buka web bakal lihat halaman maintenance</li>
              <li>Auto-refresh tiap 5 detik buat cek unlock</li>
              <li>Developer (kamu) bypass, tetap bisa akses</li>
              <li>Durasi "Manual" = gak auto-unlock, harus dibuka manual</li>
            </ul>
          </div>
        </div>
      `;
      
      // Duration buttons
      let selectedMin = null;
      wrap.querySelectorAll(".maint-duration-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          wrap.querySelectorAll(".maint-duration-btn").forEach(x=>x.classList.remove("active"));
          btn.classList.add("active");
          selectedMin = parseInt(btn.dataset.min);
        });
      });
      
      const onBtn = $("#maint-on");
      if(onBtn) onBtn.addEventListener("click", async ()=>{
        if(selectedMin === null){ toast("Pilih durasi dulu!","error"); return; }
        const reasonText = $("#maint-reason")?.value.trim() || "Sedang ada perbaikan";
        const until = selectedMin > 0 ? Date.now() + selectedMin*60000 : 0;
        if(!confirm(`Aktifkan maintenance ${selectedMin > 0 ? selectedMin+' menit' : 'manual'}?`)) return;
        showLoading("Mengaktifkan...");
        try{
          await FB.db.collection("settings").doc("app").set({
            maintenance: {
              active: true,
              reason: reasonText,
              until: until,
              startedAt: Date.now(),
              startedBy: Auth.current.email
            }
          }, { merge:true });
          hideLoading();
          toast("🔧 Maintenance ON","success");
          Sound.tada();
          this.renderMaintenance();
        }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
      });
      
      const offBtn = $("#maint-off");
      if(offBtn) offBtn.addEventListener("click", async ()=>{
        if(!confirm("Matikan maintenance?")) return;
        showLoading("Mematikan...");
        try{
          await FB.db.collection("settings").doc("app").set({
            maintenance: {
              active: false,
              reason: "",
              until: 0,
              endedAt: Date.now(),
              endedBy: Auth.current.email
            }
          }, { merge:true });
          hideLoading();
          toast("✅ Maintenance OFF","success");
          Sound.success();
          this.renderMaintenance();
        }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
      });
      
    }catch(e){
      wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">😵 ${esc(e.message)}</div></div>`;
    }
  },
  
  async renderFavicon(){
    const wrap = $("#dev-content");
    if(!wrap) return;
    wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">⏳ Memuat favicon...</div></div>`;
    
    try{
      const settings = await Store.getSettings();
      const favicon = settings.favicon || "";
      
      wrap.innerHTML = `
        <div class="favicon-panel">
          <div class="fp-card">
            <div style="font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px">
              ${ico('star')} Favicon Aplikasi
            </div>
            
            <div class="favicon-preview-big">
              <div class="fp-thumb" id="fav-thumb">
                ${favicon ? `<img src="${esc(favicon)}" id="fav-preview-img">` : `<span style="font-size:36px">🌐</span>`}
              </div>
            </div>
            
            <p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:14px;text-align:center;line-height:1.6">
              Upload favicon custom. Max 100KB. Format PNG/ICO/SVG.
            </p>
            
            <label style="display:block;margin-bottom:10px">
              <input type="file" id="fav-file" accept="image/*" style="display:none"/>
              <div class="btn btn-primary btn-block" style="cursor:pointer">📤 Upload Favicon</div>
            </label>
            
            ${favicon ? `<button class="btn btn-red btn-block" id="fav-clear">🗑️ Hapus Favicon Custom</button>` : ''}
          </div>
        </div>
      `;
      
      const favFile = $("#fav-file");
      if(favFile) favFile.addEventListener("change", async e=>{
        const f = e.target.files[0]; if(!f) return;
        if(f.size > 100*1024){ toast("File max 100KB!","error"); return; }
        showLoading("Upload...");
        try{
          const dataUrl = await new Promise((res, rej)=>{
            const r = new FileReader();
            r.onload = ()=>res(r.result);
            r.onerror = ()=>rej(new Error("Gagal baca file"));
            r.readAsDataURL(f);
          });
          await Store.saveSettings({ favicon: dataUrl });
          hideLoading();
          toast("✅ Favicon diupdate!","success");
          Sound.tada();
          
          // Apply immediately
          let links = document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']");
          if(!links.length){
            const link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
            links = [link];
          }
          links.forEach(l => l.href = dataUrl);
          
          this.renderFavicon();
        }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
      });
      
      const clearBtn = $("#fav-clear");
      if(clearBtn) clearBtn.addEventListener("click", async ()=>{
        if(!confirm("Hapus favicon custom?")) return;
        try{
          await Store.saveSettings({ favicon: "" });
          toast("Favicon dihapus","success");
          this.renderFavicon();
        }catch(e){ toast("Gagal: "+e.message,"error"); }
      });
      
    }catch(e){
      wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">😵 ${esc(e.message)}</div></div>`;
    }
  },
  
  async renderTutorialReset(){
    const wrap = $("#dev-content");
    if(!wrap) return;
    
    wrap.innerHTML = `
      <div class="dev-manager">
        <div class="dev-manager-head">
          <div class="mgr-title">📚 Tutorial Management</div>
        </div>
        
        <div style="background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:20px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px">
          <div style="font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:12px">📖 Tutorial Onboarding</div>
          <p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);line-height:1.7;margin-bottom:16px">
            Tutorial otomatis muncul saat user pertama kali login/dashboard.
            Ada <b>10 step interaktif</b> dengan highlight element.
          </p>
          
          <button class="btn btn-primary btn-block" id="tut-test" style="margin-bottom:8px">▶️ Jalankan Tutorial Sekarang</button>
          <button class="btn btn-yellow btn-block" id="tut-reset-all" style="margin-bottom:8px">🔄 Reset Tutorial Semua User</button>
        </div>
        
        <div style="background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:12px;font-size:11.5px;font-weight:600;line-height:1.6">
          ⚠️ <b>Warning:</b> Reset semua user bakal munculin tutorial lagi ke SEMUA user di login berikutnya.
        </div>
      </div>
    `;
    
    const testBtn = $("#tut-test");
    if(testBtn) testBtn.addEventListener("click", ()=>{
      try{
        if(typeof Tutorial !== "undefined"){
          Tutorial.start();
        } else {
          toast("Tutorial module belum load","error");
        }
      }catch(e){ toast("Error: "+e.message,"error"); }
    });
    
    const resetAllBtn = $("#tut-reset-all");
    if(resetAllBtn) resetAllBtn.addEventListener("click", async ()=>{
      if(!confirm("Reset tutorial untuk SEMUA user? Ini bisa banyak request Firestore.")) return;
      if(!confirm("Yakin banget? Tekan OK buat lanjut.")) return;
      showLoading("Resetting...");
      try{
        const snap = await FB.db.collection("users").get();
        const batch = FB.db.batch();
        let count = 0;
        snap.forEach(doc=>{
          batch.update(doc.ref, { tutorialShown: false, tutorialCompletedAt: null });
          count++;
        });
        await batch.commit();
        hideLoading();
        toast(`✅ ${count} user di-reset`,"success");
        Sound.tada();
      }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
    });
  }
};

.bio-deco.d2{width:38px;height:38px;top:16%;right:8%;background:var(--blue);border:3px solid var(--ink);

.bio-plan-badge.starter{background:var(--green);color:#fff;border-color:var(--ink)}
.bio-plan-badge.pro{background:var(--blue);color:#fff;border-color:var(--ink)}
.bio-plan-badge.ultimate{background:var(--ink);color:var(--yellow);border-color:var(--yellow)}

/* Logos */
.bio-logos{display:flex;justify-content:center;align-items:center;gap:10px;
  flex-wrap:wrap;margin-bottom:14px;margin-top:4px}
.bio-logo-item{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);
  background:var(--white);overflow:hidden;display:grid;place-items:center;
  box-shadow:3px 3px 0 var(--ink)}
.bio-logo-item img{width:100%;height:100%;object-fit:contain;padding:4px}

/* Links */
.bio-links{display:flex;flex-direction:column;gap:14px}
.bio-link{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 18px;border:3px solid var(--ink);border-radius:12px;
  font-weight:900;font-size:14.5px;text-transform:uppercase;letter-spacing:.5px;
  position:relative;box-shadow:6px 6px 0 var(--ink);cursor:pointer;
  min-height:56px;background:var(--white);color:var(--ink);
  animation:linkFadeIn .4s ease both;text-decoration:none;
}
@keyframes linkFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bio-link:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.bio-link:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.bio-link .licon{width:22px;height:22px;display:grid;place-items:center;flex-shrink:0}
.bio-link .licon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bio-link .ltext{flex:1;text-align:center}

/* Featured Link v26 */
.bio-link.bio-featured{
  display:flex;flex-direction:column;align-items:stretch;padding:0;overflow:hidden;
  gap:0;background:var(--feat-bg,var(--white));color:var(--feat-fg,var(--ink));
  min-height:0;position:relative;border:3px solid var(--ink);border-radius:12px;
  box-shadow:6px 6px 0 var(--ink)
}
.bio-link.bio-featured:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.bio-link.bio-featured .feat-img-wrap{
  padding:var(--feat-padding,10px);
  display:flex;justify-content:center;align-items:center;width:100%;
  background:var(--feat-bg,var(--white))
}
.bio-link.bio-featured .feat-img{
  width:80%;height:auto;aspect-ratio:var(--feat-ratio,16/9);
  object-fit:cover;object-position:var(--feat-pos-x,50%) var(--feat-pos-y,50%);
  transform:scale(var(--feat-zoom,1));
  transform-origin:var(--feat-pos-x,50%) var(--feat-pos-y,50%);
  border:2.5px solid var(--ink);border-radius:8px;
  display:block;background:var(--white)
}
.bio-link.bio-featured .feat-body{
  padding:10px 14px 12px;text-align:center;
  background:var(--feat-bg,var(--white));color:var(--feat-fg,var(--ink))
}
.bio-link.bio-featured .feat-body b{
  font-size:14.5px;font-weight:900;text-transform:uppercase;letter-spacing:.5px
}

/* Embed */
.bio-embed{border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  box-shadow:6px 6px 0 var(--ink);background:var(--white)}
.bio-embed iframe{width:100%;display:block;border:none;aspect-ratio:16/9}

/* Footer */
.bio-footer{
  margin-top:28px;font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:1px;background:var(--white);border:2px solid var(--ink);
  padding:6px 12px;border-radius:20px;box-shadow:2px 2px 0 var(--ink);
  display:inline-block;color:var(--ink)
}
.bio-footer a{color:var(--ink);font-weight:900;text-decoration:underline}

/* CTA float */
.bio-cta-float{
  position:fixed;bottom:16px;right:16px;z-index:9990;
  display:inline-flex;align-items:center;gap:6px;
  background:var(--ink);color:var(--yellow);font-weight:900;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;text-decoration:none;
  padding:8px 14px;border-radius:999px;border:2.5px solid var(--yellow);
  box-shadow:3px 3px 0 var(--yellow);
  animation:ctaBounce 2.5s ease-in-out infinite
}
@keyframes ctaBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* Lock overlay */
.lock-overlay{
  position:fixed;inset:0;background:rgba(240,235,224,.96);z-index:9998;
  display:grid;place-items:center;padding:18px
}
.lock-card{
  background:var(--white);border:3px solid var(--ink);border-radius:14px;
  padding:28px;max-width:340px;width:100%;text-align:center;
  box-shadow:8px 8px 0 var(--red)
}
.lock-card .li{width:56px;height:56px;background:var(--ink);color:var(--yellow);
  border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:26px}
.lock-card h3{margin-bottom:6px;font-size:16px;text-transform:uppercase;font-weight:900}
.lock-card p{font-size:13px;margin-bottom:16px;font-weight:600;color:var(--ink-soft)}
.lock-card input{
  width:100%;padding:12px;border-radius:10px;border:2.5px solid var(--ink);
  background:var(--white);color:var(--ink);font-size:14px;outline:none;
  text-align:center;font-weight:700;font-family:inherit
}
.lock-card button{
  width:100%;padding:12px;border-radius:10px;border:2.5px solid var(--ink);
  background:var(--ink);color:var(--white);font-weight:900;cursor:pointer;
  margin-top:10px;font-size:13.5px;text-transform:uppercase;
  box-shadow:3px 3px 0 var(--red);font-family:inherit
}
.lock-card .lock-err{color:var(--red);font-size:12px;font-weight:700;margin-top:8px;min-height:16px}

/* Animations */
.anim-bounce .bio-link{animation:animBounce 2s ease-in-out infinite}
@keyframes animBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.anim-shake .bio-link:hover{animation:animShake .4s ease-in-out}
@keyframes animShake{0%,100%{transform:translate(-2px,-2px) rotate(0)}25%{transform:translate(-2px,-2px) rotate(-2deg)}75%{transform:translate(-2px,-2px) rotate(2deg)}}
.anim-glow .bio-link{box-shadow:6px 6px 0 var(--ink), 0 0 20px rgba(255,215,0,.6)}
.anim-glow .bio-link:hover{box-shadow:8px 8px 0 var(--ink), 0 0 30px rgba(255,215,0,.9)}

  },
  
  renderBadge(bio){
    const plan = bio.ownerPlan || "free";
    if(plan === "free") return "";
    const map = { starter:"STARTER", pro:"PRO", ultimate:"ULTIMATE" };
    const label = map[plan];
    if(!label) return "";
    return `<div class="bio-plan-badge ${plan}">${label}</div>`;
  },
  
  renderLinks(bio, preview){
    try{
      const links = Array.isArray(bio.links) ? bio.links.filter(l => l.active !== false) : [];
      if(!links.length){
        return `<div style="text-align:center;padding:20px;font-size:12.5px;font-weight:700;opacity:.7">Belum ada link.</div>`;
      }
      
      return links.map((l, i) => {
        const url = l.url || "#";
        const label = l.label || "Link";
        const bgColor = l.color || "";
        const delay = (i * 0.05).toFixed(2);
        const iconName = LinkTypes.icon(url);
        
        // Featured Link
        if(l.type === "featured" && l.thumb){
          const bg = bgColor || "#ffffff";
          const fg = contrastText(bg);
          const ratio = l.featRatio === "1:1" ? "1/1" : (l.featRatio === "4:3" ? "4/3" : (l.featRatio === "auto" ? "auto" : "16/9"));
          const posX = l.featPosX ?? 50;
          const posY = l.featPosY ?? 50;
          const zoom = l.featZoom ?? 1;
          const pad = l.featPadding ?? 10;
          
          return `<a class="bio-link bio-featured" href="${esc(url)}" target="_blank" rel="noopener"
            data-idx="${i}"
            style="animation-delay:${delay}s;--feat-bg:${bg};--feat-fg:${fg};
              --feat-ratio:${ratio};--feat-pos-x:${posX}%;--feat-pos-y:${posY}%;
              --feat-zoom:${zoom};--feat-padding:${pad}px">
            <div class="feat-img-wrap">
              <img class="feat-img" src="${esc(l.thumb)}" alt="${esc(label)}"/>
            </div>
            <div class="feat-body"><b>${esc(label)}</b></div>
          </a>`;
        }
        
        // Embed
        if(["youtube","spotify","vimeo","tiktok"].includes(l.type)){
          const embedUrl = LinkTypes.embed(url);
          if(embedUrl){
            return `<div class="bio-embed" style="animation-delay:${delay}s">
              <iframe src="${esc(embedUrl)}" allowfullscreen loading="lazy"
                allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe>
            </div>`;
          }
        }
        
        // Classic
        const customStyle = bgColor ? `background:${bgColor};color:${contrastText(bgColor)}` : "";
        return `<a class="bio-link" href="${esc(url)}" target="_blank" rel="noopener"
          data-idx="${i}" style="animation-delay:${delay}s;${customStyle}">
          <span class="licon">${this.iconSVG(iconName)}</span>
          <span class="ltext">${esc(label)}</span>
        </a>`;
      }).join("");
    }catch(e){ console.warn("renderLinks:", e); return ""; }
  },

  renderLockHTML(){
    return `
      <div class="lock-overlay" id="lock-overlay">
        <div class="lock-card">
          <div class="li">🔒</div>
          <h3>Bio Dikunci</h3>
          <p>Masukkan password untuk melihat bio ini.</p>
          <input type="password" id="lock-input" placeholder="Password" autofocus/>
          <div class="lock-err" id="lock-err"></div>
          <button id="lock-submit">Buka Bio</button>
        </div>
      </div>
    `;
  },
  
  renderTrackingScript(bio){
    if(!bio.id) return "";
    return `<script>
(function(){
  try{
    fetch("https://firestore.googleapis.com/v1/projects/allweb-9dacd/databases/(default)/documents:runQuery",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({structuredQuery:{from:[{collectionId:"bios"}],where:{fieldFilter:{field:{fieldPath:"__name__"},op:"EQUAL",value:{referenceValue:"projects/allweb-9dacd/databases/(default)/documents/bios/${bio.id}"}}}}})
    }).catch(function(){});

    document.querySelectorAll(".bio-link[data-idx]").forEach(function(el){
      el.addEventListener("click", function(){
        var idx = el.getAttribute("data-idx");
        var t = new Date().toISOString().slice(0,10);
        try{
          var req = new XMLHttpRequest();
          req.open("POST","https://firestore.googleapis.com/v1/projects/allweb-9dacd/databases/(default)/documents:commit",true);
          req.setRequestHeader("Content-Type","application/json");
          req.send(JSON.stringify({

  /* =========================================================

  async render(idOrSlug){
    try{
      document.body.classList.add("public-mode");
      
      const app = $("#app");
      if(app) app.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;font-family:sans-serif;background:#f0ebe0"><div style="text-align:center"><div style="font-size:48px;margin-bottom:12px">⏳</div><div style="font-weight:800;text-transform:uppercase;letter-spacing:1px">Memuat bio...</div></div></div>`;
      
      // Cari bio
      let bio = null;
      try{
        const doc = await FB.db.collection("bios").doc(idOrSlug).get();
        if(doc.exists) bio = { id:doc.id, ...doc.data() };
      }catch(e){}
      
      if(!bio){
        try{
          const q = await FB.db.collection("bios").where("slug","==",idOrSlug).limit(1).get();
          if(!q.empty){
            const doc = q.docs[0];
            bio = { id:doc.id, ...doc.data() };
          }
        }catch(e){}
      }
      
      if(!bio){
        if(app) app.innerHTML = `
          <div class="bio-error">
            <div class="icon">🔍</div>
            <h1>Bio Tidak Ditemukan</h1>
            <p>URL yang kamu buka gak ada atau udah dihapus.</p>
            <a href="${APP_BASE_URL}/#/register">Bikin Bio Kamu →</a>
          </div>
        `;
        return;
      }
      
      // Track view (via Firestore update)
      try{
        const today = new Date().toISOString().slice(0,10);
        await FB.db.collection("bios").doc(bio.id).update({
          "stats.views": firebase.firestore.FieldValue.increment(1),
          [`stats.daily.${today}.views`]: firebase.firestore.FieldValue.increment(1)
        });
      }catch(e){}
      
      // Render bio lengkap pakai iframe srcdoc biar isolated styles
      const html = this.buildHTML(bio, { preview:false });
      
      if(app){
        // Buat iframe full screen biar style isolated
        app.innerHTML = "";
        const iframe = document.createElement("iframe");
        iframe.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:none;background:transparent";
        iframe.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox");
        iframe.srcdoc = html;
        app.appendChild(iframe);
      }
      
      // Update title
      document.title = (bio.name || "Link in Bio") + " — Varlinkbio";
      
      // Analytics click tracking
      setTimeout(()=>{
        try{
          const iframe = document.querySelector("#app iframe");
          if(!iframe) return;
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if(!doc) return;
          doc.querySelectorAll(".bio-link[data-idx]").forEach(el=>{
            el.addEventListener("click", async ()=>{
              const idx = el.getAttribute("data-idx");
              const today = new Date().toISOString().slice(0,10);
              try{
                await FB.db.collection("bios").doc(bio.id).update({
                  [`stats.clicks.${idx}`]: firebase.firestore.FieldValue.increment(1),
                  [`stats.daily.${today}.clicks`]: firebase.firestore.FieldValue.increment(1)
                });
              }catch(e){}
            });
          });
        }catch(e){ console.warn("Click bind:", e); }
      }, 600);
      
    }catch(e){
      console.error("PagePublic.render:", e);
      const app = $("#app");
      if(app) app.innerHTML = `
        <div class="bio-error">
          <div class="icon">⚠️</div>
          <h1>Terjadi Error</h1>
          <p>${esc(e.message)}</p>
          <a href="${APP_BASE_URL}/#/register">Buka Varlinkbio →</a>
        </div>
      `;
    }
  }
};

function setupAnalyticsListener(){
  try{
    if(!Auth.current) return;
    if(window.__analyticsUnsub){ try{ window.__analyticsUnsub(); }catch(e){} }
    window.__analyticsUnsub = FB.db.collection("bios")
      .where("ownerUid","==",Auth.current.uid)
      .onSnapshot(snap=>{
        const arr = [];
        snap.forEach(d=>arr.push({ id:d.id, ...d.data() }));
        STATE.cache = arr;
      }, err=>{ /* silent */ });
  }catch(e){ /* silent */ }

        }
      }
    }catch(e){ console.warn("handleRedirectResult:", e); }
    
    // 3. Init Auth state
    await Auth.init();
    
    // 4. Apply user preferences (style + warna)

      try{

    // 6. Apply favicon
    try{ await applyAppFavicon(); }catch(e){}
    
    // 7. Bind global sound
    try{ bindGlobalSound(); }catch(e){}
    
    // 8. Check maintenance (SEBELUM router start)

        renderMaintenancePage(maint);
        hideLoading();
        return; // STOP di sini

    // 9. Register routes
    registerRoutes();
    
    // 10. Start router

    }
    
    // 12. Tutorial auto-start (kalau user login & belum lihat)

      }, 3000);

    // 14. Auto-save interval (tiap 30 detik kalau di editor)
    setInterval(()=>{

        if(hashPath === "/editor" && Auth.current && STATE.draft && STATE.draft.name){
          AutoSave.fire();
        }
      }catch(e){}
    }, 30000);
    
    // 15. Cleanup on hash change
    window.addEventListener("hashchange", ()=>{

  }catch(e){

      if(app){
        app.innerHTML = `

      }
    }catch(err){}
  }

@keyframes vsDust_v28{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-40px,-20px) scale(.2)}}

</style>

<script id="v28-js">
/* ═══════════════════════════════════════════════════════════
   VARSMILE v28 — FINAL
   Cycle 1.5 menit · Sound Realistis · Kanan→Tengah→Kiri
   ═══════════════════════════════════════════════════════════ */
(function(){
  "use strict";
  console.log("🎬 Varsmile v28 loading...");
  
  /* ─── NUKE CSS & DOM LAMA ─── */
  function nukeOld(){
    try{
      document.querySelectorAll("style").forEach(function(s){
        if(s.id === "v28-css") return;
        var css = s.textContent || "";
        if(css.indexOf(".varsmile-") !== -1){
          var cleaned = css
            .replace(/\/\*[\s\S]*?VARSMILE[\s\S]*?\*\//gi,"")
            .replace(/\.varsmile-[^{}]*\{[^{}]*\}/g,"")
            .replace(/@keyframes\s+vs[A-Za-z0-9_]+\s*\{(?:[^{}]|\{[^{}]*\})*\}/g,"")
            .replace(/@keyframes\s+roadDash[A-Za-z0-9_]*\s*\{(?:[^{}]|\{[^{}]*\})*\}/g,"")
            .replace(/@keyframes\s+bubble(In|Out)[A-Za-z0-9_]*\s*\{(?:[^{}]|\{[^{}]*\})*\}/g,"");
          if(cleaned !== css) s.textContent = cleaned;
        }
      });
      ["varsmile-char","varsmile-road"].forEach(function(id){
        var el = document.getElementById(id); if(el) el.remove();
      });
      document.querySelectorAll(".varsmile-bubble,.varsmile-dust,.varsmile-house,.varsmile-flash").forEach(function(el){el.remove()});
      console.log("🗑️ CSS+DOM Varsmile lama dibersihkan");
    }catch(e){ console.warn("nuke:", e); }
  }
  
  /* ═══════════════════════════════════════════════════════════
     SOUND ENGINE REALISTIS — Langkah kaki 8-bit
     ═══════════════════════════════════════════════════════════ */
  const StepsSound = {
    _ctx:null,
    _enabled:true,
    _stepTimer:null,
    
    init(){
      try{
        this._enabled = localStorage.getItem("varlinkbio_sound") !== "off";
      }catch(e){ this._enabled = true; }
    },
    
    _getCtx(){
      try{
        if(!this._ctx){
          var AC = window.AudioContext || window.webkitAudioContext;
          if(!AC) return null;
          this._ctx = new AC();
        }
        if(this._ctx && this._ctx.state === "suspended") this._ctx.resume().catch(function(){});
        return this._ctx;
      }catch(e){ return null; }
    },
    
    /* Satu langkah kaki 8-bit — pendek & realistis */
    _oneStep(volume){
      if(!this._enabled) return;
      var ctx = this._getCtx(); if(!ctx) return;
      try{
        var t = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        var noise = ctx.createBufferSource();
        var noiseGain = ctx.createGain();
        var filter = ctx.createBiquadFilter();
        
        // Oscillator rendah (bunyi tap)
        osc.type = "triangle";
        osc.frequency.setValueAtTime(120 + Math.random()*40, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.06);
        
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(volume || 0.06, t + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.1);
        
        // Noise (tekstur langkah di aspal)
        var buffer = ctx.createBuffer(1, 1024, ctx.sampleRate);
        var data = buffer.getChannelData(0);
        for(var i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * 0.3;
        noise.buffer = buffer;
        
        filter.type = "bandpass";
        filter.frequency.value = 800 + Math.random()*400;
        filter.Q.value = 2;
        
        noiseGain.gain.setValueAtTime(0, t);
        noiseGain.gain.linearRampToValueAtTime((volume || 0.06) * 0.5, t + 0.005);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
        
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(t);
        noise.stop(t + 0.08);
      }catch(e){}
    },
    
    /* Mulai footsteps loop pas Varsmile jalan */
    startWalking(){
      if(!this._enabled) return;
      this.stopWalking();
      var self = this;
      // Langkah tiap 380ms (realistis)
      this._oneStep(0.055);
      this._stepTimer = setInterval(function(){
        if(self._enabled) self._oneStep(0.045 + Math.random()*0.02);
      }, 380);
    },
    
    stopWalking(){
      if(this._stepTimer){ clearInterval(this._stepTimer); this._stepTimer = null; }
    },
    
    /* Capek (napas) */
    tired(){
      if(!this._enabled) return;
      var ctx = this._getCtx(); if(!ctx) return;
      try{
        var self = this;
        [0, 300, 600].forEach(function(delay){
          setTimeout(function(){
            var t = ctx.currentTime;
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(280, t);
            osc.frequency.exponentialRampToValueAtTime(180, t + 0.35);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.035, t + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t); osc.stop(t + 0.42);
          }, delay);
        });
      }catch(e){}
    },
    
    /* Bubble chat muncul */
    bubble(){
      if(!this._enabled) return;
      var ctx = this._getCtx(); if(!ctx) return;
      try{
        var t = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(680, t);
        osc.frequency.exponentialRampToValueAtTime(920, t + 0.05);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.04, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.1);
      }catch(e){}
    },
    
    /* Peek (kepala muncul) */
    peek(){
      if(!this._enabled) return;
      var ctx = this._getCtx(); if(!ctx) return;
      try{
        var t = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(420, t);
        osc.frequency.exponentialRampToValueAtTime(620, t + 0.15);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.03, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.22);
      }catch(e){}
    }
  };
  
  /* ═══════════════════════════════════════════════════════════
     VARSMILE v28 OBJECT
     ═══════════════════════════════════════════════════════════ */
  function buildVarsmile(){
    return {
      _el:null, _bubbleEl:null, _roadEl:null,
      _tipTimer:null, _active:false, _mode:"hidden",
      
      CONFIG:{
        HIDE_DURATION: 90 * 1000,        // 1.5 menit sembunyi (dari sembunyi ke muncul)
        PEEK_DURATION: 3000,             // 3 detik ngintip
        WALK_TO_CENTER: 5000,            // 5 detik dari kanan ke tengah
        TIRED_DURATION: 1500,            // 1.5 detik capek
        TALK_DURATION: 8000,             // 8 detik ngomong
        WALK_TO_LEFT: 8000,              // 8 detik dari tengah ke ujung kiri
        GO_DOWN_DURATION: 1200,          // 1.2 detik sembunyi
        WAITING_TIP_INTERVAL: 8000
      },
      
      TIPS_RANDOM:[
        "✨ Kamu keren, terus berkarya!",
        "🚀 Satu link, sejuta peluang!",
        "💪 Jangan menyerah, kamu bisa!",
        "🎨 Bikin bio kamu sebagus mungkin!",
        "⭐ Kreator hebat selalu konsisten!",
        "🔥 Hari ini pasti lebih baik!",
        "💎 Simpan dulu, baru share ya!",
        "🌈 Detail kecil itu penting!",
        "⚡ Coba tema warna baru!",
        "🎯 Fokus, hasilnya memuaskan!",
        "💫 Setiap klik itu berarti!",
        "🏆 Kamu luar biasa hari ini!",
        "🍀 Semoga harimu menyenangkan!",
        "🎁 Fitur baru nungguin kamu!",
        "💡 Ide keren datang tiba-tiba!"
      ],
      
      TIPS_LOGIN:[
        "Ayo login dulu ya! 🔑",
        "Isi email & password di atas ↗️",
        "Santai, aku tungguin kok! ☕",
        "Passwordnya jangan lupa! 🗝️",
        "Selamat datang di Varlinkbio! 🎉",
        "Kamu pasti bisa login! 💪",
        "Cek emailnya bener ya! 📧",
        "Hampir masuk nih, semangat!",
        "Aku udah siap nuntun kamu! 🚀",
        "Yang sabar ya, bentar lagi!"
      ],
      
      TIPS_CONTEXT:{
        "/dashboard":["📺 Nonton iklan dapet kredit gratis!","🎁 Buka Fitur Store buat beli fitur!","📊 Cek statistik bio kamu!","🧭 Explore bio user lain yuk!"],
        "/editor":["💾 Klik Simpan biar tersimpan!","⠿ Drag link buat atur urutan!","📸 Upload foto profil biar keren!","🎨 Coba tema warna baru!"],
        "/store":["💰 Kredit gak cukup? Nonton iklan aja!","🔒 Fitur yang dibeli PERMANENT lho!"]
      },
      
      SVG: '<svg viewBox="0 0 16 17" class="varsmile-svg" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="1" width="10" height="1" fill="#0a0a0a"/><rect x="2" y="2" width="12" height="1" fill="#0a0a0a"/><rect x="1" y="3" width="14" height="7" fill="#0a0a0a"/><rect x="2" y="10" width="12" height="1" fill="#0a0a0a"/><rect x="3" y="11" width="10" height="1" fill="#0a0a0a"/><rect x="2" y="3" width="12" height="7" fill="#ffd700"/><rect x="4" y="5" width="2" height="2" fill="#0a0a0a"/><rect x="4" y="5" width="1" height="1" fill="#ffffff"/><rect x="10" y="5" width="2" height="2" fill="#0a0a0a"/><rect x="10" y="5" width="1" height="1" fill="#ffffff"/><rect x="3" y="7" width="1" height="1" fill="#ff69b4"/><rect x="12" y="7" width="1" height="1" fill="#ff69b4"/><rect x="6" y="8" width="4" height="1" fill="#0a0a0a"/><rect x="5" y="7" width="1" height="1" fill="#0a0a0a"/><rect x="10" y="7" width="1" height="1" fill="#0a0a0a"/><rect x="5" y="12" width="6" height="1" fill="#0a0a0a"/><rect x="4" y="13" width="8" height="3" fill="#0a0a0a"/><rect x="5" y="13" width="6" height="2" fill="#2563eb"/><rect x="3" y="13" width="1" height="2" fill="#0a0a0a"/><rect x="3" y="14" width="1" height="1" fill="#ffd700"/><rect x="12" y="13" width="1" height="2" fill="#0a0a0a"/><rect x="12" y="14" width="1" height="1" fill="#ffd700"/><rect x="6" y="16" width="1" height="1" fill="#0a0a0a" class="vs-leg-left"/><rect x="9" y="16" width="1" height="1" fill="#0a0a0a" class="vs-leg-right"/></svg>',
      
      init:function(){
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        if(hashPath.startsWith("/u/")) return;
        if(!window.Auth || !window.Auth.current){ console.log("⏸️ Varsmile: user belum login"); return; }
        if(!window.STATE || STATE.varsmileEnabled === false){ console.log("⏸️ Varsmile: dinonaktifkan"); return; }
        
        if(this._el && document.body.contains(this._el)){
          if(!this._active) this.startLoop();
          return;
        }
        
        try{
          ["varsmile-char","varsmile-road"].forEach(function(id){
            var el = document.getElementById(id); if(el) el.remove();
          });
          
          this._el = document.createElement("div");
          this._el.id = "varsmile-char";
          this._el.className = "hide-bottom facing-right";
          this._el.innerHTML = this.SVG;
          this._el.style.pointerEvents = "auto";
          this._el.style.cursor = "pointer";
          document.body.appendChild(this._el);
          
          this._roadEl = document.createElement("div");
          this._roadEl.id = "varsmile-road-new";
          this._roadEl.className = "varsmile-road";
          document.body.appendChild(this._roadEl);
          
          this._bindInteraction();
          this._active = true;
          this.startLoop();
          console.log("✅ Varsmile v28 aktif");
        }catch(e){ console.warn("Varsmile.init:", e); }
      },
      
      _bindInteraction:function(){
        var self = this;
        if(!this._el) return;
        this._el.addEventListener("click", function(e){
          e.stopPropagation();
          if(self._mode === "runAway" || self._mode === "waiting") return;
          var tip = self.TIPS_RANDOM[Math.floor(Math.random()*self.TIPS_RANDOM.length)];
          self.showBubble(tip, 3000);
          if(window.Sound && Sound.bip) Sound.bip();
        });
      },
      
      showBubble:function(text, duration){
        duration = duration || 3000;
        if(!this._el) return;
        if(this._bubbleEl){ try{ this._bubbleEl.remove(); }catch(e){} this._bubbleEl = null; }
        try{
          var rect = this._el.getBoundingClientRect();
          var bubble = document.createElement("div");
          bubble.className = "varsmile-bubble";
          bubble.textContent = text;
          bubble.style.top = (rect.top - 60) + "px";
          bubble.style.left = Math.max(10, rect.left + rect.width/2) + "px";
          bubble.style.transform = "translateX(-50%)";
          document.body.appendChild(bubble);
          this._bubbleEl = bubble;
          
          StepsSound.bubble();
          
          var self = this;
          setTimeout(function(){
            if(self._bubbleEl === bubble){
              bubble.classList.add("dismissing");
              setTimeout(function(){
                try{ bubble.remove(); }catch(e){}
                if(self._bubbleEl === bubble) self._bubbleEl = null;
              }, 300);
            }
          }, duration);
          
          bubble.addEventListener("click", function(){
            bubble.classList.add("dismissing");
            setTimeout(function(){
              try{ bubble.remove(); }catch(e){}
              if(self._bubbleEl === bubble) self._bubbleEl = null;
            }, 300);
          });
        }catch(e){}
      },
      
      _setMode:function(mode){
        if(!this._el) return;
        this._mode = mode;
        var cls = "hide-bottom facing-right";
        if(mode === "hide") cls = "hide-bottom facing-right";
        else if(mode === "peek") cls = "peek-bottom idle facing-right";
        else if(mode === "walking") cls = "on-road walking facing-right";
        else if(mode === "tired") cls = "on-road tired facing-right";
        else if(mode === "talking") cls = "on-road talking facing-right";
        else if(mode === "waiting") cls = "waiting-mode idle";
        else if(mode === "runAway") cls = "run-away-3d facing-right";
        this._el.className = cls;
      },
      
      _spawnDust:function(){
        if(!this._el) return;
        try{
          var rect = this._el.getBoundingClientRect();
          var dust = document.createElement("div");
          dust.className = "varsmile-dust";
          dust.style.left = (rect.left + rect.width/2) + "px";
          dust.style.top = (rect.bottom - 6) + "px";
          document.body.appendChild(dust);
          setTimeout(function(){ try{ dust.remove(); }catch(e){} }, 900);
        }catch(e){}
      },
      
      _dustBurst:function(){
        var self = this;
        for(var i=0;i<6;i++){
          setTimeout(function(){ self._spawnDust(); }, i*300);
        }
      },
      
      _flashScreen:function(){
        try{
          var flash = document.createElement("div");
          flash.className = "varsmile-flash";
          document.body.appendChild(flash);
          setTimeout(function(){ flash.classList.add("active"); }, 10);
          setTimeout(function(){
            flash.classList.remove("active");
            setTimeout(function(){ try{ flash.remove(); }catch(e){} }, 300);
          }, 250);
        }catch(e){}
      },
      
      startLoop:function(){
        if(!this._el) return;
        this._active = true;
        this._cycle();
      },
      
      /* ═══════════════════════════════════════════════════
         CYCLE UTAMA v28
         1. Sembunyi 1.5 menit
         2. Ngintip 3 detik
         3. Naik, siap di ujung KANAN (off-screen)
         4. Jalan ke TENGAH (5 detik) + sound footsteps
         5. Capek (1.5 detik) + sound napas
         6. Ngomong tips (8 detik)
         7. Jalan lagi ke UJUNG KIRI (8 detik) + sound footsteps
         8. Sembunyi ke bawah
         9. Loop
         ═══════════════════════════════════════════════════ */
      _cycle:function(){
        var self = this;
        var C = this.CONFIG;
        if(!this._active) return;
        
        // STEP 1 — Sembunyi 1.5 menit
        this._setMode("hide");
        if(this._roadEl) this._roadEl.classList.remove("active");
        StepsSound.stopWalking();
        
        setTimeout(function(){
          if(!self._active) return;
          self._stepPeek();
        }, C.HIDE_DURATION);
      },
      
      _stepPeek:function(){
        var self = this;
        var C = this.CONFIG;
        if(!this._active) return;
        
        // STEP 2 — Ngintip
        this._setMode("peek");
        StepsSound.peek();
        
        setTimeout(function(){
          if(!self._active) return;
          self._stepRoadOn();
        }, C.PEEK_DURATION);
      },
      
      _stepRoadOn:function(){
        var self = this;
        if(!this._active) return;
        
        // STEP 3 — Jalanan muncul (fade-in)
        if(this._roadEl) this._roadEl.classList.add("active");
        
        setTimeout(function(){
          if(!self._active) return;
          self._stepStart();
        }, 700);
      },
      
      _stepStart:function(){
        var self = this;
        var C = this.CONFIG;
        if(!self._active || !self._el) return;
        
        // STEP 4 — Posisi awal: di LUAR kanan layar
        self._el.style.transition = "none";
        self._el.style.left = "calc(100% + 80px)";
        self._el.style.transform = "translateX(0)";
        self._setMode("walking");
        
        // STEP 5 — Jalan ke TENGAH
        setTimeout(function(){
          if(!self._active) return;
          self._el.style.transition = "left " + (C.WALK_TO_CENTER/1000) + "s linear";
          self._el.style.left = "50%";
          self._el.style.transform = "translateX(-50%)";
          
          // Sound footsteps mulai
          StepsSound.startWalking();
          self._dustBurst();
          
          setTimeout(function(){
            if(!self._active) return;
            StepsSound.stopWalking();
            self._stepTired();
          }, C.WALK_TO_CENTER);
        }, 100);
      },
      
      _stepTired:function(){
        var self = this;
        var C = this.CONFIG;
        if(!this._active) return;
        
        // STEP 6 — Capek di TENGAH
        this._setMode("tired");
        StepsSound.tired();
        
        setTimeout(function(){
          if(!self._active) return;
          self._stepTalk();
        }, C.TIRED_DURATION);
      },
      
      _stepTalk:function(){
        var self = this;
        var C = this.CONFIG;
        if(!this._active) return;
        
        // STEP 7 — Ngomong tips (8 detik)
        this._setMode("talking");
        
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        var tips = this.TIPS_RANDOM;
        if(this.TIPS_CONTEXT[hashPath]){
          tips = this.TIPS_CONTEXT[hashPath].concat(this.TIPS_RANDOM);
        }
        var tip = tips[Math.floor(Math.random()*tips.length)];
        this.showBubble(tip, C.TALK_DURATION - 500);
        
        setTimeout(function(){
          if(!self._active) return;
          self._stepWalkLeft();
        }, C.TALK_DURATION);
      },
      
      _stepWalkLeft:function(){
        var self = this;
        var C = this.CONFIG;
        if(!self._active || !self._el) return;
        
        // STEP 8 — Lanjut jalan ke UJUNG KIRI
        self._setMode("walking");
        // Balik arah: hadap kiri
        self._el.classList.remove("facing-right");
        self._el.classList.add("facing-left");
        self._el.style.transition = "left " + (C.WALK_TO_LEFT/1000) + "s linear";
        self._el.style.left = "calc(-20% - 80px)";
        self._el.style.transform = "translateX(0)";
        
        StepsSound.startWalking();
        self._dustBurst();
        
        setTimeout(function(){
          if(!self._active) return;
          StepsSound.stopWalking();
          self._stepHide();
        }, C.WALK_TO_LEFT);
      },
      
      _stepHide:function(){
        var self = this;
        var C = this.CONFIG;
        if(!this._active) return;
        
        // STEP 9 — Sembunyi di bawah
        this._setMode("hide");
        if(this._roadEl) this._roadEl.classList.remove("active");
        
        setTimeout(function(){
          if(!self._active || !self._el) return;
          // Reset posisi ke kanan buat cycle berikutnya
          self._el.style.transition = "none";
          self._el.style.left = "calc(100% + 80px)";
          self._el.style.transform = "translateX(0)";
          
          // Loop lagi
          setTimeout(function(){
            if(self._active) self._cycle();
          }, 800);
        }, C.GO_DOWN_DURATION);
      },
      
      /* ═══════════════════════════════════════════════════
         LOGIN WAITING MODE
         ═══════════════════════════════════════════════════ */
      startLoginMode:function(){
        var self = this;
        if(!this._el){
          ["varsmile-char","varsmile-road"].forEach(function(id){
            var el = document.getElementById(id); if(el) el.remove();
          });
          this._el = document.createElement("div");
          this._el.id = "varsmile-char";
          this._el.className = "waiting-mode idle";
          this._el.innerHTML = this.SVG;
          this._el.style.pointerEvents = "auto";
          this._el.style.cursor = "pointer";
          document.body.appendChild(this._el);
          this._bindInteraction();
        }
        this._setMode("waiting");
        if(this._tipTimer){ clearInterval(this._tipTimer); }
        this._tipTimer = setInterval(function(){
          if(self._mode !== "waiting") return;
          var tip = self.TIPS_LOGIN[Math.floor(Math.random()*self.TIPS_LOGIN.length)];
          self.showBubble(tip, 4000);
        }, this.CONFIG.WAITING_TIP_INTERVAL);
      },
      
      runAway3D:function(){
        var self = this;
        if(!this._el) return Promise.resolve();
        if(this._tipTimer){ clearInterval(this._tipTimer); this._tipTimer = null; }
        StepsSound.stopWalking();
        
        this.showBubble("AYOOO MARI KITA MENUJU RUMAH! 🏠", 2500);
        StepsSound.startWalking();
        this._dustBurst();
        this._setMode("runAway");
        
        setTimeout(function(){ StepsSound.stopWalking(); }, 1500);
        setTimeout(function(){ self._flashScreen(); }, 2300);
        
        return new Promise(function(resolve){
          setTimeout(resolve, 2600);
        });
      },
      
      hide:function(){
        this._active = false;
        if(this._tipTimer){ clearInterval(this._tipTimer); this._tipTimer = null; }
        StepsSound.stopWalking();
        if(this._el){ try{ this._el.remove(); }catch(e){} this._el = null; }
        if(this._bubbleEl){ try{ this._bubbleEl.remove(); }catch(e){} this._bubbleEl = null; }
        if(this._roadEl){ try{ this._roadEl.remove(); }catch(e){} this._roadEl = null; }
        this._mode = "hidden";
      },
      
      /* ═══════════════════════════════════════════════════
         TEST MODE — Muncul dalam 3 detik (buat debug)
         ═══════════════════════════════════════════════════ */
      testShow:function(){
        console.log("🧪 Test mode — Varsmile muncul 3 detik");
        var self = this;
        if(this._tipTimer){ clearInterval(this._tipTimer); this._tipTimer = null; }
        setTimeout(function(){
          if(!self._active) return;
          self._stepPeek();
        }, 3000);
      }
    };
  }
  
  /* ═══════════════════════════════════════════════════════════
     APPLY
     ═══════════════════════════════════════════════════════════ */
  function applyAll(){
    nukeOld();
    StepsSound.init();
    window.StepsSound = StepsSound;
    window.Varsmile = buildVarsmile();
    console.log("✅ Varsmile v28 applied");
    
    try{
      if(window.Auth && Auth.current && window.STATE && STATE.varsmileEnabled){
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        if(!hashPath.startsWith("/u/")){
          setTimeout(function(){ window.Varsmile.init(); }, 500);
        }
      }
    }catch(e){ console.warn("auto-init:", e); }
  }
  
  function whenReady(fn){
    if(document.readyState === "complete" || document.readyState === "interactive"){
      setTimeout(fn, 500);
    } else {
      document.addEventListener("DOMContentLoaded", function(){ setTimeout(fn, 500); });
    }
  }
  
  whenReady(function(){
    var attempts = 0;
    var check = setInterval(function(){
      attempts++;
      if(attempts > 30){
        clearInterval(check);
        console.warn("⏱️ Timeout — apply paksa");
        applyAll();
        return;
      }
      if(typeof window.Auth !== "undefined" && typeof window.STATE !== "undefined"){
        clearInterval(check);
        console.log("🎬 Auth & STATE siap");
        applyAll();
      }
    }, 200);
  });
  
})();
</script>
