     PATCH: MENU DRAWER — Tambah item "Music Saya"
     ═══════════════════════════════════════════════════════════ */
  function patchDrawerMenu(){
    var drawer = document.querySelector(".lt-drawer-panel");
    if(!drawer) return;
    if(document.getElementById("drawer-music-item")) return;

    var homeItem = document.getElementById("drawer-back-home");

  /* ═══════════════════════════════════════════════════════════
     PATCH: ROUTER — Tambah route /music
     ═══════════════════════════════════════════════════════════ */
  function patchRouter(){
    if(!window.Router || !window.Router.routes) return;
    if(window.Router.routes["/music"]) return;
    
    window.Router.on("/music", function(){ PageMusic.render(); });
    console.log("✅ Route /music terdaftar");
  }

  /* ═══════════════════════════════════════════════════════════
     PATCH: PUBLIC BIO — Auto load music dari bio
     ═══════════════════════════════════════════════════════════ */
  function patchPublicBioMusic(){
    if(!window.PagePublic) return;
    if(window.PagePublic._musicPatched) return;
    
    var origRender = window.PagePublic.render;
    window.PagePublic.render = async function(idOrSlug){
      // Set global music id sebelum render
      try{
        var bio = null;
        var doc = await window.FB.db.collection("bios").doc(idOrSlug).get();
        if(doc.exists) bio = { id:doc.id, ...doc.data() };
        
        if(!bio){
          var q = await window.FB.db.collection("bios").where("slug","==",idOrSlug).limit(1).get();
          if(!q.empty){
            var d2 = q.docs[0];
            bio = { id:d2.id, ...d2.data() };
          }
        }
        
        if(bio && bio.musicId){
          window._publicBioMusicId = bio.musicId;
        } else {
          window._publicBioMusicId = null;
        }
      }catch(e){}
      
      // Panggil render asli
      await origRender.call(this, idOrSlug);
      
      // Init music player
      setTimeout(function(){
        if(window.MusicPlayer) window.MusicPlayer.start();
      }, 1000);
    };
    
    window.PagePublic._musicPatched = true;
    console.log("✅ Public Bio music patched");
  }

  /* ═══════════════════════════════════════════════════════════
     AUTO INIT
     ═══════════════════════════════════════════════════════════ */
  function initPatches(){
    // Init Music Player
    MusicPlayer.init();
    
    // Patch Dev Panel
    patchDevPanelTabs();
    patchDevPanelRender();
    
    // Patch Router
    patchRouter();
    
    // Patch Drawer Menu
    patchDrawerMenu();
    
    // Patch Public Bio
    patchPublicBioMusic();
    
    // Watch for editor render (pakai MutationObserver)
    var observer = new MutationObserver(function(){
      patchEditorMusicSection();
      patchDrawerMenu();
      patchDevPanelTabs();
    });
    observer.observe(document.body, { childList: true, subtree: true });
    
    // Start global music (di halaman manapun)
    setTimeout(function(){
      try{
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        if(!hashPath.startsWith("/u/")){
          MusicPlayer.start();
        }
      }catch(e){}
    }, 1500);
    
    // Re-init music on hash change
    window.addEventListener("hashchange", function(){
      try{
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        if(hashPath.startsWith("/music")) return; // biarin PageMusic handle
        if(hashPath.startsWith("/u/")) return; // biarin public bio handle
        
        // Restart music player kalau pindah halaman
        setTimeout(function(){
          if(MusicPlayer._btn){
            // Button udah ada, gak usah init ulang
            return;
          }
          MusicPlayer.start();
        }, 500);
      }catch(e){}
    });
    
    console.log("🎵 Music System v26 siap!");
    console.log("📋 Cloud Name:", CLOUDINARY.cloudName);
    console.log("📋 Upload Preset:", CLOUDINARY.uploadPreset);
  }

  // Expose ke window
  window.MusicPlayer = MusicPlayer;
  window.MusicLibrary = MusicLibrary;
  window.PageMusic = PageMusic;
  window.CLOUDINARY_CONFIG = CLOUDINARY;

  // Wait for dependencies
  waitFor(function(){
    return window.FB && window.Auth && window.Router && window.PageDev;
  }, 8000).then(function(){
    setTimeout(initPatches, 500);
  }).catch(function(){
    console.warn("⚠️ Timeout nunggu dependencies — patch paksa");
    setTimeout(initPatches, 500);
  });

})();
</script>

/* Render pixel SVG dari string art */
function pxRender(name){
  var art = PX_ICONS[name];
  if(!art) return "";
  var h = art.length;
  var w = art[0].length;
  var rects = "";
  for(var y = 0; y < h; y++){
    var row = art[y];
    var x = 0;
    while(x < w){
      var c = row[x];
      if(c === "." || c === " "){ x++; continue; }
      var startX = x;
      while(x < w && row[x] === c) x++;
      var len = x - startX;
      var color = PX_PAL[c] || c;
      rects += '<rect x="' + startX + '" y="' + y + '" width="' + len + '" height="1" fill="' + color + '"/>';
    }
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' + rects + '</svg>';
}

/* Override emojiToSvg */
var _EMOJI_REGEX = /([\u{1F300}-\u{1F9FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{2600}-\u{27BF}]|[\u{1F900}-\u{1F9FF}]|[\u{2190}-\u{21FF}]|[\u{2B00}-\u{2BFF}]|[\uFE0F]|[\u2700-\u27BF])/gu;

window.emojiToSvg = function(text, opts){
  if(!text) return text;
  return String(text).replace(_EMOJI_REGEX, function(match){
    if(match === "\uFE0F") return "";
    var name = EMOJI_MAP[match];
    if(!name) return match;
    var svg = pxRender(name);
    if(!svg) return match;
    return '<span class="px-icon">' + svg + '</span>';
  });
};

var EmojiReplacer = {
  _skipTags: ["SCRIPT","STYLE","TEXTAREA","INPUT","CODE","PRE","SVG","PATH","CIRCLE","RECT","POLYGON","LINE","POLYLINE","ELLIPSE","G","DEFS"],
  init: function(){
    var self = this;
    setTimeout(function(){ cleanupOldEmoji(); }, 500);
    setTimeout(function(){ self._walk(document.body); }, 1500);
    setTimeout(function(){ self._walk(document.body); }, 3500);
    var observer = new MutationObserver(function(muts){
      muts.forEach(function(m){
        if(m.target && m.target.closest && m.target.closest(".px-icon")) return;
        if(m.target && self._skipTags.indexOf(m.target.tagName) !== -1) return;
        m.addedNodes.forEach(function(n){
          if(n.nodeType === 1){
            if(self._skipTags.indexOf(n.tagName) !== -1) return;
            self._walk(n);
          } else if(n.nodeType === 3){ self._convertTextNode(n); }
        });
      });
    });
    try{ observer.observe(document.body, { childList: true, subtree: true }); }catch(e){}
  },
  _walk: function(root){
    if(!root || root.nodeType !== 1) return;
    if(this._skipTags.indexOf(root.tagName) !== -1) return;
    if(root.classList && root.classList.contains("px-icon")) return;
    if(root.closest && root.closest(".px-icon")) return;
    var kids = Array.prototype.slice.call(root.childNodes || []);
    for(var i = 0; i < kids.length; i++){
      var k = kids[i];
      if(k.nodeType === 3) this._convertTextNode(k);
      else if(k.nodeType === 1) this._walk(k);
    }
  },
  _convertTextNode: function(node){
    try{
      var txt = node.nodeValue;
      if(!txt || txt.length === 0) return;
      var parent = node.parentNode;
      if(!parent) return;
      if(this._skipTags.indexOf(parent.tagName) !== -1) return;
      if(parent.closest && parent.closest(".px-icon")) return;
      _EMOJI_REGEX.lastIndex = 0;
      if(!_EMOJI_REGEX.test(txt)) return;
      var html = window.emojiToSvg(txt);
      if(!html || html === txt) return;
      var span = document.createElement("span");
      span.style.display = "contents";
      span.setAttribute("data-emoji-converted", "1");
      span.innerHTML = html;
      node.parentNode.replaceChild(span, node);
    }catch(e){}
  }
};

var QRCODEJS_CDNS = [
  "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js",
  "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js",
  "https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"
];
var _qrLibLoading = null;
function loadQRCodeJS(){
  if(window.QRCode && typeof window.QRCode === "function") return Promise.resolve(true);
  if(_qrLibLoading) return _qrLibLoading;
  _qrLibLoading = new Promise(function(resolve){
    var i = 0;
    function tryNext(){
      if(i >= QRCODEJS_CDNS.length){ _qrLibLoading = null; resolve(false); return; }
      var url = QRCODEJS_CDNS[i++];
      var s = document.createElement("script");
      s.src = url; s.async = true;
      var timer = setTimeout(function(){ try{ s.remove(); }catch(e){} tryNext(); }, 4000);
      s.onload = function(){
        clearTimeout(timer);
        if(window.QRCode && typeof window.QRCode === "function") resolve(true);
        else tryNext();
      };
      s.onerror = function(){ clearTimeout(timer); tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
  return _qrLibLoading;
}
setTimeout(loadQRCodeJS, 500);

var GestureRecovery = {
  _seq: [], _lastTs: 0, _threshold: 50, _maxTime: 500, _seqTimeout: 4000,
  _touchStartY: 0, _touchStartX: 0, _touchStartTime: 0, _wheelLast: 0,
  init: function(){
    var self = this;
    document.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1) return;
      self._touchStartY = e.touches[0].clientY;
      self._touchStartX = e.touches[0].clientX;
      self._touchStartTime = Date.now();
    }, { passive: true });
    document.addEventListener("touchend", function(e){
      if(!e.changedTouches || e.changedTouches.length !== 1) return;
      var endY = e.changedTouches[0].clientY;
      var endX = e.changedTouches[0].clientX;
      var dt = Date.now() - self._touchStartTime;
      var dy = endY - self._touchStartY;
      var dx = endX - self._touchStartX;
      if(Math.abs(dy) < self._threshold) return;
      if(Math.abs(dx) > Math.abs(dy) * 0.6) return;
      if(dt > self._maxTime) return;
      if(dy < 0) self._addSwipe("up");
      else self._addSwipe("down");
    }, { passive: true });
    document.addEventListener("wheel", function(e){
      var now = Date.now();
      if(now - self._wheelLast < 200) return;
      self._wheelLast = now;
      if(e.deltaY < -30) self._addSwipe("up");
      else if(e.deltaY > 30) self._addSwipe("down");
    }, { passive: true });
  },
  _addSwipe: function(dir){
    var now = Date.now();
    if(now - this._lastTs > this._seqTimeout) this._seq = [];
    this._lastTs = now;
    this._seq.push(dir);
    if(this._seq.length > 4) this._seq = this._seq.slice(-4);
    if(this._seq.length >= 4){
      var l4 = this._seq.slice(-4);
      if(l4[0] === "up" && l4[1] === "up" && l4[2] === "down" && l4[3] === "down"){
        this._trigger();
        this._seq = [];
      }
    }
  },
  _trigger: function(){
    try{
      var vs = document.getElementById("varsmile-char");
      if(window.Varsmile){
        window.Varsmile.hide && window.Varsmile.hide();
        setTimeout(function(){ window.Varsmile.init(); }, 100);

      if(window.Sound && Sound.tada) Sound.tada();
      if(navigator.vibrate) navigator.vibrate([50, 50, 50]);

};

function pascalCase(str){
  return String(str || "").split("-").map(function(s){
    return s.charAt(0).toUpperCase() + s.slice(1);
  }).join("");
}

function renderLucideIcon(name){
  if(!window.lucide || !window.lucide.icons) return "";
  var pascalName = pascalCase(name);
  var iconNode = window.lucide.icons[pascalName];
  if(!iconNode) return "";
  
  var inner = "";
  // iconNode = [["tag", {attrs}], ...]
  for(var i = 0; i < iconNode.length; i++){
    var item = iconNode[i];
    if(!item || !item[0]) continue;
    var tag = item[0];
    var attrs = item[1] || {};
    var attrStr = "";
    var keys = Object.keys(attrs);
    for(var j = 0; j < keys.length; j++){
      var k = keys[j];
      var v = String(attrs[k]);
      v = v.replace(/"/g, "&quot;");
      attrStr += " " + k + '="' + v + '"';
    }
    inner += "<" + tag + attrStr + "></" + tag + ">";
  }
  
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';

function cleanupAndReconvert(){
  try{

    var oldIcons = document.querySelectorAll(".px-icon");
    oldIcons.forEach(function(el){
      // Ambil emoji asli dari title atau data attribute

      if(emoji){
        var newSvg = window.emojiToSvg(emoji);

          var span = document.createElement("span");
          span.style.display = "contents";
          span.setAttribute("data-emoji-converted", "2");
          span.innerHTML = newSvg;
          el.parentNode.replaceChild(span, el);
          return;
        }
      }
      // Fallback: hapus aja
      if(el.parentNode) el.parentNode.removeChild(el);
    });

    });

/* ═══════════════════════════════════════════════════════════

      if(!root || root.nodeType !== 1) return;
      if(skipTags.indexOf(root.tagName) !== -1) return;
      if(root.classList && (root.classList.contains("lucide-emoji") || root.classList.contains("px-icon"))) return;
      if(root.closest && (root.closest(".lucide-emoji") || root.closest(".px-icon"))) return;
      
      var kids = Array.prototype.slice.call(root.childNodes || []);
      for(var i = 0; i < kids.length; i++){
        var k = kids[i];
        if(k.nodeType === 3){
          try{
            var txt = k.nodeValue;
            if(!txt) continue;
            _EMOJI_REGEX.lastIndex = 0;
            if(!_EMOJI_REGEX.test(txt)) continue;
            var html = window.emojiToSvg(txt);
            if(html && html !== txt){
              var span = document.createElement("span");
              span.style.display = "contents";
              span.setAttribute("data-emoji-converted", "2");
              span.innerHTML = html;
              k.parentNode.replaceChild(span, k);
            }
          }catch(e){}
        } else if(k.nodeType === 1){
          walk(k);
        }
      }
    }
    
    walk(document.body);
    console.log("🔄 Force reconvert done");
  }catch(e){ console.warn("forceReconvert:", e); }
}

    var sysPrompt = 'Kamu AI asisten Varlinkbio. Bikin bio in-bio dari deskripsi user.\n\nOUTPUT HARUS JSON VALID:\n{"bio":"max 60 char, diawali emoji","links":[{"label":"WhatsApp","url":"https://wa.me/"},{"label":"Instagram","url":"https://instagram.com/"},{"label":"Katalog","url":"#"},{"label":"Testimoni","url":"#"}],"tema":"neo-pink","style":"minimalist"}\n\nTema: neo-cream,neo-midnight,neo-dark,neo-blue,neo-rose,neo-pink,neo-green,neo-purple,neo-orange,neo-ocean,neo-coffee,neo-sunset,neo-galaxy,neo-neon,neo-retro,neo-sakura,neo-gold\nStyle: brutalism,minimalist,glassmorphism,material,gaming,vintage,cyberpunk,aurora,retro,cosmic,anime\nGaya bahasa: ' + style + '\nOUTPUT HANYA JSON.';
    
    try{
      var response = await fetch(GROQ_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_KEY },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [
            { role: "system", content: sysPrompt },
            { role: "user", content: 'Deskripsi: "' + userInput + '"' }
          ],
          max_tokens: 600,
          temperature: 0.7,
          response_format: { type: "json_object" }
        })
      });
      
      if(!response.ok){
        console.warn("Groq HTTP " + response.status + " — fallback template");
        return this._fallback(userInput);
      }
      
      var data = await response.json();
      var content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!content) throw new Error("Empty response");
      
      try{
        return JSON.parse(content);
      }catch(e){
        throw new Error("AI format salah");
      }
    }catch(e){
      console.warn("AIBio error:", e);
      return this._fallback(userInput);
    }
  };
  console.log("✅ AIBioGenerator patched (key baru)");
}, 2000);

   ═══════════════════════════════════════════════════════════ */
setTimeout(function(){
  if(!window.Router) return;
  
  var _origNavigate = window.Router.navigate;
  var _confirming = false;
  
  window.Router.navigate = function(path){
    var hashPath = (location.hash.slice(1) || "/").split("?")[0];
    
    // Cek kalau keluar dari editor
    if(hashPath === "/editor" && path !== "/editor" && !_confirming){
      if(window.STATE && STATE.draft && STATE.draft.name){
        _confirming = true;
        
        var hasId = !!STATE.draft.id;
        var isSaved = hasId && STATE.draft.updatedAt;
        
        // Cek perubahan signifikan
        var msg = isSaved 
          ? "💾 Simpan perubahan dulu?\n\n• OK = Simpan lalu keluar\n• Cancel = Keluar tanpa simpan"
          : "⚠️ Bio belum pernah disimpan!\n\n• OK = Simpan lalu keluar\n• Cancel = Keluar tanpa simpan";
        
        var choice = confirm(msg);
        _confirming = false;
        
        if(choice){
          // Save dulu
          try{
            if(window.PageEditor && window.PageEditor.save){
              window.PageEditor.save();
              setTimeout(function(){
                _origNavigate.call(window.Router, path);
              }, 800);
              return;
            }
          }catch(e){ console.warn("save:", e); }
        }
        // Cancel → keluar tanpa save (langsung)
      }
    }
    
    return _origNavigate.call(this, path);
  };
  
  console.log("✅ Router navigate patched");
  
  // Patch juga untuk tombol back editor
  setTimeout(function(){
    var backBtn = document.getElementById("btn-back-dashboard");
    if(backBtn){
      // Clone buat hapus listener lama
      var newBtn = backBtn.cloneNode(true);
      backBtn.parentNode.replaceChild(newBtn, backBtn);
      
      newBtn.addEventListener("click", function(){
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        if(hashPath === "/editor" && window.STATE && STATE.draft && STATE.draft.name){
          var isSaved = STATE.draft.id && STATE.draft.updatedAt;
          var msg = isSaved 
            ? "💾 Simpan perubahan dulu?\n\n• OK = Simpan\n• Cancel = Keluar tanpa simpan"
            : "⚠️ Bio belum disimpan!\n\n• OK = Simpan dulu\n• Cancel = Keluar tanpa simpan";
          
          var choice = confirm(msg);
          if(choice){
            if(window.PageEditor && window.PageEditor.save){
              window.PageEditor.save();
              setTimeout(function(){
                window.Router.navigate("/dashboard");
              }, 800);
              return;
            }
          }
        }
        window.Router.navigate("/dashboard");
      });
      console.log("✅ Back button patched");
    }
  }, 3000);
}, 2000);

var VarsmileDrag = {
  _el: null, _isDragging: false,
  _startX: 0, _startY: 0,
  _startLeft: 0, _startTop: 0,
  _moved: false, _attached: false,
  
  init: function(){
    var self = this;
    setInterval(function(){ self._attach(); }, 1500);
    setTimeout(function(){ self._attach(); }, 500);
  },
  
  _attach: function(){
    var vs = document.getElementById("varsmile-char");
    if(!vs) return;
    if(vs.dataset.dragAttached === "1") return;
    vs.dataset.dragAttached = "1";
    
    var self = this;
    this._el = vs;
    
    // Position absolute dari awal
    var rect = vs.getBoundingClientRect();
    vs.style.right = "auto";
    vs.style.bottom = "auto";
    vs.style.left = rect.left + "px";
    vs.style.top = rect.top + "px";
    
    // Restore saved position
    this.restorePosition();
    
    // Mouse events
    vs.addEventListener("mousedown", function(e){ self._onStart(e); });
    document.addEventListener("mousemove", function(e){ self._onMove(e); });
    document.addEventListener("mouseup", function(e){ self._onEnd(e); });
    
    // Touch events
    vs.addEventListener("touchstart", function(e){ self._onStart(e); }, { passive: false });
    document.addEventListener("touchmove", function(e){ self._onMove(e); }, { passive: false });
    document.addEventListener("touchend", function(e){ self._onEnd(e); });
    
    console.log("✅ Varsmile drag attached");
  },
  
  _onStart: function(e){
    if(!this._el) return;
    var touch = e.touches ? e.touches[0] : e;
    this._isDragging = true;
    this._moved = false;
    this._startX = touch.clientX;
    this._startY = touch.clientY;
    
    var rect = this._el.getBoundingClientRect();
    this._startLeft = rect.left;
    this._startTop = rect.top;
    
    this._el.classList.add("dragging");
  },
  
  _onMove: function(e){
    if(!this._isDragging || !this._el) return;
    if(e.cancelable) e.preventDefault();
    
    var touch = e.touches ? e.touches[0] : e;
    var dx = touch.clientX - this._startX;
    var dy = touch.clientY - this._startY;
    
    if(Math.abs(dx) > 5 || Math.abs(dy) > 5) this._moved = true;
    
    var newLeft = this._startLeft + dx;
    var newTop = this._startTop + dy;
    
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var vsW = this._el.offsetWidth || 72;
    var vsH = this._el.offsetHeight || 88;
    
    newLeft = Math.max(4, Math.min(vw - vsW - 4, newLeft));
    newTop = Math.max(4, Math.min(vh - vsH - 4, newTop));
    
    this._el.style.left = newLeft + "px";
    this._el.style.top = newTop + "px";
  },
  
  _onEnd: function(e){
    if(!this._isDragging || !this._el) return;
    
    var self = this;
    this._isDragging = false;
    this._el.classList.remove("dragging");
    
    if(!this._moved) return;
    
    var rect = this._el.getBoundingClientRect();
    var dx = rect.left - this._startLeft;
    var dy = rect.top - this._startTop;
    
    var animClass = "move-side";
    if(dy < -30) animClass = "move-up";
    else if(dy > 30) animClass = "move-down";
    else if(Math.abs(dx) > 20) animClass = "move-side";
    
    this._el.classList.add(animClass);
    setTimeout(function(){
      if(self._el) self._el.classList.remove(animClass);
    }, 600);
    
    if(window.Sound && Sound.tick) Sound.tick();
    
    try{
      localStorage.setItem("varlinkbio_varsmile_pos", JSON.stringify({
        left: rect.left, top: rect.top
      }));
    }catch(e){}
  },
  
  restorePosition: function(){
    try{
      var saved = localStorage.getItem("varlinkbio_varsmile_pos");
      if(!saved) return;
      var pos = JSON.parse(saved);
      var vs = document.getElementById("varsmile-char");
      if(!vs) return;
      if(pos.left && pos.top){
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var vsW = vs.offsetWidth || 72;
        var vsH = vs.offsetHeight || 88;
        pos.left = Math.max(4, Math.min(vw - vsW - 4, pos.left));
        pos.top = Math.max(4, Math.min(vh - vsH - 4, pos.top));
        vs.style.left = pos.left + "px";
        vs.style.top = pos.top + "px";
        vs.style.right = "auto";
        vs.style.bottom = "auto";
      }
    }catch(e){}
  }
};

var VarsmileAIPage = {

  _escape: function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); },

  _icon: function(name){

    };

function hookVarsmileClick(){

    startY = e.clientY;
    startTime = Date.now();
  });
  
  vs.addEventListener("pointerup", function(e){
    var dx = Math.abs(e.clientX - startX);
    var dy = Math.abs(e.clientY - startY);
    var dt = Date.now() - startTime;
    
    // Kalau geser > 10px atau lama > 500ms → dianggap drag, bukan klik

    if(window.Sound && Sound.click) Sound.click();

  console.log("✅ Varsmile click → AI page hooked");

/* Rebuild MusicPlayer dengan mode support */
setTimeout(function(){
  // Cari MusicPlayer yang ada
  if(!window.MusicPlayer){
    console.warn("⚠️ MusicPlayer belum ada");
    return;
  }
  
  var MP = window.MusicPlayer;
  
  // Override _onEnded handler
  if(MP._audio){
    // Reset handlers dulu
    try{
      MP._audio.onended = null;
    }catch(e){}
    
    MP._audio.addEventListener("ended", async function(){
      try{
        var mode = MusicModeManager.getMode();
        console.log("🎵 Music ended, mode:", mode);
        
        if(mode === "tetap"){
          // Ulang lagu yang sama
          MP._audio.currentTime = 0;
          MP._audio.play().catch(function(){});
          return;
        }
        
        if(mode === "auto"){
          // Auto pindah ke lagu berikutnya
          var queue = [];
          try{
            var raw = localStorage.getItem("varlinkbio_playlist_pref");
            if(raw){
              var p = JSON.parse(raw);
              if(p && Array.isArray(p.queue)) queue = p.queue;
            }
          }catch(e){}
          
          if(!queue.length){
            // Kalau gak ada playlist, ulang lagu yang sama
            MP._audio.currentTime = 0;
            MP._audio.play().catch(function(){});
            return;
          }
          
          var currentId = MP._current ? MP._current.id : null;
          var curIdx = queue.indexOf(currentId);
          var nextIdx = (curIdx === -1) ? 0 : ((curIdx + 1) % queue.length);
          var nextId = queue[nextIdx];
          
          // Load lagu berikutnya dari MusicLibrary
          if(window.MusicLibrary){
            var nextMusic = await MusicLibrary.getById(nextId);
            if(nextMusic && nextMusic.url){
              MP._current = nextMusic;
              MP._audio.src = nextMusic.url;
              MP._audio.play().catch(function(){});
              console.log("🎵 Auto next:", nextMusic.title);
            }
          }
          return;
        }
        
        if(mode === "acak"){
          // Pilih lagu acak dari playlist
          var queue2 = [];
          try{
            var raw2 = localStorage.getItem("varlinkbio_playlist_pref");
            if(raw2){
              var p2 = JSON.parse(raw2);
              if(p2 && Array.isArray(p2.queue)) queue2 = p2.queue;
            }
          }catch(e){}
          
          if(!queue2.length){
            MP._audio.currentTime = 0;
            MP._audio.play().catch(function(){});
            return;
          }
          
          var currentId2 = MP._current ? MP._current.id : null;
          var candidates = queue2.filter(function(id){ return id !== currentId2; });
          if(!candidates.length) candidates = queue2;
          var pickId = candidates[Math.floor(Math.random() * candidates.length)];
          
          if(window.MusicLibrary){
            var pickMusic = await MusicLibrary.getById(pickId);
            if(pickMusic && pickMusic.url){
              MP._current = pickMusic;
              MP._audio.src = pickMusic.url;
              MP._audio.play().catch(function(){});
              console.log("🎵 Shuffle:", pickMusic.title);
            }
          }
          return;
        }
      }catch(e){
        console.warn("music ended handler:", e);
      }
    });
    
    // Set loop berdasarkan mode
    MP._audio.loop = (MusicModeManager.getMode() === "tetap");
  }
  
  console.log("✅ MusicPlayer mode handler attached");
}, 3000);

  },
  
  _formatText: function(text){
    return text.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  },
  
  _findElement: function(selector){
    var selectors = selector.split(",").map(function(s){ return s.trim(); });
    for(var i = 0; i < selectors.length; i++){
      var el = document.querySelector(selectors[i]);
      if(el) return el;
    }
    return null;
  },
  
  _positionAtTarget: function(targetEl, step){
    var rect = targetEl.getBoundingClientRect();
    var pad = 12;
    
    this._spotlight.style.display = "block";
    this._spotlight.style.left = (rect.left - pad) + "px";
    this._spotlight.style.top = (rect.top - pad) + "px";
    this._spotlight.style.width = (rect.width + pad*2) + "px";
    this._spotlight.style.height = (rect.height + pad*2) + "px";
    
    var vsW = 72, vsH = 88;
    var bubbleW = 340, bubbleH = 250;
    var vw = window.innerWidth, vh = window.innerHeight;
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    
    var bubbleX, bubbleY, vsX, vsY;
    
    if(step.position === "top"){
      bubbleX = Math.max(16, Math.min(vw - bubbleW - 16, cx - bubbleW/2));
      bubbleY = Math.max(16, rect.top - bubbleH - 30);
      vsX = Math.max(16, Math.min(vw - vsW - 16, cx + rect.width/2 + 20));
      vsY = Math.max(16, bubbleY + 40);
    } else if(step.position === "bottom"){
      bubbleX = Math.max(16, Math.min(vw - bubbleW - 16, cx - bubbleW/2));
      bubbleY = Math.min(vh - bubbleH - 16, rect.bottom + 30);
      vsX = Math.max(16, Math.min(vw - vsW - 16, cx + rect.width/2 + 20));
      vsY = Math.max(16, bubbleY - vsH + 20);
    } else {
      bubbleX = Math.max(16, Math.min(vw - bubbleW - 16, cx - bubbleW/2));
      bubbleY = Math.min(vh - bubbleH - 16, cy + 60);
      vsX = Math.max(16, Math.min(vw - vsW - 16, cx - vsW/2));
      vsY = cy - vsH - 20;
    }
    
    vsX = Math.max(16, Math.min(vw - vsW - 16, vsX));
    vsY = Math.max(16, Math.min(vh - vsH - 16, vsY));
    
    this._varsmile.style.left = vsX + "px";
    this._varsmile.style.top = vsY + "px";
    
    this._bubble.style.left = bubbleX + "px";
    this._bubble.style.top = bubbleY + "px";
    this._bubble.style.transform = "none";
    
    if(step.requiresTap){
      this._tapHint.style.display = "block";
      this._tapHint.style.left = (cx - 24) + "px";
      this._tapHint.style.top = (cy - 24) + "px";
    } else {
      this._tapHint.style.display = "none";
    }
  },
  
  _positionCenter: function(step){
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var bubbleW = 360;
    var bubbleH = 280;
    var vsW = 72;
    var vsH = 88;
    
    this._spotlight.style.display = "none";
    this._tapHint.style.display = "none";
    
    var bubbleX = (vw - bubbleW) / 2;
    var bubbleY = (vh - bubbleH) / 2 + 40;
    var vsX = (vw - vsW) / 2;
    var vsY = bubbleY - vsH - 10;
    
    this._varsmile.style.left = Math.max(16, vsX) + "px";
    this._varsmile.style.top = Math.max(16, vsY) + "px";
    
    this._bubble.style.left = Math.max(16, bubbleX) + "px";
    this._bubble.style.top = Math.max(16, bubbleY) + "px";
    this._bubble.style.transform = "none";
  },
  
  _autoScroll: function(targetEl){
    var rect = targetEl.getBoundingClientRect();
    var vh = window.innerHeight;
    var pad = 120;
    var needsScroll = rect.top < pad || rect.bottom > (vh - pad);
    if(!needsScroll) return;
    
    try{
      targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
      var self = this;
      setTimeout(function(){
        var step = TUTORIAL_STEPS[self._step];
        if(step && step.target){
          var el = self._findElement(step.target);
          if(el) self._positionAtTarget(el, step);
        }
      }, 800);
    }catch(e){
      var targetY = window.scrollY + rect.top - (vh / 2) + (rect.height / 2);
      window.scrollTo({ top: targetY, behavior: "smooth" });
      var self2 = this;
      setTimeout(function(){
        var step = TUTORIAL_STEPS[self2._step];
        if(step && step.target){
          var el = self2._findElement(step.target);
          if(el) self2._positionAtTarget(el, step);
        }
      }, 800);
    }
  },
  
  _setupTapRequirement: function(selector, step){
    var self = this;
    var targets = selector.split(",").map(function(s){ return s.trim(); });
    
    var cleanupList = [];
    var timeoutId = null;
    
    function handleTap(e){
      e.preventDefault();
      e.stopPropagation();
      
      console.log("👆 User tapped: " + step.id);
      if(window.Sound && Sound.success) Sound.success();
      
      cleanup();
      setTimeout(function(){ self._next(); }, 400);
    }
    
    function cleanup(){
      cleanupList.forEach(function(item){
        try{ item.el.removeEventListener(item.type, item.fn, true); }catch(e){}
      });
      cleanupList = [];
      if(timeoutId) clearTimeout(timeoutId);
    }
    
    targets.forEach(function(sel){
      var el = document.querySelector(sel);
      if(el){
        el.addEventListener("click", handleTap, true);
        cleanupList.push({ el: el, type: "click", fn: handleTap });
        var preventTouch = function(e){ if(e.cancelable) e.preventDefault(); };
        el.addEventListener("touchstart", preventTouch, { passive: false, capture: true });
        cleanupList.push({ el: el, type: "touchstart", fn: preventTouch });
      }
    });
    
    timeoutId = setTimeout(function(){
      console.log("⏱️ Tap timeout, auto-next");
      cleanup();
      self._next();
    }, 30000);
    
    this._cleanupTap = cleanup;
  },
  
  _next: function(){
    if(this._cleanupTap){
      try{ this._cleanupTap(); }catch(e){}
      this._cleanupTap = null;
    }
    
    this._step++;
    if(this._step >= TUTORIAL_STEPS.length){
      this._finish();
    } else {
      this._render();
    }
  },
  
  _finish: async function(skipped){
    var self = this;
    
    if(this._cleanupTap){
      try{ this._cleanupTap(); }catch(e){}
      this._cleanupTap = null;
    }
    
    if(!skipped) this._confetti();
    
    if(this._overlay) this._overlay.classList.remove("active");
    if(this._progress) this._progress.classList.remove("active");
    if(this._counter) this._counter.classList.remove("active");
    
    setTimeout(function(){
      try{ self._overlay && self._overlay.remove(); }catch(e){}
      try{ self._progress && self._progress.remove(); }catch(e){}
      try{ self._counter && self._counter.remove(); }catch(e){}
      
      var realVarsmile = document.getElementById("varsmile-char");
      if(realVarsmile) realVarsmile.style.display = "";
      
      var closeBtn = document.getElementById("varsmile-close-btn");
      if(closeBtn) closeBtn.style.display = "";
      
      self._active = false;
      self._overlay = null;
      self._progress = null;
      self._counter = null;
      
      try{ if(window.Auth && Auth.markTutorialDone) Auth.markTutorialDone(); }catch(e){}
      if(self._onFinish) try{ self._onFinish(skipped); }catch(e){}
      
      if(!skipped){
        if(window.Sound && Sound.tada) Sound.tada();
        if(window.toast) toast("🎉 Tutorial selesai! Selamat berkarya!","success");
      } else {
        if(window.toast) toast("Tutorial di-skip","info");
      }
    }, 500);
  },
  
  _confetti: function(){
    try{
      var colors = ["#ffd700","#ff2a2a","#22c55e","#2563eb","#ff69b4","#a78bfa","#ff8c00"];
      var container = document.createElement("div");
      container.className = "vtut-confetti";
      for(var i = 0; i < 80; i++){
        var piece = document.createElement("div");
        piece.className = "vtut-confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * 0.5) + "s";
        piece.style.animationDuration = (2.5 + Math.random() * 1.5) + "s";
        piece.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
        container.appendChild(piece);
      }
      document.body.appendChild(container);
      setTimeout(function(){ try{ container.remove(); }catch(e){} }, 4000);
    }catch(e){}
  },
  
  _getFallbackSvg: function(){
    return '<svg viewBox="0 0 16 17" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3" width="12" height="7" fill="#ffd700"/><rect x="4" y="5" width="2" height="2" fill="#0a0a0a"/><rect x="10" y="5" width="2" height="2" fill="#0a0a0a"/><rect x="6" y="8" width="4" height="1" fill="#0a0a0a"/><rect x="5" y="13" width="6" height="2" fill="#2563eb"/></svg>';
  }
};

/* ─── Fix Keluar Editor ─── */
setTimeout(function(){
  if(!window.Router) return;
  
  var _origNavigate = window.Router.navigate;
  var _bypassConfirm = false;
  
  window.Router.navigate = function(path){
    var hashPath = (location.hash.slice(1) || "/").split("?")[0];
    
    if(hashPath === "/editor" && path !== "/editor" && !_bypassConfirm){
      if(window.STATE && STATE.draft && STATE.draft.name){
        var isSaved = STATE.draft.id && STATE.draft.updatedAt;
        var msg = isSaved 
          ? "💾 Simpan perubahan dulu?\n\n• OK = Simpan lalu keluar\n• Cancel = Keluar tanpa simpan"
          : "⚠️ Bio belum pernah disimpan!\n\n• OK = Simpan lalu keluar\n• Cancel = Keluar tanpa simpan";
        
        var choice = confirm(msg);
        
        if(choice){
          _bypassConfirm = true;
          try{
            if(window.PageEditor && window.PageEditor.save){
              var result = window.PageEditor.save();
              if(result && typeof result.then === "function"){
                result.then(function(){
                  _bypassConfirm = false;
                  _origNavigate.call(window.Router, path);
                }).catch(function(e){
                  _bypassConfirm = false;
                  setTimeout(function(){ _origNavigate.call(window.Router, path); }, 200);
                });
              } else {
                setTimeout(function(){
                  _bypassConfirm = false;
                  _origNavigate.call(window.Router, path);
                }, 800);
              }
              return;
            }
          }catch(e){}
          
          _bypassConfirm = false;
          _origNavigate.call(this, path);
          return;
        } else {
          _bypassConfirm = true;
          setTimeout(function(){
            _bypassConfirm = false;
            _origNavigate.call(window.Router, path);
          }, 50);
          return;
        }
      }
    }
    
    return _origNavigate.call(this, path);
  };
  
  console.log("✅ Router.navigate editor-exit patched");
}, 2000);

/* ─── Fix Explore Bio (no composite index) ─── */
setTimeout(function(){
  if(!window.Store) return;
  
  window.Store.listDirectory = async function(filter, search){
    filter = filter || "all";
    search = search || "";
    
    try{
      var snap = await FB.db.collection("bios").limit(200).get();
      var arr = [];
      
      snap.forEach(function(d){
        var data = d.data();
        if(data.allowDirectory !== true) return;
        if(filter !== "all" && data.ownerPlan !== filter) return;
        
        if(search){
          var q = search.toLowerCase();
          var hay = ((data.name || "") + " " + (data.bio || "") + " " + (data.slug || "")).toLowerCase();
          if(hay.indexOf(q) === -1) return;
        }
        
        arr.push(Object.assign({ id: d.id }, data));
      });
      
      var planOrder = { ultimate: 0, developer: 0, pro: 1, starter: 2, free: 3 };
      arr.sort(function(a, b){
        var pa = planOrder[a.ownerPlan] != null ? planOrder[a.ownerPlan] : 4;
        var pb = planOrder[b.ownerPlan] != null ? planOrder[b.ownerPlan] : 4;
        if(pa !== pb) return pa - pb;
        return ((b.stats && b.stats.views) || 0) - ((a.stats && a.stats.views) || 0);
      });
      
      STATE.directory = arr;
      console.log("✅ Explore loaded: " + arr.length + " bios (scanned: " + snap.size + ")");
      return arr;
    }catch(e){
      console.error("❌ listDirectory error:", e);
      STATE.directory = [];
      return [];
    }
  };
  
  console.log("✅ Store.listDirectory patched");
}, 3000);
