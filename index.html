  async start(){
    if(!Auth.current) return;
    this._steps = this.buildSteps();
    this._step = 0;
    
    try{
      this._overlay = document.createElement("div");
      this._overlay.className = "tut-overlay";
      this._overlay.id = "tut-overlay";
      document.body.appendChild(this._overlay);
      
      this.render();
      
      setTimeout(()=>this._overlay.classList.add("active"), 20);
      
      document.addEventListener("keydown", this._keyHandler = (e)=>{
        if(e.key === "Escape"){ this.skip(); }
        if(e.key === "ArrowRight"){ this.next(); }
        if(e.key === "ArrowLeft"){ this.prev(); }
      });
      
      Sound.ding();
    }catch(e){ console.warn("Tutorial.start:", e); }
  },
  
  render(){
    if(!this._overlay) return;
    const s = this._steps[this._step];
    if(!s) return;
    
    const total = this._steps.length;
    const cur = this._step + 1;
    const pct = Math.round((cur/total)*100);
    
    this._overlay.innerHTML = `
      <div class="tut-dialog">
        <div class="tut-steps-bar">
          ${this._steps.map((_,i)=>`
            <div class="tut-step-dot ${i < this._step ? 'done' : (i === this._step ? 'active' : '')}"></div>
          `).join("")}
        </div>
        
        <div class="tut-header">
          <span class="tut-counter">${cur} / ${total}</span>
          <span class="tut-time">~${Math.ceil((total - this._step) * 0.5)} detik lagi</span>
          <button class="tut-close" id="tut-close">${ico('x')}</button>
        </div>
        
        <div class="tut-body">
          <div class="tut-icon ${s.color}">${s.icon}</div>
          <div class="tut-subtitle">${esc(s.subtitle)}</div>
          <div class="tut-title">${esc(s.title)}</div>
          <div class="tut-desc">${s.desc}</div>
          
          <div class="tut-info-box">
            ${s.info.map(i=>`
              <div class="tut-info-item">
                <span class="bullet">${i.bullet}</span>
                <span class="txt">${i.txt}</span>
              </div>
            `).join("")}
          </div>
          
          ${this._step === total - 1 ? `
            <div class="tut-highlight">
              🎉 <b>Selamat!</b> Kamu udah selesai tutorial. Yuk langsung bikin bio pertamamu!
            </div>
          ` : `
            <div class="tut-highlight">
              💡 <b>Tips:</b> Tutorial ini bisa diulang kapan saja di <b>Settings → Tutorial Onboarding</b>.
            </div>
          `}
        </div>
        
        <div class="tut-footer">
          ${this._step > 0 ? `<button class="btn tut-btn-secondary" id="tut-prev">← Kembali</button>` : `<button class="btn tut-btn-secondary" id="tut-skip">Lewati</button>`}
          <button class="btn btn-primary tut-btn" id="tut-next">
            ${this._step === total - 1 ? '🚀 Mulai Sekarang' : 'Lanjut →'}
          </button>
        </div>
      </div>
    `;
    
    const nc = $("#tut-close", this._overlay);
    if(nc) nc.addEventListener("click", ()=>this.skip());
    const nk = $("#tut-skip", this._overlay);
    if(nk) nk.addEventListener("click", ()=>this.skip());
    const np = $("#tut-prev", this._overlay);
    if(np) np.addEventListener("click", ()=>this.prev());
    const nn = $("#tut-next", this._overlay);
    if(nn) nn.addEventListener("click", ()=>this.next());
    
    this.applyHighlight(s.highlight);
    
    if(this._step === total - 1) this.confetti();
  },
  
  applyHighlight(elementId){
    if(this._highlightEl){
      try{ this._highlightEl.classList.remove("tut-highlight-target"); }catch(e){}
      this._highlightEl = null;
    }
    if(this._autoScrollTimer){ clearInterval(this._autoScrollTimer); this._autoScrollTimer = null; }
    
    if(!elementId) return;
    
    try{
      const el = document.getElementById(elementId);
      if(!el) return;
      
      this._highlightEl = el;
      el.classList.add("tut-highlight-target");
      
      setTimeout(()=>{
        try{
          el.scrollIntoView({ behavior:"smooth", block:"center" });
        }catch(e){}
      }, 300);
    }catch(e){ console.warn("applyHighlight:", e); }
  },
  
  next(){
    if(this._step < this._steps.length - 1){
      this._step++;
      Sound.click();
      this.render();
    } else {
      this.finish();
    }
  },
  
  prev(){
    if(this._step > 0){
      this._step--;
      Sound.click();
      this.render();
    }
  },
  
  skip(){
    if(!confirm("Yakin mau skip tutorial?")) return;
    this.finish(true);
  },
  
  async finish(skipped=false){
    try{
      if(this._highlightEl){
        try{ this._highlightEl.classList.remove("tut-highlight-target"); }catch(e){}
        this._highlightEl = null;
      }
      if(this._autoScrollTimer){ clearInterval(this._autoScrollTimer); this._autoScrollTimer = null; }
      if(this._keyHandler) document.removeEventListener("keydown", this._keyHandler);
      
      if(this._overlay){
        this._overlay.classList.remove("active");
        setTimeout(()=>{
          try{ this._overlay.remove(); }catch(e){}
          this._overlay = null;
        }, 400);
      }
      
      try{ await Auth.markTutorialDone(); }catch(e){}
      
      if(!skipped){
        Sound.tada();
        toast("🎉 Tutorial selesai! Selamat berkarya!","success");
      } else {
        toast("Tutorial di-skip","info");
      }
    }catch(e){ console.warn("Tutorial.finish:", e); }
  },
  
  confetti(){
    try{
      if(!this._overlay) return;
      const colors = ["#ffd700","#ff2a2a","#22c55e","#2563eb","#ff69b4","#a78bfa","#ff8c00"];
      const container = document.createElement("div");
      container.className = "tut-confetti";
      for(let i=0;i<60;i++){
        const piece = document.createElement("div");
        piece.className = "tut-confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        piece.style.animationDuration = (2.5 + Math.random()*1.5) + "s";
        piece.style.transform = `rotate(${Math.random()*360}deg)`;
        container.appendChild(piece);
      }
      this._overlay.appendChild(container);
      setTimeout(()=>container.remove(), 4000);
    }catch(e){}
  }
};

      snap.forEach(d => users.push({ id:d.id, ...d.data() }));
      
      if(this.state.filter !== "all"){
        users = users.filter(u => (u.plan||"free") === this.state.filter);
      }
      if(this.state.search){
        const q = this.state.search;
        users = users.filter(u => 
          (u.name||"").toLowerCase().includes(q) ||
          (u.email||"").toLowerCase().includes(q)
        );
      }
      
      users.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      
      if(!users.length){
        wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">😶 Gak ada user.</div></div>`;

                    <b>${esc(u.name||"(No name)")}${isDevUser?' <span style="color:var(--red)">DEV</span>':''}</b>
                    <span>${esc(u.email||"")} ${verifyIcon}</span>
                    <span style="font-size:10.5px;opacity:.7">

                    <button class="btn btn-sm" data-user-plan="${u.id}|ultimate">Ultimate</button>
                    <button class="btn btn-sm" data-user-kredit="${u.id}">💰 Kredit</button>
                    <button class="btn btn-sm btn-red" data-user-del="${u.id}">🗑️</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
      
      wrap.querySelectorAll("[data-user-plan]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const [uid, plan] = btn.dataset.userPlan.split("|");
          if(!confirm(`Set plan user ini ke ${plan}?`)) return;
          try{
            await FB.db.collection("users").doc(uid).update({ plan });
            toast(`✅ Plan → ${plan}`,"success");
            this.renderUsers();
          }catch(e){ toast("Gagal: "+e.message,"error"); }
        });
      });
      
      wrap.querySelectorAll("[data-user-kredit]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const uid = btn.dataset.userKredit;
          const input = prompt("Tambah kredit (bisa minus untuk kurang):","100");
          if(input === null) return;
          const amount = parseInt(input);
          if(isNaN(amount)){ toast("Angka gak valid","error"); return; }
          try{
            const doc = await FB.db.collection("users").doc(uid).get();
            const cur = doc.data()?.kredit || 0;
            await FB.db.collection("users").doc(uid).update({ kredit: Math.max(0, cur + amount) });
            toast(`✅ Kredit ${amount>=0?"+":""}${amount}`,"success");
            this.renderUsers();
          }catch(e){ toast("Gagal: "+e.message,"error"); }
        });

        btn.addEventListener("click", async ()=>{

          if(!confirm("Hapus user ini? (data Firestore aja, bukan Auth)")) return;
          try{
            await FB.db.collection("users").doc(uid).delete();
            toast("User dihapus","success");
            this.renderUsers();
          }catch(e){ toast("Gagal: "+e.message,"error"); }

    }

  async renderMaintenance(){
    const wrap = $("#dev-content");
    if(!wrap) return;
    wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">⏳ Memuat status...</div></div>`;
    
    try{
      const doc = await FB.db.collection("settings").doc("app").get();
      const data = doc.exists ? doc.data() : {};
      const m = data.maintenance || {};

      const until = m.until || 0;
      const reason = m.reason || "Sedang ada perbaikan";
      
      const now = Date.now();
      const remaining = until > 0 ? Math.max(0, until - now) : 0;
      const remainingMin = Math.floor(remaining / 60000);
      
      wrap.innerHTML = `
        <div class="dev-manager">
          <div class="dev-manager-head">
            <div class="mgr-title">🔧 Maintenance Mode</div>
          </div>

              <div class="maint-status-text">
                <div class="msl">Status</div>
                <div class="msv">${active?'MAINTENANCE ON':'NORMAL'}</div>

                <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px">⏱️ Auto Unlock Dalam</div>

                <div style="font-size:10.5px;opacity:.7">Until: ${new Date(until).toLocaleString("id-ID")}</div>
              </div>
            ` : ''}
            ${active && !until ? `
              <div style="background:rgba(255,255,255,.5);border-radius:8px;padding:10px;margin-bottom:10px;text-align:center;font-size:12px;font-weight:700">
                🔒 Manual mode — harus dibuka manual

            ` : ''}
          </div>
          
          <div style="background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:12px">
            <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;color:var(--ink-soft)">📋 Alasan:</div>
            <input type="text" id="maint-reason" value="${esc(reason)}" placeholder="Alasan maintenance..." 
              style="width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px"/>
            
            <div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;color:var(--ink-soft)">⏱️ Durasi:</div>
            <div class="maint-duration-grid">
              <div class="maint-duration-btn" data-min="15">15 menit</div>
              <div class="maint-duration-btn" data-min="30">30 menit</div>
              <div class="maint-duration-btn" data-min="60">1 jam</div>
              <div class="maint-duration-btn" data-min="120">2 jam</div>
              <div class="maint-duration-btn" data-min="360">6 jam</div>
              <div class="maint-duration-btn" data-min="1440">1 hari</div>
              <div class="maint-duration-btn" data-min="0">Manual</div>
            </div>
          </div>
          
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${active
              ? `<button class="btn btn-green btn-block" id="maint-off">✅ MATIKAN MAINTENANCE</button>`
              : `<button class="btn btn-red btn-block" id="maint-on">🔧 AKTIFKAN MAINTENANCE</button>`
            }
          </div>
          
          <div style="background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:12px;margin-top:14px;font-size:11.5px;font-weight:600;line-height:1.6">
            <b>💡 Info:</b>
            <ul style="margin-left:16px;margin-top:6px">
              <li>User yang buka web bakal lihat halaman maintenance</li>
              <li>Auto-refresh tiap 5 detik buat cek unlock</li>
              <li>Developer (kamu) bypass, tetap bisa akses</li>
              <li>Durasi "Manual" = gak auto-unlock, harus dibuka manual</li>
            </ul>
          </div>
        </div>
      `;
      
      let selectedMin = null;
      wrap.querySelectorAll(".maint-duration-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          wrap.querySelectorAll(".maint-duration-btn").forEach(x=>x.classList.remove("active"));
          btn.classList.add("active");
          selectedMin = parseInt(btn.dataset.min);
        });
      });
      
      const onBtn = $("#maint-on");
      if(onBtn) onBtn.addEventListener("click", async ()=>{
        if(selectedMin === null){ toast("Pilih durasi dulu!","error"); return; }
        const reasonText = $("#maint-reason")?.value.trim() || "Sedang ada perbaikan";
        const until = selectedMin > 0 ? Date.now() + selectedMin*60000 : 0;
        if(!confirm(`Aktifkan maintenance ${selectedMin > 0 ? selectedMin+' menit' : 'manual'}?`)) return;
        showLoading("Mengaktifkan...");

          await FB.db.collection("settings").doc("app").set({
            maintenance: {
              active: true,
              reason: reasonText,
              until: until,
              startedAt: Date.now(),
              startedBy: Auth.current.email

        }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
      });
      
      const offBtn = $("#maint-off");
      if(offBtn) offBtn.addEventListener("click", async ()=>{
        if(!confirm("Matikan maintenance?")) return;
        showLoading("Mematikan...");
        try{
          await FB.db.collection("settings").doc("app").set({
            maintenance: {
              active: false,
              reason: "",
              until: 0,
              endedAt: Date.now(),
              endedBy: Auth.current.email
            }
          }, { merge:true });
          hideLoading();
          toast("✅ Maintenance OFF","success");
          Sound.success();
          this.renderMaintenance();
        }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
      });
      
    }catch(e){
      wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">😵 ${esc(e.message)}</div></div>`;
    }
  },
  
  async renderFavicon(){
    const wrap = $("#dev-content");
    if(!wrap) return;
    wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">⏳ Memuat favicon...</div></div>`;
    
    try{
      const settings = await Store.getSettings();
      const favicon = settings.favicon || "";
      
      wrap.innerHTML = `
        <div class="favicon-panel">
          <div class="fp-card">
            <div style="font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px">
              ${ico('star')} Favicon Aplikasi
            </div>
            
            <div class="favicon-preview-big">
              <div class="fp-thumb" id="fav-thumb">
                ${favicon ? `<img src="${esc(favicon)}" id="fav-preview-img">` : `<span style="font-size:36px">🌐</span>`}
              </div>
            </div>
            
            <p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:14px;text-align:center;line-height:1.6">
              Upload favicon custom. Max 100KB. Format PNG/ICO/SVG.
            </p>
            
            <label style="display:block;margin-bottom:10px">
              <input type="file" id="fav-file" accept="image/*" style="display:none"/>
              <div class="btn btn-primary btn-block" style="cursor:pointer">📤 Upload Favicon</div>
            </label>
            
            ${favicon ? `<button class="btn btn-red btn-block" id="fav-clear">🗑️ Hapus Favicon Custom</button>` : ''}
          </div>
        </div>
      `;
      
      const favFile = $("#fav-file");
      if(favFile) favFile.addEventListener("change", async e=>{
        const f = e.target.files[0]; if(!f) return;
        if(f.size > 100*1024){ toast("File max 100KB!","error"); return; }
        showLoading("Upload...");
        try{
          const dataUrl = await new Promise((res, rej)=>{
            const r = new FileReader();
            r.onload = ()=>res(r.result);
            r.onerror = ()=>rej(new Error("Gagal baca file"));
            r.readAsDataURL(f);
          });
          await Store.saveSettings({ favicon: dataUrl });
          hideLoading();
          toast("✅ Favicon diupdate!","success");
          Sound.tada();
          
          let links = document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']");
          if(!links.length){
            const link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
            links = [link];
          }
          links.forEach(l => l.href = dataUrl);
          
          this.renderFavicon();
        }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
      });
      
      const clearBtn = $("#fav-clear");
      if(clearBtn) clearBtn.addEventListener("click", async ()=>{
        if(!confirm("Hapus favicon custom?")) return;
        try{
          await Store.saveSettings({ favicon: "" });
          toast("Favicon dihapus","success");
          this.renderFavicon();
        }catch(e){ toast("Gagal: "+e.message,"error"); }
      });
      
    }catch(e){
      wrap.innerHTML = `<div class="dev-manager"><div class="mgr-empty">😵 ${esc(e.message)}</div></div>`;
    }
  },
  
  async renderTutorialReset(){
    const wrap = $("#dev-content");
    if(!wrap) return;
    
    wrap.innerHTML = `
      <div class="dev-manager">
        <div class="dev-manager-head">
          <div class="mgr-title">📚 Tutorial Management</div>
        </div>
        
        <div style="background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:20px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px">
          <div style="font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:12px">📖 Tutorial Onboarding</div>
          <p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);line-height:1.7;margin-bottom:16px">
            Tutorial otomatis muncul saat user pertama kali login/dashboard.
            Ada <b>10 step interaktif</b> dengan highlight element.
          </p>
          
          <button class="btn btn-primary btn-block" id="tut-test" style="margin-bottom:8px">▶️ Jalankan Tutorial Sekarang</button>
          <button class="btn btn-yellow btn-block" id="tut-reset-all" style="margin-bottom:8px">🔄 Reset Tutorial Semua User</button>
        </div>
        
        <div style="background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:12px;font-size:11.5px;font-weight:600;line-height:1.6">
          ⚠️ <b>Warning:</b> Reset semua user bakal munculin tutorial lagi ke SEMUA user di login berikutnya.
        </div>
      </div>
    `;
    
    const testBtn = $("#tut-test");
    if(testBtn) testBtn.addEventListener("click", ()=>{
      try{
        if(typeof Tutorial !== "undefined"){
          Tutorial.start();
        } else {
          toast("Tutorial module belum load","error");
        }
      }catch(e){ toast("Error: "+e.message,"error"); }
    });
    
    const resetAllBtn = $("#tut-reset-all");
    if(resetAllBtn) resetAllBtn.addEventListener("click", async ()=>{
      if(!confirm("Reset tutorial untuk SEMUA user? Ini bisa banyak request Firestore.")) return;
      if(!confirm("Yakin banget? Tekan OK buat lanjut.")) return;
      showLoading("Resetting...");
      try{
        const snap = await FB.db.collection("users").get();
        const batch = FB.db.batch();
        let count = 0;
        snap.forEach(doc=>{
          batch.update(doc.ref, { tutorialShown: false, tutorialCompletedAt: null });
          count++;
        });
        await batch.commit();
        hideLoading();
        toast(`✅ ${count} user di-reset`,"success");
        Sound.tada();
      }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
    });
  }
};

    }catch(e){
      console.error("buildHTML:", e);
      return `<!DOCTYPE html><html><body style="font-family:sans-serif;padding:40px;text-align:center">
        <h1>⚠️ Error</h1><p>${esc(e.message)}</p></body></html>`;
    }
  },
  
  renderBadge(bio){
    const plan = bio.ownerPlan || "free";
    if(plan === "free") return "";
    const map = { starter:"STARTER", pro:"PRO", ultimate:"ULTIMATE" };
    const label = map[plan];
    if(!label) return "";
    return `<div class="bio-plan-badge ${plan}">${label}</div>`;
  },
  
  renderLinks(bio, preview){
    try{
      const links = Array.isArray(bio.links) ? bio.links.filter(l => l.active !== false) : [];
      if(!links.length){
        return `<div style="text-align:center;padding:20px;font-size:12.5px;font-weight:700;opacity:.7">Belum ada link.</div>`;
      }
      
      return links.map((l, i) => {
        const url = l.url || "#";
        const label = l.label || "Link";
        const bgColor = l.color || "";
        const delay = (i * 0.05).toFixed(2);
        const iconName = LinkTypes.icon(url);
        
        if(l.type === "featured" && l.thumb){
          const bg = bgColor || "#ffffff";
          const fg = contrastText(bg);
          const ratio = l.featRatio === "1:1" ? "1/1" : (l.featRatio === "4:3" ? "4/3" : (l.featRatio === "auto" ? "auto" : "16/9"));
          const posX = l.featPosX ?? 50;
          const posY = l.featPosY ?? 50;
          const zoom = l.featZoom ?? 1;
          const pad = l.featPadding ?? 10;
          
          return `<a class="bio-link bio-featured" href="${esc(url)}" target="_blank" rel="noopener"
            data-idx="${i}"
            style="animation-delay:${delay}s;--feat-bg:${bg};--feat-fg:${fg};
              --feat-ratio:${ratio};--feat-pos-x:${posX}%;--feat-pos-y:${posY}%;
              --feat-zoom:${zoom};--feat-padding:${pad}px">
            <div class="feat-img-wrap">
              <img class="feat-img" src="${esc(l.thumb)}" alt="${esc(label)}"/>
            </div>
            <div class="feat-body"><b>${esc(label)}</b></div>
          </a>`;
        }
        
        if(["youtube","spotify","vimeo","tiktok"].includes(l.type)){
          const embedUrl = LinkTypes.embed(url);
          if(embedUrl){
            return `<div class="bio-embed" style="animation-delay:${delay}s">
              <iframe src="${esc(embedUrl)}" allowfullscreen loading="lazy"
                allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe>
            </div>`;
          }
        }
        
        const customStyle = bgColor ? `background:${bgColor};color:${contrastText(bgColor)}` : "";
        return `<a class="bio-link" href="${esc(url)}" target="_blank" rel="noopener"
          data-idx="${i}" style="animation-delay:${delay}s;${customStyle}">
          <span class="licon">${this.iconSVG(iconName)}</span>
          <span class="ltext">${esc(label)}</span>
        </a>`;
      }).join("");
    }catch(e){ console.warn("renderLinks:", e); return ""; }
  },
  
  iconSVG(name){
    const icons = {
      link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
      instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
      tiktok:'<path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>',
      youtube:'<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>',

      twitter:'<path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>',
      video:'<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
      mail:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
      user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'

    const d = icons[name] || icons.link;
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  },
  
  renderLockHTML(){
    return `
      <div class="lock-overlay" id="lock-overlay">
        <div class="lock-card">
          <div class="li">🔒</div>
          <h3>Bio Dikunci</h3>
          <p>Masukkan password untuk melihat bio ini.</p>
          <input type="password" id="lock-input" placeholder="Password" autofocus/>
          <div class="lock-err" id="lock-err"></div>
          <button id="lock-submit">Buka Bio</button>
        </div>
      </div>`;
  },
  
  async render(idOrSlug){
    try{
      document.body.classList.add("public-mode");
      
      const app = $("#app");
      if(app) app.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;font-family:sans-serif;background:#f0ebe0"><div style="text-align:center"><div style="font-size:48px;margin-bottom:12px">⏳</div><div style="font-weight:800;text-transform:uppercase;letter-spacing:1px">Memuat bio...</div></div></div>`;
      
      let bio = null;
      try{
        const doc = await FB.db.collection("bios").doc(idOrSlug).get();
        if(doc.exists) bio = { id:doc.id, ...doc.data() };
      }catch(e){}
      
      if(!bio){
        try{
          const q = await FB.db.collection("bios").where("slug","==",idOrSlug).limit(1).get();
          if(!q.empty){
            const doc = q.docs[0];
            bio = { id:doc.id, ...doc.data() };
          }
        }catch(e){}
      }
      
      if(!bio){
        if(app) app.innerHTML = `
          <div class="bio-error">
            <div class="icon">🔍</div>
            <h1>Bio Tidak Ditemukan</h1>
            <p>URL yang kamu buka gak ada atau udah dihapus.</p>
            <a href="${APP_BASE_URL}/#/register">Bikin Bio Kamu →</a>
          </div>
        `;
        return;
      }
      
      try{
        const today = new Date().toISOString().slice(0,10);
        await FB.db.collection("bios").doc(bio.id).update({
          "stats.views": firebase.firestore.FieldValue.increment(1),
          [`stats.daily.${today}.views`]: firebase.firestore.FieldValue.increment(1)
        });
      }catch(e){}
      
      const html = this.buildHTML(bio, { preview:false });
      
      if(app){
        app.innerHTML = "";
        const iframe = document.createElement("iframe");
        iframe.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:none;background:transparent";
        iframe.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox");
        iframe.srcdoc = html;
        app.appendChild(iframe);
      }
      
      document.title = (bio.name || "Link in Bio") + " — Varlinkbio";
      
      setTimeout(()=>{
        try{
          const iframe = document.querySelector("#app iframe");
          if(!iframe) return;
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if(!doc) return;
          doc.querySelectorAll(".bio-link[data-idx]").forEach(el=>{
            el.addEventListener("click", async ()=>{
              const idx = el.getAttribute("data-idx");
              const today = new Date().toISOString().slice(0,10);
              try{
                await FB.db.collection("bios").doc(bio.id).update({
                  [`stats.clicks.${idx}`]: firebase.firestore.FieldValue.increment(1),
                  [`stats.daily.${today}.clicks`]: firebase.firestore.FieldValue.increment(1)
                });
              }catch(e){}
            });
          });
        }catch(e){ console.warn("Click bind:", e); }
      }, 600);
      
    }catch(e){
      console.error("PagePublic.render:", e);
      const app = $("#app");
      if(app) app.innerHTML = `
        <div class="bio-error">
          <div class="icon">⚠️</div>
          <h1>Terjadi Error</h1>
          <p>${esc(e.message)}</p>
          <a href="${APP_BASE_URL}/#/register">Buka Varlinkbio →</a>
        </div>
      `;
    }
  }
};

/* =========================================================
   BOOT v26 — INIT APLIKASI
   ========================================================= */
async function boot(){
  try{
    console.log("%c╔════════════════════════════════════════╗","color:#ffd700;font-weight:bold");
    console.log("%c║  VARLINKBIO v26 — SUPER UPDATE         ║","color:#ffd700;font-weight:bold");
    console.log("%c║  by Varoo                              ║","color:#ffd700;font-weight:bold");
    console.log("%c╚════════════════════════════════════════╝","color:#ffd700;font-weight:bold");
    
    showLoading("Memuat aplikasi...");
    
    // 1. Init Sound + StepsSound
    try{ Sound.init(); }catch(e){}
    try{ StepsSound.init(); }catch(e){}
    
    // 2. Handle Google redirect
    try{
      const redirectResult = await Auth.handleRedirectResult();
      if(redirectResult && redirectResult.__error){
        console.warn("Redirect error:", redirectResult.__error);
        if(redirectResult.__error.code !== "auth/no-auth-event" && redirectResult.__error.code !== "auth/null-user"){
          setTimeout(()=>toast("Login Google gagal: " + Auth.errMsg(redirectResult.__error.code), "error"), 600);
        }
      }
      if(redirectResult && redirectResult.uid){
        const from = sessionStorage.getItem("varlinkbio_redirect_from");
        if(from){
          try{ sessionStorage.removeItem("varlinkbio_redirect_from"); }catch(e){}
          setTimeout(()=>{ location.replace(location.pathname + from); }, 300);
        }
      }
    }catch(e){ console.warn("handleRedirectResult:", e); }
    
    // 3. Init Auth
    await Auth.init();
    
    // 4. Apply user preferences
    if(Auth.current){
      try{
        applyStyleUI(STATE.styleUI || "brutalism");
        applyWarnaUI(STATE.warnaUI || "neo-cream");
      }catch(e){}
    } else {
      try{
        applyStyleUI("brutalism");
        applyWarnaUI("neo-cream");
      }catch(e){}
    }
    
    // 5. Load user plan
    if(Auth.current){
      await loadUserPlan();
    } else {
      STATE.plan = PLANS.free;
    }
    
    // 6. Apply favicon
    try{ await applyAppFavicon(); }catch(e){}
    
    // 7. Bind global sound
    try{ bindGlobalSound(); }catch(e){}
    
    // 8. Check maintenance SEBELUM router start
    try{
      const maint = await checkMaintenance();
      if(maint && maint.active){
        renderMaintenancePage(maint);
        hideLoading();
        return;
      }
    }catch(e){ console.warn("checkMaintenance:", e); }
    
    // 9. Register routes
    registerRoutes();
    
    // 10. Start router
    Router.start();
    
    // 11. Init Varsmile
    if(Auth.current && STATE.varsmileEnabled){
      setTimeout(()=>{
        try{
          Varsmile.init();
        }catch(e){ console.warn("Varsmile.init:", e); }
      }, 1200);
    }
    
    // 12. Tutorial auto-start
    if(Auth.current && !Auth.current.tutorialShown){
      setTimeout(()=>{
        try{
          const hashPath = (location.hash.slice(1) || "/").split("?")[0];
          if(hashPath === "/dashboard"){
            Tutorial.start();
          }
        }catch(e){ console.warn("Tutorial auto-start:", e); }
      }, 2000);
    }
    
    // 13. Auto-save interval
    setInterval(()=>{
      try{
        const hashPath = (location.hash.slice(1) || "/").split("?")[0];
        if(hashPath === "/editor" && Auth.current && STATE.draft && STATE.draft.name){
          AutoSave.fire();
        }
      }catch(e){}
    }, 30000);
    
    // 14. Cleanup on hash change
    window.addEventListener("hashchange", ()=>{
      try{
        const hashPath = (location.hash.slice(1) || "/").split("?")[0];
        const drawer = document.getElementById("lt-drawer");
        if(drawer) drawer.classList.remove("open");
        if(!hashPath.startsWith("/u/")){
          document.body.classList.remove("public-mode");
        }
        // Re-init Varsmile di halaman baru
        if(Auth.current && STATE.varsmileEnabled && !hashPath.startsWith("/u/")){
          // Biarkan page render yang handle
        }
      }catch(e){}
    });
    
    // 15. Welcome log
    if(Auth.current){
      console.log("%c✓ Login sebagai: " + Auth.current.email, "color:#22c55e;font-weight:bold");
    } else {
      console.log("%c○ Belum login", "color:#ffd700;font-weight:bold");
    }
    
    hideLoading();
    console.log("%c🚀 Varlinkbio v26 siap digunakan!","color:#22c55e;font-weight:bold;font-size:14px");
    
  }catch(e){
    console.error("❌ Boot error:", e);
    hideLoading();
    try{
      const app = $("#app");
      if(app){
        app.innerHTML = `
          <div class="auth-page">
            <div class="auth-card" style="text-align:center">
              <div style="font-size:56px;margin-bottom:12px">💥</div>
              <h2>Gagal Memuat</h2>
              <p class="auth-sub">Terjadi error saat boot aplikasi.</p>
              <div style="background:var(--red);color:#fff;padding:12px;border-radius:8px;font-family:monospace;font-size:11px;word-break:break-all;margin-bottom:14px;text-align:left">${esc(e.message)}</div>
              <button class="btn btn-primary btn-block" onclick="location.reload()">🔄 Reload Halaman</button>
            </div>
          </div>
        `;
      }
    }catch(err){}
  }
}

try{

        if(!this._active) return;
        
        this._setMode("walking-out");
        if(window.Sound && Sound.tick) Sound.tick();
        
        setTimeout(function(){
          if(!self._active) return;
          self._step2_hide();
        }, C.WALK_OUT_DURATION);
      },
      
      _step2_hide(){
        var self = this;
        var C = this.CONFIG;
        if(!this._active) return;
        
        this._setMode("hide");
        
        setTimeout(function(){
          if(!self._active) return;
          self._step3_peek();
        }, C.HIDE_DURATION);
      },
      
      _step3_peek(){
        var self = this;
        var C = this.CONFIG;
        if(!self._active || !self._el) return;
        
        // Reset posisi ke kanan biar peek keliatan dari bawah
        self._el.classList.remove("walking-out");
        self._el.classList.remove("walking-in");
        self._el.style.right = "16px";
        
        this._setMode("peek");
        
        setTimeout(function(){
          if(!self._active) return;
          self._step4_comeUp();
        }, C.PEEK_DURATION);
      },
      
      _step4_comeUp(){
        var self = this;
        var C = this.CONFIG;
        if(!self._active) return;
        
        this._setMode("talk");
        
        // Ngomong tips
        var tip = this.TIPS_RANDOM[Math.floor(Math.random()*this.TIPS_RANDOM.length)];
        this.showBubble(tip, C.TIP_SHOW_DURATION);
        if(window.Sound && Sound.bip) Sound.bip();
        
        setTimeout(function(){
          if(!self._active) return;
          self._step5_backToIdle();
        }, C.TIP_SHOW_DURATION);
      },
      
      _step5_backToIdle(){
        var self = this;
        if(!self._active) return;
        
        this._setMode("idle");
        this._idleCycle();

      /* ─── LOGIN MODE ─── */
      startLoginMode(){

        this._setMode("peek");
        
        if(this._tipTimer) clearInterval(this._tipTimer);
        this._tipTimer = setInterval(function(){
          if(self._mode !== "peek") return;
          var tip = self.TIPS_LOGIN[Math.floor(Math.random()*self.TIPS_LOGIN.length)];

      runAway3D(){

        this.showBubble("AYOOO MARI KITA MENUJU RUMAH! 🏠", 2500);

        this._mode = "hidden";

  /* ═══════════════════════════════════════════════════════════
     MUSIC SYSTEM v26 — Cloudinary
     ═══════════════════════════════════════════════════════════ */
  function buildMusicSystem(){
    return {
      _audio:null,
      _current:null,
      _btn:null,
      _toast:null,
      
      /* ─── INIT ─── */
      async init(){
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        
        // Buat audio element
        if(!this._audio){
          this._audio = new Audio();
          this._audio.loop = true;
          this._audio.volume = 0.5;
        }
        
        // Cek user preference
        var pref = this._getUserPref();
        
        // Kalau user matiin music → gak play
        if(pref.enabled === false) return;
        
        // Ambil music yang harus diputar
        var musicData = await this._resolveMusic();
        if(!musicData || !musicData.url) return;
        
        this._current = musicData;
        
        // Buat tombol float
        this._renderButton();
        
        // Coba autoplay
        this._tryAutoplay();
      },
      
      /* ─── RESOLVE MUSIC ─── */
      async _resolveMusic(){
        try{
          var hashPath = (location.hash.slice(1) || "/").split("?")[0];
          
          // Kalau public bio → pakai music dari bio
          if(hashPath.startsWith("/u/")){
            var slug = hashPath.slice(3);
            // Cek dari cache dulu
            if(window._currentPublicBio && window._currentPublicBio.musicId){
              return await this._getMusicById(window._currentPublicBio.musicId);
            }
            // Kalau gak ada, ambil dari default
          }
          
          // Kalau user login & punya preference
          if(window.Auth && Auth.current){
            var pref = this._getUserPref();
            if(pref.musicId){
              var m = await this._getMusicById(pref.musicId);
              if(m) return m;
            }
          }
          
          // Fallback ke default
          return await this._getDefaultMusic();
        }catch(e){
          console.warn("_resolveMusic:", e);
          return null;
        }
      },
      
      async _getMusicById(id){
        try{
          var doc = await window.FB.db.collection("music_library").doc(id).get();
          if(doc.exists) return { id:doc.id, ...doc.data() };
          return null;
        }catch(e){ return null; }
      },
      
      async _getDefaultMusic(){
        try{
          var q = await window.FB.db.collection("music_library").where("isDefault","==",true).limit(1).get();
          if(!q.empty){
            var doc = q.docs[0];
            return { id:doc.id, ...doc.data() };
          }
          // Kalau gak ada default, ambil sembarang
          var q2 = await window.FB.db.collection("music_library").limit(1).get();
          if(!q2.empty){
            var doc2 = q2.docs[0];
            return { id:doc2.id, ...doc2.data() };
          }
          return null;
        }catch(e){ return null; }
      },
      
      /* ─── USER PREFERENCE ─── */
      _getUserPref(){
        try{
          var raw = localStorage.getItem("varlinkbio_music_pref");
          if(raw) return JSON.parse(raw);
        }catch(e){}
        return { enabled:true, musicId:null };
      },
      
      _setUserPref(pref){
        try{
          localStorage.setItem("varlinkbio_music_pref", JSON.stringify(pref));
        }catch(e){}
      },
      
      /* ─── RENDER BUTTON ─── */
      _renderButton(){
        if(this._btn){ try{ this._btn.remove(); }catch(e){} }
        if(!this._current || !this._current.url) return;
        
        var self = this;
        var btn = document.createElement("div");
        btn.className = "music-float-btn";
        btn.id = "music-float-btn";
        btn.innerHTML = '<span class="music-icon">🔇</span>';
        btn.title = "Music: " + (this._current.title || "Untitled");
        document.body.appendChild(btn);
        this._btn = btn;
        
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          self._toggle();
        });
        
        // Cek state audio
        if(!this._audio.paused){
          btn.classList.add("playing");
          btn.innerHTML = '<span class="music-icon">🔊</span>';
        }
      },
      
      /* ─── TRY AUTOPLAY ─── */
      _tryAutoplay(){
        var self = this;
        if(!this._audio || !this._current) return;
        
        this._audio.src = this._current.url;
        
        var promise = this._audio.play();
        if(promise && promise.catch){
          promise.then(function(){
            if(self._btn){
              self._btn.classList.add("playing");
              self._btn.innerHTML = '<span class="music-icon">🔊</span>';
            }
            console.log("🎵 Music autoplay OK");
          }).catch(function(err){
            console.log("🎵 Autoplay diblokir:", err.message);
            // Show toast
            self._showToast("🔇 Tap tombol musik buat nyalain");
          });
        }
        
        // Fallback: play pas user klik apapun
        var clickHandler = function(){
          if(self._audio && self._audio.paused && self._current){
            self._audio.play().then(function(){
              if(self._btn){
                self._btn.classList.add("playing");
                self._btn.innerHTML = '<span class="music-icon">🔊</span>';
              }
            }).catch(function(){});
          }
          document.removeEventListener("click", clickHandler);
        };
        document.addEventListener("click", clickHandler, { once: true });
      },
      
      /* ─── TOGGLE ─── */
      _toggle(){
        var self = this;
        if(!this._audio || !this._current) return;
        
        if(this._audio.paused){
          this._audio.play().then(function(){
            if(self._btn){
              self._btn.classList.add("playing");
              self._btn.innerHTML = '<span class="music-icon">🔊</span>';
            }
            self._setUserPref({ enabled: true, musicId: self._current.id });
            self._showToast("🎵 " + (self._current.title || "Music"));
          }).catch(function(err){
            self._showToast("❌ Gagal: " + err.message);
          });
        } else {
          this._audio.pause();
          if(this._btn){
            this._btn.classList.remove("playing");
            this._btn.innerHTML = '<span class="music-icon">🔇</span>';
          }
          this._setUserPref({ enabled: false, musicId: this._current.id });
          this._showToast("🔇 Music dimatiin");
        }
      },
      
      /* ─── SHOW TOAST ─── */
      _showToast(text){
        var self = this;
        if(this._toast){ try{ this._toast.remove(); }catch(e){} }
        
        var t = document.createElement("div");
        t.className = "music-toast";
        t.textContent = text;
        document.body.appendChild(t);
        this._toast = t;
        
        setTimeout(function(){
          if(self._toast === t){
            t.classList.add("hide");
            setTimeout(function(){
              try{ t.remove(); }catch(e){}
              if(self._toast === t) self._toast = null;
            }, 400);
          }
        }, 3000);
      },
      
      /* ─── SET MUSIC ─── */
      async setMusicForBio(bioId, musicId){
        try{
          await window.FB.db.collection("bios").doc(bioId).update({
            musicId: musicId
          });
          toast("✅ Music bio diupdate!","success");
          return true;
        }catch(e){
          toast("Gagal: " + e.message,"error");
          return false;
        }
      },
      
      async setUserMusic(musicId){
        this._setUserPref({ enabled: true, musicId: musicId });
        var self = this;
        var m = await this._getMusicById(musicId);
        if(m){
          this._current = m;
          this._audio.src = m.url;
          this._audio.play().then(function(){
            if(self._btn){
              self._btn.classList.add("playing");
              self._btn.innerHTML = '<span class="music-icon">🔊</span>';
            }
          }).catch(function(){});
        }
        toast("✅ Music dipilih!","success");
      },
      
      stop(){
        if(this._audio){
          this._audio.pause();
          this._audio.currentTime = 0;
        }
        if(this._btn){ try{ this._btn.remove(); }catch(e){} this._btn = null; }
        if(this._toast){ try{ this._toast.remove(); }catch(e){} this._toast = null; }
      },
      
      /* ─── UPLOAD KE CLOUDINARY ─── */
      async uploadToCloudinary(file, onProgress){
        return new Promise(function(resolve, reject){
          var formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", CLOUDINARY.uploadPreset);
          formData.append("folder", CLOUDINARY.folder);
          
          var isVideo = file.type.startsWith("video/");
          var resourceType = isVideo ? "video" : "auto";
          
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY.cloudName + "/" + resourceType + "/upload");
          
          xhr.upload.onprogress = function(e){
            if(e.lengthComputable && onProgress){
              var pct = Math.round((e.loaded / e.total) * 100);
              onProgress(pct);
            }
          };
          
          xhr.onload = function(){
            if(xhr.status === 200){
              try{
                var data = JSON.parse(xhr.responseText);
                resolve({
                  url: data.secure_url,
                  publicId: data.public_id,
                  format: data.format,
                  duration: data.duration || 0,
                  bytes: data.bytes,
                  isVideo: isVideo
                });
              }catch(e){ reject(new Error("Response error")); }
            } else {
              var errMsg = "Upload gagal (HTTP " + xhr.status + ")";
              try{
                var errData = JSON.parse(xhr.responseText);
                if(errData.error && errData.error.message) errMsg = errData.error.message;
              }catch(e){}
              reject(new Error(errMsg));
            }
          };
          
          xhr.onerror = function(){ reject(new Error("Network error")); };
          
          xhr.send(formData);
        });
      }
    };
  }

    }

<script id="music-v26-js">
/* ═══════════════════════════════════════════════════════════════
   PATCH MUSIC v26 — Full System
   ═══════════════════════════════════════════════════════════════ */
(function(){
  "use strict";
  console.log("%c🎵 Patch Music v26 loading...","color:#ffd700;font-weight:bold");

  /* ═══════════════════════════════════════════════════════════
     CLOUDINARY CONFIG
     ═══════════════════════════════════════════════════════════ */
  var CLOUDINARY = {
    cloudName: "lcceusqr",
    uploadPreset: "Varlinkbio",
    folder: "varlinkbio/music",
    maxSizeMB: 10,
    allowedFormats: ["mp3","wav","m4a","mp4","webm","ogg"]
  };

  /* ═══════════════════════════════════════════════════════════
     UTILS
     ═══════════════════════════════════════════════════════════ */
  function el(html){
    var d = document.createElement("div");
    d.innerHTML = html.trim();
    return d.firstChild;
  }
  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function waitFor(condition, timeout){
    return new Promise(function(resolve, reject){
      var start = Date.now();
      var iv = setInterval(function(){
        if(condition()){ clearInterval(iv); resolve(true); }
        else if(Date.now() - start > (timeout || 5000)){ clearInterval(iv); reject(new Error("Timeout")); }
      }, 100);
    });
  }

  /* ═══════════════════════════════════════════════════════════
     CLOUDINARY UPLOADER
     ═══════════════════════════════════════════════════════════ */
  function uploadToCloudinary(file, onProgress){
    return new Promise(function(resolve, reject){
      var formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY.uploadPreset);
      formData.append("folder", CLOUDINARY.folder);
      
      var isVideo = file.type.startsWith("video/");
      var resourceType = isVideo ? "video" : "auto";
      
      var xhr = new XMLHttpRequest();
      xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY.cloudName + "/" + resourceType + "/upload");
      
      xhr.upload.onprogress = function(e){
        if(e.lengthComputable && onProgress){
          var pct = Math.round((e.loaded / e.total) * 100);
          onProgress(pct);
        }
      };
      
      xhr.onload = function(){
        if(xhr.status === 200){
          try{
            var data = JSON.parse(xhr.responseText);
            resolve({
              url: data.secure_url,
              publicId: data.public_id,
              format: data.format,
              duration: data.duration || 0,
              bytes: data.bytes,
              isVideo: isVideo,
              resourceType: data.resource_type
            });
          }catch(e){ reject(new Error("Response error")); }
        } else {
          var errMsg = "Upload gagal (HTTP " + xhr.status + ")";
          try{
            var errData = JSON.parse(xhr.responseText);
            if(errData.error && errData.error.message) errMsg = errData.error.message;
          }catch(e){}
          reject(new Error(errMsg));
        }
      };
      
      xhr.onerror = function(){ reject(new Error("Network error")); };
      xhr.send(formData);
    });
  }

  /* ═══════════════════════════════════════════════════════════
     MUSIC LIBRARY (Firestore)
     ═══════════════════════════════════════════════════════════ */
  var MusicLibrary = {
    COLLECTION: "music_library",
    
    async list(){
      try{
        var snap = await window.FB.db.collection(this.COLLECTION).get();
        var arr = [];
        snap.forEach(function(d){ arr.push({ id:d.id, ...d.data() }); });
        arr.sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
        return arr;
      }catch(e){
        console.warn("MusicLibrary.list:", e);
        return [];
      }
    },
    
    async add(data){
      try{
        var ref = await window.FB.db.collection(this.COLLECTION).add({
          title: data.title || "Untitled",
          artist: data.artist || "Unknown",
          url: data.url,
          publicId: data.publicId,
          format: data.format,
          duration: data.duration || 0,
          bytes: data.bytes || 0,
          isVideo: data.isVideo || false,
          isDefault: false,
          createdAt: Date.now(),
          createdBy: window.Auth.current ? window.Auth.current.email : "unknown"
        });
        return ref.id;
      }catch(e){
        console.error("MusicLibrary.add:", e);
        throw e;
      }
    },
    
    async update(id, data){
      try{
        await window.FB.db.collection(this.COLLECTION).doc(id).update(data);
        return true;
      }catch(e){ throw e; }
    },
    
    async remove(id){
      try{
        // Hapus dari Firestore (file di Cloudinary tetap ada, tapi gak ke-list)
        await window.FB.db.collection(this.COLLECTION).doc(id).delete();
        return true;
      }catch(e){ throw e; }
    },
    
    async setDefault(id){
      try{
        // Reset semua isDefault=false
        var snap = await window.FB.db.collection(this.COLLECTION).get();
        var batch = window.FB.db.batch();
        snap.forEach(function(doc){
          batch.update(doc.ref, { isDefault: false });
        });
        // Set yang baru jadi default
        batch.update(window.FB.db.collection(this.COLLECTION).doc(id), { isDefault: true });
        await batch.commit();
        return true;
      }catch(e){ throw e; }
    },
    
    async getDefault(){
      try{
        var q = await window.FB.db.collection(this.COLLECTION).where("isDefault","==",true).limit(1).get();
        if(!q.empty){
          var doc = q.docs[0];
          return { id:doc.id, ...doc.data() };
        }
        return null;
      }catch(e){ return null; }
    },
    
    async getById(id){
      try{
        var doc = await window.FB.db.collection(this.COLLECTION).doc(id).get();
        if(doc.exists) return { id:doc.id, ...doc.data() };
        return null;
      }catch(e){ return null; }
    }
  };

  /* ═══════════════════════════════════════════════════════════
     MUSIC PLAYER — GLOBAL
     ═══════════════════════════════════════════════════════════ */
  var MusicPlayer = {
    _audio: null,
    _current: null,
    _btn: null,
    _toast: null,
    _initialized: false,
    
    init: function(){
      if(!this._audio){
        this._audio = new Audio();
        this._audio.loop = true;
        this._audio.volume = 0.5;
      }
    },
    
    getPref: function(){
      try{
        var raw = localStorage.getItem("varlinkbio_music_pref");
        if(raw) return JSON.parse(raw);
      }catch(e){}
      return { enabled: true, musicId: null };
    },
    
    setPref: function(pref){
      try{
        localStorage.setItem("varlinkbio_music_pref", JSON.stringify(pref));
      }catch(e){}
    },
    
    /* Cari music yang harus diputar */
    async resolveMusic(){
      try{
        var hashPath = (location.hash.slice(1) || "/").split("?")[0];
        
        // Kalau public bio
        if(hashPath.startsWith("/u/")){
          if(window._publicBioMusicId){
            var m = await MusicLibrary.getById(window._publicBioMusicId);
            if(m) return m;
          }
          // Fallback ke default
          return await MusicLibrary.getDefault();
        }
        
        // Kalau user login
        if(window.Auth && window.Auth.current){
          var pref = this.getPref();
          if(pref.musicId){
            var m2 = await MusicLibrary.getById(pref.musicId);
            if(m2) return m2;
          }
        }
        
        // Fallback default
        return await MusicLibrary.getDefault();
      }catch(e){
        console.warn("resolveMusic:", e);
        return null;
      }
    },
    
    async start(){
      this.init();
      
      // Cek preference
      var pref = this.getPref();
      if(pref.enabled === false){ 
        this._renderButtonOnly();
        return; 
      }
      
      // Resolve music
      var music = await this.resolveMusic();
      if(!music || !music.url){ return; }
      
      this._current = music;
      this._audio.src = music.url;
      
      // Render button
      this._renderButton();
      
      // Try autoplay
      var self = this;
      var p = this._audio.play();
      if(p && p.catch){
        p.then(function(){
          self._btnPlaying(true);
          console.log("🎵 Music autoplay OK:", music.title);
        }).catch(function(err){
          console.log("🎵 Autoplay diblokir:", err.message);
          self._showToast("🔇 Tap tombol musik buat nyalain");
          self._btnPlaying(false);
        });
      }
      
      // Fallback: play pas user klik apapun
      var onceHandler = function(){
        if(self._audio && self._audio.paused && self._current){
          self._audio.play().then(function(){
            self._btnPlaying(true);
          }).catch(function(){});
        }
        document.removeEventListener("click", onceHandler);
      };
      document.addEventListener("click", onceHandler, { once: true });
    },
    
    _renderButtonOnly(){
      // Kalau user matiin → tetap tampilkan tombol (kecil)
      this._renderButton();
      if(this._btn) this._btn.classList.remove("playing");
    },
    
    _renderButton(){
      if(this._btn){ try{ this._btn.remove(); }catch(e){} }
      
      var self = this;
      var btn = document.createElement("div");
      btn.className = "music-float-btn";
      btn.id = "music-float-btn";
      btn.innerHTML = '<span class="music-icon">🔇</span>';
      btn.title = "Toggle Music";
      document.body.appendChild(btn);
      this._btn = btn;
      
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        self.toggle();
      });
    },
    
    _btnPlaying(isPlaying){
      if(!this._btn) return;
      if(isPlaying){
        this._btn.classList.add("playing");
        this._btn.querySelector(".music-icon").textContent = "🔊";
      } else {
        this._btn.classList.remove("playing");
        this._btn.querySelector(".music-icon").textContent = "🔇";
      }
    },
    
    toggle(){
      var self = this;
      
      // Kalau gak ada music, coba resolve lagi
      if(!this._current){
        this.resolveMusic().then(function(m){
          if(m && m.url){
            self._current = m;
            self._audio.src = m.url;
            self._audio.play().then(function(){
              self._btnPlaying(true);
              self._showToast("🎵 " + (m.title || "Music"));
            }).catch(function(e){
              self._showToast("❌ " + e.message);
            });
          } else {
            self._showToast("❌ Belum ada music");
          }
        });
        return;
      }
      
      if(this._audio.paused){
        this._audio.play().then(function(){
          self._btnPlaying(true);
          self.setPref({ enabled: true, musicId: self._current.id });
          self._showToast("🎵 " + (self._current.title || "Music"));
        }).catch(function(err){
          self._showToast("❌ " + err.message);
        });
      } else {
        this._audio.pause();
        this._btnPlaying(false);
        this.setPref({ enabled: false, musicId: this._current.id });
        this._showToast("🔇 Music dimatiin");
      }
    },
    
    _showToast(text){
      var self = this;
      if(this._toast){ try{ this._toast.remove(); }catch(e){} }
      
      var t = document.createElement("div");
      t.className = "music-toast";
      t.textContent = text;
      document.body.appendChild(t);
      this._toast = t;
      
      setTimeout(function(){
        if(self._toast === t){
          t.classList.add("hide");
          setTimeout(function(){
            try{ t.remove(); }catch(e){}
            if(self._toast === t) self._toast = null;
          }, 400);
        }
      }, 3000);
    },
    
    async setUserMusic(musicId){
      this.setPref({ enabled: true, musicId: musicId });
      var m = await MusicLibrary.getById(musicId);
      if(m && m.url){
        this._current = m;
        this._audio.src = m.url;
        var self = this;
        this._audio.play().then(function(){
          self._btnPlaying(true);
        }).catch(function(){});
      }
      window.toast("✅ Music dipilih!","success");
    },
    
    async unsetUserMusic(){
      this.setPref({ enabled: false, musicId: null });
      if(this._audio){
        this._audio.pause();
        this._audio.currentTime = 0;
      }
      this._btnPlaying(false);
      window.toast("🔇 Music dimatiin","info");
    },
    
    stop(){
      if(this._audio){ this._audio.pause(); this._audio.currentTime = 0; }
      if(this._btn){ try{ this._btn.remove(); }catch(e){} this._btn = null; }
      if(this._toast){ try{ this._toast.remove(); }catch(e){} this._toast = null; }
    }
  };

  /* ═══════════════════════════════════════════════════════════
     PAGE: DEV PANEL — MUSIC LIBRARY
     ═══════════════════════════════════════════════════════════ */
  async function renderDevMusicLibrary(){
    var wrap = document.getElementById("dev-content");
    if(!wrap) return;
    
    wrap.innerHTML = '<div class="dev-manager"><div class="mgr-empty">⏳ Memuat music library...</div></div>';
    
    try{
      var list = await MusicLibrary.list();
      
      var html = '';
      
      // Upload zone
      html += '<div class="music-upload-zone" id="music-upload-zone">';
      html += '<input type="file" id="music-file-input" accept="audio/*,video/*"/>';
      html += '<div class="muz-icon">🎵</div>';
      html += '<p>Upload Music</p>';
      html += '<small>MP3, WAV, M4A, MP4, WEBM — Max ' + CLOUDINARY.maxSizeMB + 'MB</small>';
      html += '</div>';
      
      // Progress placeholder
      html += '<div id="music-upload-progress"></div>';
      
      // Grid
      html += '<div class="music-lib-grid">';
      
      if(list.length === 0){
        html += '<div class="music-picker-empty" style="grid-column:1/-1">😶 Belum ada music. Upload dulu di atas.</div>';
      } else {
        list.forEach(function(m){
          html += '<div class="music-card ' + (m.isDefault ? 'is-default' : '') + '" data-music-id="' + m.id + '">';
          if(m.isDefault) html += '<div class="mc-badge">DEFAULT</div>';
          html += '<div class="mc-head">';
          html += '<div class="mc-icon">' + (m.isVideo ? '🎬' : '🎵') + '</div>';
          html += '<div class="mc-info">';
          html += '<div class="mc-title">' + escapeHtml(m.title || 'Untitled') + '</div>';
          html += '<div class="mc-artist">' + escapeHtml(m.artist || 'Unknown') + ' · ' + formatBytes(m.bytes) + '</div>';
          html += '</div>';
          html += '</div>';
          html += '<audio class="mc-audio" controls preload="none" src="' + escapeHtml(m.url) + '"></audio>';
          html += '<div class="mc-actions">';
          if(!m.isDefault){
            html += '<button class="btn btn-sm btn-yellow" data-action="set-default" data-id="' + m.id + '">⭐ Set Default</button>';
          }
          html += '<button class="btn btn-sm" data-action="edit" data-id="' + m.id + '">✏️ Edit</button>';
          html += '<button class="btn btn-sm btn-red" data-action="delete" data-id="' + m.id + '">🗑️</button>';
          html += '</div>';
          html += '</div>';
        });
      }
      
      html += '</div>';
      
      wrap.innerHTML = html;
      
      // Bind upload
      bindUploadZone();
      
      // Bind actions
      wrap.querySelectorAll("[data-action]").forEach(function(btn){
        btn.addEventListener("click", async function(){
          var action = btn.dataset.action;
          var id = btn.dataset.id;
          
          if(action === "set-default"){
            try{
              await MusicLibrary.setDefault(id);
              window.toast("✅ Default music diupdate!","success");
              renderDevMusicLibrary();
            }catch(e){ window.toast("Gagal: " + e.message,"error"); }
          }
          
          if(action === "delete"){
            if(!confirm("Hapus music ini?")) return;
            try{
              await MusicLibrary.remove(id);
              window.toast("Music dihapus","success");
              renderDevMusicLibrary();
            }catch(e){ window.toast("Gagal: " + e.message,"error"); }
          }
          
          if(action === "edit"){
            var music = list.find(function(x){ return x.id === id; });
            if(!music) return;
            var newTitle = prompt("Judul music:", music.title || "");
            if(newTitle === null) return;
            var newArtist = prompt("Artist:", music.artist || "");
            if(newArtist === null) return;
            try{
              await MusicLibrary.update(id, { title: newTitle, artist: newArtist });
              window.toast("✅ Music diupdate!","success");
              renderDevMusicLibrary();
            }catch(e){ window.toast("Gagal: " + e.message,"error"); }
          }
        });
      });
      
    }catch(e){
      wrap.innerHTML = '<div class="dev-manager"><div class="mgr-empty">😵 ' + escapeHtml(e.message) + '</div></div>';
    }
  }
  
  function bindUploadZone(){
    var zone = document.getElementById("music-upload-zone");
    var input = document.getElementById("music-file-input");
    if(!zone || !input) return;
    
    zone.addEventListener("click", function(){ input.click(); });
    
    input.addEventListener("change", async function(e){
      var f = e.target.files[0];
      if(!f) return;
      
      // Validasi ukuran
      var sizeMB = f.size / (1024 * 1024);
      if(sizeMB > CLOUDINARY.maxSizeMB){
        window.toast("File max " + CLOUDINARY.maxSizeMB + "MB! Ukuran: " + sizeMB.toFixed(1) + "MB","error");
        return;
      }
      
      // Validasi format
      var ext = (f.name.split(".").pop() || "").toLowerCase();
      if(CLOUDINARY.allowedFormats.indexOf(ext) === -1){
        window.toast("Format ." + ext + " gak didukung!","error");
        return;
      }
      
      // Konfirmasi judul
      var defaultTitle = f.name.replace(/\.[^.]+$/,"").replace(/[_-]/g," ");
      var title = prompt("Judul music:", defaultTitle);
      if(title === null) return;
      var artist = prompt("Artist:", "Unknown");
      if(artist === null) return;
      
      // Progress
      var progWrap = document.getElementById("music-upload-progress");
      if(progWrap){
        progWrap.innerHTML = '<div class="music-progress">' +
          '<div class="mp-label"><span>⏫ Uploading...</span><span id="music-prog-pct">0%</span></div>' +
          '<div class="mp-bar"><div class="mp-bar-fill" id="music-prog-fill"></div></div>' +
          '</div>';
      }
      
      try{
        var result = await uploadToCloudinary(f, function(pct){
          var fill = document.getElementById("music-prog-fill");
          var pctEl = document.getElementById("music-prog-pct");
          if(fill) fill.style.width = pct + "%";
          if(pctEl) pctEl.textContent = pct + "%";
        });
        
        window.toast("✅ Upload sukses! Menyimpan...","success");
        
        // Simpan ke Firestore
        await MusicLibrary.add({
          title: title.trim() || defaultTitle,
          artist: artist.trim() || "Unknown",
          url: result.url,
          publicId: result.publicId,
          format: result.format,
          duration: result.duration,
          bytes: result.bytes,
          isVideo: result.isVideo
        });
        
        window.toast("🎵 Music berhasil ditambah!","success");
        window.Sound && window.Sound.tada && window.Sound.tada();
        
        renderDevMusicLibrary();
        
      }catch(e){
        window.toast("Gagal upload: " + e.message,"error");
        if(progWrap) progWrap.innerHTML = '';
      }
    });
  }
  
  function formatBytes(bytes){
    if(!bytes) return "—";
    var kb = bytes / 1024;
    if(kb < 1024) return kb.toFixed(0) + " KB";
    return (kb / 1024).toFixed(1) + " MB";
  }

  /* ═══════════════════════════════════════════════════════════
     PAGE: MUSIC PICKER (untuk user)
     ═══════════════════════════════════════════════════════════ */
  var PageMusic = {
    _previewAudio: null,
    _previewId: null,
    
    async render(){
      if(!window.Auth || !window.Auth.current){
        return window.Router.navigate("/login");
      }
      
      var app = document.getElementById("app");
      if(!app) return;
      
      // Render topbar
      app.innerHTML = (typeof window.renderTopbar === "function" ? window.renderTopbar() : "") +
        '<div class="music-picker-page">' +
          '<div class="music-picker-hero">' +
            '<h1>🎵 Music Saya</h1>' +
            '<p>Pilih lagu buat bio kamu</p>' +
          '</div>' +
          '<div id="music-list-wrap">' +
            '<div class="music-picker-empty">⏳ Memuat music...</div>' +
          '</div>' +
        '</div>';
      
      if(typeof window.bindTopbar === "function") window.bindTopbar();
      
      // Load music
      this.loadList();
    },
    
    async loadList(){
      var wrap = document.getElementById("music-list-wrap");
      if(!wrap) return;
      
      try{
        var list = await MusicLibrary.list();
        var pref = MusicPlayer.getPref();
        var selectedId = pref.musicId || null;
        var enabled = pref.enabled !== false;
        
        if(list.length === 0){
          wrap.innerHTML = '<div class="music-picker-empty">😶 Belum ada music. Tunggu admin upload ya!</div>';
          return;
        }
        
        var html = '';
        
        // Tombol matiin music
        html += '<div style="margin-bottom:14px;display:flex;gap:8px">';
        html += '<button class="btn ' + (!enabled ? 'btn-primary' : '') + '" id="music-off-btn" style="flex:1">🔇 Matiin Music</button>';
        html += '</div>';
        
        // List
        list.forEach(function(m){
          var selected = (m.id === selectedId) && enabled;
          html += '<div class="music-picker-item ' + (selected ? 'selected' : '') + '" data-music-id="' + m.id + '">';
          html += '<div class="mpi-play" data-action="preview" data-id="' + m.id + '">▶️</div>';
          html += '<div class="mpi-info">';
          html += '<div class="mpi-title">' + escapeHtml(m.title || 'Untitled') + '</div>';
          html += '<div class="mpi-artist">' + escapeHtml(m.artist || 'Unknown') + (m.isDefault ? ' · ⭐ Default' : '') + '</div>';
          html += '</div>';
          html += '<button class="mpi-select" data-action="select" data-id="' + m.id + '">' + (selected ? 'Dipilih' : 'Pilih') + '</button>';
          html += '<div class="mpi-check">✓</div>';
          html += '</div>';
        });
        
        wrap.innerHTML = html;
        
        // Bind preview
        wrap.querySelectorAll('[data-action="preview"]').forEach(function(el){
          el.addEventListener("click", function(){
            var id = el.dataset.id;
            var music = list.find(function(x){ return x.id === id; });
            if(music) PageMusic.preview(music, el);
          });
        });
        
        // Bind select
        wrap.querySelectorAll('[data-action="select"]').forEach(function(el){
          el.addEventListener("click", async function(){
            var id = el.dataset.id;
            await MusicPlayer.setUserMusic(id);
            PageMusic.loadList();
          });
        });
        
        // Bind matiin
        var offBtn = document.getElementById("music-off-btn");
        if(offBtn) offBtn.addEventListener("click", async function(){
          await MusicPlayer.unsetUserMusic();
          PageMusic.loadList();
        });
        
      }catch(e){
        wrap.innerHTML = '<div class="music-picker-empty">😵 ' + escapeHtml(e.message) + '</div>';
      }
    },
    
    preview(music, btnEl){
      if(this._previewAudio){
        this._previewAudio.pause();
        this._previewAudio = null;
      }
      
      if(this._previewId === music.id){
        this._previewId = null;
        if(btnEl) btnEl.textContent = "▶️";
        return;
      }
      
      this._previewId = music.id;
      this._previewAudio = new Audio(music.url);
      this._previewAudio.volume = 0.6;
      this._previewAudio.play().catch(function(){});
      
      // Update semua tombol
      document.querySelectorAll(".mpi-play").forEach(function(el){ el.textContent = "▶️"; });
      if(btnEl) btnEl.textContent = "⏸️";
      
      var self = this;
      this._previewAudio.onended = function(){
        if(btnEl) btnEl.textContent = "▶️";
        self._previewId = null;
        self._previewAudio = null;
      };
    }
  };

  /* ═══════════════════════════════════════════════════════════
     PATCH: DEV PANEL — Tambah tab "Music Library"
     ═══════════════════════════════════════════════════════════ */
  function patchDevPanelTabs(){
    // Tambah tab baru ke dev panel
    var tabsWrap = document.getElementById("dev-tabs");
    if(!tabsWrap) return;
    
    if(document.getElementById("dev-tab-music-added")) return;
    
    var musicTab = document.createElement("div");
    musicTab.className = "dev-tab";
    musicTab.dataset.tab = "music";
    musicTab.id = "dev-tab-music-added";
    musicTab.textContent = "🎵 Music Library";
    tabsWrap.appendChild(musicTab);
    
    // Bind klik
    musicTab.addEventListener("click", function(){
      document.querySelectorAll("#dev-tabs .dev-tab").forEach(function(t){ t.classList.remove("active"); });
      musicTab.classList.add("active");
      // Update state di PageDev
      if(window.PageDev && window.PageDev.state){
        window.PageDev.state.tab = "music";
      }
      renderDevMusicLibrary();
    });
  }
  
  // Override renderContent di PageDev
  var origRenderContent = null;
  function patchDevPanelRender(){
    if(!window.PageDev) return;
    if(origRenderContent) return; // already patched
    
    origRenderContent = window.PageDev.renderContent;
    window.PageDev.renderContent = async function(){
      // Kalau tab == music → pakai renderer sendiri
      if(this.state && this.state.tab === "music"){
        return await renderDevMusicLibrary();
      }
      return await origRenderContent.call(this);
    };
  }

  /* ═══════════════════════════════════════════════════════════
     PATCH: EDITOR — Tambah section "Music Bio"
     ═══════════════════════════════════════════════════════════ */
  function patchEditorMusicSection(){
    // Cek apakah editor ada di DOM
    var editorPanel = document.querySelector(".editor-panel");
    if(!editorPanel) return;
    
    // Cek apakah section music udah ada
    if(document.getElementById("editor-music-section")) return;
    
    // Cari section terakhir (Tema Warna)
    var themeSection = editorPanel.querySelectorAll(".editor-section");
    var insertAfter = null;
    themeSection.forEach(function(s){
      if(s.querySelector("#theme-grid")) insertAfter = s;
    });
    
    if(!insertAfter) return;
    
    // Buat section music
    var musicSection = document.createElement("div");
    musicSection.className = "editor-section";
    musicSection.id = "editor-music-section";
    musicSection.innerHTML = 
      '<h3><span class="num">🎵</span> Music Bio</h3>' +
      '<div class="editor-music-box">' +
        '<div class="emb-head">🎵 Pilih lagu buat bio ini</div>' +
        '<div id="editor-music-current">' +
          '<div class="emb-current">' +
            '<div class="embi-icon">🔇</div>' +
            '<div class="embi-info">' +
              '<b>Belum ada music</b>' +
              '<span>Tap "Pilih Lagu" buat mulai</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="emb-actions">' +
          '<button class="btn btn-primary" id="editor-pick-music">🎵 Pilih Lagu</button>' +
          '<button class="btn" id="editor-remove-music">🔇 Hapus</button>' +
        '</div>' +
      '</div>';
    
    insertAfter.parentNode.insertBefore(musicSection, insertAfter.nextSibling);
    
    // Update current music
    updateEditorMusicDisplay();
    
    // Bind "Pilih Lagu"
    document.getElementById("editor-pick-music").addEventListener("click", function(){
      // Buka halaman music picker di modal
      openMusicPickerModal();
    });
    
    // Bind "Hapus"
    document.getElementById("editor-remove-music").addEventListener("click", function(){
      if(window.STATE && window.STATE.draft){
        window.STATE.draft.musicId = null;
        updateEditorMusicDisplay();
        window.toast("Music bio dihapus","info");
      }
    });
  }
  
  async function updateEditorMusicDisplay(){
    var wrap = document.getElementById("editor-music-current");
    if(!wrap) return;
    
    var draft = window.STATE && window.STATE.draft;
    if(!draft || !draft.musicId){
      wrap.innerHTML = 
        '<div class="emb-current">' +
          '<div class="embi-icon">🔇</div>' +
          '<div class="embi-info">' +
            '<b>Belum ada music</b>' +
            '<span>Tap "Pilih Lagu" buat mulai</span>' +
          '</div>' +
        '</div>';
      return;
    }
    
    var m = await MusicLibrary.getById(draft.musicId);
    if(!m){
      wrap.innerHTML = 
        '<div class="emb-current">' +
          '<div class="embi-icon">⚠️</div>' +
          '<div class="embi-info">' +
            '<b>Music gak ditemukan</b>' +
            '<span>Mungkin udah dihapus admin</span>' +
          '</div>' +
        '</div>';
      return;
    }
    
    wrap.innerHTML = 
      '<div class="emb-current">' +
        '<div class="embi-icon">🎵</div>' +
        '<div class="embi-info">' +
          '<b>' + escapeHtml(m.title || 'Untitled') + '</b>' +
          '<span>' + escapeHtml(m.artist || 'Unknown') + '</span>' +
        '</div>' +
      '</div>';
  }
  
  async function openMusicPickerModal(){
    var list = await MusicLibrary.list();
    
    if(list.length === 0){
      window.toast("Belum ada music. Tunggu admin upload ya!","info");
      return;
    }
    
    var currentId = window.STATE && window.STATE.draft ? window.STATE.draft.musicId : null;
    
    var html = '<button class="close-x" onclick="this.closest(\'.modal-back\').remove()">×</button>' +
      '<h3>🎵 Pilih Music Bio</h3>' +
      '<p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:12px">Pilih lagu buat bio ini:</p>';
    
    list.forEach(function(m){
      var selected = m.id === currentId;
      html += '<div class="music-picker-item ' + (selected ? 'selected' : '') + '" data-modal-music="' + m.id + '" style="margin-bottom:8px">' +
        '<div class="mpi-play" data-modal-preview="' + m.id + '">▶️</div>' +
        '<div class="mpi-info">' +
          '<div class="mpi-title">' + escapeHtml(m.title || 'Untitled') + '</div>' +
          '<div class="mpi-artist">' + escapeHtml(m.artist || 'Unknown') + '</div>' +
        '</div>' +
        '<button class="mpi-select">' + (selected ? '✓' : 'Pilih') + '</button>' +
        '</div>';
    });
    
    var m = window.openModal ? window.openModal(html) : null;
    if(!m) return;
    
    // Preview audio untuk modal
    var previewAudio = null;
    m.querySelectorAll("[data-modal-preview]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.dataset.modalPreview;
        var music = list.find(function(x){ return x.id === id; });
        if(!music) return;
        
        if(previewAudio){ previewAudio.pause(); previewAudio = null; }
        
        if(el.textContent === "⏸️"){
          el.textContent = "▶️";
          return;
        }
        
        previewAudio = new Audio(music.url);
        previewAudio.volume = 0.6;
        previewAudio.play().catch(function(){});
        el.textContent = "⏸️";
        previewAudio.onended = function(){
          el.textContent = "▶️";
          previewAudio = null;
        };
      });
    });
    
    // Pilih music
    m.querySelectorAll("[data-modal-music]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.modalMusic;
        if(previewAudio){ previewAudio.pause(); previewAudio = null; }
        
        if(window.STATE && window.STATE.draft){
          window.STATE.draft.musicId = id;
        }
        
        m.remove();
        updateEditorMusicDisplay();
        window.toast("✅ Music bio dipilih!","success");
        window.Sound && window.Sound.tada && window.Sound.tada();
      });
    });
  }
