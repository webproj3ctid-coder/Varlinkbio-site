<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>VarlinkB — Link in Bio Generator</title>
<meta name="theme-color" content="#f0ebe0"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><circle cx='50' cy='50' r='22' fill='%23ffd700' stroke='%23fff' stroke-width='4'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f0ebe0;--cream-2:#e8e2d5;--ink:#0a0a0a;--ink-soft:#2a2a2a;
  --red:#ff2a2a;--yellow:#ffd700;--green:#22c55e;--blue:#2563eb;
  --pink:#ff69b4;--purple:#a78bfa;--white:#fff;--orange:#ff8c00;
  --shadow:5px 5px 0 var(--ink);--shadow-sm:3px 3px 0 var(--ink);
  --border:2.5px solid var(--ink);--radius:10px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html,body{height:100%;font-family:var(--font);color:var(--ink);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{background-color:var(--cream);
  background-image:radial-gradient(circle,#0a0a0a 1.2px,transparent 1.2px);
  background-size:16px 16px;min-height:100vh}
#app{min-height:100vh}
body.public-mode{overflow:hidden;height:100vh;height:100dvh}
body.public-mode #app{min-height:0;height:100vh;height:100dvh;overflow:hidden}
.hidden{display:none!important}
a{color:var(--ink);text-decoration:none}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;outline:none;
  transition:transform .1s, box-shadow .1s}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--white);border:var(--border);border-radius:var(--radius);
  padding:12px 14px;outline:none;transition:all .1s;width:100%;font-weight:600}
input:focus,textarea:focus,select:focus{box-shadow:var(--shadow-sm)}
input::placeholder,textarea::placeholder{color:#888;font-weight:500}
textarea{resize:vertical;min-height:80px}

.ic{width:16px;height:16px;display:inline-block;vertical-align:middle;
  stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;
  stroke-linejoin:round;flex-shrink:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:var(--radius);font-weight:800;font-size:13.5px;
  white-space:nowrap;background:var(--white);color:var(--ink);
  border:var(--border);box-shadow:var(--shadow-sm);text-transform:uppercase;
  letter-spacing:.3px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--white)}
.btn-yellow{background:var(--yellow)}
.btn-red{background:var(--red);color:var(--white)}
.btn-green{background:var(--green);color:var(--white)}
.btn-blue{background:var(--blue);color:var(--white)}
.btn-pink{background:var(--pink)}
.btn-orange{background:var(--orange);color:var(--white)}
.btn-sm{padding:8px 12px;font-size:12px}
.btn-lg{padding:15px 22px;font-size:14px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.card{background:var(--white);border:var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px}

#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;
  flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--white);border:var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:10px 14px;font-weight:700;font-size:13px;
  pointer-events:auto;animation:toastIn .18s ease}
.toast.success{background:var(--green);color:var(--white)}
.toast.error{background:var(--red);color:var(--white)}
.toast.info{background:var(--yellow)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

#loading-overlay{position:fixed;inset:0;background:rgba(240,235,224,.85);z-index:10000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:1px}
.loader{width:40px;height:40px;border:4px solid var(--ink);border-top-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.container{max-width:960px;margin:0 auto;padding:0 18px}

/* Topbar */
.lt-topbar{position:sticky;top:0;z-index:100;background:var(--white);
  border-bottom:3px solid var(--ink);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.lt-topbar .lt-brand{display:flex;align-items:center;gap:8px;font-weight:900;
  font-size:16px;text-transform:uppercase;letter-spacing:.5px}
.lt-topbar .lt-brand .lt-logo{width:32px;height:32px;background:var(--ink);
  color:var(--yellow);border-radius:50%;display:grid;place-items:center;
  font-size:15px;font-weight:900;border:2.5px solid var(--ink);
  box-shadow:2px 2px 0 var(--red)}
.lt-topbar .lt-actions{display:flex;gap:6px;align-items:center}
.lt-btn{padding:9px 14px;border-radius:999px;font-weight:800;font-size:12.5px;
  border:2.5px solid var(--ink);background:var(--white);color:var(--ink);
  text-transform:uppercase;letter-spacing:.3px;box-shadow:2px 2px 0 var(--ink);
  display:inline-flex;align-items:center;gap:6px}
.lt-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.lt-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.lt-btn-logout{background:var(--ink);color:var(--white)}
.lt-btn-hamburger{padding:8px;width:38px;height:38px;justify-content:center;border-radius:50%}
.lt-btn-plan{background:var(--yellow)}
@media(max-width:520px){
  .lt-topbar .lt-actions .lt-btn span{display:none}
  .lt-btn{padding:9px 10px}
}

.lt-drawer{position:fixed;inset:0;background:rgba(10,10,10,.6);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .2s}
.lt-drawer.open{opacity:1;pointer-events:auto}
.lt-drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(320px,80vw);
  background:var(--cream);border-left:3px solid var(--ink);
  padding:20px;transform:translateX(100%);transition:transform .25s;
  display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.lt-drawer.open .lt-drawer-panel{transform:translateX(0)}
.lt-drawer-panel h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;
  color:var(--ink-soft);margin-bottom:4px;font-weight:800}
.lt-drawer-panel .user-box{background:var(--white);border:var(--border);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);
  margin-bottom:6px}
.lt-drawer-panel .user-box b{display:block;font-size:15px;text-transform:uppercase;
  font-weight:900;letter-spacing:.3px}
.lt-drawer-panel .user-box span{font-size:12px;color:var(--ink-soft);font-weight:600;
  word-break:break-all}
.plan-badge{display:inline-block;padding:3px 10px;font-size:10px;
  font-weight:900;text-transform:uppercase;letter-spacing:1px;border:2px solid var(--ink);
  border-radius:999px;margin-top:6px;background:var(--yellow)}
.plan-badge.pro{background:var(--blue);color:var(--white)}
.plan-badge.ultimate{background:var(--ink);color:var(--yellow)}
.plan-badge.developer{background:var(--red);color:var(--white)}
.lt-drawer-panel .menu-item{background:var(--white);border:var(--border);
  border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;
  gap:10px;font-weight:800;font-size:13.5px;text-transform:uppercase;
  letter-spacing:.3px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.lt-drawer-panel .menu-item:hover{transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 var(--ink)}
.lt-drawer-panel .menu-item:active{transform:translate(2px,2px);
  box-shadow:0 0 0 var(--ink)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--cream-2)}
::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--cream-2)}

/* Landing */
.landing{min-height:100vh;display:flex;flex-direction:column}
.landing-hero{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:60px 18px 40px;text-align:center}
.hero-logo{width:88px;height:88px;border-radius:50%;background:var(--white);
  border:4px solid var(--ink);box-shadow:6px 6px 0 var(--red);
  display:grid;place-items:center;margin-bottom:24px;transform:rotate(-3deg)}
.hero-logo .ic{width:44px;height:44px}
.landing h1{font-size:clamp(38px,8vw,68px);font-weight:900;letter-spacing:-1.5px;
  margin-bottom:10px;text-transform:uppercase;line-height:1;
  text-shadow:4px 4px 0 var(--yellow)}
.landing p.sub{color:var(--ink);font-size:15px;max-width:460px;margin-bottom:28px;
  font-weight:600;background:var(--white);border:var(--border);padding:10px 16px;
  border-radius:var(--radius);box-shadow:var(--shadow-sm);transform:rotate(-1deg)}
.cta-row{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.cta-row .btn{padding:15px;font-size:14px}
.footer-tag{margin-top:28px;color:var(--ink);font-size:12px;font-weight:700;
  background:var(--white);border:var(--border);padding:5px 12px;border-radius:20px}

/* Pricing */
.pricing-section{padding:40px 18px 60px;background:var(--cream-2);
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.pricing-header{text-align:center;margin-bottom:28px}
.pricing-header h2{font-size:clamp(28px,5vw,40px);font-weight:900;
  text-transform:uppercase;letter-spacing:-.5px;line-height:1.05}
.pricing-header h2 span{background:var(--yellow);border:3px solid var(--ink);
  padding:2px 10px;box-shadow:4px 4px 0 var(--ink);display:inline-block;
  transform:rotate(-1deg);margin-top:6px}
.pricing-header p{margin-top:14px;font-size:14px;font-weight:600}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;max-width:960px;margin:0 auto}
.pricing-card{background:var(--white);border:3px solid var(--ink);border-radius:14px;
  padding:20px;position:relative;box-shadow:6px 6px 0 var(--ink);
  display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s}
.pricing-card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.pricing-card.popular{background:var(--yellow);transform:rotate(-1deg)}
.pricing-card.ultimate-card{background:var(--ink);color:var(--white)}
.pricing-card.ultimate-card .price{color:var(--yellow)}
.pricing-card.ultimate-card .features li::before{color:var(--yellow)}
.pricing-card.ultimate-card .btn{background:var(--yellow);color:var(--ink);
  border-color:var(--white);box-shadow:3px 3px 0 var(--white)}
.pricing-card .pop-badge{position:absolute;top:-14px;right:-8px;background:var(--red);
  color:var(--white);font-size:11px;font-weight:900;padding:4px 10px;
  border:2.5px solid var(--ink);border-radius:999px;text-transform:uppercase;
  letter-spacing:.5px;transform:rotate(8deg);box-shadow:2px 2px 0 var(--ink)}
.pricing-card .plan-name{font-size:22px;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:4px}
.pricing-card .plan-tagline{font-size:12.5px;font-weight:600;opacity:.75;
  margin-bottom:16px;min-height:32px}
.pricing-card .price{font-size:32px;font-weight:900;line-height:1;letter-spacing:-1px}
.pricing-card .price small{font-size:13px;font-weight:700;opacity:.7;letter-spacing:0}
.pricing-card .features{list-style:none;margin:16px 0 20px;flex:1;padding:0}
.pricing-card .features li{font-size:13px;font-weight:600;padding:5px 0 5px 22px;
  position:relative;line-height:1.4}
.pricing-card .features li::before{content:'✓';position:absolute;left:0;
  font-weight:900;font-size:14px;color:var(--green)}

/* Auth */
.auth-page{min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 18px}
.auth-card{width:100%;max-width:400px;background:var(--white);
  border:3px solid var(--ink);border-radius:14px;padding:24px;
  box-shadow:8px 8px 0 var(--ink)}
.auth-card .auth-icon{width:56px;height:56px;background:var(--yellow);
  border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;
  margin:0 auto 14px;box-shadow:3px 3px 0 var(--red);color:var(--ink)}
.auth-card .auth-icon .ic{width:26px;height:26px}
.auth-card h2{font-size:22px;font-weight:900;text-transform:uppercase;
  text-align:center;letter-spacing:-.3px;margin-bottom:6px}
.auth-card p.auth-sub{text-align:center;color:var(--ink-soft);font-size:13px;
  margin-bottom:20px;font-weight:600}
.auth-card .field{margin-bottom:12px}
.auth-card .field label{display:block;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;color:var(--ink)}
.auth-card .btn{padding:14px;font-size:14px;margin-top:6px}
.auth-card .auth-footer{text-align:center;margin-top:16px;font-size:12.5px;
  font-weight:700;color:var(--ink-soft)}
.auth-card .auth-footer a{color:var(--ink);text-decoration:underline;font-weight:900}
.auth-card .err-box{background:var(--red);color:var(--white);border:2.5px solid var(--ink);
  border-radius:var(--radius);padding:10px 12px;font-size:12.5px;font-weight:700;
  margin-bottom:12px;box-shadow:2px 2px 0 var(--ink)}
.auth-card .back-link{display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:700;margin-bottom:14px;text-transform:uppercase;
  letter-spacing:.5px}
.auth-card .back-link:hover{text-decoration:underline}
.auth-card .divider{text-align:center;margin:14px 0;font-size:12px;
  font-weight:700;color:var(--ink-soft)}
.btn-google{background:var(--white)}

/* Dashboard */
.dash{padding-bottom:60px}
.dash-hero{padding:32px 18px 24px;text-align:center}
.dash-hero h2{font-size:clamp(22px,5vw,30px);font-weight:900;letter-spacing:-.5px;
  text-transform:uppercase;display:inline-block;background:var(--yellow);
  border:var(--border);padding:6px 16px;box-shadow:var(--shadow);transform:rotate(-1deg)}
.dash-hero p{color:var(--ink);margin-top:14px;font-weight:600;font-size:14px}
.dash-plan-card{max-width:520px;margin:0 auto 20px;background:var(--white);
  border:3px solid var(--ink);border-radius:14px;padding:16px;
  box-shadow:5px 5px 0 var(--ink);display:flex;align-items:center;gap:14px;
  flex-wrap:wrap}
.dash-plan-card .picon{width:48px;height:48px;border-radius:12px;
  display:grid;place-items:center;flex-shrink:0;border:2.5px solid var(--ink);
  background:var(--yellow)}
.dash-plan-card .picon .ic{width:22px;height:22px}
.dash-plan-card .pinfo{flex:1;min-width:180px}
.dash-plan-card .pinfo b{display:block;font-size:15px;font-weight:900;
  text-transform:uppercase;letter-spacing:.3px}
.dash-plan-card .pinfo span{font-size:12px;font-weight:600;color:var(--ink-soft)}
.dash-actions{margin:24px auto;max-width:420px;display:flex;flex-direction:column;gap:12px}
.dash-actions .btn{padding:16px;font-size:14px}
.dash-info{padding:16px 0}
.section-title{font-size:13px;font-weight:900;margin-bottom:14px;text-transform:uppercase;
  letter-spacing:1px;display:inline-block;background:var(--ink);color:var(--white);
  padding:4px 12px;border-radius:6px}
.features-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.feature-card{background:var(--white);border:var(--border);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow-sm)}
.feature-card .fi{width:34px;height:34px;background:var(--yellow);border:var(--border);
  border-radius:8px;display:grid;place-items:center;margin-bottom:10px;
  box-shadow:2px 2px 0 var(--ink)}
.feature-card h4{font-size:13.5px;margin-bottom:4px;text-transform:uppercase;
  font-weight:900;letter-spacing:.3px}
.feature-card p{color:var(--ink-soft);font-size:12px;line-height:1.5;font-weight:500}
.dash-recent{padding:16px 0}
.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-item{background:var(--white);border:var(--border);border-radius:var(--radius);
  padding:12px 14px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;box-shadow:var(--shadow-sm);transition:transform .1s, box-shadow .1s}
.recent-item:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.recent-item .ri-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.recent-item .ri-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;
  background:var(--yellow);flex-shrink:0;display:grid;place-items:center;
  font-weight:900;color:var(--ink);font-size:14px;overflow:hidden;
  border:2.5px solid var(--ink)}
.recent-item .ri-info{min-width:0;flex:1}
.recent-item .ri-info b{display:block;font-size:13.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:800;text-transform:uppercase;
  letter-spacing:.2px}
.recent-item .ri-info span{color:var(--ink-soft);font-size:11.5px;font-weight:600}
.recent-item .ri-actions{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--white);
  border:2px solid var(--ink);display:grid;place-items:center;
  color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.icon-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.icon-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.icon-btn.danger{background:var(--red);color:var(--white)}
.icon-btn .ic{width:14px;height:14px}
.empty-state{text-align:center;padding:40px 18px;color:var(--ink);
  background:var(--white);border:var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.empty-state .ei{width:60px;height:60px;background:var(--yellow);border:var(--border);
  border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;
  box-shadow:var(--shadow-sm)}
.empty-state .ei .ic{width:28px;height:28px}
.empty-state p{margin-bottom:16px;font-weight:700}

/* Editor */
.editor-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;
  max-width:1180px;margin:0 auto;padding:18px;padding-bottom:60px}
@media(max-width:1024px){.editor-layout{grid-template-columns:1fr}}
.editor-panel{display:flex;flex-direction:column;gap:14px}
.editor-section{background:var(--white);border:var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow-sm)}
.editor-section h3{font-size:12px;font-weight:900;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--white);background:var(--ink);padding:4px 10px;border-radius:6px;
  align-self:flex-start}
.editor-section h3 .num{width:18px;height:18px;border-radius:4px;background:var(--yellow);
  color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:900;flex-shrink:0}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12.5px;color:var(--ink);margin-bottom:5px;
  font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:500}
.locked-hint{background:var(--yellow);border:2px dashed var(--ink);
  border-radius:var(--radius);padding:10px;font-size:12px;font-weight:700;
  text-align:center;margin-top:8px}
.locked-hint a{text-decoration:underline;font-weight:900;cursor:pointer}

.upload-box{border:2.5px dashed var(--ink);border-radius:var(--radius);
  padding:18px;text-align:center;cursor:pointer;transition:all .1s;
  background:var(--cream);position:relative;overflow:hidden}
.upload-box:hover{background:var(--yellow);border-style:solid}
.upload-box .ui{width:36px;height:36px;background:var(--ink);color:var(--yellow);
  border-radius:8px;display:grid;place-items:center;margin:0 auto 8px}
.upload-box p{color:var(--ink);font-size:12.5px;font-weight:800;text-transform:uppercase}
.upload-box small{color:var(--ink-soft);font-size:11px;display:block;margin-top:3px;font-weight:600}
.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-preview{width:100%;height:120px;object-fit:cover;border-radius:var(--radius);
  margin-top:10px;border:var(--border);display:none}
.upload-preview.show{display:block}
.profile-upload{display:flex;flex-direction:column;align-items:center;gap:10px}
.profile-upload .pbox{width:96px;height:96px;border-radius:50%;position:relative;
  border:3px solid var(--ink);overflow:hidden;cursor:pointer;background:var(--yellow);
  box-shadow:var(--shadow-sm);transform:rotate(-3deg)}

.links-list{display:flex;flex-direction:column;gap:8px}

.modal h3{font-size:16px;margin-bottom:14px;text-transform:uppercase;font-weight:900;
  letter-spacing:.3px}
.modal .link-types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.link-type{background:var(--cream);border:2.5px solid var(--ink);border-radius:var(--radius);
  padding:12px;text-align:center;cursor:pointer;transition:all .1s;
  box-shadow:2px 2px 0 var(--ink)}
.link-type:hover{background:var(--yellow);transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 var(--ink)}

  border-radius:6px;display:grid;place-items:center;margin:0 auto 6px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.theme-item{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
  aspect-ratio:1;border:2.5px solid var(--ink);transition:all .1s;
  box-shadow:2px 2px 0 var(--ink)}
.theme-item:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.theme-item.active{border-color:var(--ink);
  box-shadow:0 0 0 3px var(--yellow), 3px 3px 0 var(--ink)}

.theme-item.locked::after{content:'🔒';position:absolute;top:50%;left:50%;

.theme-item.locked:hover{transform:none}
.theme-item .label{position:absolute;bottom:0;left:0;right:0;padding:4px;

.editor-preview{position:sticky;top:70px;align-self:start}

.editor-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}

.qr-box{text-align:center;padding:14px;background:var(--white);border:var(--border);

.upgrade-box{text-align:center}

/* ===== COMPRESS IMAGE (base64) ===== */
function compressImage(file, maxSize=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith("image/")){
      reject(new Error("Hanya file gambar yang didukung (jpg/png/webp)"));
      return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if(width > maxSize || height > maxSize){
        const ratio = Math.min(maxSize/width, maxSize/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob=>{
        if(!blob){ reject(new Error("Compress gagal")); return; }
        const compressed = new File([blob], file.name.replace(/\.[^.]+$/,".jpg"), {
          type: "image/jpeg"
        });
        resolve(compressed);
      }, "image/jpeg", quality);
    };
    img.onerror = ()=>reject(new Error("Gagal baca gambar"));
    img.src = url;
  });
}

    await QRCode.toCanvas(canvasEl, text, { width:220, margin:1,

    return true;

function contrastText(hex){
  if(!hex) return "#0a0a0a";
  const h=hex.replace("#","");
  if(h.length!==6) return "#0a0a0a";
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.6?"#0a0a0a":"#ffffff";
}

        resolve(dataUrl);
      };
      reader.onerror = ()=>reject(new Error("Gagal baca file"));
      reader.readAsDataURL(compressed);
    });
  },
  async trackView(id){
    try{ await FB.db.collection("bios").doc(id).update({
      "stats.views": firebase.firestore.FieldValue.increment(1)
    }); }catch(e){}
  },
  async trackClick(id, idx){
    try{ await FB.db.collection("bios").doc(id).update({
      [`stats.clicks.${idx}`]: firebase.firestore.FieldValue.increment(1)
    }); }catch(e){}
  }
};

/* =========================================================
   ROUTER
   ========================================================= */
const PROTECTED = ["/dashboard","/editor","/manage","/stats","/dev"];
const Router = {
  routes:{},
  on(p,h){ this.routes[p]=h; },
  navigate(p){ if(location.hash.slice(1)===p) this.resolve(); else location.hash=p; },
  resolve(){
    document.body.classList.remove("public-mode");
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    document.body.style.height = '';
    const raw = location.hash.slice(1) || "/";
    const path = raw.split("?")[0];
    const query = raw.split("?")[1] || "";
    if(path.startsWith("/u/")) return (this.routes["/u/:id"]||(()=>{}))(path.slice(3));
    if(PROTECTED.includes(path) && !Auth.current) return this.navigate("/login");
    (this.routes[path]||this.routes["/404"]||(()=>{}))(query);
  },
  start(){ window.addEventListener("hashchange",()=>this.resolve()); this.resolve(); }
};

/* =========================================================
   LINK TYPES
   ========================================================= */
const LinkTypes = {
  detect(url){
    if(!url) return "classic";
    const u=url.toLowerCase();
    if(u.includes("youtube.com")||u.includes("youtu.be")) return "youtube";
    if(u.includes("spotify.com")) return "spotify";
    if(u.includes("tiktok.com")) return "tiktok";
    if(u.includes("vimeo.com")) return "vimeo";
    if(u.includes("instagram.com")) return "instagram";
    if(u.includes("twitter.com")||u.includes("x.com")) return "twitter";
    if(u.includes("wa.me")||u.includes("whatsapp.com")) return "whatsapp";
    return "classic";
  },
  embed(url){
    if(!url) return null;
    const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if(yt) return `https://www.youtube.com/embed/${yt[1]}`;
    const sp = url.match(/spotify\.com\/(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
    if(sp) return `https://open.spotify.com/embed/${sp[1]}/${sp[2]}`;
    const vm = url.match(/vimeo\.com\/(\d+)/);
    if(vm) return `https://player.vimeo.com/video/${vm[1]}`;
    const tt = url.match(/tiktok\.com\/.*\/video\/(\d+)/);
    if(tt) return `https://www.tiktok.com/embed/v2/${tt[1]}`;
    return null;
  },
  icon(url){
    const t=this.detect(url);
    return {youtube:"youtube",spotify:"music",tiktok:"video",vimeo:"video",
      instagram:"instagram",twitter:"message",whatsapp:"whatsapp",classic:"link"}[t]||"link";
  }
};

  renderLinks(){
    const wrap=$("#links-list");
    const links=STATE.draft.links;
    const canFeatured = canDo("featuredLink");
    if(!links.length){ wrap.innerHTML=`<div style="font-size:12.5px;text-align:center;padding:6px;font-weight:600">Belum ada link.</div>`; return; }
    wrap.innerHTML=links.map((l,i)=>{
      const autoColor = NEO_COLORS[i % NEO_COLORS.length];
      const curColor = l.color || NEO_HEX[autoColor];
      return `
      <div class="link-row" draggable="true" data-i="${i}">
        <span class="drag">${ico('grip')}</span>
        <div class="link-thumb">${l.thumb?`<img src="${esc(l.thumb)}">`:ico(LinkTypes.icon(l.url))}</div>

          <input type="text" placeholder="Label" value="${esc(l.label)}" data-field="label" data-i="${i}"/>

        <button class="del" data-del="${i}">${ico('x')}</button>
      </div>`;
    }).join("");

    wrap.querySelectorAll("input[data-field]").forEach(inp=>{
      inp.addEventListener("input",e=>{
        const i=+e.target.dataset.i, f=e.target.dataset.field;
        STATE.draft.links[i][f]=e.target.value;
        if(f==="url") STATE.draft.links[i].type=LinkTypes.detect(e.target.value);
        this.updatePreview();
      });
    });
    wrap.querySelectorAll(".del").forEach(b=>{
      b.addEventListener("click",e=>{
        const i=+e.currentTarget.dataset.del;
        STATE.draft.links.splice(i,1);
        this.renderLinks(); this.updatePreview();
      });
    });
    wrap.querySelectorAll("[data-thumb]").forEach(b=>{
      b.addEventListener("click",e=>{
        const i=+e.currentTarget.dataset.thumb;
        const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
        inp.onchange=async()=>{
          const f=inp.files[0]; if(!f) return;
          showLoading("Compress & upload...");
          try{
            const url=await Store.upload(f,"thumb");
            STATE.draft.links[i].thumb=url;
            hideLoading(); toast("Gambar diupdate","success");
            this.renderLinks(); this.updatePreview();
          }catch(err){ hideLoading(); toast("Gagal: "+err.message,"error"); }
        };
        inp.click();
      });
    });
    wrap.querySelectorAll("[data-color]").forEach(b=>{
      b.addEventListener("input",e=>{
        const i=+e.currentTarget.dataset.color;
        STATE.draft.links[i].color=e.target.value;
        this.updatePreview();
      });
    });

    let dragIdx=null;
    wrap.querySelectorAll(".link-row").forEach(row=>{
      row.addEventListener("dragstart",e=>{ dragIdx=+row.dataset.i; row.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
      row.addEventListener("dragend",()=>{ row.classList.remove("dragging"); wrap.querySelectorAll(".link-row").forEach(r=>r.classList.remove("drag-over")); });
      row.addEventListener("dragover",e=>{ e.preventDefault(); row.classList.add("drag-over"); });
      row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));
      row.addEventListener("drop",e=>{
        e.preventDefault();
        const dropIdx=+row.dataset.i;
        if(dragIdx===null||dragIdx===dropIdx) return;
        const arr=STATE.draft.links;
        const [moved]=arr.splice(dragIdx,1);
        arr.splice(dropIdx,0,moved);
        dragIdx=null;
        this.renderLinks(); this.updatePreview();
      });
    });
  },

  renderThemeGrid(){
    const themes=[
      {id:"neo-cream",label:"Cream",css:"#f0ebe0"},
      {id:"neo-dark",label:"Dark",css:"#0a0a0a"},
      {id:"neo-blue",label:"Blue",css:"#2563eb"},
      {id:"neo-pink",label:"Pink",css:"#ff69b4"},
      {id:"neo-green",label:"Green",css:"#22c55e"},
      {id:"neo-purple",label:"Purple",css:"#a78bfa"}
    ];
    const cur=STATE.draft.theme;
    $("#theme-grid").innerHTML=themes.map(t=>{
      const allowed = themeAllowed(t.id);
      return `
      <div class="theme-item ${cur===t.id?"active":""} ${allowed?"":"locked"}" data-t="${t.id}" style="background:${t.css}">
        <div class="chk">${ico('check')}</div><div class="label">${t.label}</div>
      </div>`;
    }).join("");
    $$("#theme-grid .theme-item").forEach(el=>{
      el.addEventListener("click",()=>{
        const tid = el.dataset.t;
        if(!themeAllowed(tid)){ toast("Tema ini khusus Pro+","error"); showUpgradeModal(); return; }
        STATE.draft.theme=tid;
        $$("#theme-grid .theme-item").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        this.updatePreview();
      });
    });
  },

  updatePreview(){
    const frame=$("#prev-frame"); if(!frame) return;
    frame.srcdoc=PagePublic.buildHTML(STATE.draft,{preview:true});
  },

  async save(){
    if(!STATE.draft.name?.trim()){ toast("Nama tidak boleh kosong","error"); return; }
    const plan = STATE.plan;
    if(!isUnlimited(plan.features.maxLinks) && STATE.draft.links.length > plan.features.maxLinks){
      toast(`Plan ${plan.name} max ${plan.features.maxLinks} tombol. Upgrade!`,"error");
      showUpgradeModal(); return;
    }
    showLoading("Menyimpan...");
    try{
      const saved=await Store.save({...STATE.draft});
      STATE.draft=saved; STATE.currentEdit=saved.id;
      hideLoading();
      toast("Tersimpan!","success");
      this.render();
      setTimeout(()=>showShareModal(saved.id), 300);
    }catch(e){ console.error(e); hideLoading(); toast("Gagal: "+e.message,"error"); }
  }
};

  async loadData(){
    try{
      const usersSnap = await FB.db.collection("users").get();
      const biosSnap = await FB.db.collection("bios").get();
      const users = []; usersSnap.forEach(d=>users.push({uid:d.id, ...d.data()}));
      const bios = []; biosSnap.forEach(d=>bios.push({id:d.id, ...d.data()}));
      users.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      bios.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

      this.state.bios = bios;
      this.renderStats();
      this.renderList();
    }catch(e){
      console.error(e);
      $("#dev-list").innerHTML = `<div class="empty-state"><p>Gagal load: ${esc(e.message)}</p></div>`;
    }
  },

  renderStats(){
    const users = this.state.users;

      if(isDev(u.email)) return p==="developer";
      return (u.plan||"free") === p;

  renderList(){
    const wrap = $("#dev-list");
    const { tab, filter, search } = this.state;

    if(tab === "users"){
      let list = this.state.users.filter(u=>{
        const plan = isDev(u.email) ? "developer" : (u.plan||"free");

        return matchSearch(u.email) || matchSearch(u.name);

      if(!list.length){
        wrap.innerHTML = `<div class="empty-state"><div class="ei">${ico('user')}</div><p>Tidak ada user.</p></div>`;

        const expiry = u.planExpiry ? new Date(u.planExpiry).toLocaleDateString("id-ID") : "—";

        return `

            </div>
          </div>`;
      }).join("");
    } else {
      let list = this.state.bios.filter(b=>{
        return matchSearch(b.name) || matchSearch(b.ownerName) || matchSearch(b.ownerUid);

      if(!list.length){
        wrap.innerHTML = `<div class="empty-state"><div class="ei">${ico('folder')}</div><p>Tidak ada bio.</p></div>`;
        return;

      wrap.innerHTML = list.map(b=>`

            <button class="icon-btn danger" onclick="PageDev.deleteBio('${b.id}')">${ico('trash')}</button>
          </div>
        </div>`).join("");

  openEdit(uid){
    const u = this.state.users.find(x=>x.uid===uid);
    if(!u) return;
    const curPlan = u.plan || "free";
    const expiry = u.planExpiry ? new Date(u.planExpiry).toISOString().slice(0,10) : "";
    const m = openModal(`
      <button class="close-x" onclick="this.closest('.modal-back').remove()">×</button>
      <h3>Edit User</h3>
      <p style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:14px">
        ${esc(u.name||"—")}<br>${esc(u.email||"")}
      </p>
      <div class="field">
        <label>Plan</label>
        <select id="dev-edit-plan" style="padding:12px;font-weight:800">
          <option value="free" ${curPlan==="free"?"selected":""}>Free</option>
          <option value="pro" ${curPlan==="pro"?"selected":""}>Pro</option>
          <option value="ultimate" ${curPlan==="ultimate"?"selected":""}>Ultimate</option>
          <option value="developer" ${curPlan==="developer"?"selected":""}>Developer</option>
        </select>
      </div>
      <div class="field">
        <label>Tanggal Kadaluarsa (opsional)</label>
        <input type="date" id="dev-edit-expiry" value="${expiry}"/>
        <div class="hint">Kosongkan = tidak kadaluarsa</div>
      </div>
      <button class="btn btn-primary btn-block" id="dev-edit-save" style="margin-top:14px">
        ${ico('save')} Simpan
      </button>
      <button class="btn btn-red btn-block" id="dev-edit-del" style="margin-top:8px">
        ${ico('trash')} Hapus User + Bio
      </button>
    `);
    $("#dev-edit-save",m).addEventListener("click", async ()=>{
      const newPlan = $("#dev-edit-plan",m).value;
      const expiryVal = $("#dev-edit-expiry",m).value;
      const expiryMs = expiryVal ? new Date(expiryVal).getTime() : null;
      showLoading("Menyimpan...");
      try{
        await FB.db.collection("users").doc(uid).update({
          plan: newPlan,
          planExpiry: expiryMs
        });
        hideLoading(); toast("Berhasil diupdate!","success");
        m.remove();
        await this.loadData();
      }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
    });
    $("#dev-edit-del",m).addEventListener("click", ()=>{ m.remove(); this.deleteUser(uid); });
  },

  async deleteUser(uid){
    if(!confirm("Hapus user ini + semua bio-nya?")) return;
    showLoading("Menghapus...");
    try{
      const biosToDelete = this.state.bios.filter(b=>b.ownerUid===uid);
      for(const b of biosToDelete){
        try{ await FB.db.collection("bios").doc(b.id).delete(); }catch(e){}
      }
      await FB.db.collection("users").doc(uid).delete();
      hideLoading(); toast("User & bio terhapus","success");
      await this.loadData();
    }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
  },

  async deleteBio(id){
    if(!confirm("Hapus bio ini?")) return;
    showLoading("Menghapus...");
    try{
      await FB.db.collection("bios").doc(id).delete();
      hideLoading(); toast("Bio terhapus","success");
      await this.loadData();
    }catch(e){ hideLoading(); toast("Gagal: "+e.message,"error"); }
  }
};

  buildHTML(d, opts={}){
    const preview = !!(opts && opts.preview);

          <img class="feat-img" src="${esc(l.thumb)}" alt=""/>

        </a>`;
      }
      if(embed && ["youtube","spotify","vimeo","tiktok"].includes(type)){
        return `<div class="bio-embed"><iframe src="${esc(embed)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe></div>`;
      }
      return `<a class="bio-link" href="${esc(l.url)}" target="_blank" rel="noopener" data-click="${idx}"

    const badgeHtml = badge ? `<div class="bio-plan-badge ${d.ownerPlan}">${badge}</div>` : "";

      <div class="bio-avatar">${profileBlock}</div>

    <div style="text-align:center">
      <div class="bio-footer">Powered by <a href="${location.origin}${location.pathname}" target="_top">VarlinkB</a> · by Varoo</div>
    </div>
  </div>
</div>
${isLocked?`
<div class="lock-overlay" id="lock-overlay">
  <div class="lock-card">
    <div class="li">${ico('lock')}</div>
    <h3>Terkunci</h3>
    <p>Masukkan password untuk membuka.</p>
    <input type="password" id="lock-pass" placeholder="Password..." autocomplete="off"/>
    <button id="lock-btn">Buka</button>
  </div>
</div>`:""}
<script>
const BIO_ID = "${bioId}";
const IS_PREVIEW = ${preview?"true":"false"};
const LOCK_PASS = ${JSON.stringify(d.lock||"")};

function trackView(){
  if(IS_PREVIEW||!BIO_ID) return;
  try{ window.parent.postMessage({type:"varlinkb:view",id:BIO_ID},"*"); }catch(e){}
}
function trackClick(idx){
  if(IS_PREVIEW||!BIO_ID) return;
  try{ window.parent.postMessage({type:"varlinkb:click",id:BIO_ID,idx:idx},"*"); }catch(e){}
}
document.querySelectorAll("[data-click]").forEach(el=>{
  el.addEventListener("click",()=>trackClick(+el.dataset.click));
});
${isLocked?`
(function(){
  const overlay=document.getElementById("lock-overlay");
  const inp=document.getElementById("lock-pass");
  const btn=document.getElementById("lock-btn");
  function unlock(){
    if(inp.value===LOCK_PASS){
      overlay.style.display="none";
      sessionStorage.setItem("varlinkb_unlocked_"+BIO_ID,"1");
    } else {
      inp.style.borderColor="#ff2a2a";
      inp.value="";
      inp.placeholder="Salah, coba lagi...";
      setTimeout(()=>{ inp.style.borderColor=""; inp.placeholder="Password..."; },1400);
    }
  }
  if(sessionStorage.getItem("varlinkb_unlocked_"+BIO_ID)==="1"){ overlay.style.display="none"; }
  btn.addEventListener("click",unlock);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") unlock(); });
  inp.focus();
})();`:""}
trackView();
<\/script>
</body></html>`;

      $("#app").innerHTML = `
        <div style="min-height:100vh;display:flex;flex-direction:column;
          align-items:center;justify-content:center;padding:40px 18px;text-align:center">
          <div style="width:70px;height:70px;background:var(--yellow);border:3px solid var(--ink);
            border-radius:50%;display:grid;place-items:center;margin-bottom:16px;
            box-shadow:5px 5px 0 var(--red)">${ico('x')}</div>
          <h2 style="margin-bottom:8px;font-size:20px;text-transform:uppercase">Tidak ditemukan</h2>
          <p style="font-size:13.5px;max-width:320px;margin-bottom:18px;font-weight:600">Mungkin sudah dihapus, atau link salah.</p>
          <a href="#/" class="btn btn-primary">${ico('back')} Kembali</a>
        </div>`;
      return;
    }
    document.title = `${data.name||"VarlinkB"} — Link in Bio`;
    document.body.classList.add("public-mode");
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    document.body.style.height = '100vh';
    document.body.style.height = '100dvh';
    $("#app").innerHTML = `
      <iframe id="bio-full"
        style="position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;
          border:0;background:#f0ebe0;z-index:50;display:block"
        title="Link-in-Bio"></iframe>`;
    const frame=document.getElementById("bio-full");
    frame.srcdoc=this.buildHTML(data, {preview:false});
  }
};

/* =========================================================
   ANALYTICS LISTENER
   ========================================================= */
window.addEventListener("message", async e=>{
  const d=e.data;
  if(!d||!d.type) return;
  if(d.type==="varlinkb:view" && d.id){ await Store.trackView(d.id); }
  if(d.type==="varlinkb:click" && d.id!=null){ await Store.trackClick(d.id, d.idx); }
});

/* =========================================================
   ROUTER REGISTER
   ========================================================= */
Router.on("/",          ()=>PageLanding.render());
Router.on("/login",     ()=>PageLogin.render());
Router.on("/register",  ()=>PageRegister.render());
Router.on("/dashboard", (q)=>PageDashboard.render(q));
Router.on("/editor",    ()=>PageEditor.render());
Router.on("/manage",    ()=>PageManage.render());
Router.on("/stats",     ()=>PageStats.render());
Router.on("/dev",       ()=>PageDev.render());
Router.on("/u/:id",     (id)=>PagePublic.render(id));
Router.on("/404",       ()=>Router.navigate("/"));

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  showLoading("Memuat...");
  await Auth.init();
  if(Auth.current) await loadUserPlan();
  hideLoading();
  if(!location.hash) location.hash = Auth.current ? "#/dashboard" : "#/";
  Router.start();
})();
</script>
